<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Character Creator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Medieval Character Creator</h1>
  <canvas id="charCanvas" width="800" height="800"></canvas>
  <div>
    <button id="downloadBtn">Download PNG</button>
    <button id="randomBtn">Random Character</button>
  </div>

  <!-- Body Picker -->
  <div class="picker">
    <h2>Body Type</h2>
    <div data-layer="body" class="thumbs"></div>
  </div>
  <!-- Face Picker -->
  <div class="picker">
    <h2>Face</h2>
    <div data-layer="face" class="thumbs"></div>
  </div>
  <!-- Hair Picker -->
  <div class="picker">
    <h2>Hair</h2>
    <div data-layer="hair" class="thumbs"></div>
    <label>Hair Color: <input type="color" id="hairColor" value="#8a4b08"></label>
  </div>
  <!-- Eyes Picker -->
  <div class="picker">
    <h2>Eyes</h2>
    <div data-layer="eyes" class="thumbs"></div>
    <label>Eye Color: <input type="color" id="eyeColor" value="#666666"></label>
  </div>
  <!-- Armor & Gear -->
  <div class="picker">
    <h2>Armor & Gear</h2>
    <label><input type="checkbox" id="armorToggle"> Chest Armor</label>
    <label><input type="checkbox" id="helmetToggle"> Helmet</label>
    <!-- Add more gear toggles as needed -->
  </div>

  <script src="main.js"></script>
</body>
</html>
