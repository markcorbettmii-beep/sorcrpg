<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Character Creator</title>
  <meta name="viewport" content="width=520, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Medieval Character Creator</h1>
  <div class="main-layout">
    <div class="pickers-row">
      <div class="picker">
        <h2>Body Type</h2>
        <div data-layer="body" class="thumbs labeled"></div>
      </div>
      <div class="picker">
        <h2>Face</h2>
        <div data-layer="face" class="thumbs"></div>
      </div>
      <div class="picker">
        <h2>Hair</h2>
        <div data-layer="hair" class="thumbs"></div>
      </div>
      <div class="picker">
        <h2>Eyes</h2>
        <div data-layer="eyes" class="thumbs"></div>
      </div>
    </div>
    <div class="center-panel">
      <canvas id="charCanvas" width="480" height="720"></canvas>
      <div>
        <button id="downloadBtn">Download PNG</button>
        <button id="randomBtn">Random Character</button>
      </div>
      <div class="coming-soon">
        Armaments and Gear coming soon...
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
