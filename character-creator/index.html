<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Character Creator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Medieval Character Creator</h1>
  <canvas id="charCanvas" width="360" height="540"></canvas>
  <div>
    <button id="downloadBtn">Download PNG</button>
    <button id="randomBtn">Random Character</button>
  </div>

  <!-- Body Picker -->
  <div class="picker">
    <h2>Body Type</h2>
    <div data-layer="body" class="thumbs"></div>
  </div>
  <!-- Face Picker -->
  <div class="picker">
    <h2>Face</h2>
    <div data-layer="face" class="thumbs"></div>
  </div>
  <!-- Hair Picker -->
  <div class="picker">
    <h2>Hair</h2>
    <div data-layer="hair" class="thumbs"></div>
  </div>
  <!-- Eyes Picker -->
  <div class="picker">
    <h2>Eyes</h2>
    <div data-layer="eyes" class="thumbs"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
