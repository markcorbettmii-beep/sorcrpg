<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Slayers of Rings & Crowns - SorC Flow Chart</title>
<style>
  body {
    background-color: #0b0b0b; /* Dark background for a mystical feel */
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 20px;
    color: #fff;
  }

  h1 {
    text-align: center;
    color: #ffd700;
    margin-bottom: 40px;
    font-family: 'Fantasy', sans-serif;
  }

  .flowchart {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Container for main node */
  .node-container {
    position: relative;
    display: flex;
    justify-content: center;
    margin-bottom: 60px;
  }

  /* Main node style */
  .main-node {
    background: radial-gradient(circle at 30% 30%, #ff6f61, #d72631);
    border: 4px solid #ffd700;
    border-radius: 20px;
    padding: 30px 50px;
    font-size: 1.5em;
    font-weight: bold;
    text-align: center;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
    position: relative;
    max-width: 250px;
  }

  /* Options container */
  .options {
    display: flex;
    justify-content: center;
    margin-top: 80px;
    gap: 80px;
    position: relative;
  }

  /* Individual option nodes */
  .option {
    padding: 20px;
    border-radius: 15px;
    width: 150px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  /* Specific colors for options */
  .offense {
    background-color: #ff4d4d;
    border: 3px solid #cc0000;
  }
  .defense {
    background-color: #3399ff;
    border: 3px solid #0066cc;
  }
  .mobility {
    background-color: #33cc33;
    border: 3px solid #006600;
  }

  /* Hover effects for options */
  .option:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(255,255,255,0.8);
  }

  /* Connectors (lines/arrows) */
  .connector-line {
    position: absolute;
    height: 4px;
    background-color: #ffd700;
  }

  /* Positioning for connectors from main node to options */
  /* Offense connector */
  .connect-offense {
    top: calc(100% + 10px);
    left: calc(25% - 75px);
    width: 150px;
  }

  /* Defense connector */
  .connect-defense {
    top: calc(100% + 10px);
    left: calc(75% - 75px);
    width: 150px;
  }

  /* Arrows pointing down from options to connectors */
  .arrow-down {
    width: 0; 
    height: 0; 
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 15px solid #ffd700;
    margin: 0 auto;
    margin-top: -5px;
  }

</style>
</head>
<body>

<h1>Slayers of Rings & Crowns - SorC</h1>

<div class="flowchart">

  <!-- Main Node: Agility (phy) -->
  <div class="node-container">
    <div class="main-node">
      Agility (phy)
    </div>
  </div>

  <!-- Connectors from main node to options -->
  <div class="connectors" style="position: relative; width: 100%;">
    <div class="connector-line" style="top: calc(100% + 10px); left: calc(25% - 75px); width: 150px;"></div>
    <div class="connector-line" style="top: calc(100% + 10px); left: calc(75% - 75px); width: 150px;"></div>
  </div>

  <!-- Options: Offense, Defense, Mobility -->
  <div class="options">
    <!-- Offense -->
    <div class="option offense" style="margin-left: -75px;">
      Offense
      <div class="arrow-down"></div>
    </div>
    <!-- Defense -->
    <div class="option defense" style="margin-left: 75px;">
      Defense
      <div class="arrow-down"></div>
    </div>
    <!-- Mobility -->
    <div class="option mobility" style="margin-left: 225px;">
      Mobility
      <div class="arrow-down"></div>
    </div>
  </div>

</div>

</body>
</html>
