<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hierarchy of Boosts</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  .diagram {
    position: relative;
    width: 1400px;
    height: 2200px;
    margin: 0 auto;
  }

  /* Centered Agility label */
  .agility {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    border: 2px solid #000;
    background: #f0f0f0;
  }

  /* SVG lines */
  svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 2200px;
    pointer-events: none;
  }

  /* Main category boxes */
  .main-box {
    position: absolute;
    width: 120px;
    padding: 8px;
    border: 2px solid #000;
    background: #d0d0d0;
    text-align: center;
  }

  /* Category boxes under second horizontal line */
  .category-box {
    width: 100px;
    padding: 6px;
    border: 1px solid #555;
    background: #e0e0e0;
    margin-top: 10px;
  }

  /* Traits boxes */
  .traits {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .trait {
    width: 120px;
    padding: 4px;
    margin-top: 4px;
    background: #ccc;
    border-radius: 3px;
    font-size: 12px;
  }
</style>
</head>
<body>

<h2 style="text-align:center;">Hierarchy of Boosts</h2>
<div class="diagram">
  <!-- SVG for all lines -->
  <svg>
    <!-- Vertical line from Agility -->
    <line x1="700" y1="40" x2="700" y2="200" stroke="#000" stroke-width="2"/>
    <!-- Horizontal line below Agility -->
    <line x1="400" y1="200" x2="1000" y2="200" stroke="#000" stroke-width="2"/>
    <!-- Vertical lines from main horizontal to boxes -->
    <line x1="400" y1="200" x2="400" y2="300" stroke="#000" stroke-width="2"/>
    <line x1="700" y1="200" x2="700" y2="300" stroke="#000" stroke-width="2"/>
    <line x1="1000" y1="200" x2="1000" y2="300" stroke="#000" stroke-width="2"/>
    <!-- Second horizontal line -->
    <line x1="300" y1="400" x2="500" y2="400" stroke="#000" stroke-width="2"/>
    <line x1="600" y1="400" x2="800" y2="400" stroke="#000" stroke-width="2"/>
    <line x1="900" y1="400" x2="1100" y2="400" stroke="#000" stroke-width="2"/>
    <!-- Vertical lines down to traits -->
    <line x1="300" y1="400" x2="300" y2="500" stroke="#000" stroke-width="2"/>
    <line x1="500" y1="400" x2="500" y2="500" stroke="#000" stroke-width="2"/>
    <line x1="600" y1="400" x2="600" y2="500" stroke="#000" stroke-width="2"/>
    <line x1="800" y1="400" x2="800" y2="500" stroke="#000" stroke-width="2"/>
    <line x1="900" y1="400" x2="900" y2="500" stroke="#000" stroke-width="2"/>
    <line x1="1100" y1="400" x2="1100" y2="500" stroke="#000" stroke-width="2"/>
  </svg>

  <!-- Agility node -->
  <div class="agility">Agility</div>

  <!-- Main boxes: positioned at the bottom of vertical lines -->
  <div class="main-box" style="left: 400px; top: 200px;">Offense</div>
  <div class="main-box" style="left: 700px; top: 200px;">Defense</div>
  <div class="main-box" style="left: 1000px; top: 200px;">Mobility</div>

  <!-- Category boxes under second horizontal line -->
  <!-- Under Offense -->
  <div style="position: absolute; left: 300px; top: 410px;">
    <div class="category-box">Accuracy</div>
    <div class="traits">
      <div class="trait">+Accuracy</div>
      <div class="trait">+Hit</div>
      <div class="trait">+Damage</div>
      <div class="trait">+Crit Chance</div>
      <div class="trait">+Crit Power</div>
    </div>
  </div>
  <!-- Under Defense -->
  <div style="position: absolute; left: 600px; top: 410px;">
    <div class="category-box">Damage Reduction</div>
    <div class="traits">
      <div class="trait">+Resist Damage</div>
      <div class="trait">+Fortify</div>
      <div class="trait">+Shielding</div>
      <div class="trait">+Absorb</div>
      <div class="trait">+Resilience</div>
    </div>
  </div>
  <!-- Under Mobility -->
  <div style="position: absolute; left: 900px; top: 410px;">
    <div class="category-box">Evasion</div>
    <div class="traits">
      <div class="trait">+Dodge</div>
      <div class="trait">+Speed</div>
      <div class="trait">+Reflexes</div>
      <div class="trait">+Quick Retreat</div>
      <div class="trait">+Stealth</div>
    </div>
  </div>
</div>
</body>
</html>
