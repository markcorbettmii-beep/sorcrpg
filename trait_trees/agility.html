<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expanded Flow Chart - TTRPG</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
  }
  .chart-container {
    position: relative;
    width: 100%;
    padding: 50px 0;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .level {
    display: flex;
    justify-content: center;
    margin-top: 40px;
  }
  .sub-level {
    display: flex;
    justify-content: center;
    margin-top: 40px;
  }
  .node {
    border: 2px solid #333;
    border-radius: 8px;
    padding: 10px 20px;
    background-color: #fff;
    text-align: center;
    min-width: 100px;
    margin: 20px;
    position: relative;
  }
</style>
</head>
<body>

<div class="chart-container" id="chartContainer">
  <svg></svg>

  <!-- Top Box -->
  <div style="text-align: center;">
    <div class="node" id="agility">Agility</div>
  </div>

  <!-- First level: Offense, Defense, Mobility -->
  <div class="level" id="level1">
    <div class="node" id="offense">Offense</div>
    <div class="node" id="defense">Defense</div>
    <div class="node" id="mobility">Mobility</div>
  </div>

  <!-- Second level: three boxes under each main category -->
  <div class="sub-level" id="sub-offense">
    <div class="node" id="offense1">Offense 1</div>
    <div class="node" id="offense2">Offense 2</div>
    <div class="node" id="offense3">Offense 3</div>
  </div>
  <div class="sub-level" id="sub-defense">
    <div class="node" id="defense1">Defense 1</div>
    <div class="node" id="defense2">Defense 2</div>
    <div class="node" id="defense3">Defense 3</div>
  </div>
  <div class="sub-level" id="sub-mobility">
    <div class="node" id="mobility1">Mobility 1</div>
    <div class="node" id="mobility2">Mobility 2</div>
    <div class="node" id="mobility3">Mobility 3</div>
  </div>

  <!-- Third level: details under each sub -->
  <div class="sub-level" id="detail-offense">
    <div class="node" id="offense1-detail">Offense 1 Detail</div>
    <div class="node" id="offense2-detail">Offense 2 Detail</div>
    <div class="node" id="offense3-detail">Offense 3 Detail</div>
  </div>
  <div class="sub-level" id="detail-defense">
    <div class="node" id="defense1-detail">Defense 1 Detail</div>
    <div class="node" id="defense2-detail">Defense 2 Detail</div>
    <div class="node" id="defense3-detail">Defense 3 Detail</div>
  </div>
  <div class="sub-level" id="detail-mobility">
    <div class="node" id="mobility1-detail">Mobility 1 Detail</div>
    <div class="node" id="mobility2-detail">Mobility 2 Detail</div>
    <div class="node" id="mobility3-detail">Mobility 3 Detail</div>
  </div>
</div>

<script>
  function getCenterPosition(element) {
    const rect = element.getBoundingClientRect();
    const containerRect = document.getElementById('chartContainer').getBoundingClientRect();
    return {
      x: rect.left + rect.width / 2 - containerRect.left,
      y: rect.top + rect.height / 2 - containerRect.top
    };
  }

  window.onload = () => {
    const svg = document.querySelector("svg");
    const container = document.getElementById("chartContainer");

    const lines = [
      // Diagonal lines from Agility to main categories
      {from: "agility", to: "offense"},
      {from: "agility", to: "defense"},
      {from: "agility", to: "mobility"},
      // Vertical lines from main to second level
      {from: "offense", to: "offense1"},
      {from: "offense", to: "offense2"},
      {from: "offense", to: "offense3"},
      {from: "defense", to: "defense1"},
      {from: "defense", to: "defense2"},
      {from: "defense", to: "defense3"},
      {from: "mobility", to: "mobility1"},
      {from: "mobility", to: "mobility2"},
      {from: "mobility", to: "mobility3"},
      // Vertical lines from sub to details
      {from: "offense1", to: "offense1-detail"},
      {from: "offense2", to: "offense2-detail"},
      {from: "offense3", to: "offense3-detail"},
      {from: "defense1", to: "defense1-detail"},
      {from: "defense2", to: "defense2-detail"},
      {from: "defense3", to: "defense3-detail"},
      {from: "mobility1", to: "mobility1-detail"},
      {from: "mobility2", to: "mobility2-detail"},
      {from: "mobility3", to: "mobility3-detail"}
    ];

    lines.forEach(link => {
      const fromEl = document.getElementById(link.from);
      const toEl = document.getElementById(link.to);
      const fromPos = getCenterPosition(fromEl);
      const toPos = getCenterPosition(toEl);

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", fromPos.x);
      line.setAttribute("y1", fromPos.y);
      line.setAttribute("x2", toPos.x);
      line.setAttribute("y2", toPos.y);
      line.setAttribute("stroke", "#333");
      line.setAttribute("stroke-width", "2");
      svg.appendChild(line);
    });
  };
</script>

</body>
</html>
