<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hierarchy of Boosts</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
  }
  .diagram {
    position: relative;
    width: 1300px;
    height: 1800px;
    margin: 0 auto;
  }
  /* Center node ("Agility") */
  .center {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    border: 2px solid #000;
    background: #f0f0f0;
  }
  /* SVG lines */
  svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 1800px;
    pointer-events: none;
    z-index: 0;
  }
  /* Box styles for main boxes (Offense, Defense, Mobility) */
  .main-box {
    position: absolute;
    width: 140px;
    padding: 8px;
    border: 2px solid #000;
    background: #d0d0d0;
    text-align: center;
  }
  /* Trait boxes */
  .traits-container {
    position: absolute;
    width: 130px;
    text-align: center;
  }
  .trait-box {
    width: 130px;
    padding: 6px;
    margin-top: 10px;
    border: 1px solid #555;
    background: #e0e0e0;
  }
</style>
</head>
<body>
<h2>Hierarchy of Boosts</h2>
<div class="diagram">
  <!-- SVG for lines -->
  <svg>
    <!-- Vertical line from "Agility" to the horizontal line -->
    <line x1="650" y1="40" x2="650" y2="150" stroke="#000" stroke-width="2"/>
    <!-- Horizontal line connecting the main vertical lines -->
    <line x1="350" y1="150" x2="950" y2="150" stroke="#000" stroke-width="2"/>
    <!-- Vertical lines down to boxes, ending exactly at the top center of each box -->
    <line x1="350" y1="150" x2="350" y2="240" stroke="#000" stroke-width="2"/>
    <line x1="650" y1="150" x2="650" y2="240" stroke="#000" stroke-width="2"/>
    <line x1="950" y1="150" x2="950" y2="240" stroke="#000" stroke-width="2"/>
    <!-- Shorter vertical lines from boxes down to traits -->
    <line x1="250" y1="370" x2="350" y2="370" stroke="#000" stroke-width="2"/>
    <line x1="550" y1="370" x2="650" y2="370" stroke="#000" stroke-width="2"/>
    <line x1="850" y1="370" x2="950" y2="370" stroke="#000" stroke-width="2"/>
  </svg>

  <!-- Center node ("Agility") -->
  <div class="center">Agility</div>

  <!-- Main boxes positioned at the bottom of vertical lines -->
  <div class="main-box" style="left: 350px; top: 150px;">Offense</div>
  <div class="main-box" style="left: 650px; top: 150px;">Defense</div>
  <div class="main-box" style="left: 950px; top: 150px;">Mobility</div>

  <!-- Traits for Offense -->
  <div class="traits-container" style="left: 250px; top: 370px;">
    <div class="trait-box">+Accuracy</div>
    <div class="trait-box">+Hit</div>
    <div class="trait-box">+Damage</div>
    <div class="trait-box">+Crit Chance</div>
    <div class="trait-box">+Crit Power</div>
  </div>

  <!-- Traits for Defense -->
  <div class="traits-container" style="left: 550px; top: 370px;">
    <div class="trait-box">+Damage Reduction</div>
    <div class="trait-box">+Resist Damage</div>
    <div class="trait-box">+Fortify</div>
    <div class="trait-box">+Shielding</div>
    <div class="trait-box">+Absorb</div>
  </div>

  <!-- Traits for Mobility -->
  <div class="traits-container" style="left: 850px; top: 370px;">
    <div class="trait-box">+Evasion</div>
    <div class="trait-box">+Speed</div>
    <div class="trait-box">+Reflexes</div>
    <div class="trait-box">+Quick Retreat</div>
    <div class="trait-box">+Stealth</div>
  </div>

</div>
</body>
</html>
