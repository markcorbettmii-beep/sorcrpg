<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slayers of Rings & Crowns - SorC Flow Chart</title>
<!-- Link to your existing stylesheet -->
<link rel="stylesheet" href="../../styles.css" />
</head>
<body>

<h1>Slayers of Rings & Crowns - SorC</h1>

<div class="flowchart" style="text-align: center; margin-top: 40px; position: relative;">

  <!-- Agility (phy) in a top box -->
  <div class="topbox" style="margin: 0 auto;">
    Agility (phy)
  </div>

  <!-- Connector downward from top box -->
  <div style="position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%); width: 2px; height: 40px; background-color: #ffd700;"></div>

  <!-- Offense, Defense, Mobility in their style -->
  <div class="side-boxes" style="display: flex; justify-content: center; margin-top: 60px; gap: 40px;">
    <div class="box offense">Offense</div>
    <div class="box defense">Defense</div>
    <div class="box mobility">Mobility</div>
  </div>

</div>

</body>
</html>
