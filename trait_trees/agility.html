<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Slayers of Rings & Crowns - SorC Flow Chart</title>
<!-- Link to your existing style sheet -->
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<h1>Slayers of Rings & Crowns - SorC</h1>

<div class="flowchart">

  <!-- Main Node -->
  <div class="main-node">
    Agility (phy)
  </div>

  <!-- Connectors from main node to options -->
  <div style="position: relative; width: 100%; height: 60px;">
    <div class="connector connect-offense"></div>
    <div class="connector connect-defense"></div>
    <div class="connector connect-mobility"></div>
  </div>

  <!-- Options: Offense, Defense, Mobility as styled boxes -->
  <div class="buttons">
    <div class="button offense">
      Offense
    </div>
    <div class="button defense">
      Defense
    </div>
    <div class="button mobility">
      Mobility
    </div>
  </div>

</div>

</body>
</html>
