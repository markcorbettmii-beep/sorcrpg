<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slayers of Rings & Crowns - SorC Flow Chart</title>
<!-- Link to your existing stylesheet -->
<link rel="stylesheet" href="../../styles.css" />
</head>
<body>

<h1>Slayers of Rings & Crowns - SorC</h1>

<div class="flowchart" style="position: relative;">

  <!-- Agility (phy) in a top box -->
  <div class="topbox" style="margin: 0 auto;">Agility (phy)</div>

  <!-- Vertical arrow from topbox downward -->
  <svg style="position: absolute; top: 80px; left: 50%; transform: translateX(-50%);" height="60" width="2">
    <line x1="1" y1="0" x2="1" y2="50" stroke="black" stroke-width="2" />
    <!-- arrowhead -->
    <polygon points="1,50  -5,55  5,55" fill="black" />
  </svg>

  <!-- Container for the three boxes below -->
  <div style="display: flex; gap: 20px; justify-content: center; margin-top: 80px; position: relative;">
    <div class="box" style="border: 1px solid black; position: relative;">
      Offense
      <!-- Vertical line ending at top of box -->
      <svg style="position: absolute; top: -50px; left: 50%; transform: translateX(-50%);" height="50" width="2">
        <line x1="1" y1="0" x2="1" y2="50" stroke="black" stroke-width="2" />
        <polygon points="1,0  -5,-5  5,-5" fill="black" />
      </svg>
    </div>
    <div class="box" style="border: 1px solid black; position: relative;">
      Defense
      <!-- Vertical line ending at top of box -->
      <svg style="position: absolute; top: -50px; left: 50%; transform: translateX(-50%);" height="50" width="2">
        <line x1="1" y1="0" x2="1" y2="50" stroke="black" stroke-width="2" />
        <polygon points="1,0  -5,-5  5,-5" fill="black" />
      </svg>
    </div>
    <div class="box" style="border: 1px solid black; position: relative;">
      Mobility
      <!-- Vertical line ending at top of box -->
      <svg style="position: absolute; top: -50px; left: 50%; transform: translateX(-50%);" height="50" width="2">
        <line x1="1" y1="0" x2="1" y2="50" stroke="black" stroke-width="2" />
        <polygon points="1,0  -5,-5  5,-5" fill="black" />
      </svg>
    </div>
  </div>

  <!-- Horizontal connector line across the tops of vertical lines -->
  <svg style="position: absolute; top: 30px; left: calc(50% - 70px); width: 140px; height: 2px;">
    <line x1="0" y1="1" x2="140" y2="1" stroke="black" stroke-width="2" />
  </svg>

</div>

</body>
</html>
