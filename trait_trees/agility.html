<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slayers of Rings & Crowns - SorC Flow Chart</title>
<!-- Link to your existing stylesheet -->
<link rel="stylesheet" href="../../styles.css" />
</head>
<body>

<h1>Slayers of Rings & Crowns - SorC</h1>

<div style="position: relative; display: inline-block;">

  <!-- Top box: Agility -->
  <div class="topbox" style="margin: 0 auto;">Agility (phy)</div>

  <!-- Vertical arrow from top box -->
  <svg style="position: absolute; top: 80px; left: 50%; transform: translateX(-50%);" height="60" width="2">
    <line x1="1" y1="0" x2="1" y2="50" stroke="black" stroke-width="2" />
    <polygon points="1,50  -5,55  5,55" fill="black" />
  </svg>

  <!-- Container for the three boxes -->
  <div style="display: flex; gap: 20px; justify-content: center; margin-top: 80px; position: relative;">

    <!-- Offense box -->
    <div style="position: relative; border: 1px solid black; padding: 10px;">
      Offense
      <!-- Vertical line ending at top of box -->
      <svg style="position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);" height="50" width="2">
        <line x1="1" y1="0" x2="1" y2="50" stroke="black" stroke-width="2" />
        <polygon points="1,0  -5,-5  5,-5" fill="black" />
      </svg>
    </div>

    <!-- Defense box -->
    <div style="border: 1px solid black; padding: 10px;">Defense</div>

    <!-- Mobility box -->
    <div style="position: relative; border: 1px solid black; padding: 10px;">
      Mobility
      <!-- Vertical line ending at top of box -->
      <svg style="position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);" height="50" width="2">
        <line x1="1" y1="0" x2="1" y2="50" stroke="black" stroke-width="2" />
        <polygon points="1,0  -5,-5  5,-5" fill="black" />
      </svg>
    </div>
  </div>

  <!-- Horizontal line connecting tops of offense and mobility vertical lines -->
  <svg style="position: absolute; bottom: calc(80px + 50px + 10px); left: calc(50% - 70px); width: 140px; height: 2px;">
    <line x1="0" y1="1" x2="140" y2="1" stroke="black" stroke-width="2" />
  </svg>

</div>

</body>
</html>
