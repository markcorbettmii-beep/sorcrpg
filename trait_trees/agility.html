<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blade & Soul Style Flow Chart</title>
<style>
  body {
    background-color: #1e1e2f; /* Dark mystical background */
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 20px;
    color: #fff;
  }

  .flowchart {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .nodes {
    display: flex;
    justify-content: center;
    position: relative;
    margin: 50px 0;
  }

  .node {
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    border: 3px solid #ffd700;
    border-radius: 15px;
    padding: 20px;
    width: 200px;
    text-align: center;
    font-weight: bold;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
    position: relative;
  }

  /* Add mystical glow effect */
  .node:hover {
    box-shadow: 0 0 40px rgba(255, 215, 0, 1);
    cursor: pointer;
  }

  /* Connectors between nodes */
  .connector {
    position: absolute;
    height: 2px;
    background-color: #ffd700;
  }

  /* Positions for connectors and lines */
  .line-horizontal {
    top: 50%;
    width: calc(100% + 40px);
    left: -20px;
    position: absolute;
  }

  .line-vertical {
    width: 2px;
    height: 50px;
    background-color: #ffd700;
  }

  /* Arrow indicator */
  .arrow {
    width: 0; 
    height: 0; 
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 15px solid #ffd700;
    margin: 0 auto;
  }
</style>
</head>
<body>

<h1 style="text-align:center; color:#ffd700;">Blade & Soul Style Flow Chart</h1>

<div class="flowchart">

  <!-- First row of nodes -->
  <div class="nodes" style="margin-bottom:50px;">
    <div class="node" style="background-image: url('https://images.unsplash.com/photo-1612195676899-4f4e4f5b3a2b'); background-size: cover;">
      Start
    </div>
  </div>

  <!-- Connecting line -->
  <div style="position: relative; width: 100%; height: 100px;">
    <div class="connector line-horizontal" style="top: 50%;"></div>
  </div>

  <!-- Second row of nodes -->
  <div class="nodes" style="position: relative;">
    <div class="node" style="margin-right:50px;">
      Option 1
    </div>
    <div class="node" style="margin-left:50px;">
      Option 2
    </div>
  </div>

  <!-- Connecting lines from first to second row -->
  <div style="position: absolute; top: 150px; width: 100%; display:flex; justify-content: center;">
    <!-- Line from Start to Option 1 -->
    <div style="position: absolute; left: calc(25%); width: 25%; height: 2px; background-color: #ffd700;"></div>
    <!-- Line from Start to Option 2 -->
    <div style="position: absolute; left: calc(75%); width: 25%; height: 2px; background-color: #ffd700;"></div>
  </div>

  <!-- Connecting arrows -->
  <div style="position: absolute; top: 130px; left: calc(25% + 100px); transform: translateX(-50%);">
    <div class="arrow"></div>
  </div>
  <div style="position: absolute; top: 130px; left: calc(75% + 100px); transform: translateX(-50%);">
    <div class="arrow"></div>
  </div>

</div>

</body>
</html>
