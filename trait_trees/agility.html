<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Slayers of Rings & Crowns - SorC Flow Chart</title>
<style>
  body {
    font-family: 'Goudy Old Style', Baskerville, Garamond, serif;
    background-color: #FFFFFF;
    color: #2F2F2F;
    margin: 20px;
    line-height: 1.6;
  }
  /* Header styles */
  h1 {
    margin-bottom: 0px;
    color: #c9980b;
    font-weight: normal;
    font-family: 'Garamond', Baskerville, Goudy Old Style, serif;
    border-bottom: 1px solid #FFD700;
    background-color: #d3d3d3;
    display: inline-block;
    margin: 0;
    padding: 10px 0;
    padding-left: 20px;
    text-shadow: -.5px -.5px 1px #ffffff;
    text-align: center;
    width: 100%;
  }

  /* Container for the flow chart */
  .flowchart {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 40px;
  }

  /* Main node style */
  .main-node {
    background: linear-gradient(135deg, #ff7e5f, #feb47b);
    border: 4px solid #ffd700;
    border-radius: 20px;
    padding: 30px 50px;
    font-size: 1.5em;
    font-weight: bold;
    text-align: center;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
    margin-bottom: 60px;
    max-width: 250px;
  }

  /* Options container: side by side boxes */
  .options {
    display: flex;
    justify-content: center;
    gap: 40px;
    position: relative;
  }

  /* Individual option boxes */
  .option {
    padding: 20px;
    border-radius: 15px;
    width: 150px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: default;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: 'Goudy Old Style', serif;
  }

  /* Specific colors for options */
  .offense {
    background-color: #ff4d4d;
    border: 3px solid #cc0000;
    color: #fff;
  }
  .defense {
    background-color: #3399ff;
    border: 3px solid #0066cc;
    color: #fff;
  }
  .mobility {
    background-color: #33cc33;
    border: 3px solid #006600;
    color: #fff;
  }

  /* Hover effect for options (optional) */
  .option:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
  }

  /* Connectors: lines between nodes */
  .connector {
    position: absolute;
    height: 4px;
    background-color: #ffd700;
  }

  /* Positioning connectors from main node to options */
  /* Offense connector */
  .connect-offense {
    top: calc(100% + 10px);
    left: calc(25% - 75px);
    width: 150px;
  }
  /* Defense connector */
  .connect-defense {
    top: calc(100% + 10px);
    left: calc(75% - 75px);
    width: 150px;
  }
  /* Mobility connector (centered between offense and defense) */
  .connect-mobility {
    top: calc(100% + 10px);
    left: calc(50% - 75px);
    width: 150px;
  }

  /* Optional: arrows pointing down from options to connectors */
  .arrow-down {
    width: 0; 
    height: 0; 
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 15px solid #ffd700;
    margin: 0 auto;
    margin-top: -5px;
  }
</style>
</head>
<body>

<h1>Slayers of Rings & Crowns - SorC</h1>

<div class="flowchart">

  <!-- Main Node -->
  <div class="main-node">
    Agility (phy)
  </div>

  <!-- Connectors from main node to options -->
  <div style="position: relative; width: 100%; height: 60px;">
    <div class="connector connect-offense"></div>
    <div class="connector connect-defense"></div>
    <div class="connector connect-mobility"></div>
  </div>

  <!-- Options: Offense, Defense, Mobility -->
  <div class="options">
    <!-- Offense -->
    <div class="option offense">
      Offense
      <div class="arrow-down"></div>
    </div>
    <!-- Defense -->
    <div class="option defense">
      Defense
      <div class="arrow-down"></div>
    </div>
    <!-- Mobility -->
    <div class="option mobility">
      Mobility
      <div class="arrow-down"></div>
    </div>
  </div>

</div>

</body>
</html>
