<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simplified Flow Chart - TTRPG</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
  }
  .chart-container {
    position: relative;
    width: 100%;
    padding: 50px 0;
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .node {
    display: inline-block;
    border: 2px solid #333;
    border-radius: 8px;
    padding: 10px 20px;
    background-color: #fff;
    text-align: center;
    min-width: 100px;
    margin: 20px;
    position: relative;
  }
  .level {
    display: flex;
    justify-content: center;
    margin-top: 40px;
  }
</style>
</head>
<body>

<div class="chart-container" id="chartContainer">
  <svg></svg>
  <!-- Top Box -->
  <div style="text-align: center;">
    <div class="node" id="agility">Agility</div>
  </div>

  <!-- Branch: Offense, Defense, Mobility -->
  <div class="level" id="level1">
    <div class="node" id="offense">Offense</div>
    <div class="node" id="defense">Defense</div>
    <div class="node" id="mobility">Mobility</div>
  </div>

  <!-- Second level: sub-branches -->
  <div class="level" id="level2">
    <div class="node" id="offense1">Offense 1</div>
    <div class="node" id="defense2">Defense 2</div>
    <div class="node" id="mobility3">Mobility 3</div>
  </div>

  <!-- Third level: detailed boxes -->
  <div class="level" id="level3">
    <div class="node" id="offense1-detail">Offense 1 Detail</div>
    <div class="node" id="defense2-detail">Defense 2 Detail</div>
    <div class="node" id="mobility3-detail">Mobility 3 Detail</div>
  </div>
</div>

<script>
  function getCenterPosition(element) {
    const rect = element.getBoundingClientRect();
    const containerRect = document.getElementById('chartContainer').getBoundingClientRect();
    return {
      x: rect.left + rect.width / 2 - containerRect.left,
      y: rect.top + rect.height / 2 - containerRect.top
    };
  }

  window.onload = () => {
    const svg = document.querySelector("svg");
    const container = document.getElementById("chartContainer");

    const lines = [
      // Diagonal lines from Agility to Offense, Defense, Mobility
      {from: "agility", to: "offense"},
      {from: "agility", to: "defense"},
      {from: "agility", to: "mobility"},
      // Vertical lines from first to second level
      {from: "offense", to: "offense1"},
      {from: "defense", to: "defense2"},
      {from: "mobility", to: "mobility3"},
      // Connecting to third level
      {from: "offense1", to: "offense1-detail"},
      {from: "defense2", to: "defense2-detail"},
      {from: "mobility3", to: "mobility3-detail"},
      // Additional vertical connections following pattern
      // e.g., offense to defense, defense to mobility, etc., if needed
    ];

    lines.forEach(link => {
      const fromEl = document.getElementById(link.from);
      const toEl = document.getElementById(link.to);
      const fromPos = getCenterPosition(fromEl);
      const toPos = getCenterPosition(toEl);

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", fromPos.x);
      line.setAttribute("y1", fromPos.y);
      line.setAttribute("x2", toPos.x);
      line.setAttribute("y2", toPos.y);
      line.setAttribute("stroke", "#333");
      line.setAttribute("stroke-width", "2");
      svg.appendChild(line);
    });
  };
</script>

</body>
</html>
