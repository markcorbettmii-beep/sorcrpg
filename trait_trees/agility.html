<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slayers of Rings & Crowns - SorC Flow Chart</title>
<!-- Link to your existing stylesheet -->
<link rel="stylesheet" href="../../styles.css" />
</head>
<body>

<h1>Slayers of Rings & Crowns - SorC</h1>

<div class="flowchart">

  <!-- Agility (phy) in a top box, styled via your stylesheet -->
  <div class="topbox" style="margin: 0 auto;">Agility (phy)</div>

  <!-- Connector from top box to the three boxes below -->
  <div class="connector-vertical"></div> <!-- You can style this in your CSS -->

<div style="display: flex; gap: 20px;">
  <div class="box" style="border: 1px solid black;">Offense</div>
  <div class="box" style="border: 1px solid black;">Defense</div>
  <div class="box" style="border: 1px solid black;">Mobility</div>
</div>

</body>
</html>
