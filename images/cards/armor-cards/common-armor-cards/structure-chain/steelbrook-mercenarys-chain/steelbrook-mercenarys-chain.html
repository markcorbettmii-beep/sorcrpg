<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flip Card with Text</title>
<style>
  .flip-card {
    background-color: transparent;
    width: 300px;
    height: 400px;
    perspective: 1000px;
    cursor: pointer;
  }
  .flip-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.8s;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
  }
  /* Flip the inner on toggle */
  .flip-card.flipped .flip-card-inner {
    transform: rotateY(180deg);
  }
  /* Front and back styles */
  .flip-card-front, .flip-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
  }
  /* Style for front: centered text */
  .flip-card-front {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #eee; /* optional background for visibility */
    font-family: Arial, sans-serif;
    font-size: 1.2em;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
  }
  /* Style for back: image */
  .flip-card-back img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>

<div class="flip-card" onclick="this.classList.toggle('flipped')">
  <div class="flip-card-inner">
    <div class="flip-card-front">
      Image of<br>
      Steelbrook Mercenary Chain<br>
      Coming Soon
    </div>
    <div class="flip-card-back">
      <img src="https://sorcrpg.com/images/cards/armor-cards/common-armor-cards/structure-chain/steelbrook-mercenarys-chain/IMG_1730.jpeg" alt="Back Image" />
    </div>
  </div>
</div>

</body>
</html>
