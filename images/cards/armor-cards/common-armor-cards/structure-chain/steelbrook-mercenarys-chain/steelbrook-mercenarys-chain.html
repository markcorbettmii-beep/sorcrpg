<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flip Card with Text and Image</title>
<style>
  /* Container for the flip card */
  .flip-card {
    width: 300px;
    height: 400px;
    perspective: 1000px;
    cursor: pointer;
    margin: 50px auto; /* centers the card */
  }

  /* Inner wrapper that will be rotated */
  .flip-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.8s;
    transform-style: preserve-3d;
  }

  /* Flip the inner on flipped class */
  .flip-card.flipped .flip-card-inner {
    transform: rotateY(180deg);
  }

  /* Common styles for front and back faces */
  .flip-card-front, .flip-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    font-size: 1.2em;
    text-align: center;
  }

  /* Back face rotated 180deg */
  .flip-card-back {
    transform: rotateY(180deg);
  }

  /* Styling for images inside front and back */
  .flip-card-front img, .flip-card-back img {
    max-width: 100%;
    height: auto;
    margin-top: 10px;
    object-fit: cover;
  }
</style>
</head>
<body>

<div class="flip-card" onclick="this.classList.toggle('flipped')">
  <div class="flip-card-inner">
    <!-- Front side with text and image -->
    <div class="flip-card-front">
      <div>Image of Armor and Enhancements Pending. Touch for stats.</div>
      <img src="https://sorcrpg.com/images/cards/armor-cards/common-armor-cards/structure-chain/front-armor-card-common/IMG_1731_Original.jpeg" alt="Front Image" />
    </div>
    <!-- Back side with message and image -->
    <div class="flip-card-back">
      <div>Steelbrook Mercenary Chain Stats.  Touch to return to image and effects, if any.</div>
      <img src="https://sorcrpg.com/images/cards/armor-cards/common-armor-cards/structure-chain/steelbrook-mercenarys-chain/IMG_1730.jpeg" alt="Back Image" />
    </div>
  </div>
</div>

</body>
</html>
