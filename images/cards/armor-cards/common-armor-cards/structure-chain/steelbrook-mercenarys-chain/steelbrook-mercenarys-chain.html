<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flip Card with Text and Image</title>
<style>
  .flip-card {
    width: 300px;
    height: 400px;
    perspective: 1000px;
    cursor: pointer;
  }

  .flip-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.8s;
    transform-style: preserve-3d;
    /* Start with no rotation */
    transform: rotateY(0deg);
  }

  /* When flipped, rotate 180 degrees */
  .flip-card.flipped .flip-card-inner {
    transform: rotateY(180deg);
  }

  /* Faces styling */
  .flip-card-front, .flip-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    font-size: 1.2em;
    text-align: center;
  }

  /* Front face styles */
  .flip-card-front {
    background-color: #f0f0f0; /* optional, for visibility */
  }

  /* Back face styles */
  .flip-card-back {
    flex-direction: column;
  }

  /* Image styling */
  .flip-card-back img {
    margin-top: 10px;
    max-width: 100%;
    height: auto;
    object-fit: cover;
  }
</style>
</head>
<body>

<div class="flip-card" onclick="this.classList.toggle('flipped')">
  <div class="flip-card-inner">
    <!-- Front side with text -->
    <div class="flip-card-front">
      <div>
        Image of<br>
        Steelbrook Mercenary Chain<br>
        Coming Soon
      </div>
    </div>
    <!-- Back side with message and image -->
    <div class="flip-card-back">
      <div>Touch card to see image of armor</div>
      <img src="https://sorcrpg.com/images/cards/armor-cards/common-armor-cards/structure-chain/steelbrook-mercenarys-chain/IMG_1730.jpeg" alt="Back Image" />
    </div>
  </div>
</div>

</body>
</html>
