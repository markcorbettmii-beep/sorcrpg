<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flip Card with Images</title>
<style>
  .flip-card {
    background-color: transparent;
    width: 300px;
    height: 400px;
    perspective: 1000px;
    cursor: pointer;
  }
  .flip-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.8s;
    transform-style: preserve-3d;
  }
  /* When flipped, rotate the inner */
  .flip-card.flipped .flip-card-inner {
    transform: rotateY(180deg);
  }
  .flip-card-front, .flip-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
  }
  /* Optional: Remove default margin/padding from images */
  img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>

<div class="flip-card" onclick="this.classList.toggle('flipped')">
  <div class="flip-card-inner">
    <div class="flip-card-front">
      <img src="https://sorcrpg.com/images/cards/armor-cards/common-armor-cards/structure-chain/front-armor-card-common/IMG_1731_Original.jpeg" alt="Front Image" />
    </div>
    <div class="flip-card-back">
      <img src="https://sorcrpg.com/images/cards/armor-cards/common-armor-cards/structure-chain/steelbrook-mercenarys-chain/IMG_1730.jpeg" alt="Back Image" />
    </div>
  </div>
</div>

</body>
</html>
