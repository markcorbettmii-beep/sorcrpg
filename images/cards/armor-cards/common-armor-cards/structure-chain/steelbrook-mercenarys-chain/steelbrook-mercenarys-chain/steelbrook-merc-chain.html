<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Steelbrook Mercenary Chain Stats n Image</title>
<style>
  /* Container for the flip card */
  .flip-card {
    width: 300px;
    height: 400px;
    perspective: 1000px;
    cursor: pointer;
    margin: 50px auto;
  }

  /* Inner wrapper that will be rotated */
  .flip-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.8s;
    transform-style: preserve-3d;
  }

  /* Flip the inner on flipped class */
  .flip-card.flipped .flip-card-inner {
    transform: rotateY(180deg);
  }

  /* Common styles for front and back faces */
  .flip-card-front, .flip-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start; /* align at top for consistency */
    padding: 10px;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    font-size: 1em;
    text-align: center;
    background-color: #fff; /* optional background */
  }

  /* Back face rotated 180deg */
  .flip-card-back {
    transform: rotateY(180deg);
  }

  /* Layout container to keep content aligned */
  .content-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  /* Style for the text */
  .text-container {
    margin-top: 10px;
    margin-bottom: 10px;
    text-align: center;
  }

  /* Style for images inside front and back */
  .flip-card-front img, .flip-card-back img {
    max-width: 90%;
    height: auto;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="flip-card" onclick="this.classList.toggle('flipped')">
  <div class="flip-card-inner">
    <!-- Front side -->
    <div class="flip-card-front">
      <div class="content-container">
        <div class="text-container">
          Image of Steelbrook Mercenary Chain and Enhancements Pending. Touch for stats.
        </div>
        <img src="https://sorcrpg.com/images/cards/armor-cards/common-armor-cards/structure-chain/front-armor-card-common/IMG_1153.jpeg" alt="Front Image" />
      </div>
    </div>
    <!-- Back side -->
    <div class="flip-card-back">
      <div class="content-container">
        <div class="text-container">
          Steelbrook Mercenary Chain Stats. Touch to return to image and effects, if any.
        </div>
        <img src="https://sorcrpg.com/images/cards/armor-cards/common-armor-cards/structure-chain/steelbrook-mercenarys-chain/steelbrook-mercenarys-chain/IMG_1149.jpeg" alt="Back Image" />
      </div>
    </div>
  </div>
</div>

</body>
</html>
