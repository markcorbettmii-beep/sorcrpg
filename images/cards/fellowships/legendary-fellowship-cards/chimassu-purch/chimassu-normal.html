<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chimassu Normal Fellowship Card</title>
<style>
  .flip-card {
    width: 350px;
    height: 600px;
    perspective: 1000px;
    cursor: pointer;
    margin: 50px auto;
  }
  .flip-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.8s;
    transform-style: preserve-3d;
  }
  .flip-card.flipped .flip-card-inner {
    transform: rotateY(180deg);
  }
  .flip-card-front, .flip-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 10px;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    font-size: 1em;
    text-align: center;
    background-color: #fff;
    overflow: hidden;
  }
  .flip-card-back {
    transform: rotateY(180deg);
    overflow-y: auto;
    text-align: left;
    padding-right: 14px;
  }
  .content-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: auto;
  }
  .back-to-image {
    margin-bottom: 8px;
    margin-top: 0;
    font-weight: bold;
    text-align: center;
    width: 100%;
  }
  .flip-card-front img, .flip-card-back img {
    max-width: 90%;
    height: auto;
    margin-top: 10px;
    margin-bottom: 14px;
  }
  .chimassu-text {
    font-size: 0.93em;
    margin-top: 8px;
    margin-bottom: 8px;
    width: 100%;
  }
  .chimassu-text h2 {
    font-size: 1.08em;
    margin: 0.3em 0 0.15em 0;
    text-align: left;
  }
  .chimassu-text b {
    display: block;
    margin-top: 0.5em;
    margin-bottom: 0.13em;
  }
  .chimassu-text ul {
    margin: 0 0 0 1.5em;
    padding: 0;
  }
  .chimassu-text p {
    margin: 0.23em 0;
  }
</style>
</head>
<body>

<div class="flip-card" id="chimassuCard">
  <div class="flip-card-inner">
    <!-- Front side -->
    <div class="flip-card-front">
      Touch Card (flip)
      <div class="content-container">
        <img src="https://sorcrpg.com/images/cards/fellowships/legendary-fellowship-cards/chimassu-purch/IMG_1182.jpeg" alt="Front Image Chimassu Normal" />
      </div>
    </div>
    <!-- Back side -->
    <div class="flip-card-back">
      <div class="back-to-image">Back Image Normal</div>
      <img src="https://sorcrpg.com/images/cards/fellowships/legendary-fellowship-cards/chimassu-purch/IMG_1234.jpeg" alt="Back Image Chimassu Wild" />
      <div class="chimassu-text">
        <!-- ... large block of text unchanged ... -->
        <h2>Fellowship - Guardian</h2>
        <b>Chimassu Normal – Lore &amp; History</b>
        <!-- ... rest of the content ... -->
        <p>
          None. As a wild celestial beast, the Chimassu does not possess profession or craftsmanship skills.
        </p>
      </div>
    </div>
  </div>
</div>

<div style="text-align:center; margin-top:20px;">
  <button onclick="showFront()">Show Front</button>
  <button onclick="showBack()">Show Back</button>
</div>

<script>
const card = document.getElementById('chimassuCard');

card.addEventListener('click', function(e) {
  // Prevent flip if clicking a button or outside the card
  if (e.target.closest('.flip-card')) {
    card.classList.toggle('flipped');
  }
});

function showFront() {
  card.classList.remove('flipped');
}
function showBack() {
  card.classList.add('flipped');
}
</script>

</body>
</html>
