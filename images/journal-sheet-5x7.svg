<svg xmlns="http://www.w3.org/2000/svg" width="5in" height="7in" viewBox="0 0 360 504" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b06a"/>
      <stop offset="55%" stop-color="#009a55"/>
      <stop offset="100%" stop-color="#008601"/>
    </linearGradient>
  </defs>

  <rect width="360" height="504" fill="url(#sheet)"/>

  <!-- masthead -->
  <text x="180" y="62" text-anchor="middle" font-size="46" letter-spacing="3"
        fill="#d9a520">SORC</text>
  <text x="180" y="86" text-anchor="middle" font-size="15" letter-spacing="5"
        fill="#d9a520">JOURNAL</text>

  <!-- type row -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="7.5" letter-spacing="1.1" fill="#0a5c34">
    <text x="29" y="118">QUEST</text>
    <text x="72" y="118">LORE</text>
    <text x="108" y="118">PLACE</text>
    <text x="150" y="118">PERSON</text>
    <text x="200" y="118">NOTE</text>
    <text x="271" y="118">SESSION</text>
  </g>
  <g stroke="#0a5c34" stroke-width=".8" fill="none" opacity=".65">
    <rect x="22" y="112" width="6" height="6"/>
    <rect x="65" y="112" width="6" height="6"/>
    <rect x="101" y="112" width="6" height="6"/>
    <rect x="143" y="112" width="6" height="6"/>
    <rect x="193" y="112" width="6" height="6"/>
  </g>
  <line x1="312" y1="119" x2="338" y2="119" stroke="#0a5c34" stroke-width=".7" opacity=".5"/>

  <!-- printed field lines -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="7" letter-spacing="1.1" fill="#0a5c34" opacity=".85">
    <text x="22" y="140">NAME</text>
    <text x="22" y="166">WHERE OR WHO</text>
    <text x="22" y="192">STANDING CHANGED</text>
    <text x="196" y="192">WITH</text>
  </g>

  <!-- ruled lines -->
  <g stroke="#0a6b3c" stroke-width=".7" opacity=".42">
    <line x1="22" y1="146" x2="338" y2="146"/>
    <line x1="22" y1="172" x2="338" y2="172"/>
    <line x1="22" y1="198" x2="338" y2="198"/>
    <line x1="22" y1="224" x2="338" y2="224"/>
    <line x1="22" y1="248" x2="338" y2="248"/>
    <line x1="22" y1="272" x2="338" y2="272"/>
    <line x1="22" y1="296" x2="338" y2="296"/>
    <line x1="22" y1="320" x2="338" y2="320"/>
    <line x1="22" y1="344" x2="338" y2="344"/>
    <line x1="22" y1="368" x2="338" y2="368"/>
    <line x1="22" y1="392" x2="338" y2="392"/>
    <line x1="22" y1="416" x2="338" y2="416"/>
    <line x1="22" y1="440" x2="338" y2="440"/>
  </g>

  <!-- footer strip -->
  <line x1="22" y1="456" x2="338" y2="456" stroke="#0a5c34" stroke-width=".8" opacity=".5"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="6.4" letter-spacing=".8" fill="#0a5c34">
    <text x="31" y="471">OPEN</text>
    <text x="76" y="471">COMPLETE</text>
    <text x="142" y="471">FAILED</text>
    <text x="190" y="471">ABANDONED</text>
    <text x="31" y="489">WITNESSED</text>
    <text x="106" y="489">RUMOR ONLY</text>
  </g>
  <g stroke="#0a5c34" stroke-width=".8" fill="none" opacity=".65">
    <rect x="22" y="465" width="6" height="6"/>
    <rect x="67" y="465" width="6" height="6"/>
    <rect x="133" y="465" width="6" height="6"/>
    <rect x="181" y="465" width="6" height="6"/>
    <rect x="22" y="483" width="6" height="6"/>
    <rect x="97" y="483" width="6" height="6"/>
  </g>
</svg>
