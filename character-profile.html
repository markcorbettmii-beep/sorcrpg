<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SORC Character Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css?v=9">
  <style>
    main { padding: 2rem; margin: 0 auto; max-width: 900px; }
    .profile-section { background: rgba(120,80,200,0.06); border: 1px solid rgba(160,140,200,0.15); padding: 1.5rem; border-radius: 6px; margin-bottom: 2rem; }
    .profile-section h2 { color: #c5a042; font-size: 1.3rem; letter-spacing: 1.5px; text-transform: uppercase; margin: 0 0 1.5rem; border-bottom: 2px solid rgba(160,100,220,0.3); padding-bottom: 0.5rem; }
    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.5rem; }
    @media (max-width: 768px) { .profile-grid { grid-template-columns: 1fr; } }
    .profile-field { display: flex; flex-direction: column; }
    .profile-field label { font-size: 0.85rem; font-weight: bold; color: #c5a042; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 0.4rem; opacity: 0.9; }
    .profile-field input, .profile-field select, .profile-field textarea { background: rgba(0,0,0,0.2); border: 1px solid rgba(160,140,200,0.2); color: #ffffff; padding: 0.6rem 0.8rem; border-radius: 3px; font-family: inherit; font-size: 0.95rem; }
    .profile-field input:focus, .profile-field select:focus, .profile-field textarea:focus { outline: none; border-color: rgba(160,100,220,0.6); background: rgba(120,80,200,0.15); }
    .full-width { grid-column: 1 / -1; }
    .field-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    @media (max-width: 768px) { .field-row-3 { grid-template-columns: 1fr; } }

    body.lawful-mode .profile-section { background: rgba(200,180,120,0.08); border-color: rgba(0,0,0,0.12); }
    body.lawful-mode .profile-section h2 { color: #8b7500; border-color: rgba(100,60,0,0.2); }
    body.lawful-mode .profile-field label { color: #8b7500; }
    body.lawful-mode .profile-field input, body.lawful-mode .profile-field select, body.lawful-mode .profile-field textarea { background: rgba(0,0,0,0.08); border-color: rgba(0,0,0,0.15); color: #2c2c2c; }
  </style>
</head>
<body>
  <main>
    <div class="profile-section">
      <h2>Character Profile</h2>

      <div class="profile-grid">
        <!-- 1. Name & UID -->
        <div class="profile-field">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Character name">
        </div>
        <div class="profile-field">
          <label for="uid">UID</label>
          <input type="text" id="uid" placeholder="Unique ID" maxlength="5">
        </div>

        <!-- 2. Nickname(s) -->
        <div class="profile-field full-width">
          <label for="nicknames">Nickname(s)</label>
          <input type="text" id="nicknames" placeholder="e.g., The Brave, Shadowstep, Ironheart">
        </div>

        <!-- 3. Gender -->
        <div class="profile-field">
          <label for="gender">Gender</label>
          <select id="gender">
            <option value="">Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="non-binary">Non-binary</option>
            <option value="other">Other</option>
            <option value="ukn">Unknown (UKN)</option>
          </select>
        </div>

        <!-- 4. Age -->
        <div class="profile-field">
          <label for="age">Age</label>
          <input type="number" id="age" placeholder="Character age" min="1" max="200">
        </div>

        <!-- 5. Race -->
        <div class="profile-field">
          <label for="race">Race</label>
          <input type="text" id="race" placeholder="e.g., Dwarf, Elf, Human">
        </div>

        <!-- 6. Species -->
        <div class="profile-field">
          <label for="species">Species</label>
          <input type="text" id="species" placeholder="e.g., Humanoid, Reptilian, Fae">
        </div>

        <!-- 7. Level -->
        <div class="profile-field">
          <label for="level">Level</label>
          <input type="number" id="level" placeholder="LVL" min="0" max="30">
        </div>

        <!-- 8. Rank -->
        <div class="profile-field">
          <label for="rank">Rank</label>
          <input type="text" id="rank" placeholder="Novice, Apprentice, etc.">
        </div>

        <!-- 9. Growth -->
        <div class="profile-field">
          <label for="growth">Growth</label>
          <input type="number" id="growth" placeholder="Growth milestone" min="0" max="20">
        </div>

        <!-- 10. Favorite Class(es) -->
        <div class="profile-field full-width">
          <label for="favoriteClasses">Favorite Class(es)</label>
          <input type="text" id="favoriteClasses" placeholder="e.g., Warrior, Cleric; Thief, Ranger">
        </div>

        <!-- 11. Culture -->
        <div class="profile-field">
          <label for="culture">Culture</label>
          <input type="text" id="culture" placeholder="Cultural background">
        </div>

        <!-- 12. Place of Birth -->
        <div class="profile-field">
          <label for="birthplace">Place of Birth</label>
          <input type="text" id="birthplace" placeholder="Hometown or birthplace">
        </div>

        <!-- 13. Languages -->
        <div class="profile-field full-width">
          <label for="languages">Languages</label>
          <input type="text" id="languages" placeholder="e.g., Common, Dwarvish, Elvish">
        </div>

        <!-- 14. Occupation / Role -->
        <div class="profile-field full-width">
          <label for="occupation">Occupation / Role</label>
          <input type="text" id="occupation" placeholder="Profession or adventuring role">
        </div>
      </div>
    </div>
  </main>
</body>
</html>
