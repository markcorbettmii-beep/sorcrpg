<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resend Verification | Slayers of Rings § Crowns</title>
    <link rel="stylesheet" href="styles.css?v=9" />
    <style>
        body { font-family: sans-serif; min-height: 100vh; margin: 0; display: flex; flex-direction: column; }
        .signin-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem 1rem; }
        .signin-card { background: #1a1a1a; border: 1px solid #333; border-radius: 1rem; padding: 2.5rem 2rem; max-width: 420px; width: 100%; text-align: center; }
        .signin-card h1 { color: #c93f35; font-size: 1.8rem; margin-bottom: 1rem; font-weight: 600; }
        .signin-card p { color: #999; font-size: 0.95rem; margin-bottom: 1.5rem; line-height: 1.5; }
        .email-label { color: #888; font-size: 0.85rem; margin-bottom: 0.5rem; text-align: left; }
        .signin-input { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 1rem; box-sizing: border-box; transition: all 0.2s; }
        .signin-input:focus { outline: none; border-color: #c93f35; }
        .signin-input::placeholder { color: #666; opacity: 0.4; }
        .signin-btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 1rem; margin-bottom: 16px; background: #c93f35; color: #fff; transition: all 0.2s; }
        .signin-btn:hover { background: #d45a4a; }
        .status-msg { display: none; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 16px; }
        .status-msg.success { background: #1a3a1a; color: #6fcf6f; border: 1px solid #2a5a2a; }
        .status-msg.error { background: #3a1a1a; color: #e57373; border: 1px solid #5a2a2a; }
        .signin-links { margin-top: 1rem; font-size: 0.85rem; }
        .signin-links a { color: #b9aa00; text-decoration: none; }
        .signin-links a:hover { text-decoration: underline; }

        body.lawful-mode .signin-card { background: #ffffff; border-color: #e0e0e0; }
        body.lawful-mode .signin-input { background: #f9f5f1; color: #2c2c2c; border-color: #ccc; }
        body.lawful-mode .signin-input::placeholder { color: #999; opacity: 0.4; }
        body.lawful-mode .signin-card p { color: #555; }
        body.lawful-mode .email-label { color: #666; }
        body.lawful-mode .status-msg.error { background: #fbe6e4; color: #a03030; border-color: #e0a0a0; }
        body.lawful-mode .status-msg.success { background: #e6f5e6; color: #1a7a1a; border-color: #7fcf9f; }
    </style>
</head>
<body>
    <div class="signin-wrapper">
        <div class="signin-card">
            <h1>Resend Verification</h1>
            <p>Please enter the email address you'd like your verification link sent to</p>
            <div class="status-msg" id="statusMsg"></div>
            <div class="email-label">Enter email address</div>
            <input type="email" id="emailInput" class="signin-input" placeholder="corbett@sorcrpg.com" autocomplete="email" />
            <button class="signin-btn" onclick="doResendVerification()">Resend Verification Email</button>
            <div class="signin-links"><a href="/signin.html">Back to Sign In</a></div>
        </div>
    </div>
    <script>
        function showStatus(msg, type) {
            var el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status-msg ' + type;
            el.style.display = 'block';
        }

        (function(){
            var t = localStorage.getItem('themeSelected') || 'evil';
            if (t === 'lawful') document.body.classList.add('lawful-mode');

            var email = localStorage.getItem('signupEmail') || (JSON.parse(localStorage.getItem('sorc_user') || '{}').email);
            if (email) {
                document.getElementById('emailInput').value = email;
            }
        })();

        function doResendVerification() {
            var email = document.getElementById('emailInput').value.trim();
            if (!email) { showStatus('Please enter your email address.', 'error'); return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showStatus('Please enter a valid email address.', 'error'); return; }

            showStatus('Sending...', 'success');
            var apiUrl = window.SORC_API || 'https://api.sorcrpg.com';
            fetch(apiUrl + '/api/auth/resend-verification', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            }).then(function(r) { return r.json(); }).then(function(data) {
                if (data.success) {
                    showStatus('Verification email sent! Check your inbox and spam folder.', 'success');
                    setTimeout(function() { window.location.href = '/signin-verify-email.html'; }, 2500);
                } else {
                    showStatus(data.error || 'Something went wrong.', 'error');
                }
            }).catch(function() {
                showStatus('Connection error. Please try again.', 'error');
            });
        }
    </script>
    <div id="footer"></div>
</body>
</html>
