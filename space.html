<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Deployment: 2026-08-25 -->
    <title>Character Space | Slayers of Rings § Crowns</title>
    <link rel="stylesheet" href="styles.css?v=10" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        .space-container { max-width: 1000px; margin: 2rem auto; padding: 2rem; }
        .space-card { background: #1a1a1a; border-radius: 1rem; border: 1px solid #333; overflow: hidden; margin-bottom: 1rem; }
        .space-banner { width: 100%; height: 120px; background: linear-gradient(135deg, #1a0a0a, #2a0808, #c93f3522); display: flex; align-items: center; justify-content: center; color: #b9aa00; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.08em; position: relative; padding: 1rem 2rem; box-sizing: border-box; text-align: center; }
        .space-banner-title { color: #b9aa00; font-size: 1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.08em; line-height: 1; margin: 0 0 0.5rem 0; padding: 0 1.5rem; display: block; }
        body.lawful-mode .space-banner-title { color: #c93f35; }
        .space-info-row { display: flex; align-items: flex-end; gap: 1rem; padding: 0 1.5rem; margin-top: -40px; margin-bottom: 1rem; position: relative; z-index: 1; }
        .space-avatar-large { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #c93f35; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #555; overflow: hidden; flex-shrink: 0; }
        .space-name-block { flex: 1; padding-bottom: 0.5rem; }
        .space-username { font-size: 1.3rem; font-weight: bold; color: #e0cfc0; }
        .space-role-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; margin-top: 3px; }
        .space-section { padding: 1rem 1.5rem; border-top: 1px solid #2a2a2a; }
        .space-section h3 { color: #b9aa00; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.75rem 0; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
        .stat-box { background: #222; border-radius: 8px; padding: 0.75rem; text-align: center; border: 1px solid #333; }
        .stat-box .stat-val { font-size: 1.2rem; font-weight: bold; color: #b9aa00; }
        .stat-box .stat-label { font-size: 0.7rem; color: #666; margin-top: 2px; }

        /* Tab Navigation - paper folder tabs, 3 columns */
        .tab-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px 4px;
            padding: 6px 6px 0 6px;
            background: #141414;
            border-radius: 10px 10px 0 0;
            border-bottom: 3px solid #b9aa00;
        }
        .tab-nav button {
            position: relative;
            padding: 9px 6px 8px;
            background: linear-gradient(180deg, #262626 0%, #1c1c1c 100%);
            border: 1px solid #333;
            border-bottom: none;
            border-radius: 9px 9px 0 0;
            color: #8a8a8a;
            font-weight: bold;
            font-size: 0.62rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            line-height: 1.25;
            cursor: pointer;
            transition: all 0.15s ease;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .tab-nav button:hover:not(:disabled) {
            background: linear-gradient(180deg, #303030 0%, #242424 100%);
            color: #b9aa00;
            border-color: #4a4420;
        }
        .tab-nav button.active {
            background: linear-gradient(180deg, #3a3520 0%, #2a2718 100%);
            color: #b9aa00;
            border-color: #b9aa00;
            box-shadow: inset 0 1px 0 rgba(185,170,0,0.25), 0 -2px 4px rgba(0,0,0,0.3);
            z-index: 2;
        }
        .tab-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
        .tab-content { display: none; padding: 1.75rem 1.5rem; background: #1a1a1a; border-radius: 0 0 10px 10px; min-height: 300px; }
        .tab-content.active { display: block; }

        /* Tabs scale with viewport so they never read as empty bars on desktop */
        @media (min-width: 600px) {
            .tab-nav { gap: 4px 6px; padding: 8px 8px 0 8px; }
            .tab-nav button { font-size: 0.72rem; padding: 11px 10px 10px; letter-spacing: 0.05em; }
        }
        @media (min-width: 900px) {
            .tab-nav { gap: 5px 8px; padding: 10px 10px 0 10px; }
            .tab-nav button { font-size: 0.82rem; padding: 14px 14px 12px; border-radius: 11px 11px 0 0; }
        }

        /* Access Control */
        .access-badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; margin-bottom: 1rem; }
        .access-badge.PUBLIC { background: #1a3a6b; color: #fff; }
        .access-badge.PRIVATE { background: #3a1a1a; color: #fff; }
        .access-badge.PRO { background: #3a3a1a; color: #fff; }
        .locked-section { background: #2a1a1a; border: 1px solid #c93f35; border-radius: 8px; padding: 2rem; text-align: center; }
        .locked-section h4 { color: #c93f35; margin: 0 0 0.5rem 0; }
        .locked-section p { color: #888; font-size: 0.9rem; margin: 0.5rem 0; }
        .upgrade-btn { background: #b9aa00; color: #111; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .upgrade-btn:hover { background: #d4c70a; }

        /* Content Grid */
        .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .card { background: #222; border: 1px solid #333; border-radius: 8px; padding: 1rem; transition: border-color 0.2s; }
        .card:hover { border-color: #b9aa00; }
        .card h4 { color: #e0cfc0; margin: 0 0 0.5rem 0; font-size: 0.95rem; }
        .card p { color: #666; font-size: 0.85rem; margin: 0; line-height: 1.5; }

        .fam-tags { margin: 0.6rem 0 0 0; display: flex; gap: 0.35rem; flex-wrap: wrap; }
        .fam-tag { font-size: 0.68rem; font-weight: bold; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; background: #2c2c1a; color: #b9aa00; border: 1px solid #4a4420; }
        body.lawful-mode .fam-tag { background: #f5f1e0; color: #7a6a00; border-color: #ddd5b0; }
        /* Sub-tabs (game boards under Leaderboards) */
        .subtab { padding: 6px 14px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #888; font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: all 0.15s; }
        .subtab:hover { border-color: #b9aa00; color: #b9aa00; }
        .subtab.active { background: #222; border-color: #b9aa00; color: #b9aa00; }
        body.lawful-mode .subtab { background: #ffffff; border-color: #e0e0e0; }
        body.lawful-mode .subtab.active { background: #f9f5f1; border-color: #c93f35; color: #c93f35; }

        .not-logged-in { text-align: center; padding: 3rem; }
        .not-logged-in a { color: #c93f35; }

        .btn { padding: 8px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-red { background: #c93f35; color: #fff; }
        .btn-gold { background: #b9aa00; color: #222; }
        .btn-sm { padding: 5px 12px; font-size: 0.8rem; }

        body.lawful-mode .space-card { background: #ffffff; border-color: #e0e0e0; }
        body.lawful-mode .tab-nav { background: #e8e3d5; border-bottom-color: #c9a227; }
        body.lawful-mode .tab-nav button {
            background: linear-gradient(180deg, #fdfcf8 0%, #f2ece0 100%);
            border-color: #d8d0bd;
            color: #7a7264;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }
        body.lawful-mode .tab-nav button:hover:not(:disabled) { background: #fffef9; color: #c93f35; border-color: #c9a227; }
        body.lawful-mode .tab-nav button.active {
            background: linear-gradient(180deg, #ffffff 0%, #fdfaf2 100%);
            color: #c93f35;
            border-color: #c9a227;
            box-shadow: inset 0 2px 0 #c9a227, 0 -2px 4px rgba(0,0,0,0.06);
        }
        body.lawful-mode .tab-content { background: #ffffff; }
        body.lawful-mode .card { background: #f9f5f1; border-color: #e0e0e0; }
        body.lawful-mode .card h4 { color: #2c2c2c; }
        body.lawful-mode .card p { color: #666; }
        body.lawful-mode .stat-box { background: #f9f5f1; border-color: #e0e0e0; }
    </style>
</head>

        <div id="navRoleBadge"></div>

    <script>(function(){var t=localStorage.getItem('themeSelected')||'lawful';if(t==='lawful')document.body.classList.add('lawful-mode');})();</script>
    <ul class="page-nav">
      <li><a href="index.html">&#8962;</a></li>

    <div id="profileApp">
        <!-- Space Header -->
        <div class="space-container" id="profileContainer">
            <div class="not-logged-in">
                <p>Loading...</p>
                <button onclick="alert('JS is working');" style="padding:10px 20px;margin-top:1rem;background:#b9aa00;color:#222;border:none;border-radius:6px;font-weight:bold;cursor:pointer;">Test JS</button>
            </div>
        </div>

    <script>
        // Failsafe: if DOMContentLoaded doesn't fire or stalls, show error after 10 seconds
        var loadTimeoutId = setTimeout(function() {

            if (container && container.innerHTML.includes('Loading')) {
                container.innerHTML = '<div class="not-logged-in"><h2>Unable to Load</h2><p>Profile failed to load. <a href="signin.html">Sign in again</a></p><button onclick="location.reload();" style="padding:10px 20px;margin-top:1rem;background:#b9aa00;color:#222;border:none;border-radius:6px;font-weight:bold;cursor:pointer;">Retry</button></div>';
            }

    <div id="footer"></div>
    <script src="main.js?v=26"></script>
    <script>
    var API_URL = 'https://api.sorcrpg.com';
    var OWNER_EMAILS = ['corbett@sorcrpg.com'];
    var ADMIN_EMAILS = ['markcorbett.mii@gmail.com'];

    // Tab definitions with access control
    var PROFILE_TABS = [
        { id: 'overview', label: 'Overview', access: 'PUBLIC', pro: false },
        { id: 'trophy-room', label: 'Trophy Room', access: 'PUBLIC', pro: false },
        { id: 'characters', label: 'Characters', access: 'PUBLIC', pro: false },
        { id: 'leaderboards', label: 'Leaderboards', access: 'PUBLIC', pro: false },
        { id: 'fellows', label: 'Fellows', access: 'PUBLIC', pro: false },
        { id: 'vault', label: 'Vault', access: 'PRIVATE', pro: false },
        { id: 'online-journal', label: 'Online Journal', access: 'PRIVATE', pro: false },
        { id: 'home', label: 'Home', access: 'PRO', pro: false },
        { id: 'standing', label: 'Standing', access: 'PUBLIC', pro: false },
        { id: 'essentia-exchange', label: 'Essentia Exchange', access: 'PRIVATE', pro: false },
        { id: 'inbox', label: 'Inbox', access: 'PRIVATE', pro: false },
        { id: 'settings', label: 'Settings', access: 'PRIVATE', pro: false }
    ];

    function canViewTab(tab, isOwner, isPro) {
        if (tab.access === 'PUBLIC') return true;
        if (tab.access === 'PRIVATE') return isOwner;
        if (tab.access === 'PRO') return isOwner && isPro;
        return false;
    }

    function getRoleColor(role) {
        if (role === 'OWNER') return 'background:#b9aa00;color:#222;';
        if (role === 'ADMIN') return 'background:#c93f35;color:#fff;';
        if (role === 'MASTER') return 'background:#1a6b1a;color:#fff;';
        if (role === 'PLAYER') return 'background:#1a3a6b;color:#fff;';
        return 'background:#333;color:#e0cfc0;';
    }

    function getRoleAbbr(role) {
        if (role === 'OWNER') return '[OWN]';
        if (role === 'ADMIN') return '[AD]';
        if (role === 'MASTER') return '[GM]';
        if (role === 'PLAYER') return '[PC]';
        return '[CIV]';
    }

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    var GAME_MODES = {
        'campaign': 'Campaign Mode',
        'trials-combat': 'Trials of Combat',
        'trials-zailister': 'Trials of Zailister',
        'omne': 'Omn\u00e9 Chronicles',
        'crownmaster': 'Crownmaster',
        'legend': 'Legend'
    };

    window.switchGameMode = function(ev, mode) {
        var btns = ev.target.parentNode.querySelectorAll('.subtab');
        for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
        ev.target.classList.add('active');
        var out = document.getElementById('gameBoard');
        if (out) out.innerHTML = '<p>' + (GAME_MODES[mode] || 'Mode') + ' standings loading...</p>';
    };

    function switchTab(tabId) {
        document.querySelectorAll('.tab-nav button').forEach(function(btn) { btn.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
        var btn = document.querySelector('.tab-nav button[data-tab="' + tabId + '"]');
        if (btn) btn.classList.add('active');
        var panel = document.getElementById('tab-' + tabId);
        if (panel) panel.classList.add('active');
        window.history.replaceState(null, null, '?tab=' + tabId);

        // Load Fellows data when Fellows tab is selected
        if (tabId === 'fellows') {
            loadFellowsData();
        }
    }

    function loadFellowsData() {
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}

        if (!saved || !saved.authKey) return;

        // Load friend requests
        fetch(API_URL + '/api/friend-requests', {
            headers: { 'X-Auth-Key': saved.authKey }
        })
        .then(r => r.ok ? r.json() : null)
        .then(data => {
            var requestsList = document.getElementById('friendRequestsList');
            if (!requestsList) return;

            if (!data || data.count === 0) {
                requestsList.innerHTML = '<p style="color:#888;font-size:0.9rem;">No pending friend requests.</p>';
                return;
            }

            var html = '';
            data.incoming_requests.forEach(function(req) {
                html += '<div style="display:flex;gap:1rem;padding:1rem;background:#1a1a1a;border-radius:6px;margin-bottom:0.5rem;align-items:center;">' +
                    '<div style="width:48px;height:48px;border-radius:50%;background:#333;flex-shrink:0;border:2px solid #b9aa00;display:flex;align-items:center;justify-content:center;color:#666;font-size:0.9rem;">' +
                    (req.from_avatar ? '<img src="images/avatars/' + req.from_avatar + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />' : req.from_display_name.charAt(0)) +
                    '</div>' +
                    '<div style="flex:1;">' +
                        '<p style="color:#e0cfc0;margin:0 0 0.25rem 0;font-weight:bold;">' + esc(req.from_display_name) + '</p>' +
                        '<p style="color:#888;font-size:0.85rem;margin:0;">' + req.from_community_points + ' Community Points</p>' +
                    '</div>' +
                    '<button class="btn btn-sm btn-gold" onclick="acceptFriend(\'' + req.from_id + '\')">Accept</button>' +
                    '<button class="btn btn-sm" style="background:#333;color:#e0cfc0;margin-left:0.25rem;" onclick="declineFriend(\'' + req.from_id + '\')">Decline</button>' +
                '</div>';
            });
            requestsList.innerHTML = html;
        })
        .catch(e => console.error('Failed to load friend requests:', e));

        // Load online Fellows
        fetch(API_URL + '/api/friends', {
            headers: { 'X-Auth-Key': saved.authKey }
        })
        .then(r => r.ok ? r.json() : null)
        .then(data => {
            var fellowsList = document.getElementById('onlineFellowsList');
            if (!fellowsList) return;

            if (!data || data.count === 0) {
                fellowsList.innerHTML = '<p style="color:#888;font-size:0.9rem;grid-column:1/-1;">No Friends yet. <a href="#" onclick="alert(\'Friend search coming soon\');return false;" style="color:#b9aa00;text-decoration:underline;">Add a Fellow</a></p>';
                return;
            }

            var html = '';
            data.friends.forEach(function(friend) {
                var statusColor = friend.status === 'online' ? '#1a6b1a' : '#666';
                html += '<div style="background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:1rem;text-align:center;cursor:pointer;transition:all 0.2s;hover:border-color:#b9aa00;">' +
                    '<div style="width:64px;height:64px;border-radius:50%;margin:0 auto 0.75rem;background:#333;border:3px solid ' + statusColor + ';display:flex;align-items:center;justify-content:center;overflow:hidden;">' +
                    (friend.avatar ? '<img src="images/avatars/' + friend.avatar + '" style="width:100%;height:100%;object-fit:cover;" />' : '<span style="font-size:1.5rem;color:#666;">' + friend.display_name.charAt(0) + '</span>') +
                    '</div>' +
                    '<p style="color:#e0cfc0;margin:0 0 0.25rem 0;font-weight:bold;font-size:0.95rem;">' + esc(friend.display_name) + '</p>' +
                    '<p style="color:#888;font-size:0.8rem;margin:0 0 0.75rem 0;">' + (friend.status === 'online' ? '🟢 Online' : '⚫ Offline') + '</p>' +
                    '<button class="btn btn-sm btn-gold" onclick="alert(\'Fellow Space coming soon\')">View Space</button>' +
                '</div>';
            });
            fellowsList.innerHTML = html;
        })
        .catch(e => console.error('Failed to load friends:', e));
    }

    function acceptFriend(friendId) {
        var saved = JSON.parse(localStorage.getItem('sorc_user') || '{}');
        fetch(API_URL + '/api/friends', {
            method: 'POST',
            headers: { 'X-Auth-Key': saved.authKey, 'Content-Type': 'application/json' },
            body: JSON.stringify({ friend_id: friendId, action: 'accept' })
        })
        .then(r => r.json())
        .then(() => {
            loadFellowsData();
        })
        .catch(e => console.error('Failed to accept friend:', e));
    }

    function declineFriend(friendId) {
        var saved = JSON.parse(localStorage.getItem('sorc_user') || '{}');
        fetch(API_URL + '/api/friends?friend_id=' + friendId, {
            method: 'DELETE',
            headers: { 'X-Auth-Key': saved.authKey }
        })
        .then(r => r.json())
        .then(() => {
            loadFellowsData();
        })
        .catch(e => console.error('Failed to decline friend:', e));
    }

    function renderProfileHeader(user, role, isPro) {
        var displayName = user.display_name || user.username || 'Adventurer';
        var avatar = user.avatar;
        var avatarDisplay = avatar
            ? '<img src="images/avatars/' + avatar + '" style="width:100%;height:100%;object-fit:cover;" />'
            : '<span style="font-size:1.5rem;"></span>';

        var communityPoints = user.community_points || 0;
        var postCount = user.post_count || 0;
        var membershipBadge = isPro ? '<span class="space-role-tag" style="background:#b9aa00;color:#222;">PRO</span>' : '';

        return '<div class="space-banner-title">Your Space</div>' +
            '<div class="space-card">' +
            '<div class="space-banner"></div>' +
            '<div class="space-info-row">' +
                '<div class="space-avatar-large">' + avatarDisplay + '</div>' +
                '<div class="space-name-block">' +
                    '<div class="space-username">' + esc(displayName) + '</div>' +
                    '<span class="space-role-tag" style="' + getRoleColor(role) + '">' + role + ' ' + getRoleAbbr(role) + '</span>' +
                    membershipBadge +
                '</div>' +
            '</div>' +
            '<div class="space-section">' +
                '<div class="stat-grid">' +
                    '<div class="stat-box"><div class="stat-val">' + communityPoints + '</div><div class="stat-label">Community Points</div></div>' +
                    '<div class="stat-box"><div class="stat-val">' + postCount + '</div><div class="stat-label">Forum Posts</div></div>' +
                    '<div class="stat-box"><div class="stat-val">' + (user.email_verified ? 'Yes' : 'No') + '</div><div class="stat-label">Email Verified</div></div>' +
                '</div>' +
            '</div>' +
        '</div>';
    }

    function renderTabNav(user, role, isPro) {
        var html = '<div class="tab-nav">';
        PROFILE_TABS.forEach(function(tab) {
            var canView = canViewTab(tab, true, isPro);
            var disabled = !canView ? ' disabled' : '';
            var proClass = tab.pro ? ' pro' : '';
            html += '<button class="tab-btn' + proClass + '" data-tab="' + tab.id + '" onclick="switchTab(\'' + tab.id + '\')"' + disabled + '>' + tab.label + '</button>';
        });
        html += '</div>';
        return html;
    }

    function renderTabContent(user, role, isPro) {
        var displayName = user.display_name || user.username || 'Adventurer';
        var html = '';
        PROFILE_TABS.forEach(function(tab) {
            var canView = canViewTab(tab, true, isPro);
            var active = tab.id === 'overview' ? ' active' : '';

            html += '<div class="tab-content' + active + '" id="tab-' + tab.id + '">';

            if (!canView) {
                html += '<div class="locked-section">' +
                    '<h4>Locked</h4>' +
                    '<p>';
                if (tab.access === 'PRO') {
                    html += 'Upgrade to Pro to unlock this feature.';
                } else {
                    html += 'This section is private to your Space.';
                }
                html += '</p>';
                if (tab.access === 'PRO') {
                    html += '<button class="upgrade-btn" onclick="">Upgrade to Pro</button>';
                }
                html += '</div>';
            } else {
                // Render tab content based on ID
                switch (tab.id) {
                    case 'overview':
                        html += '<h3>Your Space</h3>' +
                            '<span class="access-badge PUBLIC">PUBLIC</span>' +
                            '<p>Your Space is your corner of Essentia. Build your reputation, showcase your treasures, and chart your path. What you see here is what others see on your public Space.</p>' +
                            '<div class="content-grid">' +
                                '<div class="card"><h4>Space Completeness</h4><p>Your avatar, display name, bio, and social links. ' +
                                '<a href="javascript:void(0);" onclick="switchTab(\'settings\');return false;" style="color:#b9aa00;text-decoration:underline;">Edit in Settings</a></p></div>' +
                                '<div class="card"><h4>Recent Achievements</h4><p>Your latest achievements will appear here.</p></div>' +

    document.addEventListener('DOMContentLoaded', async function() {
        try {
            // Clear failsafe timeout since page is loading
            if (typeof loadTimeoutId !== 'undefined') clearTimeout(loadTimeoutId);

            var saved = null;
            try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {
                console.error('[Space] Failed to parse stored user:', e);
            }

            if (!saved || !saved.authKey) {
                document.getElementById('profileContainer').innerHTML =
                    '<div class="not-logged-in"><h2>Not logged in</h2><p><a href="signin.html">Sign in to view your profile</a></p></div>';
                return;
            }

            var user = saved;
            var role = user.role || 'CIVILIAN';
            if (OWNER_EMAILS.includes(user.email)) role = 'OWNER';
            else if (ADMIN_EMAILS.includes(user.email)) role = 'ADMIN';

            var isPro = user.pro_member === true || user.pro_member === 1;

            // Fetch fresh data
            try {
                var freshRes = await fetch(API_URL + '/api/me', {
                    headers: { 'X-Auth-Key': saved.authKey }
                });
                if (freshRes.ok) {
                    var freshData = await freshRes.json();
                    if (freshData.user) {
                        user = Object.assign(user, freshData.user);
                        isPro = user.pro_member === true || user.pro_member === 1;
                        localStorage.setItem('sorc_user', JSON.stringify(user));
                    }
                } else {
                    console.warn('[Space] API returned status:', freshRes.status);
                }
            } catch(e) {
                console.error('[Space] API fetch failed:', e);
            }

            // Render profile
            var container = document.getElementById('profileContainer');
            if (!container) throw new Error('profileContainer not found');

            container.innerHTML = renderProfileHeader(user, role, isPro) +
                renderTabNav(user, role, isPro) +
                renderTabContent(user, role, isPro);

            // Set initial active tab from URL
            var params = new URLSearchParams(window.location.search);
            var initialTab = params.get('tab') || 'overview';
            switchTab(initialTab);

            // Fetch and display active character count
            (async function() {
                try {
                    var charRes = await fetch(API_URL + '/api/characters', {
                        headers: { 'X-Auth-Key': saved.authKey }
                    });
                    if (charRes.ok) {
                        var charData = await charRes.json();
                        var charCount = Array.isArray(charData) ? charData.length : (charData.characters ? charData.characters.length : 0);
                        // Update both the Settings tab and Overview tab character counts
                        var settingsCountEl = document.getElementById('activeCharacterCount');
                        if (settingsCountEl) {
                            settingsCountEl.textContent = charCount;
                        }
                        var overviewCountEl = document.getElementById('overviewCharacterCount');
                        if (overviewCountEl) {
                            overviewCountEl.textContent = charCount;
                        }
                    }
                } catch(e) {
                    console.error('[Space] Failed to fetch character count:', e);
                }
            })();

            // Initialize avatar system
            (function() {
                var AVATAR_POINTS_REQUIRED = 100;
                var defaultAvatars = [
                    { url: '/images/avatars/953d2b9a-3239-485b-b725-6a8ec7b198a6.png', id: '1' },
                    { url: '/images/avatars/6c37d5d1-76c4-4391-ac12-6ca2a1109026.png', id: '2' },
                    { url: '/images/avatars/b4d464f7-1923-409f-883a-1648018b9483.png', id: '3' },

                    for (var i = 0; i < defaultAvatars.length; i++) {
                        var btn = document.createElement('button');
                        btn.style.width = '80px';
                        btn.style.height = '80px';
                        btn.style.borderRadius = '50%';
                        btn.style.border = '2px solid #333';

                        btn.style.backgroundImage = 'url(' + defaultAvatars[i].url + ')';
                        btn.style.backgroundSize = 'cover';
                        btn.style.backgroundPosition = 'center';
                        btn.style.cursor = 'pointer';
                        btn.style.transition = 'all 0.2s';
                        btn.style.padding = '0';
                        btn.onmouseover = function() {
                            this.style.borderColor = '#b9aa00';
                            this.style.boxShadow = '0 0 8px rgba(185, 170, 0, 0.5)';
                        };
                        btn.onmouseout = function() {
                            this.style.borderColor = '#333';
                            this.style.boxShadow = 'none';
                        };
                        btn.onclick = (function(url) {
                            return function() {
                                selectDefaultAvatar(url);
                            };
                        })(defaultAvatars[i].url);

                var uploadBtn = document.getElementById('uploadAvatarBtn');

                var errMsg = (err && err.message) ? String(err.message) : 'Unknown error loading profile';

    // Global avatar functions
    function selectDefaultAvatar(imageUrl) {
        var preview = document.getElementById('avatarPreview');
        if (preview) {
            preview.style.backgroundImage = 'url(' + imageUrl + ')';
            preview.style.backgroundSize = 'cover';
            preview.style.backgroundPosition = 'center';
            preview.textContent = '';
        }
        console.log('[Avatar] Selected default avatar:', imageUrl);
    }

    function uploadCustomAvatar() {
        var fileInput = document.getElementById('avatarUpload');
        var statusEl = document.getElementById('uploadStatus');

        if (!fileInput || !fileInput.files.length) {
            if (statusEl) {
                statusEl.textContent = 'Please select a file';
                statusEl.style.display = 'block';
            }
            return;
        }

        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}

        if (!saved || !saved.authKey) {
            if (statusEl) {
                statusEl.textContent = 'Not authenticated';
                statusEl.style.display = 'block';
            }
            return;
        }

        var userCP = saved.community_points || 0;
        if (userCP < 100) {
            if (statusEl) {
                statusEl.textContent = 'Requires 100 Community Points. You have ' + userCP + '.';
                statusEl.style.display = 'block';
                statusEl.style.color = '#f44';
            }
            return;
        }

        var file = fileInput.files[0];
        if (file.size > 2 * 1024 * 1024) {
            if (statusEl) {
                statusEl.textContent = 'File size exceeds 2MB limit';
                statusEl.style.display = 'block';
            }
            return;
        }

        var reader = new FileReader();
        reader.onload = function(e) {
            var preview = document.getElementById('avatarPreview');
            if (preview) {
                preview.style.backgroundImage = 'url(' + e.target.result + ')';
                preview.style.backgroundSize = 'cover';
                preview.style.backgroundPosition = 'center';
                preview.textContent = '';
            }

            if (statusEl) {
                statusEl.textContent = 'Avatar uploaded (will save with profile)';
                statusEl.style.color = '#4ECDC4';
                statusEl.style.display = 'block';
            }

            // Reset file input
            fileInput.value = '';
            var uploadBtn = document.getElementById('uploadAvatarBtn');
            if (uploadBtn) {
                uploadBtn.textContent = 'Upload';
            }
        };
        reader.readAsDataURL(file);
    }
