<!-- Add the name of each section as an <h3> heading above each section page, e.g., "Basic Rules", "GM Rules", etc. -->
<div id="rules-sections-nav"></div>
<script>
  const ruleSections = [
    { name: "Rules Section 1", url: "/content/basic_rules/basic_rules_1.html" },
    { name: "Rules Section 2", url: "/content/basic_rules/basic_rules_2.html" },
    { name: "Rules Section 3", url: "/content/basic_rules/basic_rules_3.html" },
    { name: "Rules Section 4", url: "/content/basic_rules/basic_rules_4.html" },
    { name: "Rules Section 5", url: "/content/basic_rules/basic_rules_5.html" }
  ];
  const navDiv = document.getElementById('rules-sections-nav');
  const currentPath = window.location.pathname;
  let navHtml = '';
  ruleSections.forEach((section, idx) => {
    if (section.url === currentPath) {
      navHtml += `<a href="${section.url}" class="current-section">${section.name}</a>`;
    } else {
      navHtml += `<a href="${section.url}">${section.name}</a>`;
    }
    if (idx < ruleSections.length - 1) navHtml += ' | ';
  });
  navDiv.innerHTML = navHtml;
</script>
