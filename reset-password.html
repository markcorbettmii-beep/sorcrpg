<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Slayers of Rings § Crowns</title>
    <link rel="stylesheet" href="styles.css?v=9" />
    <style>
        body { font-family: sans-serif; min-height: 100vh; margin: 0; display: flex; flex-direction: column; }
        .signin-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem 1rem; }
        .signin-card { background: #1a1a1a; border: 1px solid #333; border-radius: 1rem; padding: 2.5rem 2rem; max-width: 420px; width: 100%; text-align: center; }
        .signin-card h1 { color: #c93f35; font-size: 1.6rem; margin-bottom: 0.5rem; }
        .signin-card p { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .signin-input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 1rem; box-sizing: border-box; }
        .signin-input:focus { outline: none; border-color: #c93f35; }
        .password-wrapper { position: relative; margin-bottom: 12px; }
        .password-wrapper .signin-input { margin-bottom: 0; padding-right: 44px; }
        .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #888; cursor: pointer; font-size: 1rem; padding: 0; }
        .signin-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; margin-bottom: 12px; background: #c93f35; color: #fff; transition: all 0.2s; }
        .signin-btn:hover { background: #c93f35; }
        .status-msg { display: none; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 12px; }
        .status-msg.success { background: #1a3a1a; color: #6fcf6f; border: 1px solid #2a5a2a; }
        .status-msg.error { background: #3a1a1a; color: #e57373; border: 1px solid #5a2a2a; }
        .signin-links { margin-top: 1rem; font-size: 0.85rem; color: #888; }
        .signin-links a { color: #b9aa00; text-decoration: none; }
    
        body.lawful-mode .signin-card { background: #ffffff; border-color: #e0e0e0; }
        body.lawful-mode .signin-input { background: #f9f5f1; color: #2c2c2c; border-color: #ccc; }
    
        body.lawful-mode .status-msg.error { background: #fbe6e4; color: #a03030; border-color: #e0a0a0; }
        body.lawful-mode .status-msg.success { background: #e6f5e6; color: #1a7a1a; border-color: #7fcf9f; }
    </style>
</head>
<body>
    <script>(function(){var t=localStorage.getItem('themeSelected')||'evil';if(t==='lawful')document.body.classList.add('lawful-mode');})();</script>
    <div class="signin-wrapper">
        <div class="signin-card">
            <h1>Reset Password</h1>
            <p>Enter your new password below.</p>
            <div class="status-msg" id="statusMsg"></div>
            <div class="password-wrapper">
                <input type="password" id="newPassword" class="signin-input" placeholder="New password (8-64 chars, 1 upper, 1 lower, 1 number)" autocomplete="new-password" />
                <button class="toggle-pw" onclick="togglePw('newPassword', this)" type="button">👁</button>
            </div>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword" class="signin-input" placeholder="Confirm new password" autocomplete="new-password" />
                <button class="toggle-pw" onclick="togglePw('confirmPassword', this)" type="button">👁</button>
            </div>
            <button class="signin-btn" onclick="doReset()">Set New Password</button>
            <div class="signin-links"><a href="/signin.html">Back to Sign In</a></div>
        </div>
    </div>
    <script type="module" src="main.js?v=25"></script>
    <script>
        function showStatus(msg, type) {
            var el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status-msg ' + type;
            el.style.display = 'block';
        }

        function togglePw(id, btn) {
            var input = document.getElementById(id);
            if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
            else { input.type = 'password'; btn.textContent = '👁'; }
        }

        var token = new URLSearchParams(window.location.search).get('token');
        if (!token) {
            showStatus('Invalid reset link. Please request a new one.', 'error');
        }

        function doReset() {
            if (!token) return;
            var password = document.getElementById('newPassword').value;
            var confirm = document.getElementById('confirmPassword').value;
            if (!password || password.length < 8 || password.length > 64) { showStatus('Password must be 8-64 characters.', 'error'); return; }
            if (!/[A-Z]/.test(password)) { showStatus('Password must contain at least one uppercase letter.', 'error'); return; }
            if (!/[a-z]/.test(password)) { showStatus('Password must contain at least one lowercase letter.', 'error'); return; }
            if (!/[0-9]/.test(password)) { showStatus('Password must contain at least one number.', 'error'); return; }
            if (password !== confirm) { showStatus('Passwords do not match.', 'error'); return; }
            showStatus('Saving...', 'success');
            var apiUrl = window.SORC_API || 'https://api.sorcrpg.com';
            fetch(apiUrl + '/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, password: password, confirmPassword: confirm })
            }).then(function(r) { return r.json(); }).then(function(data) {
                if (data.success) {
                    showStatus('Password updated! Redirecting to sign in...', 'success');
                    setTimeout(function() { window.location.href = '/signin.html?reset=true'; }, 2000);
                } else {
                    showStatus(data.error || 'Something went wrong.', 'error');
                }
            }).catch(function() {
                showStatus('Connection error. Please try again.', 'error');
            });
        }
    </script>
    <div id="footer"></div>
</body>
</html>
