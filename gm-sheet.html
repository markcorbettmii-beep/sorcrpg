<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SORC GM Sheet</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111;
      font-size: 13px;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .sheet-viewport {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
    }
    @media (max-width: 815px) {
      .sheet-viewport { overflow: hidden; }
    }

    .scale-wrap {
      width: 816px;
      height: 1056px;
      transform-origin: top center;
      flex-shrink: 0;
    }

    .flip-indicator {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      flex-shrink: 0;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .flipper {
      width: 816px;
      height: 1056px;
      position: relative;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .face {
      position: absolute;
      inset: 0;
      background: #f2ece0;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .face.back { display: none; }

    .border-frame {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .border-frame::before {
      content: '';
      position: absolute;
      inset: 7px;
      border: 2.5px solid #3a4a18;
    }
    .border-frame::after {
      content: '';
      position: absolute;
      inset: 13px;
      border: 1px solid #3a4a18;
    }

    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      z-index: 12;
      pointer-events: none;
    }
    .corner svg { width: 100%; height: 100%; }
    .corner.tl { top: 0; left: 0; }
    .corner.tr { top: 0; right: 0; transform: scaleX(-1); }
    .corner.bl { bottom: 0; left: 0; transform: scaleY(-1); }
    .corner.br { bottom: 0; right: 0; transform: scale(-1,-1); }

    .wm {
      position: absolute; inset: 0; z-index: 60; pointer-events: none;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .wm::after {
      content: 'BETA';
      font-family: 'Cinzel', serif; font-weight: 900; font-size: 26rem;
      color: #2e3d0f; opacity: 0.18; letter-spacing: 0.15em;
      transform: rotate(-52deg); white-space: nowrap;
    }

    .inner {
      position: relative;
      z-index: 1;
      padding: 14px 42px 14px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .title-block { text-align: center; margin-bottom: 4px; }

    .title-block h1 {
      font-family: 'Cinzel Decorative', Cinzel, serif;
      font-size: 1.75rem;
      color: #2e3d0f;
      font-weight: 900;
      letter-spacing: 0.03em;
      line-height: 1.15;
    }

    .title-block h2 {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      color: #2e3d0f;
      font-weight: 700;
      letter-spacing: 0.22em;
      margin-top: 4px;
    }

    .title-block .sub {
      font-family: Arial, sans-serif;
      font-size: 0.64rem;
      color: #444;
      margin-top: 5px;
      font-style: italic;
    }

    .rule {
      border: none;
      border-top: 1.5px solid #4a5a20;
      margin: 4px 0;
      opacity: 0.4;
    }

    .cols {
      display: grid;
      grid-template-columns: 1fr 1.12fr 1fr;
      gap: 10px;
      margin-top: 3px;
      align-content: start;
      overflow: hidden;
    }

    .sec { margin-bottom: 8px; }

    .sec-title {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 1px solid #4a5a20;
      padding-bottom: 3px;
      margin-bottom: 7px;
    }

    .pencil {
      font-family: Arial, sans-serif;
      color: #3d3d3d;
      font-size: 0.72rem;
      letter-spacing: 0.01em;
      line-height: 1.2;
      display: block;
      width: 100%;
      min-height: 1em;
      outline: none;
    }
    .afield .pencil { font-size: 0.65rem; }
    .vfield .pencil { font-size: 0.65rem; }
    .tfield .pencil { font-size: 0.62rem; }
    .sfield .pencil { font-size: 0.62rem; }
    .clr-line .pencil { display: inline; }
    .itype-bullet-lbl .pencil, .itype-bullet .pencil { font-size: 0.58rem; display: inline; }
    input.fline {
      background: transparent;
      border: none;
      border-bottom: 1px solid #aaa;
      width: 100%;
      font-family: Arial, sans-serif;
      font-size: 0.72rem;
      color: #3d3d3d;
      height: auto;
      padding: 0 1px;
      outline: none;
      display: block;
    }
    .field { margin-bottom: 5px; }

    .field-lbl {
      font-family: Arial, sans-serif;
      font-size: 0.6rem;
      color: #444;
      display: block;
      margin-bottom: 1px;
    }

    .field-lbl.sm { font-size: 0.55rem; }

    .fline {
      width: 100%;
      height: 1px;
      background: #6a7a48;
      margin-bottom: 2px;
    }

    .col-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .mid-label {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
    }

    .mid-line {
      width: 88%;
      height: 1px;
      background: #4a5a20;
      margin: 3px auto 0;
    }

    .bp-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.54rem;
      font-weight: 700;
      color: #4a5a20;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin: 6px 0 2px;
    }

    .back-cols {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-top: 6px;
    }

    .b-sec { margin-bottom: 13px; }

    .b-title {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 1px solid #4a5a20;
      padding-bottom: 3px;
      margin-bottom: 7px;
    }

    .frm {
      font-family: Arial, sans-serif;
      font-size: 0.44rem;
      color: #666;
      font-style: italic;
      margin: -1px 0 3px 2px;
      line-height: 1.3;
    }

    .srow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: Arial, sans-serif;
      font-size: 0.6rem;
      color: #222;
      padding: 3px 0;
      border-bottom: 1px dotted #bbb;
    }

    .sfield {
      width: 36px;
      height: 13px;
      border: 1px solid #4a5a20;
      background: #f5f0e4;
      flex-shrink: 0;
    }

    .sfield.wide { width: 62px; }

    .cbox {
      width: 9px;
      height: 9px;
      border: 1px solid #4a5a20;
      background: #f5f0e4;
      flex-shrink: 0;
      display: inline-block;
      outline: none;
      cursor: text;
      overflow: hidden;
    }

    .vit-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .vbox {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .vname {
      font-family: 'Cinzel', serif;
      font-size: 0.5rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.06em;
    }

    .vfield {
      width: 100%;
      height: 18px;
      border: 1px solid #4a5a20;
      background: #f5f0e4;
    }

    .card-row {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }
    .sheet-card {
      flex: 1;
      min-width: 0;
      border: 1px solid #4a5a20;
      background: #e8e0cc;
      padding: 3px 4px;
      box-sizing: border-box;
    }
    .sheet-card-title {
      font-family: 'Cinzel', serif;
      font-size: 0.48rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-bottom: 1px solid #4a5a20;
      margin-bottom: 2px;
      padding-bottom: 2px;
      display: flex;
    }
    .item-card-tbl {
      width: 100%;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
      font-size: 0.48rem;
    }
    .item-card-tbl td {
      padding: 1px 2px;
      vertical-align: top;
      color: #2e3d0f;
    }
    .itype-hdr td {
      font-weight: 700;
      border-top: 1px solid #4a5a20;
      padding-top: 5px;
      padding-bottom: 1px;
    }
    .itype-hdr:first-child td {
      border-top: none;
    }
    .itype-bullet-lbl td {
      color: #4a5a20;
      height: 11px;
      border-bottom: 1px dotted #ccc;
      font-size: 0.42rem;
      padding: 0px 2px;
      vertical-align: middle;
    }

    .repo-tbl { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; font-size: 0.46rem; margin-top: 4px; }
    .repo-tbl th { font-family: 'Cinzel', serif; font-size: 0.42rem; color: #2e3d0f; padding: 2px 3px; border-bottom: 1px solid #4a5a20; text-align: left; }
    .repo-tbl td { padding: 2px 3px; color: #2e3d0f; border-bottom: 1px dotted #ccc; vertical-align: middle; }

    .small-note {
      font-family: Arial, sans-serif;
      font-size: 0.48rem;
      color: #777;
      margin-top: 2px;
    }

    .clr-row {
      display: flex;
      gap: 12px;
      margin-bottom: 6px;
    }
    .clr-item {
      flex: 1;
      display: flex;
      align-items: baseline;
      gap: 5px;
      border-bottom: 1px solid #4a5a20;
      padding-bottom: 2px;
    }
    .clr-lbl {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .clr-line {
      width: 100%;
      height: 1px;
      background: #4a5a20;
    }

    /* ── ACTION BAR ── */
    .action-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 200;
      padding: 0 12px;
    }

    .action-bar button {
      background: #3a4a18;
      color: #f2ece0;
      border: 1px solid #5a6a28;
      border-radius: 16px;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 6px 14px;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .action-bar button:active { background: #2a3a10; }

    .print-group {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1px solid #5a6a28;
      border-radius: 16px;
      overflow: hidden;
    }

    .print-group .ptab {
      background: #2a2a2a;
      color: #888;
      border: none;
      border-radius: 0;
      font-family: 'Cinzel', serif;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 6px 10px;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
      border-right: 1px solid #3a3a3a;
    }

    .print-group .ptab:last-of-type { border-right: none; }

    .print-group .ptab.active {
      background: #3a4a18;
      color: #f2ece0;
    }

    .print-group .ptab:active { background: #2a3a10; color: #f2ece0; }

    #printBtn {
      background: #3a4a18;
      color: #f2ece0;
      border: 1px solid #5a6a28;
      border-radius: 16px;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 6px 14px;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
    }

    #printBtn:active { background: #2a3a10; }

    /* ── PRINT ── */
    @media print {
      @page { size: 8.5in 11in; margin: 0; }
      html, body {
        overflow: visible !important;
        height: auto !important;
        background: white !important;
      }
      .action-bar, .flip-indicator { display: none !important; }
      .sheet-viewport {
        display: block !important;
        overflow: visible !important;
        height: auto !important;
      }
      .scale-wrap {
        transform: none !important;
        width: 8.5in !important;
        height: auto !important;
        margin: 0 !important;
      }
      .flipper {
        width: 8.5in !important;
        height: auto !important;
        position: static !important;
        overflow: visible !important;
      }
      .face {
        position: relative !important;
        width: 8.5in !important;
        height: 11in !important;
        visibility: visible !important;
        opacity: 1 !important;
        display: block !important;
        overflow: hidden !important;
      }
      .face.front {
        page-break-after: always;
        break-after: page;
      }
      .face.back {
        page-break-before: always;
        break-before: page;
      }
    }
  

    /* ─── Lawful Mode (Light Theme) ─── */
    body.lawful-mode {
      background: #f5f5f0;
      color: #2c2c2c;
    }
    body.lawful-mode header { background: #ffffff; }
    body.lawful-mode nav { background: #ffffff; }
    body.lawful-mode main { background: #f5f5f0; color: #2c2c2c; }
    body.lawful-mode .content-main { background: #f5f5f0; color: #2c2c2c; }
    body.lawful-mode h1, body.lawful-mode h2, body.lawful-mode h3, body.lawful-mode h4, body.lawful-mode h5 { color: #2c2c2c; }
    body.lawful-mode p { color: #2c2c2c; }
    body.lawful-mode .profession-entry, body.lawful-mode .talent-entry, body.lawful-mode .skill-card { 
      background: rgba(185,170,0,0.06); 
      border-color: rgba(0,0,0,0.12); 
      color: #2c2c2c;
    }
    body.lawful-mode .talent-card { 
      background: rgba(185,170,0,0.06); 
      border-color: rgba(0,0,0,0.12); 
    }
    body.lawful-mode .note { 
      background: rgba(185,170,0,0.1); 
      border-color: rgba(180,140,20,0.5);
      color: #2c2c2c;
    }
    body.lawful-mode .callout {
      background: rgba(185,170,0,0.1);
      border-color: rgba(180,140,20,0.5);
      color: #2c2c2c;
    }
</style>
</head>
<body>
