<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achievements | Slayers of Rings &amp; Crowns</title>
  <link rel="stylesheet" href="styles.css?v=9" />
  <style>
    .ach-wrap { max-width: 680px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    .ach-wrap h1 { color: #c93f35; margin-bottom: 0.25rem; font-size: 1.6rem; }
    .ach-sub { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.5; }
    .free-badge { display: inline-block; background: #123a1a; border: 1px solid #4caf50; color: #4caf50; font-size: 0.75rem; font-weight: bold; padding: 0.2rem 0.6rem; border-radius: 6px; margin-bottom: 0.75rem; }
    .perk-note { background: #1a1505; border: 1px solid #5a4a00; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; color: #c9b400; font-size: 0.88rem; line-height: 1.5; }
    .perk-note.pro { background: #12240f; border-color: #2f6e1f; color: #7ed957; }
    .perk-note a { color: inherit; text-decoration: underline; }
    .ach-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.6rem; }
    .ach-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 0.9rem 1.1rem; display: flex; align-items: center; gap: 0.85rem; }
    .ach-card.earned { border-color: #2f6e1f; }
    .ach-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; background: #242424; }
    .ach-card.earned .ach-icon { background: #12240f; }
    .ach-body { flex: 1; min-width: 0; }
    .ach-name { color: #e0cfc0; font-weight: bold; font-size: 0.92rem; }
    .ach-card.earned .ach-name { color: #7ed957; }
    .ach-desc { color: #888; font-size: 0.8rem; margin-top: 2px; }
    .ach-tier { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: #b9aa00; margin-left: 0.5rem; }
    .ach-date { color: #555; font-size: 0.72rem; flex-shrink: 0; }
    .ach-empty { color: #555; font-size: 0.9rem; text-align: center; padding: 2rem; }
    .points-toast { background: #1a1505; border: 1px solid #b9aa00; color: #c9b400; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.85rem; text-align: center; }
    body.lawful-mode .perk-note { background: #fdf8e0; border-color: #e0d060; color: #7a6a00; }
    body.lawful-mode .perk-note.pro { background: #eafbe4; border-color: #4caf50; color: #2c6b1c; }
    body.lawful-mode .ach-card { background: #fff; border-color: #ddd; }
    body.lawful-mode .ach-name { color: #2c2c2c; }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header class="header-container">
      <span class="sorc-letters">S O R C</span>
      <img src="images/newest-sorc-redev-letters-jpeg_20260808_072206_0000.png" class="sorc-letters-img evil-only" alt="SORC" />
      <img src="images/newest-sorc-goldlaw-letters-jpeg_20260808_072143_0000.png" class="sorc-letters-img lawful-only" alt="SORC" />
    </header>
    <nav>
      <div id="navRoleBadge"></div>
    </nav>

    <ul class="page-nav">
      <li><a href="index.html">&#8962;</a></li>
    </ul>

    <div class="ach-wrap">
      <span class="free-badge">FREE FOR ALL MEMBERS</span>
      <h1>Achievements</h1>
      <p class="ach-sub">Basic achievements for everyone; the full system is a Pro perk.</p>

      <div id="pointsToast" style="display:none;" class="points-toast"></div>
      <div id="perkNote" class="perk-note">Checking your membership status&hellip;</div>
      <div id="achList"><p class="ach-empty">Loading&hellip;</p></div>
    </div>

    <div id="footer"></div>
  </div>

  <script>
    (function() {
      var theme = localStorage.getItem('themeSelected') || 'lawful';
      if (theme === 'lawful') document.body.classList.add('lawful-mode');
    })();

    var API_URL = 'https://api.sorcrpg.com';
    function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    var currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
    var perkNote = document.getElementById('perkNote');
    var listEl = document.getElementById('achList');
    var toastEl = document.getElementById('pointsToast');

    if (!currentUser || !currentUser.authKey) {
      perkNote.innerHTML = 'Sign in to see your achievements. <a href="signin.html">Sign In</a>';
      listEl.innerHTML = '';
    } else {
      fetch(API_URL + '/api/achievements', { headers: { 'X-Auth-Key': currentUser.authKey } })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.achievements) {
            listEl.innerHTML = '<p class="ach-empty">' + esc(data.error || 'Could not load achievements.') + '</p>';
            return;
          }
          if (data.points_awarded > 0) {
            toastEl.style.display = 'block';
            toastEl.textContent = '+' + data.points_awarded + ' Community Points from newly unlocked achievements!';
          }
          perkNote.className = data.full_system ? 'perk-note pro' : 'perk-note';
          perkNote.innerHTML = data.full_system
            ? 'You have Pro Membership &mdash; showing the full achievements system.'
            : 'Showing Basic achievements. <a href="sorc-beyond.html#basic-member">Pro members get the full achievements system.</a>';

          var earnedFirst = data.achievements.slice().sort(function(a, b) {
            if (a.earned === b.earned) return 0;
            return a.earned ? -1 : 1;
          });
          listEl.innerHTML = '<ul class="ach-list">' + earnedFirst.map(function(a) {
            return '<li class="ach-card' + (a.earned ? ' earned' : '') + '">' +
              '<span class="ach-icon">' + (a.earned ? 'Earned' : 'Locked') + '</span>' +
              '<span class="ach-body">' +
                '<span class="ach-name">' + esc(a.name) + '<span class="ach-tier">' + (a.tier === 'pro' ? 'Pro' : '') + '</span></span>' +
                '<div class="ach-desc">' + esc(a.description) + '</div>' +
              '</span>' +
              (a.earned_at ? '<span class="ach-date">' + new Date(a.earned_at).toLocaleDateString() + '</span>' : '') +
            '</li>';
          }).join('') + '</ul>';
        })
        .catch(function() {
          listEl.innerHTML = '<p class="ach-empty">Could not connect to the server.</p>';
        });
    }
  </script>
  <script src="nav.js?v=2"></script>
  <script type="module" src="main.js?v=25"></script>
</body>
</html>
