<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing - SORC</title>
    <link rel="stylesheet" href="styles.css?v=9" />
    <style>
        body { font-family: sans-serif; min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: #ffffff; }
        .test-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem 1rem; }
        .test-card { background: #1a1a1a; border: 1px solid #333; border-radius: 1rem; padding: 2.5rem 2rem; max-width: 600px; width: 100%; text-align: center; }
        .test-card h1 { color: #c93f35; font-size: 1.6rem; margin-bottom: 1rem; }
        .test-card p { color: #888; font-size: 1rem; margin-bottom: 1rem; line-height: 1.6; }
        .test-status { background: #1a2a1a; border: 1px solid #4caf50; color: #4caf50; padding: 1rem; border-radius: 8px; margin: 1rem 0; }
        body.lawful-mode { background: #ffffff; color: #2c2c2c; }
        body.lawful-mode .test-card { background: #fff; border-color: #e0e0e0; }
        body.lawful-mode .test-status { background: #f0f8f0; border-color: #4caf50; color: #2c7c2c; }
    </style>
</head>
<body>
<div class="header-container">
    <img src="images/newest-sorc-redev-letters-jpeg_20260808_072206_0000.png" class="sorc-letters-img evil-only" alt="SORC" />
    <img src="images/newest-sorc-goldlaw-letters-jpeg_20260808_072143_0000.png" class="sorc-letters-img lawful-only" alt="SORC" />
</div>
<nav><div id="navRoleBadge"></div></nav>

<div class="page-wrapper">
    <div class="test-wrapper">
        <div class="test-card">
            <h1>Testing Session</h1>
            <p>This file validates the session workflow for merging and creating pull requests.</p>
            <div class="test-status">
                <strong>✓ Deployment Active.</strong>
                <p style="margin: 0.5rem 0 0 0; font-size: 0.9rem;">Systems live on main branch. All services operational.</p>
            </div>
            <p style="margin-top: 2rem; font-size: 0.9rem; opacity: 0.7;">Session: claude/coding-session-lkoorx - Ready</p>
            <p style="margin-top: 0.5rem; font-size: 0.85rem; opacity: 0.6;">Last Updated: 2026-08-16 - Workflow Test Complete</p>
        </div>
    </div>
</div>

<div id="footer"></div>
<script src="main.js?v=25"></script>
