<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gravak - SORC Character Sheet</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111;
      font-size: 13px;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .sheet-viewport {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
    }
    @media (max-width: 815px) {
      .sheet-viewport { overflow: hidden; }
    }

    .scale-wrap {
      width: 816px;
      height: 1056px;
      transform-origin: top center;
      flex-shrink: 0;
    }

    .flip-indicator {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      flex-shrink: 0;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .flipper {
      width: 816px;
      height: 1056px;
      position: relative;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .face {
      position: absolute;
      inset: 0;
      background: #f2ece0;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .face.back { display: none; }
    #front .inner { zoom: 0.96; }

    .border-frame {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .border-frame::before {
      content: '';
      position: absolute;
      inset: 7px;
      border: 2.5px solid #3a4a18;
    }

    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      pointer-events: none;
    }
    .corner.tl { top: 7px; left: 7px; }
    .corner.tr { top: 7px; right: 7px; transform: scaleX(-1); }
    .corner.bl { bottom: 7px; left: 7px; transform: scaleY(-1); }
    .corner.br { bottom: 7px; right: 7px; transform: scale(-1); }
    .corner svg { width: 100%; height: 100%; }

    .wm {
      position: absolute;
      inset: 0;
      opacity: 0.03;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50" y="50" font-size="80" text-anchor="middle" dominant-baseline="middle">S</text></svg>');
      background-repeat: repeat;
      pointer-events: none;
    }

    .inner {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .title-block {
      text-align: center;
      margin-bottom: 10px;
    }
    .title-block h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.05em;
      margin: 0;
    }
    .title-block h2 {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      font-weight: 400;
      color: #4a5a20;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin: 3px 0 0;
    }

    .rule {
      border: none;
      height: 1px;
      background: #4a5a20;
      margin: 8px 0;
    }

    .cols {
      display: grid;
      grid-template-columns: 1fr 140px 1fr;
      gap: 12px;
      flex: 1;
    }

    .sec {
      margin-bottom: 10px;
    }

    .sec-title {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 1px solid #4a5a20;
      padding-bottom: 3px;
      margin-bottom: 7px;
    }

    .field { margin-bottom: 5px; }

    .field-lbl {
      font-family: Arial, sans-serif;
      font-size: 0.6rem;
      color: #444;
      display: block;
      margin-bottom: 1px;
    }

    .field-lbl.sm { font-size: 0.55rem; }

    .fline {
      width: 100%;
      height: 1px;
      background: #6a7a48;
      margin-bottom: 2px;
    }

    .col-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .portrait {
      width: 100%;
      aspect-ratio: 3/4;
      border: 1.5px solid #4a5a20;
      background: #e5ddc8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .portrait span {
      font-family: 'Cinzel', serif;
      font-size: 0.55rem;
      color: #999;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .srow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: Arial, sans-serif;
      font-size: 0.6rem;
      color: #222;
      padding: 3px 0;
      border-bottom: 1px dotted #bbb;
    }

    .sfield-input {
      background: #f5f0e4;
      border: 1px solid #4a5a20;
      width: 62px;
      height: 13px;
      font-family: Arial, sans-serif;
      font-size: 0.52rem;
      color: #222;
      text-align: center;
      outline: none;
      padding: 0;
      flex-shrink: 0;
    }

    .xp-bar {
      position: relative;
      width: 100%;
      height: 5px;
      background: #e8dfc0;
      border: 0.5px solid #4a5a20;
    }

    .xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #c4a000 0%, #d4b010 50%, #c4a000 100%);
    }

    .lore-item {
      font-family: Arial, sans-serif;
      font-size: 0.54rem;
      color: #2e3d0f;
      margin-bottom: 3px;
      line-height: 1.3;
    }

    .lore-note {
      font-weight: normal;
      font-style: italic;
      color: #666;
    }

    .trait-list { list-style: none; padding: 0; }

    .trait-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: Arial, sans-serif;
      font-size: 0.6rem;
      color: #222;
      padding: 1.5px 0;
      border-bottom: 1px dotted #ccc;
    }

    .tfield {
      width: 24px;
      height: 12px;
      border: 1px solid #4a5a20;
      background: #f5f0e4;
      flex-shrink: 0;
    }

    .pencil {
      font-family: Arial, sans-serif;
      color: #3d3d3d;
      font-size: 0.72rem;
      letter-spacing: 0.01em;
      line-height: 1.2;
    }

    input.fline {
      background: transparent;
      border: none;
      border-bottom: 1px solid #aaa;
      width: 100%;
      font-family: Arial, sans-serif;
      font-size: 0.62rem;
      color: #222;
      height: auto;
      padding: 0 1px;
      outline: none;
      display: block;
    }

    .repo-tbl {
      width: 100%;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
      font-size: 0.46rem;
      margin-top: 4px;
    }
    .repo-tbl th {
      font-family: 'Cinzel', serif;
      font-size: 0.42rem;
      color: #2e3d0f;
      padding: 2px 3px;
      border-bottom: 1px solid #4a5a20;
      text-align: left;
    }
    .repo-tbl td {
      padding: 2px 3px;
      color: #2e3d0f;
      border-bottom: 1px dotted #ccc;
      vertical-align: middle;
    }

    .back-cols {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-top: 6px;
    }

    .b-sec { margin-bottom: 13px; }

    .b-title {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 1px solid #4a5a20;
      padding-bottom: 3px;
      margin-bottom: 7px;
    }

    @media print {
      @page { size: 8.5in 11in; margin: 0; }
      html, body {
        overflow: visible !important;
        height: auto !important;
        background: white !important;
      }
      .action-bar, .flip-indicator { display: none !important; }
      .sheet-viewport {
        display: block !important;
        overflow: visible !important;
        height: auto !important;
      }
      .scale-wrap {
        transform: none !important;
        width: 8.5in !important;
        height: auto !important;
        margin: 0 !important;
      }
      .flipper {
        width: 8.5in !important;
        height: auto !important;
        position: static !important;
        overflow: visible !important;
      }
      .face {
        position: relative !important;
        width: 8.5in !important;
        height: 11in !important;
        visibility: visible !important;
        opacity: 1 !important;
        display: block !important;
        overflow: hidden !important;
      }
      .face.front {
        page-break-after: always;
        break-after: page;
      }
      .face.back {
        page-break-before: always;
        break-before: page;
      }
    }
  </style>
</head>
<body>
