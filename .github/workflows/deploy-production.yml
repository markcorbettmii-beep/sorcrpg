name: Deploy Production

run-name: Deploy ${{ inputs.target }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which production service to deploy
        type: choice
        options:
          - app
          - api
          - both
        default: app
        required: true

permissions:
  contents: read
  deployments: write

concurrency:
  group: sorc-production-deploy
  cancel-in-progress: false

jobs:
  deploy-app:
    if: github.ref == 'refs/heads/main' && github.actor == 'markcorbettmii-beep' && (inputs.target == 'app' || inputs.target == 'both')
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: sorc-app
      - name: Copy root HTML files to public
        run: |
          for f in *.html; do
            [[ "$f" != "brunn_build.html" && "$f" != "build-brunn-flip.html" ]] && cp "$f" sorc-app/public/
          done 2>/dev/null || true
      - name: Copy _redirects to public
        run: cp _redirects sorc-app/public/_redirects
      - name: Verify production Cloudflare token
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set PRODUCTION_CLOUDFLARE_API_TOKEN in the production environment."; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy
        working-directory: sorc-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d771bbe6613a9064911ecc7e6b3fe10b
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

  deploy-api:
    if: github.ref == 'refs/heads/main' && github.actor == 'markcorbettmii-beep' && (inputs.target == 'api' || inputs.target == 'both')
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: sorc-api
      - name: Verify production Cloudflare token
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set PRODUCTION_CLOUDFLARE_API_TOKEN in the production environment."; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy
        working-directory: sorc-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d771bbe6613a9064911ecc7e6b3fe10b
      - name: Deploy RESEND_API_KEY secret
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "ERROR: RESEND_API_KEY secret is not set in GitHub Actions"
            exit 1
          fi
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --env production
        working-directory: sorc-api
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d771bbe6613a9064911ecc7e6b3fe10b
      - name: Deploy GOOGLE_CLIENT_SECRET secret
        run: |
          if [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "ERROR: GOOGLE_CLIENT_SECRET secret is not set in GitHub Actions"
            exit 1
          fi
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET --env production
        working-directory: sorc-api
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d771bbe6613a9064911ecc7e6b3fe10b
