name: Deploy Worker

on:
  push:
    branches:
      - main
      - claude/coding-session-lkoorx
      - claude/verification-email-issue-w3qskj
    paths:
      - 'sorc-app/**'
      - '*.html'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: sorc-app
      - name: Copy root HTML files to public
        run: |
          cp *.html sorc-app/public/ 2>/dev/null || true
      - run: npx wrangler deploy
        working-directory: sorc-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d771bbe6613a9064911ecc7e6b3fe10b
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
