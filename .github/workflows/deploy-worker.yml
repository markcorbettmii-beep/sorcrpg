name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - 'content/features/space.html'
      - 'sorc-app/**'
      - '*.html'
      - '_redirects'
      - 'scripts/check-publish-consistency.mjs'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check publish sources and protected design
        run: npm run check-publish && npm run check-design
      - run: npm install
        working-directory: sorc-app
      - name: Stage canonical Worker assets
        run: node sorc-app/scripts/stage-worker-assets.mjs
      - run: npx wrangler deploy
        working-directory: sorc-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d771bbe6613a9064911ecc7e6b3fe10b
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
