name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - 'sorc-app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: sorc-app
      - run: npx wrangler deploy
        working-directory: sorc-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d771bbe6613a9064911ecc7e6b3fe10b
