name: Check Character Sheet PDFs

# Guards against the printable PDFs drifting from the HTML character sheets.
#
# This does NOT commit. main is protected ("Changes must be made through a pull
# request"), so a workflow pushing straight to main is rejected outright, which
# is exactly how the first version of this failed. Instead the job re-renders
# from the current HTML and fails if the committed PDFs no longer match, so the
# drift shows up on the pull request that caused it.
#
# Byte comparison is not usable: the PDF embeds timestamps and object ids, so
# two identical runs differ. The check compares page count and the set of form
# field names, which are stable.
#
# To update the PDFs: node scripts/render-sheet-pdfs.mjs   then commit them.

on:
  pull_request:
    paths:
      - 'character-sheet-fem-musc.html'
      - 'character-sheet-male-musc.html'
      - 'character-sheet-fem-musc.pdf'
      - 'character-sheet-male-musc.pdf'
      - 'scripts/render-sheet-pdfs.mjs'
      - 'images/**'
  push:
    branches:
      - main
    paths:
      - 'character-sheet-fem-musc.html'
      - 'character-sheet-male-musc.html'
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-sheet-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        # playwright and pdf-lib are both devDependencies in the root package.json
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Check PDFs match the HTML
        run: node scripts/render-sheet-pdfs.mjs --check
