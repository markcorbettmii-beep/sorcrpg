name: Render Character Sheet PDFs

# Keeps the printable PDFs in step with the HTML character sheets.
# Whenever a sheet's HTML (or an image it uses) changes on main, the PDFs are
# re-rendered from that HTML and committed back, so the two can never drift.

on:
  push:
    branches:
      - main
    paths:
      - 'character-sheet-fem-musc.html'
      - 'character-sheet-male-musc.html'
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-sheet-pdfs
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        # playwright is already a devDependency in the root package.json
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Render sheets to PDF
        run: node scripts/render-sheet-pdfs.mjs

      - name: Commit PDFs if they changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character-sheet-fem-musc.pdf character-sheet-male-musc.pdf
          if git diff --staged --quiet; then
            echo "PDFs unchanged, nothing to commit."
          else
            # [skip ci] stops this commit from re-triggering the workflow
            git commit -m "Re-render character sheet PDFs from HTML [skip ci]"
            git push
          fi
