<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Class Tree - Marksman</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  ul {
    display: flex;
    list-style-type: none;
    padding: 0;
  }
  li {
    position: relative;
    padding: 10px 20px;
    text-align: center;
  }
  /* Connectors */
  li::before, li::after {
    content: '';
    position: absolute;
    top: 50%;
    border-top: 2px solid #000;
  }
  li::before {
    right: 100%;
    width: 50%;
    height: 0;
  }
  li::after {
    left: 100%;
    width: 50%;
    height: 0;
  }
  /* Remove connectors for root and leaves */
  li > ul {
    display: flex;
    justify-content: center;
    padding-top: 20px;
  }
  /* Style for the main node */
  .main {
    font-weight: bold;
    font-size: 1.2em;
  }
</style>
</head>
<body>

<ul>
  <li class="main">Class Marksman
    <ul>
      <!-- Branch: Bowman -->
      <li>Bowman
        <ul>
          <li>Bandit</li>
          <li>Archer</li>
          <li>Amazon</li>
        </ul>
      </li>
      <!-- Branch: Gunner -->
      <li>Gunner
        <ul>
          <li>Gun Slinger</li>
          <li>Duelist</li>
          <li>Wrangler</li>
        </ul>
      </li>
      <!-- Branch: Ranger -->
      <li>Ranger
        <ul>
          <li>Keeper</li>
          <li>Forest Guardian</li>
          <li>Wood Warden</li>
        </ul>
      </li>
    </ul>
  </li>
</ul>

</body>
</html>
