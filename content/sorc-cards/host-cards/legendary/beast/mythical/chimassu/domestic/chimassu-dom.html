<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chimassu Domestic Fellowship Card</title>
<style>
  .flip-card {
    width: 350px;
    height: 600px;
    perspective: 1000px;
    cursor: pointer;
    margin: 40px auto 20px auto;
  }
  .flip-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.8s;
    transform-style: preserve-3d;
  }
  .flip-card.flipped .flip-card-inner {
    transform: rotateY(180deg);
  }
  .flip-card-front, .flip-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 10px;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    font-size: 1em;
    text-align: center;
    background-color: #fff;
    overflow: hidden;
  }
  .flip-card-back {
    transform: rotateY(180deg);
    overflow-y: auto;
  }
  .content-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100%;
  }
  .back-to-image {
    margin-bottom: 8px;
    margin-top: 0;
    font-weight: bold;
    text-align: center;
    width: 100%;
  }
  .flip-card-front img, .flip-card-back img {
    max-width: 90%;
    height: auto;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="flip-card" id="chimassuCard">
  <div class="flip-card-inner">
    <!-- Front side -->
    <div class="flip-card-front" id="cardFront">
      <div class="content-container">
        <img src="https://sorcrpg.com/content/sorc-cards/host-cards/legendary/beast/mythical/chimassu/domestic/IMG_1267.jpeg" alt="Front Image Chimassu Domestic" />
      </div>
    </div>
    <!-- Back side -->
    <div class="flip-card-back" id="cardBack">
      <div class="back-to-image">Back to Image</div>
      <img src="https://sorcrpg.com/content/sorc-cards/host-cards/legendary/beast/mythical/chimassu/domestic/IMG_1268.jpeg" alt="Back Image Chimassu Domestic" />
    </div>
  </div>
</div>

<script>
const card = document.getElementById('chimassuCard');
const cardFront = document.getElementById('cardFront');
const cardBack = document.getElementById('cardBack');

cardFront.addEventListener('click', function() {
  card.classList.toggle('flipped');
  // If now flipped to back, scroll back to top so image is visible
  if(card.classList.contains('flipped')) {
    cardBack.scrollTop = 0;
  }
});
cardBack.addEventListener('click', function(e) {
  card.classList.toggle('flipped');
});
</script>

</body>
</html>
