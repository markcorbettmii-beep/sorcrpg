<!DOCTYPE html>
<html lang="en">
<head>

    <title>Character Space | Slayers of Rings § Crowns</title>
    <link rel="stylesheet" href="../../styles.css?v=10" />
    <link rel="stylesheet" href="../../nav-system.css">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        .space-container { max-width: 1000px; margin: 2rem auto; padding: 1rem 0.75rem; }
        @media (min-width: 480px) { .space-container { padding: 1.5rem 1rem; } }
        @media (min-width: 600px) { .space-container { padding: 2rem; } }
        .space-card { background: #1a1a1a; border-radius: 1rem; border: 1px solid #333; overflow: hidden; margin-bottom: 1rem; }
        .space-banner { width: 100%; height: 120px; background: linear-gradient(135deg, #1a0a0a, #2a0808, #c93f3522); display: flex; align-items: center; justify-content: center; color: #b9aa00; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.08em; position: relative; padding: 1rem 2rem; box-sizing: border-box; text-align: center; }
        .space-banner-title { color: #b9aa00; font-size: 1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.08em; line-height: 1; margin: 0 0 0.5rem 0; padding: 0 1.5rem; display: block; }
        body.lawful-mode .space-banner-title { color: #c93f35; }
        .space-assessment-prompt { color: #e0cfc0; font-size: 0.82rem; line-height: 1.4; margin: 0 1.5rem 0.75rem; }
        .space-assessment-prompt a { color: #b9aa00; text-decoration: underline; }
        .space-info-row { display: flex; align-items: flex-end; gap: 1rem; padding: 0 1.5rem; margin-top: -40px; margin-bottom: 1rem; position: relative; z-index: 1; }
        .space-avatar-large { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #c93f35; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #555; overflow: hidden; flex-shrink: 0; }
        .space-name-block { flex: 1; padding-bottom: 0.5rem; }
        .space-username { font-size: 1.3rem; font-weight: bold; color: #e0cfc0; }
        .space-role-tag { display: inline-flex; align-items: center; padding: 2px 8px; border: 2px solid currentColor; border-radius: 999px; background: transparent; font-size: 0.75rem; font-weight: bold; margin-top: 3px; }
        .space-role-membership-line { display: flex; align-items: center; gap: 0.35rem; flex-wrap: nowrap; white-space: nowrap; }
        .space-status-help { color: #b9aa00; font-size: 0.72rem; text-decoration: underline; }
        .space-section { padding: 1rem 1.5rem; border-top: 1px solid #2a2a2a; }
        .space-section h3 { color: #b9aa00; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.75rem 0; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
        .stat-box { background: #222; border-radius: 8px; padding: 0.75rem; text-align: center; border: 1px solid #333; }
        .stat-box .stat-val { font-size: 1.2rem; font-weight: bold; color: #b9aa00; }
        .stat-box .stat-label { font-size: 0.7rem; color: #666; margin-top: 2px; }

        /* Tab Navigation - paper folder tabs, 3 columns */
        .tab-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px 4px;
            padding: 6px 6px 0 6px;
            background: #141414;
            border-radius: 10px 10px 0 0;
            border-bottom: 3px solid #b9aa00;
        }
        .tab-nav button {
            position: relative;
            padding: 10px 8px 9px;
            background: linear-gradient(180deg, #262626 0%, #1c1c1c 100%);
            border: 1px solid #333;
            border-bottom: none;
            border-radius: 9px 9px 0 0;
            color: #8a8a8a;
            font-weight: bold;
            font-size: 0.62rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            line-height: 1.25;
            cursor: pointer;
            transition: all 0.15s ease;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .tab-nav button:hover:not(:disabled) {
            background: linear-gradient(180deg, #303030 0%, #242424 100%);
            color: #b9aa00;
            border-color: #4a4420;
        }
        .tab-nav button.active {
            background: linear-gradient(180deg, #3a3520 0%, #2a2718 100%);
            color: #b9aa00;
            border-color: #b9aa00;
            box-shadow: inset 0 1px 0 rgba(185,170,0,0.25), 0 -2px 4px rgba(0,0,0,0.3);
            z-index: 2;
        }
        .tab-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
        .tab-content { display: none; padding: 1.75rem 1.5rem; background: #1a1a1a; border-radius: 0 0 10px 10px; min-height: 300px; }
        .tab-content.active { display: block; }

        /* Tabs scale with viewport so they never read as empty bars on desktop */
        @media (min-width: 480px) {
            .tab-nav button { padding: 11px 9px 10px; min-width: 50px; }
        }
        @media (min-width: 600px) {
            .tab-nav { gap: 4px 6px; padding: 8px 8px 0 8px; }
            .tab-nav button { font-size: 0.72rem; padding: 13px 12px 11px; letter-spacing: 0.05em; min-width: 70px; }
        }
        @media (min-width: 900px) {
            .tab-nav { gap: 5px 8px; padding: 10px 10px 0 10px; }
            .tab-nav button { font-size: 0.82rem; padding: 16px 16px 14px; border-radius: 11px 11px 0 0; min-width: 80px; }
        }

        /* Access Control */
        .access-badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; margin-bottom: 1rem; }
        .access-badge.PUBLIC { background: #1a3a6b; color: #fff; }
        .access-badge.PRIVATE { background: #3a1a1a; color: #fff; }
        .access-badge.PRO { background: #3a3a1a; color: #fff; }
        .locked-section { background: #2a1a1a; border: 1px solid #c93f35; border-radius: 8px; padding: 2rem; text-align: center; }
        .locked-section h4 { color: #c93f35; margin: 0 0 0.5rem 0; }
        .locked-section p { color: #888; font-size: 0.9rem; margin: 0.5rem 0; }
        .upgrade-btn { background: #b9aa00; color: #111; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .upgrade-btn:hover { background: #d4c70a; }

        /* Content Grid */
        .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .card { background: #222; border: 1px solid #333; border-radius: 8px; padding: 1rem; transition: border-color 0.2s; }
        .card:hover { border-color: #b9aa00; }
        .card h4 { color: #e0cfc0; margin: 0 0 0.5rem 0; font-size: 0.95rem; }
        .card p { color: #666; font-size: 0.85rem; margin: 0; line-height: 1.5; }

        /* Other Characters - sheet thumbnails. Static pictures of a sheet, not
           sheets in miniature: nothing in them is editable. The one interaction
           is choosing which sheet fills the big frame above, and the chosen
           thumbnail carries the highlight. */
        .sheet-tier { color: #b9aa00; font-size: 0.72rem; font-weight: bold; text-transform: uppercase;
            letter-spacing: 0.06em; margin: 1.1rem 0 0.4rem; }
        .sheet-thumbs { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .sheet-thumb { width: 62px; height: 89px; flex: 0 0 auto; padding: 0; cursor: pointer;
            border: 2px solid #333; border-radius: 6px; background-color: #f5f5f5;
            background-repeat: no-repeat; background-position: center; background-size: contain;
            transition: border-color 0.15s, box-shadow 0.15s; }
        .sheet-thumb:hover { border-color: #6a6320; }
        .sheet-thumb.selected { border-color: #b9aa00; box-shadow: 0 0 0 2px rgba(185,170,0,0.28); }
        .character-showcase { max-width: 620px; margin: 1.5rem auto 2rem; text-align: center; }
        .character-canvas-frame { position: relative; overflow: hidden; min-height: 430px; padding: 1rem;
            background: linear-gradient(145deg, #141414 0%, #292317 100%); border: 2px solid #b9aa00;
            border-radius: 12px; box-shadow: 0 0 0 4px rgba(185,170,0,0.12), inset 0 0 28px rgba(0,0,0,0.55); }
        .character-canvas-frame::before { content: 'ACTIVE CHARACTER'; display: block; color: #b9aa00; font-size: 0.68rem;
            font-weight: bold; letter-spacing: 0.14em; margin-bottom: 0.7rem; }
        .character-canvas { width: 100%; height: 360px; display: flex; align-items: center; justify-content: center;
            overflow: hidden; border-radius: 8px; background: #080808; }
        .character-canvas img { width: 100% !important; height: 100% !important; object-fit: contain !important; }
        .character-canvas-name { margin-top: 0.7rem; color: #e0cfc0; font-size: 1.05rem; font-weight: bold; }
        .character-thumb-heading { margin: 1.2rem 0 0.5rem; color: #b9aa00; font-size: 0.76rem;
            font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; }
        .character-thumb-row { display: flex; justify-content: center; gap: 0.65rem; flex-wrap: wrap; }
        .character-thumb { width: 76px; padding: 0.25rem; border: 2px solid #b9aa00; border-radius: 8px;
            background: #211d0f; color: #d4c24a; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
        .character-thumb:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(185,170,0,0.28); }
        .character-thumb.selected { border-color: #fff0a0; box-shadow: 0 0 0 2px rgba(255,240,160,0.35); }
        .character-thumb img { display: block; width: 64px; height: 72px; object-fit: cover; border-radius: 5px; }
        .character-thumb span { display: block; margin-top: 0.25rem; font-size: 0.62rem; font-weight: bold; }
        .character-thumb.pro { border-color: #8e44ad; background: #211329; color: #d7a8ee; }
        .character-thumb.pro img { filter: hue-rotate(245deg) saturate(1.3); }
        .character-thumb.pro:hover { box-shadow: 0 4px 12px rgba(142,68,173,0.35); }
        .character-thumb.pro.selected { border-color: #edc7ff; box-shadow: 0 0 0 2px rgba(215,168,238,0.4); }
        .character-tier-note { margin: 0.7rem 0 0; color: #777; font-size: 0.76rem; line-height: 1.45; }
        body.lawful-mode .character-canvas-frame { background: linear-gradient(145deg, #fffdf6 0%, #eee5ce 100%); }
        body.lawful-mode .character-canvas { background: #f4eee2; }
        body.lawful-mode .character-canvas-name { color: #333; }
        body.lawful-mode .character-thumb { background: #fffbea; }
        body.lawful-mode .character-thumb.pro { background: #f5eafb; }

        /* Who may read this sheet. Public is the useful setting for anyone
           looking for a table, so the recommendation sits with the control
           rather than in a help page nobody opens. */
        .sheet-privacy { display: flex; align-items: center; justify-content: center; gap: 0.5rem; flex-wrap: wrap;
            margin: 0 0 0.75rem; }
        .privacy-btn { padding: 6px 16px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a;
            color: #888; font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: all 0.15s; }
        .privacy-btn:hover:not(:disabled) { border-color: #8e44ad; color: #8e44ad; }
        .privacy-btn.active { background: rgba(142,68,173,0.15); border-color: rgba(142,68,173,0.35); color: #8e44ad; }
        .privacy-btn:disabled { opacity: 0.45; cursor: default; }
        .sheet-privacy-note { text-align: center; font-size: 0.78rem; color: #8e44ad; margin: 0 0 1.25rem; }
        body.lawful-mode .privacy-btn { background: #f5f2ec; border-color: #ddd; color: #666; }
        body.lawful-mode .privacy-btn.active { background: rgba(142,68,173,0.15); border-color: rgba(142,68,173,0.35); color: #8e44ad; }

        /* Someone else's Characters tab, reached from the sheet glyph in a lobby. */
        .visitor-sheet { background: #222; border: 1px solid #333; border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 0.85rem; }
        .visitor-sheet h4 { color: #b9aa00; font-size: 0.95rem; margin: 0 0 0.7rem 0; }
        .visitor-default-tag { display: inline-block; background: #1a1505; color: #b9aa00; border: 1px solid #b9aa00;
            font-size: 0.62rem; font-weight: bold; padding: 1px 7px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
        .visitor-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 0.55rem; }
        .visitor-field { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 0.5rem 0.65rem; }
        .visitor-field label { display: block; font-size: 0.65rem; color: #777; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
        .visitor-field p { margin: 0; font-size: 0.86rem; color: #c0b090; word-break: break-word; }
        .visitor-empty { color: #666; font-size: 0.88rem; line-height: 1.6; margin: 0; }
        .visitor-note { background: rgba(142,68,173,0.15); border: 1px solid rgba(142,68,173,0.35); border-radius: 8px;
            padding: 0.55rem 0.9rem; margin-bottom: 0.85rem; color: #8e44ad; font-size: 0.82rem; line-height: 1.5; }
        body.lawful-mode .visitor-sheet { background: #ffffff; border-color: #e0e0e0; }
        body.lawful-mode .visitor-field { background: #f9f5f1; border-color: #e0e0e0; }
        body.lawful-mode .visitor-field p { color: #333; }

        .fam-tags { margin: 0.6rem 0 0 0; display: flex; gap: 0.35rem; flex-wrap: wrap; }
        .fam-tag { font-size: 0.68rem; font-weight: bold; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; background: #2c2c1a; color: #b9aa00; border: 1px solid #4a4420; }
        body.lawful-mode .fam-tag { background: #f5f1e0; color: #7a6a00; border-color: #ddd5b0; }
        /* Sub-tabs (game boards under Leaderboards) */
        .subtab { padding: 6px 14px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #888; font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: all 0.15s; }
        .subtab:hover { border-color: #b9aa00; color: #b9aa00; }
        .subtab.active { background: #222; border-color: #b9aa00; color: #b9aa00; }
        body.lawful-mode .subtab { background: #ffffff; border-color: #e0e0e0; }
        body.lawful-mode .subtab.active { background: #f9f5f1; border-color: #c93f35; color: #c93f35; }

        .not-logged-in { text-align: center; padding: 3rem; }
        .not-logged-in a { color: #c93f35; }

        .btn { padding: 8px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-red { background: #c93f35; color: #fff; }
        .btn-gold { background: #b9aa00; color: #222; }
        .btn-sm { padding: 5px 12px; font-size: 0.8rem; }

        body.lawful-mode .space-card { background: #ffffff; border-color: #e0e0e0; }
        body.lawful-mode .tab-nav { background: #e8e3d5; border-bottom-color: #c9a227; }
        body.lawful-mode .tab-nav button {
            background: linear-gradient(180deg, #fdfcf8 0%, #f2ece0 100%);
            border-color: #d8d0bd;
            color: #7a7264;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }
        body.lawful-mode .tab-nav button:hover:not(:disabled) { background: #fffef9; color: #c93f35; border-color: #c9a227; }
        body.lawful-mode .tab-nav button.active {
            background: linear-gradient(180deg, #ffffff 0%, #fdfaf2 100%);
            color: #c93f35;
            border-color: #c9a227;
            box-shadow: inset 0 2px 0 #c9a227, 0 -2px 4px rgba(0,0,0,0.06);
        }
        body.lawful-mode .tab-content { background: #ffffff; }
        body.lawful-mode .card { background: #f9f5f1; border-color: #e0e0e0; }
        body.lawful-mode .card h4 { color: #2c2c2c; }
        body.lawful-mode .card p { color: #666; }
        body.lawful-mode .stat-box { background: #f9f5f1; border-color: #e0e0e0; }

        /* Property draft: a card-first Armory inside the Space tab. */
        .property-draft { margin-top: 1rem; }
        .property-draft, #tab-property { min-width: 0; max-width: 100%; }
        .property-access-block { max-width: 100%; margin: 0.35rem 0 1rem; }
        .property-access-pill { display: inline-flex; align-items: center; max-width: 100%; overflow: hidden; border: 1px solid #6d5c16; border-radius: 999px; background: #17130a; font-size: 0.66rem; font-weight: bold; letter-spacing: 0.08em; line-height: 1; white-space: nowrap; }
        .property-access-pill-public, .property-access-pill-private { appearance: none; border: 0; padding: 0.38rem 0.55rem; font: inherit; color: #fff; cursor: pointer; }
        .property-access-pill-public { background: #1a3a6b; color: #fff; }
        .property-access-pill-private { background: #3a1a1a; color: #fff; }
        .property-access-public, .property-access-private { appearance: none; display: inline-block; border: 0; padding: 0.38rem 0.55rem; font: inherit; color: #fff; cursor: pointer; }
        .property-access-public { background: #1a3a6b; }
        .property-access-private { background: #3a1a1a; }
        .property-access-public:not(.is-active), .property-access-private:not(.is-active) { opacity: 0.62; }
        .property-access-public.is-active, .property-access-private.is-active { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.72); }
        .property-access-pill-public:not(.is-active), .property-access-pill-private:not(.is-active) { opacity: 0.62; }
        .property-access-pill-public.is-active, .property-access-pill-private.is-active { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.72); }
        .property-access-pill-public:disabled, .property-access-pill-private:disabled { cursor: default; }
        .property-access-divider { color: #f0d879; padding: 0 0.12rem; }
        .property-gm-note { max-width: 100%; color: #999; font-size: 0.72rem; line-height: 1.45; overflow-wrap: anywhere; word-break: break-word; margin: 0.45rem 0 0; }
        #tab-property > p { max-width: 100%; font-size: 0.95rem; line-height: 1.5; overflow-wrap: anywhere; word-break: break-word; }
        .property-page-label { color: #b9aa00; font-size: 0.7rem; font-weight: bold; letter-spacing: 0.1em; text-transform: uppercase; }
        .property-page-title { color: #e0cfc0; margin: 0.2rem 0 0.35rem; font-size: 1.45rem; }
        .property-page-description { color: #999; font-size: 0.84rem; line-height: 1.55; margin: 0 0 1rem; }
        .property-page-nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.35rem; padding: 0.25rem 0 0.7rem; margin-bottom: 0.9rem; border-bottom: 1px solid #2b2b2b; }
        .property-page-nav button { min-width: 0; border: 1px solid #333; border-radius: 999px; background: #151515; color: #888; padding: 0.3rem 0.35rem; font-size: 0.7rem; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .property-page-nav button:hover, .property-page-nav button.active { color: #b9aa00; border-color: #b9aa00; background: #1e1b0b; }
        .property-page-nav button.future { opacity: 0.55; }
        .property-draft-tools { display: flex; gap: 0.55rem; align-items: center; flex-wrap: wrap; margin: 0.8rem 0; }
        .property-draft-search { flex: 1 1 220px; min-width: 0; border: 1px solid #3b3510; border-radius: 7px; background: #0e0e0e; color: #e0cfc0; padding: 0.55rem 0.7rem; font: inherit; font-size: 0.82rem; }
        .property-draft-search:focus { outline: 2px solid rgba(185,170,0,0.35); outline-offset: 1px; }
        .property-draft-cap { color: #777; font-size: 0.72rem; white-space: nowrap; }
        .property-armory-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(250px, 0.85fr); gap: 0.85rem; align-items: start; }
        .property-canvas { min-height: 440px; position: relative; overflow: hidden; border: 1px solid #6d5c16; border-radius: 12px; background: radial-gradient(circle at 50% 20%, #423619 0, #1c180c 38%, #0c0c0c 80%); box-shadow: inset 0 0 38px rgba(0,0,0,0.55), 0 0 0 3px rgba(185,170,0,0.08); padding: 0.85rem; }
        .property-canvas-kicker { color: #b9aa00; font-size: 0.64rem; font-weight: bold; letter-spacing: 0.12em; text-transform: uppercase; }
        .property-safe-haven-control { position: relative; display: block; float: right; color: #d8d0bd; font-size: 0.62rem; letter-spacing: 0; text-transform: none; }
        .property-safe-haven-control summary { list-style: none; max-width: 155px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid #6d5c16; border-radius: 5px; background: #151515; color: #f0d879; padding: 0.24rem 0.42rem; cursor: pointer; }
        .property-safe-haven-control summary::-webkit-details-marker { display: none; }
        .property-safe-haven-control summary::after { content: '▾'; float: right; margin-left: 0.7rem; color: #f0d879; }
        .property-safe-haven-control[open] summary::after { content: '▴'; }
        .property-safe-haven-options { position: absolute; z-index: 20; top: calc(100% + 0.25rem); right: 0; min-width: 145px; padding: 0.25rem; border: 1px solid #6d5c16; border-radius: 6px; background: #151515; box-shadow: 0 5px 14px rgba(0,0,0,0.45); }
        .property-safe-haven-option { display: block; width: 100%; border: 0; border-radius: 4px; background: transparent; color: #d8d0bd; padding: 0.38rem 0.45rem; cursor: pointer; font: inherit; text-align: left; }
        .property-safe-haven-option:hover, .property-safe-haven-option.selected { background: #332c0c; color: #f0d879; }
        .property-canvas-stage { width: 100%; height: clamp(360px, 105vw, 430px); box-sizing: border-box; position: relative; margin-top: 0.25rem; background-position: center; background-size: cover; border: 1px solid rgba(240,216,121,0.5); border-radius: 9px; overflow: hidden; }

    function canViewTab(tab, isOwner, isPro) {
        if (tab.access === 'PUBLIC') return true;
        if (tab.access === 'PRIVATE') return isOwner;
        if (tab.access === 'PRO') return isOwner && isPro;
        return false;
    }

        if (role === 'OWNER') return 'border-color:#c5a042;color:#c5a042;';
        if (role === 'ADMIN') return 'border-color:#c87d00;color:#c87d00;';
        if (role === 'MASTER' || role === 'GM') return 'border-color:#c87d00;color:#c87d00;';
        if (role === 'PLAYER') return 'border-color:#2196f3;color:#2196f3;';
        return 'border-color:#777;color:#777;';
    }

    function getRoleAbbr(role) {
        if (role === 'OWNER') return 'OWN';
        if (role === 'ADMIN') return 'Admin';
        if (role === 'MASTER' || role === 'GM') return 'GM';
        if (role === 'PLAYER') return 'PC';
        return 'CIV';
    }

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    var GAME_MODES = {

        var btns = ev.target.parentNode.querySelectorAll('.subtab');
        for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
        ev.target.classList.add('active');
        var out = document.getElementById('gameBoard');
        if (out) out.innerHTML = '<p>' + (GAME_MODES[mode] || 'Mode') + ' standings loading...</p>';
    };

    /* ?username= turns this page around: it shows that player's Space instead
       of the reader's own. The sheet glyph beside a name in a lobby lands here
       with tab=characters, which is the whole point of the link - it used to
       lead to the reader's own sheet from every row on the list.
       Only the Characters tab is turned around so far. The other tabs still
       read the signed-in player's own data, so a visitor is shown the one tab
       that is genuinely theirs rather than the reader's data under their name. */
    var VIEW_USERNAME = (function() {
        try { return new URLSearchParams(window.location.search).get('username') || ''; } catch(e) { return ''; }
    })();

    function esc2(str) {
        return String(str == null ? '' : str)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function avatarImageMarkup(avatar, altText) {
        var imageUrl = avatar
            ? '/images/avatars/' + encodeURIComponent(String(avatar))
            : DEFAULT_AVATAR_URL;
        var avatarStyle = 'width:100%;height:100%;object-fit:cover;' + (avatar ? '' : 'opacity:0.55;');
        return '<img src="' + esc2(imageUrl) + '" alt="' + esc2(altText || 'Avatar') + '" onerror="this.onerror=null;this.src=\'' + DEFAULT_AVATAR_URL + '\';this.style.opacity=\'0.55\';" style="' + avatarStyle + '" />';
    }

    function characterThumbnailMarkup(name, fileName, tier) {
        var imageUrl = '/images/avatars/' + encodeURIComponent(fileName);
        return '<button type="button" class="character-thumb ' + (tier === 'pro' ? 'pro' : 'basic') + '"' +
            ' data-character-name="' + esc2(name) + '" data-character-src="' + esc2(imageUrl) + '"' +
            ' onclick="selectCharacterThumbnail(this)" aria-label="Select ' + esc2(name) + '">' +
            '<img src="' + esc2(imageUrl) + '" alt="' + esc2(name) + '" />' +
            '<span>' + esc2(name) + '</span>' +
        '</button>';
    }

    function selectCharacterThumbnail(button) {
        if (!button) return;
        var canvas = document.getElementById('activeCharacterCanvas');
        var name = document.getElementById('activeCharacterName');
        var imageUrl = button.getAttribute('data-character-src');
        if (!canvas || !imageUrl) return;
        canvas.innerHTML = '<img src="' + esc2(imageUrl) + '" alt="' + esc2(button.getAttribute('data-character-name') || 'Active Character') + '" />';
        if (name) name.textContent = button.getAttribute('data-character-name') || 'Active Character';
        document.querySelectorAll('.character-thumb').forEach(function(thumb) {
            thumb.classList.toggle('selected', thumb === button);
            thumb.setAttribute('aria-pressed', thumb === button ? 'true' : 'false');
        });
    }

    function renderVisitorSheet(ch) {
        var data = (ch && ch.data && typeof ch.data === 'object') ? ch.data : {};
        var keys = Object.keys(data).filter(function(k) {
            var v = data[k];
            return v !== null && v !== undefined && v !== '' && !(Array.isArray(v) && v.length === 0);
        });
        var fields = keys.length
            ? '<div class="visitor-fields">' + keys.map(function(k) {
                var v = data[k];
                var text = (typeof v === 'object') ? JSON.stringify(v) : String(v);
                var label = String(k).replace(/[_-]+/g, ' ').replace(/\b\w/g, function(ch2) { return ch2.toUpperCase(); });
                return '<div class="visitor-field"><label>' + esc2(label) + '</label><p>' + esc2(text) + '</p></div>';
              }).join('') + '</div>'
            : '<p style="margin:0;color:#666;font-size:0.85rem;">This sheet has no stats filled in yet.</p>';
        return '<div class="visitor-sheet">' +
            '<h4>' + esc2(ch.name || 'Unnamed Character') +
                (ch.is_default ? '<span class="visitor-default-tag">DEFAULT</span>' : '') + '</h4>' +

        '</div>';

        { id:'companion-weasel', type:'Companion Cards', name:'Pet Weasel', ref:'comp-pg.A-102', size:'Small', race:'Weasel', role:'Pet', rank:'Rare', identity:'weasel', summary:'A Pet Companion carried On Person.', definition:'Pet Companion. Provides bonding and a passive Presence Benefit.', art:'/content/character/assets/customizer/pickers/companions/companion-picker-weasel.png', owned:true, worn:false },

    window.selectPropertyCard = function(id) {
        var card = PROPERTY_DRAFT_CARDS.filter(function(c) { return c.id === id; })[0];
        var draft = document.getElementById('propertyDraft');
        if (!card || !draft) return;
        var previous = draft.getAttribute('data-selected') || 'armor-core';
        draft.setAttribute('data-selected', id);
        try {
            if (card.worn && card.owned) {
                var armaments = propertySelectedArmament(previous), armamentIndex = armaments.indexOf(id);
                if (armamentIndex === -1) armaments.push(id); else armaments.splice(armamentIndex, 1);
                localStorage.setItem('sorc.property.selectedArmaments', JSON.stringify(armaments));
            }
            if (card.type === 'Companion Cards' && card.owned) {
                var companions = propertySelectedCompanion(previous), companionIndex = companions.indexOf(id);
                if (companionIndex === -1) companions.push(id); else companions.splice(companionIndex, 1);
                localStorage.setItem('sorc.property.selectedCompanions', JSON.stringify(companions));
            }
            if (card.safeHaven) localStorage.setItem('sorc.property.safeHaven', card.safeHaven);
        } catch(e) {}
        var page = document.getElementById('propertyDraftRows') ? 'on-person' : 'containers';

    window.selectPropertyCharacterPicker = function(id) {

        if (!draft) return;
        try { localStorage.setItem('sorc.property.characterPicker', propertySelectedCharacterPicker() === id ? 'none' : id); } catch(e) {}

    window.selectPropertyRowPage = function(type, direction) {
        var draft = document.getElementById('propertyDraft');
        if (!draft) return;
        var cards = PROPERTY_DRAFT_CARDS.filter(function(card) { return card.type === type; });
        var pageCount = Math.max(1, Math.ceil(cards.length / 5));
        var page = PROPERTY_DRAFT_ROW_PAGES[type] || 0;
        PROPERTY_DRAFT_ROW_PAGES[type] = (page + direction + pageCount) % pageCount;
        draft.innerHTML = propertyDraftPage('on-person', draft.getAttribute('data-selected') || 'armor-core');
    };

    window.selectPropertySafeHaven = function(id) {
        var draft = document.getElementById('propertyDraft');
        if (!draft) return;
        var haven = PROPERTY_SAFE_HAVENS.filter(function(item) { return item.id === id; })[0];
        if (!haven) return;
        try { localStorage.setItem('sorc.property.safeHaven', id); } catch(e) {}
        draft.innerHTML = propertyDraftPage('on-person', draft.getAttribute('data-selected') || 'character-sheet');
    };

    window.filterPropertyDraft = function(query) {
        var q = String(query || '').trim().toLowerCase();
        var matches = PROPERTY_DRAFT_CARDS.filter(function(card) {
            return !q || (card.name + ' ' + card.ref + ' ' + card.summary + ' ' + (card.definition || '') + ' ' + (card.role || '') + ' ' + (card.rank || '') + ' ' + (card.identity || '')).toLowerCase().indexOf(q) !== -1;
        });
        var rows = document.querySelectorAll('#propertyDraftRows .property-armory-card');
        rows.forEach(function(button) {
            var name = (button.getAttribute('data-property-name') || '').toLowerCase();
            button.style.display = (!q || name.indexOf(q) !== -1) ? '' : 'none';
        });
        var index = document.getElementById('propertyCardIndex');
        var displayMatches = matches.filter(function(card) { return card.owned; }).concat(
            matches.filter(function(card) { return !card.owned; }).slice(0, 5)
        );
        if (index) index.innerHTML = displayMatches.map(function(card) {
            return propertyDraftIndexItem(card, document.getElementById('propertyDraft').getAttribute('data-selected') || 'armor-core');
        }).join('');
        var message = document.getElementById('propertySearchMessage');
        var unowned = matches.filter(function(card) { return !card.owned; }).slice(0, 5).length;
        if (message) {
            message.hidden = !q || matches.length > 0;
            message.textContent = matches.length
                ? (unowned ? 'Some matching Cards are not owned. Select one to see: You do not yet own this Card.' : '')
                : 'No Card matches that search. Try the Card name, its ref #, or a Card type such as Armament, Companion, or Item.';
        }
    };

    async function renderVisitorSpace(username, authKey) {
        var container = document.getElementById('profileContainer');
        if (!container) return;

        var owner = null, sheets = null;
        try {
            var pRes = await fetch(API_URL + '/api/profile/' + encodeURIComponent(username));
            var pData = await pRes.json().catch(function() { return {}; });
            owner = pData && pData.user ? pData.user : null;
        } catch(e) { /* the sheet call below still names the owner */ }

        try {
            var sRes = await fetch(API_URL + '/api/characters/space/' + encodeURIComponent(username), {
                headers: { 'X-Auth-Key': authKey }
            });
            sheets = await sRes.json().catch(function() { return {}; });
        } catch(e) {
            container.innerHTML = '<div class="not-logged-in"><h2>Could not reach the server</h2>' +
                '<p><a href="lobbies.html">Back to lobbies</a></p></div>';
            return;
        }

        if (sheets && sheets.error) {
            container.innerHTML = '<div class="not-logged-in"><h2>' + esc2(sheets.error) + '</h2>' +
                '<p><a href="lobbies.html">Back to lobbies</a></p></div>';
            return;
        }

        var ownerName = (sheets && sheets.owner && (sheets.owner.display_name || sheets.owner.username)) ||
            (owner && (owner.display_name || owner.username)) || username;
        var avatar = avatarImageMarkup(owner && owner.avatar, ownerName);

        var list = (sheets && sheets.characters) || [];

        /* Character records live in Heroes & Hermits. The retired sheet art is
           intentionally not rendered here. */
        var frame =
            '<div style="margin:1.5rem auto;max-width:600px;text-align:center;">' +
                '<div class="card">' +
                    '<h4>Character Records</h4>' +
                    '<p>Named character records are maintained in <a href="../../content/tomes/heroes-hermits.html#brunn" style="color:#b9aa00;text-decoration:underline;">Heroes &amp; Hermits</a>.</p>' +
                '</div>' +
            '</div>';

        var body;
        /* A guest account holds no sheets - character sheets start at Civilian.
           Saying so beats "has not made one yet", which reads as though one
           might turn up later. Guests may still read everyone else's. */
        var ownerIsGuest = /^Guest \d+$/.test(String(ownerName).trim()) ||
            /^Guest \d+$/.test(String(username).trim());
        if (sheets && sheets['private']) {
            body = '<p class="visitor-empty">' + esc2(ownerName) + ' keeps their character sheets private.</p>';
        } else if (!list.length && ownerIsGuest) {
            body = '<p class="visitor-empty">Guests do not hold character sheets. A character sheet starts at Civilian.</p>';
        } else if (!list.length) {
            body = '<p class="visitor-empty">' + esc2(ownerName) + ' has not made a character sheet yet.</p>';
        } else {
            body = list.map(renderVisitorSheet).join('');
        }

        /* Reading a private sheet as the GM of their lobby is worth saying out
           loud - they did not open it to the room, and the reader should know
           which hat they are wearing while they read it. */
        var gmNote = (sheets && sheets.via_gm)
            ? '<div class="visitor-note">You are reading this as the Game Master of a lobby this player is in.</div>'
            : '';

        container.innerHTML =
            '<a href="javascript:void(0)" onclick="if(history.length>1){history.back();}else{window.location=\'lobbies.html\';}" ' +
              'style="display:inline-block;color:#b9aa00;text-decoration:none;font-size:0.85rem;margin-bottom:1rem;">&#8592; Back</a>' +
            '<div class="space-banner-title">' + esc2(ownerName) + '</div>' +
            '<div class="space-card">' +
                '<div class="space-banner"></div>' +
                '<div class="space-info-row">' +
                    '<div class="space-avatar-large">' + avatar + '</div>' +
                    '<div class="space-name-block">' +
                        '<div class="space-username">' + esc2(ownerName) + '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="space-section">' +
                    '<h3>Characters</h3>' +
                    gmNote +
                    body +
                    frame +
                '</div>' +
            '</div>';
    }

    /* Who may read the character sheet. The setting lives on the sheet itself
       (is_public), so the toggle governs the default sheet - the one the glyph
       beside a name in a lobby opens. Until a sheet exists there is nothing to
       set, and the buttons say so rather than pretending to save. */
    var privacySheet = null;

    function renderPropertyAccess() {
        var publicControls = document.querySelectorAll('.property-access-public');
        var privateControls = document.querySelectorAll('.property-access-private');
        if (!publicControls.length && !privateControls.length) return;
        var hasSheet = !!privacySheet;
        publicControls.forEach(function(control) {
            control.classList.toggle('is-active', hasSheet && !!privacySheet.is_public);
            control.setAttribute('aria-disabled', hasSheet ? 'false' : 'true');
            control.tabIndex = hasSheet ? 0 : -1;
        });
        privateControls.forEach(function(control) {
            control.classList.toggle('is-active', hasSheet && !privacySheet.is_public);
            control.setAttribute('aria-disabled', hasSheet ? 'false' : 'true');
            control.tabIndex = hasSheet ? 0 : -1;
        });
    }

    function bindPropertyAccessControls() {
        document.querySelectorAll('.property-access-public').forEach(function(control) {
            var button = document.createElement('button');
            button.type = 'button';
            button.className = control.className;
            button.textContent = control.textContent;
            control.parentNode.replaceChild(button, control);
            control = button;
            control.onclick = function() { if (privacySheet) setSheetPrivacy(true); };
            control.onkeydown = function(event) {
                if ((event.key === 'Enter' || event.key === ' ') && privacySheet) {
                    event.preventDefault();
                    setSheetPrivacy(true);
                }
            };
        });
        document.querySelectorAll('.property-access-private').forEach(function(control) {
            var button = document.createElement('button');
            button.type = 'button';
            button.className = control.className;
            button.textContent = control.textContent;
            control.parentNode.replaceChild(button, control);
            control = button;
            control.onclick = function() { if (privacySheet) setSheetPrivacy(false); };
            control.onkeydown = function(event) {
                if ((event.key === 'Enter' || event.key === ' ') && privacySheet) {
                    event.preventDefault();
                    setSheetPrivacy(false);
                }
            };
        });
        renderPropertyAccess();
    }

    function renderSheetPrivacy() {
        renderPropertyAccess();
        var pub = document.getElementById('sheetPublicBtn');
        var priv = document.getElementById('sheetPrivateBtn');
        var note = document.getElementById('sheetPrivacyNote');
        if (!pub || !priv) return;
        if (!privacySheet) {
            pub.disabled = true; priv.disabled = true;
            pub.classList.remove('active'); priv.classList.remove('active');
            var me = '';
            try { me = String((JSON.parse(localStorage.getItem('sorc_user') || '{}') || {}).username || ''); } catch(e) {}
            if (note) {
                note.textContent = /^Guest \d+$/.test(me.trim())
                    ? 'A character sheet starts at Civilian. Sign up to keep one.'
                    : 'Make a character sheet to set whether it is public or private.';
            }
            return;
        }
        pub.disabled = false; priv.disabled = false;
        pub.classList.toggle('active', !!privacySheet.is_public);
        priv.classList.toggle('active', !privacySheet.is_public);
        if (note) note.textContent = 'Recommend public in lobbies for GM recruiting.';
    }

    window.setSheetPrivacy = async function(makePublic) {
        if (!privacySheet || !!privacySheet.is_public === !!makePublic) return;
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!saved || !saved.authKey) return;
        var pub = document.getElementById('sheetPublicBtn');
        var priv = document.getElementById('sheetPrivateBtn');
        var note = document.getElementById('sheetPrivacyNote');
        if (pub) pub.disabled = true;
        if (priv) priv.disabled = true;
        document.querySelectorAll('.property-access-public, .property-access-private').forEach(function(control) {
            control.setAttribute('aria-disabled', 'true');
        });
        try {
            var res = await fetch(API_URL + '/api/characters/' + encodeURIComponent(privacySheet.id), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': saved.authKey },
                body: JSON.stringify({ is_public: !!makePublic })
            });
            var data = await res.json().catch(function() { return {}; });
            if (!res.ok || data.error) {
                if (note) note.textContent = data.error || 'Could not save that setting.';
                renderSheetPrivacy();
                return;
            }
            privacySheet.is_public = !!makePublic;
            renderSheetPrivacy();
        } catch(e) {
            if (note) note.textContent = 'Could not reach the server.';
            renderSheetPrivacy();
        }
    };

    function switchTab(tabId) {
        document.querySelectorAll('.tab-nav button').forEach(function(btn) { btn.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
        var btn = document.querySelector('.tab-nav button[data-tab="' + tabId + '"]');
        if (btn) btn.classList.add('active');
        var panel = document.getElementById('tab-' + tabId);
        if (panel) panel.classList.add('active');
        bindPropertyAccessControls();
        window.history.replaceState(null, null, '?tab=' + tabId);

        // Load Fellows data when Fellows tab is selected
        if (tabId === 'fellows') {
            loadFellowsData();
        }
    }

    function loadFellowsData() {
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}

        if (!saved || !saved.authKey) return;

        // Load friend requests
        fetch(API_URL + '/api/friend-requests', {
            headers: { 'X-Auth-Key': saved.authKey }
        })
        .then(r => r.ok ? r.json() : null)
        .then(data => {
            var requestsList = document.getElementById('friendRequestsList');
            if (!requestsList) return;

            if (!data || data.count === 0) {
                requestsList.innerHTML = '<p style="color:#888;font-size:0.9rem;">No pending friend requests.</p>';
                return;
            }

            var html = '';
            data.incoming_requests.forEach(function(req) {
                html += '<div style="display:flex;gap:1rem;padding:1rem;background:#1a1a1a;border-radius:6px;margin-bottom:0.5rem;align-items:center;">' +
                    '<div style="width:48px;height:48px;border-radius:50%;background:#333;flex-shrink:0;border:2px solid #b9aa00;display:flex;align-items:center;justify-content:center;color:#666;font-size:0.9rem;">' +
                    (req.from_avatar ? '<img src="../../images/avatars/' + req.from_avatar + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />' : req.from_display_name.charAt(0)) +
                    '</div>' +
                    '<div style="flex:1;">' +
                        '<p style="color:#e0cfc0;margin:0 0 0.25rem 0;font-weight:bold;">' + esc(req.from_display_name) + '</p>' +
                        '<p style="color:#888;font-size:0.85rem;margin:0;">' + req.from_community_points + ' Community Points</p>' +
                    '</div>' +
                    '<button class="btn btn-sm btn-gold" onclick="acceptFriend(\'' + req.from_id + '\')">Accept</button>' +
                    '<button class="btn btn-sm" style="background:#333;color:#e0cfc0;margin-left:0.25rem;" onclick="declineFriend(\'' + req.from_id + '\')">Decline</button>' +
                '</div>';
            });
            requestsList.innerHTML = html;
        })
        .catch(e => console.error('Failed to load friend requests:', e));

        // Load online Fellows
        fetch(API_URL + '/api/friends', {
            headers: { 'X-Auth-Key': saved.authKey }
        })
        .then(r => r.ok ? r.json() : null)
        .then(data => {
            var fellowsList = document.getElementById('onlineFellowsList');
            if (!fellowsList) return;

            if (!data || data.count === 0) {
                fellowsList.innerHTML = '<p style="color:#888;font-size:0.9rem;grid-column:1/-1;">No Friends yet. <span style="color:#888;">Add a Fellow coming soon.</span></p>';
                return;
            }

            var html = '';
            data.friends.forEach(function(friend) {
                var statusColor = friend.status === 'online' ? '#1a6b1a' : '#666';
                html += '<div style="background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:1rem;text-align:center;cursor:pointer;transition:all 0.2s;hover:border-color:#b9aa00;">' +
                    '<div style="width:64px;height:64px;border-radius:50%;margin:0 auto 0.75rem;background:#333;border:3px solid ' + statusColor + ';display:flex;align-items:center;justify-content:center;overflow:hidden;">' +
                    (friend.avatar ? '<img src="../../images/avatars/' + friend.avatar + '" style="width:100%;height:100%;object-fit:cover;" />' : '<span style="font-size:1.5rem;color:#666;">' + friend.display_name.charAt(0) + '</span>') +
                    '</div>' +
                    '<p style="color:#e0cfc0;margin:0 0 0.25rem 0;font-weight:bold;font-size:0.95rem;">' + esc(friend.display_name) + '</p>' +
                    '<p style="color:#888;font-size:0.8rem;margin:0 0 0.75rem 0;">' + (friend.status === 'online' ? '🟢 Online' : '⚫ Offline') + '</p>' +
                    '<button class="btn btn-sm btn-gold" type="button" disabled style="opacity:0.6;cursor:not-allowed;">View Space</button>' +
                '</div>';
            });
            fellowsList.innerHTML = html;
        })
        .catch(e => console.error('Failed to load friends:', e));
    }

    function acceptFriend(friendId) {
        var saved = JSON.parse(localStorage.getItem('sorc_user') || '{}');
        fetch(API_URL + '/api/friends', {
            method: 'POST',
            headers: { 'X-Auth-Key': saved.authKey, 'Content-Type': 'application/json' },
            body: JSON.stringify({ friend_id: friendId, action: 'accept' })
        })
        .then(r => r.json())
        .then(() => {
            loadFellowsData();
        })
        .catch(e => console.error('Failed to accept friend:', e));
    }

    function declineFriend(friendId) {
        var saved = JSON.parse(localStorage.getItem('sorc_user') || '{}');
        fetch(API_URL + '/api/friends?friend_id=' + friendId, {
            method: 'DELETE',
            headers: { 'X-Auth-Key': saved.authKey }
        })
        .then(r => r.json())
        .then(() => {
            loadFellowsData();
        })
        .catch(e => console.error('Failed to decline friend:', e));
    }

    document.addEventListener('DOMContentLoaded', async function() {
        try {
            console.log('[Space] DOMContentLoaded fired');

            // Clear failsafe timeout since page is loading
            if (typeof loadTimeoutId !== 'undefined') clearTimeout(loadTimeoutId);

            var saved = null;
            try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {
                console.error('[Space] Failed to parse stored user:', e);
            }

            console.log('[Space] User data loaded: ' + (saved ? 'Yes' : 'No'));

            if (!saved || !saved.authKey) {
                console.log('[Space] No auth key, showing signin');
                document.getElementById('profileContainer').innerHTML =
                    '<div class="not-logged-in"><h2>Not logged in</h2><p><a href="../../auth/signin.html">Sign in to view your profile</a></p></div>';
                return;
            }

            /* Someone else's Space. Their own name in the address is not a
               claim about who is reading - the sheets come back from the API
               under the reader's own key, which is what decides whether a
               private sheet is theirs to see. */
            if (VIEW_USERNAME &&
                VIEW_USERNAME.toLowerCase() !== String(saved.username || '').toLowerCase()) {
                await renderVisitorSpace(VIEW_USERNAME, saved.authKey);
                return;
            }

            var user = saved;
            var role = user.role || 'CIVILIAN';
            if (OWNER_EMAILS.includes(user.email)) role = 'OWNER';
            else if (ADMIN_EMAILS.includes(user.email)) role = 'ADMIN';

            var isPro = user.is_pro === true || user.is_pro === 1 || user.membership === 'pro';

            // Fetch fresh data
            try {
                var freshRes = await fetch(API_URL + '/api/me', {
                    headers: { 'X-Auth-Key': saved.authKey }
                });
                if (freshRes.ok) {
                    var freshData = await freshRes.json();
                    if (freshData.user) {
                        user = Object.assign(user, freshData.user);
                        isPro = user.is_pro === true || user.is_pro === 1 || user.membership === 'pro';
                        localStorage.setItem('sorc_user', JSON.stringify(user));
                    }
                } else {
                    console.warn('[Space] API returned status:', freshRes.status);
                }
            } catch(e) {
                console.error('[Space] API fetch failed:', e);
            }

            // Render profile
            var container = document.getElementById('profileContainer');
            if (!container) throw new Error('profileContainer not found');

            container.innerHTML = renderProfileHeader(user, role, isPro) +
                renderTabNav(user, role, isPro) +
                renderTabContent(user, role, isPro);

            // Add event delegation for tab buttons (handles disabled buttons too)
            var tabNav = document.querySelector('.tab-nav');
            if (tabNav) {
                tabNav.addEventListener('click', function(e) {
                    var btn = e.target.closest('button[data-tab]');
                    if (btn && !btn.disabled) {
                        var tabId = btn.getAttribute('data-tab');
                        switchTab(tabId);
                    }
                }, false);
            }

            // Set initial active tab from URL
            var params = new URLSearchParams(window.location.search);
            var initialTab = params.get('tab') || 'overview';
            switchTab(initialTab);

            // Fetch and display active character count
            (async function() {
                try {
                    var charRes = await fetch(API_URL + '/api/characters', {
                        headers: { 'X-Auth-Key': saved.authKey }
                    });
                    if (charRes.ok) {
                        var charData = await charRes.json();
                        var charCount = Array.isArray(charData) ? charData.length : (charData.characters ? charData.characters.length : 0);
                        // Update both the Settings tab and Overview tab character counts

    // Global avatar functions
    function selectDefaultAvatar(imageUrl) {
        var preview = document.getElementById('avatarPreview');
        if (preview) {
            preview.style.backgroundImage = 'url(' + imageUrl + ')';
            preview.style.backgroundSize = 'cover';
            preview.style.backgroundPosition = 'center';
            preview.textContent = '';
        }
        console.log('[Avatar] Selected default avatar:', imageUrl);
    }

    function uploadCustomAvatar() {
        var fileInput = document.getElementById('avatarUpload');
        var statusEl = document.getElementById('uploadStatus');

        if (!fileInput || !fileInput.files.length) {
            if (statusEl) {
                statusEl.textContent = 'Please select a file';
                statusEl.style.display = 'block';
            }
            return;
        }

        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}

        if (!saved || !saved.authKey) {
            if (statusEl) {
                statusEl.textContent = 'Not authenticated';
                statusEl.style.display = 'block';
            }
            return;
        }

        var userCP = saved.community_points || 0;
        if (userCP < 100) {
            if (statusEl) {
                statusEl.textContent = 'Requires 100 Community Points. You have ' + userCP + '.';
                statusEl.style.display = 'block';
                statusEl.style.color = '#f44';
            }
            return;
        }

        var file = fileInput.files[0];
        if (file.size > 2 * 1024 * 1024) {
            if (statusEl) {
                statusEl.textContent = 'File size exceeds 2MB limit';
                statusEl.style.display = 'block';
            }
            return;
        }

        var reader = new FileReader();
        reader.onload = function(e) {
            var preview = document.getElementById('avatarPreview');
            if (preview) {
                preview.style.backgroundImage = 'url(' + e.target.result + ')';
                preview.style.backgroundSize = 'cover';
                preview.style.backgroundPosition = 'center';
                preview.textContent = '';
            }

            if (statusEl) {
                statusEl.textContent = 'Avatar uploaded (will save with profile)';
                statusEl.style.color = '#4ECDC4';
                statusEl.style.display = 'block';
            }

            // Reset file input
            fileInput.value = '';
            var uploadBtn = document.getElementById('uploadAvatarBtn');
            if (uploadBtn) {
                uploadBtn.textContent = 'Upload';
            }
        };
        reader.readAsDataURL(file);
    }
