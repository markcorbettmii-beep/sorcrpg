<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaida - SORC Character Sheet</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111;
      font-size: 13px;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    /* Viewport fills space between flip indicator and action bar */
    .sheet-viewport {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
    }
    @media (max-width: 815px) {
      .sheet-viewport { overflow: hidden; }
    }

    /* ── SCALE WRAPPER ── */
    .scale-wrap {
      width: 816px;
      height: 1056px;
      transform-origin: top center;
      flex-shrink: 0;
    }

    /* ── FLIP INDICATOR (outside the sheet) ── */
    .flip-indicator {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      flex-shrink: 0;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── FLIP CONTAINER ── */
    .flipper {
      width: 816px;
      height: 1056px;
      position: relative;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── FACES ── */
    .face {
      position: absolute;
      inset: 0;
      background: #f2ece0;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .face.back { display: none; }
    #front .inner { zoom: 0.96; }

    /* ── BORDER ── */
    .border-frame {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .border-frame::before {
      content: '';
      position: absolute;
      inset: 7px;
      border: 2.5px solid #3a4a18;
    }
    .border-frame::after {
      content: '';
      position: absolute;
      inset: 13px;
      border: 1px solid #3a4a18;
    }

    /* ── CORNERS ── */
    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      z-index: 12;
      pointer-events: none;
    }
    .corner svg { width: 100%; height: 100%; }
    .corner.tl { top: 0; left: 0; }
    .corner.tr { top: 0; right: 0; transform: scaleX(-1); }
    .corner.bl { bottom: 0; left: 0; transform: scaleY(-1); }
    .corner.br { bottom: 0; right: 0; transform: scale(-1,-1); }

    /* ── WATERMARK ── */
    .wm {
      position: absolute; inset: 0; z-index: 60; pointer-events: none;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .wm::after {
      content: 'BETA';
      font-family: 'Cinzel', serif; font-weight: 900; font-size: 26rem;
      color: #2e3d0f; opacity: 0.18; letter-spacing: 0.15em;
      transform: rotate(-52deg); white-space: nowrap;
    }

    /* ── INNER ── */
    .inner {
      position: relative;
      z-index: 1;
      padding: 14px 18px 14px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ── TITLE ── */
    .title-block { text-align: center; margin-bottom: 4px; }

    .title-block h1 {
      font-family: 'Cinzel Decorative', Cinzel, serif;
      font-size: 1.75rem;
      color: #2e3d0f;
      font-weight: 900;
      letter-spacing: 0.03em;
      line-height: 1.15;
    }

    .title-block h2 {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      color: #2e3d0f;
      font-weight: 700;
      letter-spacing: 0.22em;
      margin-top: 4px;
    }

    .title-block .sub {
      font-family: Arial, sans-serif;
      font-size: 0.64rem;
      color: #444;
      margin-top: 5px;
      font-style: italic;
    }

    .rule {
      border: none;
      border-top: 1.5px solid #4a5a20;
      margin: 4px 0;
      opacity: 0.4;
    }

   /* ── THREE COLUMNS (front) ── */
    .cols {
      display: grid;
      grid-template-columns: 1fr 1.12fr 1fr;
      gap: 10px;
      margin-top: 3px;
      align-content: start;
      overflow: hidden;
    }

    /* ── SECTION ── */
    .sec { margin-bottom: 8px; }

    .sec-title {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 1px solid #4a5a20;
      padding-bottom: 3px;
      margin-bottom: 7px;
    }

    /* ── FILL-IN FIELDS ── */
    .field { margin-bottom: 5px; }

    .field-lbl {
      font-family: Arial, sans-serif;
      font-size: 0.6rem;
      color: #444;
      display: block;
      margin-bottom: 1px;
    }

    .field-lbl.sm { font-size: 0.55rem; }

    .fline {
      width: 100%;
      height: 1px;
      background: #6a7a48;
      margin-bottom: 2px;
    }

    /* ── CENTER COLUMN ── */
    .col-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .portrait {
      width: 100%;
      aspect-ratio: 3/4;
      border: 1.5px solid #4a5a20;
      background: #e5ddc8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .portrait span {
      font-family: 'Cinzel', serif;
      font-size: 0.55rem;
      color: #999;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .mid-label {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
    }

    .mid-line {
      width: 88%;
      height: 1px;
      background: #4a5a20;
      margin: 3px auto 0;
    }

    /* ── BONUS/PENALTY SUB-HEADER ── */
    .bp-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.54rem;
      font-weight: 700;
      color: #4a5a20;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin: 6px 0 2px;
    }

    /* ── CHIPS STACK LABEL ── */
    .chips-lbl {
      font-family: Arial, sans-serif;
      font-size: 0.46rem;
      color: #666;
      flex-shrink: 0;
      white-space: nowrap;
      margin-left: 3px;
    }

    /* ── CARDS (full-width row below the 3 columns) ── */
    .cards-wrap {
      margin-top: 8px;
    }

    .cards-head {
      font-family: 'Cinzel', serif;
      font-size: 0.66rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 8px;
    }

    .cards-main-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .cards-center { flex: 1; }

    .cards-side {
      width: 82px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .cards-side-title {
      font-family: 'Cinzel', serif;
      font-size: 0.5rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 1px solid #4a5a20;
      padding-bottom: 3px;
      margin-bottom: 5px;
    }

    .cards-side .fline { margin-bottom: 7px; }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px 8px;
    }

    .card-tpl {
      border: 1px solid #4a5a20;
      display: flex;
      flex-direction: column;
    }

    .card-tpl-hdr {
      background: #2e3d0f;
      color: #e8dfc0;
      font-family: 'Cinzel', serif;
      font-size: 0.46rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      padding: 2px 2px;
    }

    .card-tpl-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 4px;
      padding: 5px 5px 4px;
    }

    .card-tpl-body.single {
      grid-template-columns: 1fr;
    }

    .card-tpl-pending {
      font-family: 'Cinzel', serif;
      font-size: 0.44rem;
      color: #888;
      text-align: center;
      padding: 10px 4px;
      font-style: italic;
      letter-spacing: 0.08em;
    }

    .cf {
      margin-bottom: 4px;
    }

    .cl {
      font-family: Arial, sans-serif;
      font-size: 0.44rem;
      color: #555;
      display: block;
      margin-bottom: 1px;
      line-height: 1.1;
    }

    .cf .fline { margin-bottom: 0; }

    /* ════════ BACK ════════ */

    .back-cols {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-top: 6px;
    }

    .b-sec { margin-bottom: 13px; }

    .b-title {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 1px solid #4a5a20;
      padding-bottom: 3px;
      margin-bottom: 7px;
    }

    /* ATTRIBUTES */
    .attr-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .abox {
      border: 1px solid #4a5a20;
      background: #e8e0cc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3px 2px 3px;
      gap: 2px;
    }

    .abox.wide { grid-column: span 2; }

    .aname {
      font-family: 'Cinzel', serif;
      font-size: 0.52rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.08em;
    }

    .afield {
      width: 28px;
      height: 16px;
      border: 1px solid #4a5a20;
      background: #f5f0e4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* FORMULA NOTE */
    .frm {
      font-family: Arial, sans-serif;
      font-size: 0.44rem;
      color: #666;
      font-style: italic;
      margin: -1px 0 3px 2px;
      line-height: 1.3;
    }

    /* STAT ROWS */
    .srow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: Arial, sans-serif;
      font-size: 0.6rem;
      color: #222;
      padding: 3px 0;
      border-bottom: 1px dotted #bbb;
    }

    .sfield {
      width: 36px;
      height: 13px;
      border: 1px solid #4a5a20;
      background: #f5f0e4;
      flex-shrink: 0;
    }

    .sfield.wide { width: 62px; }

    /* TRAITS */
    .trait-list { list-style: none; padding: 0; }

    .trait-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: Arial, sans-serif;
      font-size: 0.6rem;
      color: #222;
      padding: 1.5px 0;
      border-bottom: 1px dotted #ccc;
    }

    .tfield {
      width: 24px;
      height: 12px;
      border: 1px solid #4a5a20;
      background: #f5f0e4;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CHIPS */
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 4px;
    }

    .chip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid #4a5a20;
      background: #f5f0e4;
    }

    .chip.purple { border-color: #7a3a9a; background: #ece0f5; }

    .chip-note {
      font-family: Arial, sans-serif;
      font-size: 0.48rem;
      color: #777;
      margin-top: 3px;
    }

    /* CONDITIONS */
    .cond-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px 8px;
    }

    .vit-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .vbox {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .vname {
      font-family: 'Cinzel', serif;
      font-size: 0.5rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.06em;
    }

    .vfield {
      width: 100%;
      height: 18px;
      border: 1px solid #4a5a20;
      background: #f5f0e4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .class-hdr {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      font-family: 'Cinzel', serif;
      font-size: 0.52rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .cond-wrap {
      flex-shrink: 0;
      margin-top: auto;
      padding-top: 0;
    }

    .card-row {
      display: flex;
      gap: 10px;
      margin-bottom: 0;
    }
    .sheet-card {
      flex: 1;
      min-width: 0;
      border: 1px solid #4a5a20;
      background: #e8e0cc;
      padding: 3px 4px;
      box-sizing: border-box;
    }
    .sheet-card-title {
      font-family: 'Cinzel', serif;
      font-size: 0.48rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-bottom: 1px solid #4a5a20;
      margin-bottom: 2px;
      padding-bottom: 2px;
      display: flex;
    }
    .item-card-tbl {
      width: 100%;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
      font-size: 0.41rem;
      table-layout: fixed;
    }
    .item-card-tbl td {
      padding: 0px 2px;
      vertical-align: middle;
      color: #2e3d0f;
      white-space: nowrap;
      overflow: hidden;
    }
    .item-card-tbl td:first-child {
      padding-right: 4px;
    }
    .item-card-tbl td:last-child {
      width: 32%;
      padding-left: 4px;
    }
    .weap-tbl td:last-child { width: 50%; }
    .ammo-tbl td:first-child { width: 38%; border-right: none; }
    .ammo-tbl td:last-child { width: 62%; }
    .ammo-tbl .pencil { font-size: 0.36rem; }
    .itype-hdr td {
      font-weight: 700;
      border-top: 1px solid #4a5a20;
      padding-top: 2px;
      padding-bottom: 1px;
    }
    .itype-hdr:first-child td {
      border-top: none;
    }
    .itype-bullet td {
      color: #555;
      height: 14px;
      border-bottom: 1px dotted #ccc;
    }
    .itype-bullet-lbl td {
      color: #4a5a20;
      height: 9px;
      border-bottom: 1px dotted #ccc;
      font-size: 0.38rem;
      padding: 0px 2px;
      vertical-align: middle;
    }
    .itype-bullet-lbl .pencil { font-size: 0.48rem; }
    .citem {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: Arial, sans-serif;
      font-size: 0.57rem;
      color: #222;
    }
    .citem-name {
      display: inline-block;
      min-width: 52px;
    }
    .citem-boxes {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .cbox {
      width: 11px;
      height: 11px;
      border: 1px solid #4a5a20;
      background: #f5f0e4;
      flex-shrink: 0;
    }

    /* JOURNAL LINES */
    .jline-item { margin-bottom: 7px; }

    .jline-lbl {
      font-family: Arial, sans-serif;
      font-size: 0.56rem;
      color: #444;
      display: block;
      margin-bottom: 1px;
    }

    .jline {
      width: 100%;
      min-height: 14px;
      margin-bottom: 5px;
      border: none;
      border-bottom: 1px solid #6a7a48;
      font-family: Arial, sans-serif;
      font-size: 0.66rem;
      color: #3d3d3d;
      padding: 0 1px;
      display: block;
    }
    .jline[contenteditable] { outline: none; cursor: text; }

    /* XP BAR */
    .xp-bar {
      border: 1px solid #4a5a20;
      height: 8px;
      background: rgba(90, 122, 40, 0.18);
      margin-top: 3px;
      overflow: hidden;
    }
    .xp-fill { height: 100%; width: 0; background: #5a7a28; }

    .small-note {
      font-family: Arial, sans-serif;
      font-size: 0.48rem;
      color: #777;
      margin-top: 2px;
    }

    .lore-item {
      font-family: Arial, sans-serif;
      font-size: 0.62rem;
      font-weight: bold;
      color: #222;
      margin: 0 0 16px 0;
      line-height: 1.2;
    }

    .lore-item.lg { margin-bottom: 50px; }
    .lore-item.md { margin-bottom: 32px; }

    .lore-note {
      font-size: 0.5rem;
      font-weight: normal;
      font-style: normal;
      color: #666;
    }

    /* ── ACTION BAR ── */
    .action-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 200;
      padding: 0 12px;
    }

    .action-bar button {
      background: #3a4a18;
      color: #f2ece0;
      border: 1px solid #5a6a28;
      border-radius: 16px;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 6px 14px;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .action-bar button:active { background: #2a3a10; }

    /* ── CLASS / LEVEL / RANK ROW ── */
    .clr-row {
      display: flex;
      gap: 12px;
      margin-bottom: 6px;
    }
    .clr-item {
      flex: 1;
      display: flex;
      align-items: baseline;
      gap: 5px;
      border-bottom: 1px solid #4a5a20;
      padding-bottom: 2px;
    }
    .clr-lbl {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      color: #2e3d0f;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .clr-line {
      width: 100%;
      height: 1px;
      background: #4a5a20;
    }

    /* REPOSITORY */
    .repo-tbl { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; font-size: 0.46rem; margin-top: 4px; }
    .repo-tbl th { font-family: 'Cinzel', serif; font-size: 0.42rem; color: #2e3d0f; padding: 2px 3px; border-bottom: 1px solid #4a5a20; text-align: left; }
    .repo-tbl td { padding: 2px 3px; color: #2e3d0f; border-bottom: 1px dotted #ccc; vertical-align: middle; }
    .repo-pts { display: inline-flex; gap: 2px; vertical-align: middle; }
    .repo-pt { width: 8px; height: 8px; border: 1px solid #4a5a20; background: #f5f0e4; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; font-size: 7px; line-height: 1; color: #2e3d0f; }
    .repo-pt.spent { text-decoration: line-through; color: #8a9a70; }
    .repo-pt-rem { border: 1.5px solid #22cc44 !important; }
    .rem-lbl { font-size: 0.36rem; color: #22aa44; font-weight: 700; margin-left: 2px; display: inline-block; vertical-align: middle; }
    .repo-field { width: 22px; height: 12px; border: 1px solid #4a5a20; background: #f5f0e4; display: inline-block; vertical-align: middle; }
    /* TALENT TREES */
    .talent-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
    .talent-tree { border: 1px solid #4a5a20; background: #e8e0cc; padding: 4px; }
    .talent-tree-name { width: 100%; height: 12px; border-bottom: 1px solid #4a5a20; margin-bottom: 5px; font-family: 'Cinzel', serif; font-size: 0.5rem; font-weight: 700; color: #2e3d0f; letter-spacing: 0.08em; display: flex; align-items: flex-end; }
    .talent-slot { font-family: Arial, sans-serif; font-size: 0.44rem; color: #555; margin-bottom: 3px; display: flex; align-items: center; gap: 3px; }
    .talent-slot-line { flex: 1; height: 1px; background: #aaa; }
    /* PROFESSIONS */
    .prof-list { font-family: Arial, sans-serif; font-size: 0.44rem; color: #444; line-height: 1.5; margin-top: 3px; }

    /* ── PENCIL / HANDWRITING STYLE ── */
    .pencil {
      font-family: Arial, sans-serif;
      color: #3d3d3d;
