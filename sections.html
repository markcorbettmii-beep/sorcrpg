<h3>Rules Sections</h3>
<!-- Placeholder for dynamic links -->
<div id="section-links"></div>

<script>
  // List of all sections with their URLs and display names
  const sections = [
    { href: "/content/basic_rules/basic_rules_2.html", name: "Rules Section 2" },
    { href: "/content/basic_rules/basic_rules_3.html", name: "Rules Section 3" },
    { href: "/content/basic_rules/basic_rules_4.html", name: "Rules Section 4" },
    { href: "/content/basic_rules/basic_rules_5.html", name: "Rules Section 5" }
  ];

  const currentPage = window.location.pathname; // get current page URL
  const container = document.getElementById('section-links');

  let html = '';

  sections.forEach(section => {
    if (section.href === currentPage) {
      // Current page: show as plain text
      html += `<strong>${section.name}</strong> | `;
    } else {
      // Other pages: show as links
      html += `<a href="${section.href}"><strong>${section.name}</strong></a> | `;
    }
  });

  // Remove trailing separator
  html = html.replace(/\| $/, '');

  container.innerHTML = html;
</script>
