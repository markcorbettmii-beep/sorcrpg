<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessment | SORC RPG</title>
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>
  <div class="page-wrapper">
    <header class="header-container">
      <span class="sorc-letters">S O R C</span>
      <img src="images/newest-sorc-redev-letters-jpeg_20260808_072206_0000.png" class="sorc-letters-img evil-only" alt="SORC" />
      <img src="images/newest-sorc-goldlaw-letters-jpeg_20260808_072143_0000.png" class="sorc-letters-img lawful-only" alt="SORC" />
    </header>
    <nav>
      <div id="navRoleBadge"></div>
    </nav>

    <ul class="page-nav">
      <li><a href="index.html">&#8962;</a></li>
    </ul>

    <div class="assess-wrap">
      <h1>Take the Assessment</h1>
      <p class="assess-sub">Answer 10 questions to determine your role.</p>
      <div id="question-container"></div>
      <button id="submit-btn" class="choice-btn pc">Submit Answers</button>
      
      <!-- Debug Tool -->
      <div id="debug-box" style="background: #f8f8f8; border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; font-family: monospace; font-size: 0.9rem;">
        <h3>Debug Logs</h3>
        <pre id="debug-output"></pre>
      </div>
    </div>
  </div>

  <script>
    var questions = [];
    var selectedAnswers = {};

    // Fetch questions from the API
    fetch("/api/assess/beta-questions")
      .then((res) => res.json())
      .then((data) => {
        questions = data.questions;
        renderQuestions();
      })
      .catch((error) => {
        console.error("Error fetching questions:", error);
        alert("Error loading questions. Please try refreshing the page.");
      });

    function renderQuestions() {
      const container = document.getElementById("question-container");
      container.innerHTML = "";
      
      questions.forEach((question, index) => {
        const questionDiv = document.createElement("div");
        questionDiv.className = "question";
        questionDiv.innerHTML = `
          <h3>${index + 1}. ${question.q}</h3>
          <div class="options">
            ${question.options
              .map(
                (option, i) =>
                  `<label>
                    <input type="radio" name="question-${question.id}" value="${i}" data-question-id="${question.id}" />
                    ${option}
                  </label>`
              )
              .join("")}
          </div>
        `;
        container.appendChild(questionDiv);
      });

      // Add event listeners to capture answers
      const inputs = container.querySelectorAll("input[type='radio']");
      inputs.forEach((input) => {
        input.addEventListener("change", (e) => {
          const questionId = e.target.getAttribute("data-question-id");
          const answer = parseInt(e.target.value, 10);
          selectedAnswers[questionId] = answer;
          console.log(`Question ${questionId} selected answer: ${answer}`);
        });
      });
    }

    function submitQuiz() {
      // Collect user-selected answers
      var answers = questions.map(function (q) {
        return { id: q.id, answer: selectedAnswers[q.id] };
      });

      // Debugging: Log the questions and submitted answers
      const debugBox = document.getElementById("debug-output");
      debugBox.textContent = "Questions:\n" + JSON.stringify(questions, null, 2) + "\n\n";
      debugBox.textContent += "Submitted Answers:\n" + JSON.stringify(answers, null, 2) + "\n\n";

      // Send answers to the backend
      fetch("/api/assess/beta-submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ answers: answers }),
      })
        .then((res) => res.json())
        .then((data) => {
          // Debugging: Log the backend response
          console.log("Backend Response:", data);

          debugBox.textContent += "Backend Response:\n" + JSON.stringify(data, null, 2) + "\n\n";

          if (data.error) {
            alert("Error: " + data.error);
          } else {
            console.log("Score:", data.score);
            console.log("Role Granted:", data.role);
            console.log("Passed:", data.passed);
            console.log("Wrong Answers:", data.wrong);

            debugBox.textContent += "Score: " + data.score + "\n";
            debugBox.textContent += "Role Granted: " + data.role + "\n";
            debugBox.textContent += "Passed: " + data.passed + "\n";
            if (data.wrong) {
              debugBox.textContent += "Wrong Answers Breakdown:\n" + JSON.stringify(data.wrong, null, 2) + "\n";
            }
          }
        })
        .catch((error) => {
          console.error("Error submitting quiz:", error);
          debugBox.textContent += "Error submitting quiz:\n" + error + "\n";
        });
    }

    // Attach submit event to the button
    document.getElementById("submit-btn").addEventListener("click", submitQuiz);
  </script>
</body>
</html>
