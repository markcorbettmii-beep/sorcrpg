<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Role Assessment | Slayers of Rings § Crowns</title>
  <link rel="stylesheet" href="styles.css?v=9" />
  <style>
    .assess-wrap { max-width: 680px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    .assess-wrap h1 { color: #c93f35; margin-bottom: 0.25rem; font-size: 1.6rem; }
    .assess-sub { color: #666; font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.5; }
    .result-card { background: #1a1a1a; border: 2px solid #b9aa00; border-radius: 14px; padding: 2rem; text-align: center; }
    .result-card h2 { color: #b9aa00; margin-bottom: 0.5rem; }
    .result-role { font-size: 2rem; font-weight: bold; margin: 0.5rem 0; }
    .result-score { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
    .error-message { color: #c93f35; font-size: 1rem; margin-top: 1.5rem; }
    .reload-btn { margin-top: 1rem; background: #c93f35; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
    .reload-btn:hover { background: #a11d1b; }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header class="header-container">
      <span class="sorc-letters">S O R C</span>
      <img src="images/newest-sorc-redev-letters-jpeg_20260808_072206_0000.png" class="sorc-letters-img evil-only" alt="SORC" />
      <img src="images/newest-sorc-goldlaw-letters-jpeg_20260808_072143_0000.png" class="sorc-letters-img lawful-only" alt="SORC" />
    </header>
    <div class="assess-wrap">
      <h1>Role Assessment</h1>
      <p class="assess-sub">Answer 10 questions to find out your rank!</p>
      <div id="assessApp"><p style="color:#555;">Loading...</p></div>
    </div>
  </div>

  <script>
    var API_URL = 'https://api.sorcrpg.com';
    var currentUser = null;

    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    // Role labels
    function roleLabel(r) {
      switch (r) {
        case 'PC-BEG': return '[PC] Novice';
        case 'PC-INT': return '[PC] Journeyman';
        case 'PC-ADV': return '[PC] Master';
        case 'GM-BEG': return '[GM] Novice';
        case 'GM-INT': return '[GM] Journeyman';
        case 'GM-ADV': return '[GM] Master';
        default: return r;
      }
    }

    // Role colors
    function roleColor(r) {
      if (r.startsWith('[PC]')) return 'blue'; // PC roles in blue
      if (r.startsWith('[GM]')) return 'purple'; // GM roles in purple
      return '#e0cfc0'; // Default color
    }

    // Show result
    function showResult(assessment) {
      var app = document.getElementById('assessApp');
      var role = assessment.role_granted;
      var roleText = roleLabel(role);
      var color = roleColor(role);

      app.innerHTML = `
        <div class="result-card">
          <h2>Assessment Complete</h2>
          <div class="result-role" style="color: ${color};">${roleText}</div>
          <div class="result-score">${assessment.score}/10 correct</div>
        </div>
      `;
    }

    // Handle loading questions from API (with error handling)
    async function loadBetaQuiz() {
      var app = document.getElementById("assessApp");
      app.innerHTML = '<p style="color:#555;">Loading questions...</p>';
      gmTrack = false; // beta is Player-only, no account, no GM

      try {
        var res = await fetch(API_URL + "/api/assess/beta-questions?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) {
          throw new Error("Server error: " + res.status);
        }
        var data = await res.json();
        if (!data.questions) {
          throw new Error("No questions in response");
        }
        questions = data.questions || [];
        selectedAnswers = {};
        renderQuiz();
      } catch (e) {
        console.error("Error loading beta questions:", e);
        app.innerHTML = `
          <p class="error-message">
            Could not load questions: ${e.message}
          </p>
          <button class="reload-btn" onclick="location.reload()">Reload Page</button>
        `;
      }
    }

    // Render the quiz questions
    function renderQuiz() {
      var app = document.getElementById("assessApp");

      if (!questions || questions.length === 0) {
        app.innerHTML = `
          <p class="error-message">
            No questions available at this time. Please try again later.
          </p>
        `;
        return;
      }

      var qHtml = questions.map((q, idx) => renderQuestionCard(q, idx, questions.length)).join("");
      app.innerHTML = qHtml;
    }

    // Simulate an assessment result for testing
    showResult({ role_granted: 'PC-BEG', score: 7 }); // Change 'PC-BEG' to 'GM-ADV' or others to test
  </script>
</body>
</html>
