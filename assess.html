<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Role Assessment | Slayers of Rings § Crowns</title>
    <link rel="stylesheet" href="styles.css?v=9" />
    <!-- Additional styling... -->
  </head>
  <body>
    <div class="page-wrapper">
      <header class="header-container">
        <span class="sorc-letters">S O R C</span>
        <img
          src="images/newest-sorc-redev-letters-jpeg_20260808_072206_0000.png"
          class="sorc-letters-img evil-only"
          alt="SORC"
        />
        <img
          src="images/newest-sorc-goldlaw-letters-jpeg_20260808_072143_0000.png"
          class="sorc-letters-img lawful-only"
          alt="SORC"
        />
      </header>
      <nav>
        <div id="navRoleBadge"></div>
      </nav>

      <ul class="page-nav">
        <li><a href="index.html">&#8962;</a></li>
      </ul>

      <div class="assess-wrap">
        <h1>Role Assessment</h1>
        <p class="assess-sub">
          Answer 10 questions drawn from the SORC Basic Rules to unlock lobby
          access. Score 6–7 for PC Beginner, 8 for PC Intermediate, 9–10 for PC
          Advanced. GMs must score 9 or higher.
        </p>
        <div id="assessApp">
          <p style="color:#555;">Loading...</p>
        </div>
      </div>

      <div id="footer"></div>
    </div>

    <script>
      var API_URL = "https://api.sorcrpg.com";
      var currentUser = null;
      try {
        currentUser = JSON.parse(localStorage.getItem("sorc_user"));
      } catch (e) {
        console.error("Error parsing localStorage:", e);
        currentUser = null;
      }

      (function () {
        var theme = localStorage.getItem("themeSelected") || "lawful";
        if (theme === "lawful") document.body.classList.add("lawful-mode");
      })();

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      var gmTrack = false;
      var selectedAnswers = {};
      var questions = [];
      var betaMode = false;

      async function init() {
        var app = document.getElementById("assessApp");
        if (!currentUser || !currentUser.authKey) {
          console.log("Guest mode detected. Starting beta quiz...");
          betaMode = true;
          loadBetaQuiz();
          return;
        }
        app.innerHTML = '<p style="color:#555;">Checking assessment status...</p>';
        try {
          var res = await fetch(API_URL + "/api/assess?t=" + Date.now(), {
            headers: { "X-Auth-Key": currentUser.authKey },
            cache: "no-store",
          });
          var data = await res.json();
          if (data.assessment) {
            try {
              var saved = JSON.parse(localStorage.getItem("sorc_user") || "{}");
              saved.sorc_role = data.assessment.role_granted;
              localStorage.setItem("sorc_user", JSON.stringify(saved));
            } catch (e) {
              console.error("Error saving role to localStorage:", e);
            }
            if (data.expired || data.needs_reassess) {
              showResult(data.assessment, true, true);
            } else {
              showResult(data.assessment, true, false);
            }
          } else {
            loadQuiz(trackParam === "gm");
          }
        } catch (e) {
          app.innerHTML =
            '<p style="color:#c93f35;">Connection error. Please try again.</p>';
        }
      }

      async function loadBetaQuiz() {
        var app = document.getElementById("assessApp");
        app.innerHTML = '<p style="color:#555;">Loading questions...</p>';
        gmTrack = false; // beta is Player-only, no account, no GM
        console.log("Beta Quiz: Starting to load questions...");
        try {
          var res = await fetch(
            API_URL + "/api/assess/beta-questions?t=" + Date.now(),
            { cache: "no-store" }
          );
          console.log("Beta Quiz: API response status:", res.status);

          // Check for errors
          if (!res.ok) {
            console.error("Error: API response failed with status", res.status);
            app.innerHTML =
              '<p style="color:#c93f35;">Could not load questions. Please try again later.</p>';
            return;
          }

          var data = await res.json();
          console.log("Beta Quiz: API response data:", data);

          // Ensure questions are available
          if (!data.questions || data.questions.length === 0) {
            console.error("Error: No questions returned in API response");
            app.innerHTML =
              '<p style="color:#c93f35;">No questions were found for the beta assessment. Please try again later.</p>';
            return;
          }

          questions = data.questions || [];
          selectedAnswers = {};
          renderQuiz();
        } catch (e) {
          console.error("Error loading beta questions:", e);
          app.innerHTML =
            '<p style="color:#c93f35;">Could not load questions. <button onclick="location.reload()" style="background:#c93f35;color:white;border:none;padding:0.5rem 1rem;border-radius:4px;cursor:pointer;">Reload Page</button></p>';
        }
      }

      function renderQuiz() {
        var app = document.getElementById("assessApp");
        var basicQs = questions.filter(function (q) {
          return q.section !== "gm_codex";
        });
        var codexQs = questions.filter(function (q) {
          return q.section === "gm_codex";
        });

        var qHtml =
          '<h3 style="margin-top:1.5rem;">Basic Rules</h3><hr style="border-color:#2a2a2a;margin-bottom:1rem;">' +
          basicQs
            .map(function (q, idx) {
              return renderQuestionCard(q, idx, questions.length);
            })
            .join("");
        if (codexQs.length) {
          qHtml +=
            '<h3 style="margin-top:2rem;">GM Codex</h3><hr style="border-color:#2a2a2a;margin-bottom:1rem;">' +
            codexQs
              .map(function (q, idx) {
                return renderQuestionCard(q, basicQs.length + idx, questions.length);
              })
              .join("");
        }

        app.innerHTML =
          qHtml +
          '<div class="submit-row">' +
          '<button class="submit-btn" id="submitBtn" onclick="submitAssessment()" disabled>Submit Assessment</button>' +
          '<span class="assess-msg" id="assessMsg"></span>' +
          "</div>" +
          '<div id="assessReview"></div>';

        if (!betaMode) updateTrackUI(gmTrack);
      }

      init();
    </script>
  </body>
</html>
