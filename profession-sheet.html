<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SORC Profession Sheet</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111;
      font-size: 13px;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .sheet-viewport {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
    }
    @media (max-width: 815px) {
      .sheet-viewport { overflow: hidden; }
    }

    .scale-wrap {
      width: 816px;
      height: 1056px;
      transform-origin: top center;
      flex-shrink: 0;
    }

    .flipper {
      width: 816px;
      height: 1056px;
      position: relative;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .face {
      position: absolute;
      inset: 0;
      background: #f0ece2;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .face.hidden { display: none; }

    .border-frame {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .border-frame::before {
      content: '';
      position: absolute;
      inset: 7px;
      border: 2.5px solid #5a3a1a;
    }
    .border-frame::after {
      content: '';
      position: absolute;
      inset: 13px;
      border: 1px solid #5a3a1a;
    }

    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      z-index: 12;
      pointer-events: none;
    }
    .corner svg { width: 100%; height: 100%; }
    .corner.tl { top: 0; left: 0; }
    .corner.tr { top: 0; right: 0; transform: scaleX(-1); }
    .corner.bl { bottom: 0; left: 0; transform: scaleY(-1); }
    .corner.br { bottom: 0; right: 0; transform: scale(-1,-1); }

    .wm {
      position: absolute; inset: 0; z-index: 60; pointer-events: none;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .wm::after {
      content: 'BETA';
      font-family: 'Cinzel', serif; font-weight: 900; font-size: 26rem;
      color: #5a3a1a; opacity: 0.15; letter-spacing: 0.15em;
      transform: rotate(-52deg); white-space: nowrap;
    }

    .inner {
      position: relative;
      z-index: 1;
      padding: 14px 30px 14px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .title-block { text-align: center; margin-bottom: 4px; }

    .title-block h1 {
      font-family: 'Cinzel Decorative', Cinzel, serif;
      font-size: 1.6rem;
      color: #5a3a1a;
      font-weight: 900;
      letter-spacing: 0.03em;
      line-height: 1.15;
    }

    .title-block h2 {
      font-family: 'Cinzel', serif;
      font-size: 0.74rem;
      color: #5a3a1a;
      font-weight: 700;
      letter-spacing: 0.2em;
      margin-top: 4px;
    }

    .title-block .sub {
      font-family: Arial, sans-serif;
      font-size: 0.56rem;
      color: #444;
      margin-top: 4px;
      font-style: italic;
    }

    .rule {
      border: none;
      border-top: 1.5px solid #7e5a30;
      margin: 4px 0;
      opacity: 0.4;
    }

    .sec { margin-bottom: 8px; }

    .sec-title {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      color: #5a3a1a;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 1px solid #7e5a30;
      padding-bottom: 3px;
      margin-bottom: 6px;
    }

    .field { margin-bottom: 5px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

    .field-lbl {
      font-family: Arial, sans-serif;
      font-size: 0.56rem;
      color: #444;
      display: block;
      margin-bottom: 1px;
    }

    input.fline {
      background: transparent;
      border: none;
      border-bottom: 1px solid #aaa;
      width: 100%;
      font-family: Arial, sans-serif;
      font-size: 0.68rem;
      color: #3d3d3d;
      height: auto;
      padding: 0 1px;
      outline: none;
      display: block;
    }

    .small-note {
      font-family: Arial, sans-serif;
      font-size: 0.46rem;
      color: #666;
      line-height: 1.5;
    }

    .lore-item {
      font-family: Arial, sans-serif;
      font-size: 0.56rem;
      font-weight: bold;
      color: #222;
      margin: 0 0 5px 0;
      line-height: 1.3;
    }

    /* ── RECIPE/SKILL TRACKER TABLE ── */
    .skill-tbl { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; font-size: 0.56rem; }
    .skill-tbl th {
      font-family: 'Cinzel', serif; font-size: 0.46rem; font-weight: 700; color: #f0ece2;
      background: #5a3a1a; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 4px 5px; text-align: left; border: 1px solid #5a3a1a;
    }
    .skill-tbl td {
      padding: 4px 5px; border: 1px solid #7e5a30; color: #222; vertical-align: middle;
    }
    .skill-tbl td[contenteditable] { font-family: Arial, sans-serif; outline: none; cursor: text; background: #f7f2e6; }
    .skill-tbl tr:nth-child(even) td { background: #ece4d2; }
    .skill-tbl tr:nth-child(even) td[contenteditable] { background: #e8dfc9; }

    /* ── PROFICIENCY TIER TABLE ── */
    .tier-tbl { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; font-size: 0.54rem; }
    .tier-tbl th {
      font-family: 'Cinzel', serif; font-size: 0.46rem; font-weight: 700; color: #f0ece2;
      background: #7e5a30; padding: 3px 5px; text-align: center; border: 1px solid #5a3a1a;
    }
    .tier-tbl td { border: 1px solid #7e5a30; padding: 3px 5px; text-align: center; color: #222; }
    .tier-tbl td.tier-name { text-align: left; font-weight: 700; font-family: 'Cinzel', serif; font-size: 0.48rem; color: #5a3a1a; background: #e3d7bb; }
    .tier-tbl td[contenteditable] { outline: none; cursor: text; background: #f7f2e6; }

    /* ── PROFESSION REFERENCE LIST (page 2/3) ── */
    .prof-ref { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; font-size: 0.44rem; }
    .prof-ref th {
      font-family: 'Cinzel', serif; font-size: 0.4rem; font-weight: 700; color: #f0ece2;
      background: #5a3a1a; letter-spacing: 0.02em; text-transform: uppercase;
      padding: 3px 4px; text-align: left; border: 1px solid #5a3a1a;
    }
    .prof-ref td { border: 1px solid #7e5a30; padding: 3px 4px; color: #222; vertical-align: top; }
    .prof-ref td.pname { font-weight: 700; font-family: 'Cinzel', serif; font-size: 0.44rem; color: #5a3a1a; background: #e3d7bb; white-space: nowrap; }
    .prof-ref tr:nth-child(even) td:not(.pname) { background: #f7f2e6; }

    /* ── ACTION BAR ── */
    .action-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 200;
      padding: 0 12px;
    }

    .action-bar button {
      background: #5a3a1a;
      color: #f0ece2;
      border: 1px solid #7e5a30;
      border-radius: 16px;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 6px 14px;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .action-bar button:active { background: #422a12; }

    .print-group {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1px solid #7e5a30;
      border-radius: 16px;
      overflow: hidden;
    }

    .print-group .ptab {
      background: #2a2a2a;
      color: #888;
      border: none;
      border-radius: 0;
      font-family: 'Cinzel', serif;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 6px 10px;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
      border-right: 1px solid #3a3a3a;
    }

    .print-group .ptab:last-of-type { border-right: none; }

    .print-group .ptab.active {
      background: #5a3a1a;
      color: #f0ece2;
    }

    .print-group .ptab:active { background: #422a12; color: #f0ece2; }

    #printBtn {
      background: #5a3a1a;
      color: #f0ece2;
      border: 1px solid #7e5a30;
      border-radius: 16px;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 6px 14px;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
    }

    #printBtn:active { background: #422a12; }

    /* ── PRINT ── */
    @media print {
      @page { size: 8.5in 11in; margin: 0; }
      html, body {
        overflow: visible !important;
        height: auto !important;
        background: white !important;
      }
      .action-bar { display: none !important; }
      .sheet-viewport {
        display: block !important;
        overflow: visible !important;
        height: auto !important;
      }
      .scale-wrap {
        transform: none !important;
        width: 8.5in !important;
        height: auto !important;
        margin: 0 !important;
      }
      .flipper {
        width: 8.5in !important;
        height: auto !important;
        position: static !important;
        overflow: visible !important;
      }
      .face {
        position: relative !important;
        width: 8.5in !important;
        height: 11in !important;
        visibility: visible !important;
        opacity: 1 !important;
        display: block !important;
        overflow: hidden !important;
      }
      .face.print-front { page-break-after: always; break-after: page; }
      .face.print-mid { page-break-after: always; break-after: page; }
      .face.print-last { page-break-before: always; break-before: page; }
    }
  

    /* ─── Lawful Mode (Light Theme) ─── */
    body.lawful-mode {
      background: #f5f5f0;
      color: #2c2c2c;
    }
    body.lawful-mode header { background: #ffffff; }
    body.lawful-mode nav { background: #ffffff; }
    body.lawful-mode main { background: #f5f5f0; color: #2c2c2c; }
    body.lawful-mode .content-main { background: #f5f5f0; color: #2c2c2c; }
    body.lawful-mode h1, body.lawful-mode h2, body.lawful-mode h3, body.lawful-mode h4, body.lawful-mode h5 { color: #2c2c2c; }
    body.lawful-mode p { color: #2c2c2c; }
    body.lawful-mode .profession-entry, body.lawful-mode .talent-entry, body.lawful-mode .skill-card { 
      background: rgba(185,170,0,0.06); 
      border-color: rgba(0,0,0,0.12); 
      color: #2c2c2c;
    }
    body.lawful-mode .talent-card { 
      background: rgba(185,170,0,0.06); 
      border-color: rgba(0,0,0,0.12); 
    }
    body.lawful-mode .note { 
      background: rgba(185,170,0,0.1); 
      border-color: rgba(180,140,20,0.5);
      color: #2c2c2c;
    }
    body.lawful-mode .callout {
      background: rgba(185,170,0,0.1);
      border-color: rgba(180,140,20,0.5);
      color: #2c2c2c;
    }
</style>
</head>
<body>
