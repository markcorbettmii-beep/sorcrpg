<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Attribute repository allocation example</title>
  <desc id="desc">The complete current repository example, including attribute score purchases, TST allocation, and remnants.</desc>
  <rect width="1400" height="620" fill="#ffffff"/>
  <g fill="#111111" font-family="'EB Garamond', Georgia, serif">
    <text x="42" y="52" font-size="40" font-weight="700">The ATTR Repository: Full Allocation</text>
    <text x="42" y="82" font-size="21" font-style="italic">Roll totals are 1d10 + 1d4; ATTR score gains are capped at 2 per level, and unused REM becomes Remnants.</text>
    <line x1="26" y1="104" x2="1374" y2="104" stroke="#111111" stroke-width="2"/>
    <g font-size="24" font-weight="700">
      <text x="42" y="140">ATTR</text>
      <text x="210" y="140">Roll</text>
      <text x="335" y="140">ATTR SCR</text>
      <text x="520" y="140">REM on SCR</text>
      <text x="735" y="140">TST Purchased</text>
      <text x="1010" y="140">Remnants</text>
    </g>
    <line x1="26" y1="156" x2="1374" y2="156" stroke="#111111" stroke-width="2"/>
    <g font-size="31">
      <text x="42" y="212">Artistry</text><text x="222" y="212">8</text><text x="370" y="212">1</text><text x="575" y="212">2</text><text x="790" y="212">1 TST (2)</text><text x="1060" y="212">5</text>
      <text x="42" y="272">Fortitude</text><text x="222" y="272">6</text><text x="370" y="272">2</text><text x="575" y="272">4</text><text x="790" y="272">None</text><text x="1060" y="272">2</text>
      <text x="42" y="332">Intellect</text><text x="222" y="332">2</text><text x="370" y="332">0</text><text x="575" y="332">0</text><text x="790" y="332">None</text><text x="1060" y="332">2</text>
      <text x="42" y="392">Physique</text><text x="222" y="392">9</text><text x="370" y="392">2</text><text x="575" y="392">4</text><text x="790" y="392">1 TST (2)</text><text x="1060" y="392">4</text>
      <text x="42" y="452">Vigilance</text><text x="222" y="452">2</text><text x="370" y="452">0</text><text x="575" y="452">0</text><text x="790" y="452">None</text><text x="1060" y="452">2</text>
      <text x="42" y="512">Wisdom</text><text x="222" y="512">7</text><text x="370" y="512">0</text><text x="575" y="512">0</text><text x="790" y="512">None</text><text x="1060" y="512">7</text>
    </g>
  </g>
</svg>