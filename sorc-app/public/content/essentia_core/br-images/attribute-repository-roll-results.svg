<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512" role="img" aria-labelledby="title desc">
  <title id="title">Attribute repository roll results example</title>
  <desc id="desc">The six current attributes and their kept 1d10 plus 1d4 results after the two lowest of eight rolls are discarded.</desc>
  <rect width="1024" height="512" fill="#ffffff"/>
  <g fill="#111111" font-family="'EB Garamond', Georgia, serif">
    <text x="42" y="48" font-size="38" font-weight="700">Kept Roll Results: 1d10 + 1d4</text>
    <text x="42" y="76" font-size="20" font-style="italic">Eight rolls are made; the two lowest totals are discarded, leaving six.</text>
    <line x1="26" y1="96" x2="998" y2="96" stroke="#111111" stroke-width="2"/>
    <g font-size="34" font-weight="700">
      <text x="42" y="137">Attribute</text>
      <text x="610" y="137">Roll Total</text>
    </g>
    <g font-size="34">
      <text x="42" y="187">Artistry</text><text x="640" y="187">8</text>
      <text x="42" y="237">Fortitude</text><text x="640" y="237">6</text>
      <text x="42" y="287">Intellect</text><text x="640" y="287">2</text>
      <text x="42" y="337">Physique</text><text x="640" y="337">9</text>
      <text x="42" y="387">Vigilance</text><text x="640" y="387">2</text>
      <text x="42" y="437">Wisdom</text><text x="640" y="437">7</text>
    </g>
  </g>
</svg>