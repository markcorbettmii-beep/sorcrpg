name = "sorc-app"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "d771bbe6613a9064911ecc7e6b3fe10b"
assets = { directory = "public" }

[triggers]
crons = ["0 6 */2 * *"]

[[d1_databases]]
binding = "sorc_db"
database_name = "sorc-rpg"
database_id = "256008d3-fd04-4766-8883-0796624b9cb5"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "sorc-avatars"

[[r2_buckets]]
binding = "FORUM_MEDIA"
bucket_name = "sorc-forum-media"

[vars]
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""

[env.production]
name = "sorc-app"
account_id = "d771bbe6613a9064911ecc7e6b3fe10b"

[[env.production.d1_databases]]
binding = "sorc_db"
database_name = "sorc-rpg"
database_id = "256008d3-fd04-4766-8883-0796624b9cb5"

[[env.production.r2_buckets]]
binding = "AVATARS"
bucket_name = "sorc-avatars"

[[env.production.r2_buckets]]
binding = "FORUM_MEDIA"
bucket_name = "sorc-forum-media"

[env.production.vars]
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""

# Secrets (RESEND_API_KEY, GOOGLE_CLIENT_SECRET) are managed via
# `wrangler secret put` / the Cloudflare dashboard — never in this file.
