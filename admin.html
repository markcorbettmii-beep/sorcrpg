<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | Slayers of Rings § Crowns</title>
  <link rel="stylesheet" href="styles.css?v=7" />
  <style>
    .admin-container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    .admin-container h1 { color: #c93f35; margin-bottom: 0.25rem; }
    .admin-container > .sub { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
    .admin-section { margin-bottom: 2.5rem; }
    .admin-section h2 { color: #b9aa00; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; border-bottom: 1px solid #2a2a2a; padding-bottom: 0.5rem; }
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .admin-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 1.25rem; }
    .admin-card h3 { color: #e0cfc0; font-size: 0.9rem; margin: 0 0 0.5rem 0; }
    .admin-card p { color: #555; font-size: 0.8rem; margin: 0 0 0.75rem 0; line-height: 1.5; }
    .btn { padding: 8px 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .btn-gold { background: #b9aa00; color: #222; }
    .btn-gold:hover { background: #b9aa00; }
    .btn-red { background: #c93f35; color: #fff; }
    .btn-red:hover { background: #c93f35; }
    .btn-dark { background: #333; color: #e0cfc0; }
    .btn-dark:hover { background: #444; }
    .btn-block { width: 100%; display: block; text-align: center; margin-bottom: 6px; }
    .input-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .admin-input { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #333; background: #222; color: #e0cfc0; font-size: 0.85rem; }
    .admin-input:focus { outline: none; border-color: #b9aa00; }
    .admin-select { padding: 8px 10px; border-radius: 6px; border: 1px solid #333; background: #222; color: #e0cfc0; font-size: 0.85rem; }
    .output-box { background: #111; border: 1px solid #2a2a2a; border-radius: 6px; padding: 0.75rem; margin-top: 0.5rem; font-size: 0.82rem; color: #b9aa00; min-height: 1.5rem; word-break: break-all; }
    .msg { font-size: 0.82rem; margin-top: 0.5rem; min-height: 1.2em; }
    .msg.success { color: #4caf50; }
    .msg.error { color: #c93f35; }
    .member-row { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .member-row-info { flex: 1; }
    .member-row-info .mname { font-weight: bold; color: #e0cfc0; font-size: 0.88rem; }
    .member-row-info .mdetail { font-size: 0.75rem; color: #555; margin-top: 2px; }
    .role-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; }
    .role-OWNER { background: #b9aa00; color: #222; }
    .role-ADMIN { background: #c93f35; color: #fff; }
    .role-MASTER { background: #1a6b1a; color: #fff; }
    .role-PLAYER { background: #1a3a6b; color: #fff; }
    .role-CIVILIAN { background: #333; color: #e0cfc0; }
    .member-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .member-actions button { padding: 4px 10px; border: none; border-radius: 5px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .act-warn { background: #b9aa00; color: #222; }
    .act-ban { background: #c93f35; color: #fff; }
    .act-suspend { background: #555; color: #fff; }
    .act-role { background: #1a3a6b; color: #fff; }
    .not-authorized { text-align: center; padding: 4rem; color: #555; }
    .not-authorized h2 { color: #c93f35; }
    #memberList .empty { text-align: center; padding: 2rem; color: #444; font-size: 0.85rem; }
    body.lawful-mode .admin-card, body.lawful-mode .member-row { background: #fff; border-color: #e0e0e0; }
    body.lawful-mode .admin-card h3, body.lawful-mode .member-row-info .mname { color: #2c2c2c; }
    .coming-soon-tag { font-size: 0.7rem; background: #333; color: #888; padding: 2px 7px; border-radius: 8px; margin-left: 6px; vertical-align: middle; }
    .role-search-item { padding: 8px 12px; cursor: pointer; font-size: 0.85rem; color: #e0cfc0; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; }
    .role-search-item:last-child { border-bottom: none; }
    .role-search-item:hover, .role-search-item:focus { background: #2a2a2a; outline: none; }
    .role-search-item .rs-uid { font-size: 0.72rem; color: #b9aa00; }
    .queue-count { font-size: 0.75rem; background: #c93f35; color: #fff; padding: 2px 8px; border-radius: 10px; margin-left: 6px; font-weight: bold; vertical-align: middle; }
    .report-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 0.9rem 1.1rem; margin-bottom: 0.6rem; display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
    .report-card.high { border-color: #c93f35; }
    .report-meta { flex: 1; min-width: 0; }
    .report-meta .rtype { display: inline-block; font-size: 0.7rem; font-weight: bold; padding: 2px 7px; border-radius: 8px; margin-bottom: 4px; }
    .rtype.post { background: #1a3a6b; color: #fff; }
    .rtype.user { background: #c93f35; color: #fff; }
    .report-meta .rpreview { font-size: 0.85rem; color: #e0cfc0; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .report-meta .rdetail { font-size: 0.75rem; color: #555; }
    .report-count { font-size: 0.8rem; font-weight: bold; color: #b9aa00; white-space: nowrap; }
    .report-count.high { color: #c93f35; }
    .report-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .report-actions button { padding: 5px 12px; border: none; border-radius: 5px; font-size: 0.78rem; font-weight: bold; cursor: pointer; }
    .act-dismiss { background: #333; color: #888; }
    .act-remove-post { background: #c93f35; color: #fff; }
    .act-suspend-user { background: #555; color: #fff; }
    body.lawful-mode .report-card { background: #fff; border-color: #e0e0e0; }
  
        body.lawful-mode .output-box { background: #f9f5f1; border-color: #e0e0e0; color: #7a6a00; }
        body.lawful-mode .member-row { background: #f9f5f1; border-color: #e0e0e0; }
    
        body.lawful-mode .act-dismiss { background: #eee; color: #888; }
    body.lawful-mode .act-role { background: #e3edf9; color: #1a4a8a; }
    body.lawful-mode .admin-input { background: #f9f5f1; border-color: #ccc; color: #2c2c2c; }
    body.lawful-mode .admin-select { background: #f9f5f1; border-color: #ccc; color: #2c2c2c; }
    body.lawful-mode .btn-dark { background: #eee; color: #555; }
    body.lawful-mode .coming-soon-tag { background: #eee; color: #888; }
    body.lawful-mode .role-CIVILIAN { background: #eee; color: #555; }
    body.lawful-mode .role-PLAYER { background: #e3edf9; color: #1a4a8a; }
    body.lawful-mode .rtype.post { background: #e3edf9; color: #1a4a8a; }
    
        body.lawful-mode .role-search-item:hover, body.lawful-mode .role-search-item:focus { background: #f0ede6; }
    </style>
</head>
<body>
  <div class="page-wrapper">
    <header class="header-container">
      <span class="sorc-letters">S O R C</span><img src="images/newest-sorc-redev-letters-jpeg_20260808_072206_0000.png" class="sorc-letters-img evil-only" alt="SORC" /><img src="images/newest-sorc-goldlaw-letters-jpeg_20260808_072143_0000.png" class="sorc-letters-img lawful-only" alt="SORC" />
    </header>
    <nav><div id="navRoleBadge"></div></nav>

    <div class="admin-container" id="adminApp">
      <div style="text-align:center;padding:3rem;color:#555;">Loading...</div>
    </div>

    <div id="footer"></div>
  </div>

  <script>
    var API_URL = 'https://api.sorcrpg.com';
    var OWNER_EMAILS = ['corbett@sorcrpg.com'];
    var ADMIN_EMAILS = ['markcorbett.mii@gmail.com'];
    var currentUser = null;
    var currentRole = null;

    (function() {
      var theme = localStorage.getItem('themeSelected') || 'evil';
      if (theme === 'lawful') document.body.classList.add('lawful-mode');
      try { currentUser = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
    })();

    function escapeHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function authHeaders() {
      return { 'Content-Type': 'application/json', 'X-Auth-Key': currentUser ? currentUser.authKey : '' };
    }

    async function apiFetch(path, opts) {
      var res = await fetch(API_URL + path, Object.assign({ headers: authHeaders() }, opts || {}));
      try { return await res.json(); } catch(e) { return { success: false, error: 'Server error (' + res.status + ')' }; }
    }

    async function sendRoleChangeMessage(uid, role) {
      try {
        var convRes = await apiFetch('/api/conversations', {
          method: 'POST',
          body: JSON.stringify({ recipient_uid: uid })
        });
        if (convRes.conversation_id) {
          await apiFetch('/api/conversations/' + convRes.conversation_id + '/messages', {
            method: 'POST',
            body: JSON.stringify({ body: 'Your SORC role has been updated to ' + role + '. If you have questions about this change, please contact an admin.' })
          });
        }
      } catch(e) {}
    }

    async function sendAdminInvitation(uid) {
      try {
        var convRes = await apiFetch('/api/conversations', {
          method: 'POST',
          body: JSON.stringify({ recipient_uid: uid })
        });
        if (convRes.conversation_id) {
          var body =
            "You've been invited to become a SORC Admin [AD] by the Owner.\n\n" +
            "As an Admin, you'll help moderate the platform, manage members, and support the SORC community. " +
            "Upon accepting, you will receive 10,000 Community Points.\n\n" +
            "To accept or decline, visit your Profile page - an invitation notice will be waiting for you there.";
          await apiFetch('/api/conversations/' + convRes.conversation_id + '/messages', {
            method: 'POST',
            body: JSON.stringify({ body: body })
          });
        }
      } catch(e) {}
    }

    function initAdminPanel() {
      if (!currentUser || !currentUser.authKey) { renderUnauthorized(); return; }
      var email = currentUser.email || '';
      if (OWNER_EMAILS.includes(email)) currentRole = 'OWNER';
      else if (ADMIN_EMAILS.includes(email)) currentRole = 'ADMIN';
      else { renderUnauthorized(); return; }
      renderPanel();
      setTimeout(loadModQueue, 200);
    }
    document.addEventListener('DOMContentLoaded', initAdminPanel);
    window.addEventListener('load', function() {
      setTimeout(function() {
        var app = document.getElementById('adminApp');
        if (app && app.innerHTML.indexOf('Loading') !== -1) { initAdminPanel(); }
      }, 800);
    });

    function renderUnauthorized() {
      document.getElementById('adminApp').innerHTML =
        '<div class="not-authorized"><h2>Access Denied</h2><p>This panel is restricted to Admins and Owners.</p></div>';
    }

    function renderPanel() {
      var isOwner = currentRole === 'OWNER';
      document.getElementById('adminApp').innerHTML =
        '<h1>' + (isOwner ? 'Owner' : 'Admin') + ' Panel</h1>' +
        '<p class="sub">Site management tools for ' + escapeHtml(currentUser.display_name || currentUser.username || 'Admin') + ' [' + currentRole + ']</p>' +

        '<div class="admin-section">' +
          '<h2>Mod Queue <span id="queueBadge"></span></h2>' +
          '<div id="modQueue"><div class="empty">Loading reports...</div></div>' +
        '</div>' +

        '<div class="admin-section">' +
          '<h2>Member Management</h2>' +
          '<div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;">' +
            '<input type="text" id="memberSearch" class="admin-input" placeholder="Search by username or email..." style="max-width:340px;" />' +
            '<button class="btn btn-gold" onclick="searchMembers()">Search</button>' +
            '<button class="btn btn-dark" onclick="loadAllMembers()">View All</button>' +
          '</div>' +
          '<div id="memberList"><div class="empty">Search for a member or click View All.</div></div>' +
          '<div id="memberMsg" class="msg"></div>' +
        '</div>' +

        '<div class="admin-section">' +
          '<h2>Codes</h2>' +
          '<div class="admin-grid">' +
            '<div class="admin-card">' +
              '<h3>&#128081; Generate GM Code</h3>' +
              '<p>One-time code that lets a PC member upgrade their role to Game Master [GM]. They enter it on their Profile page.</p>' +
              '<button class="btn btn-gold btn-block" onclick="adminGenGmCode()">Generate GM Code</button>' +
              '<div id="gmCodeOut" class="output-box" style="margin-top:0.5rem;font-size:0.82rem;"></div>' +
            '</div>' +
            '<div class="admin-card">' +
              '<h3>&#128274; Generate Box Set Code</h3>' +
              '<p>Temporary code (GEN...BSC) for members who own a physical box set. They enter it in the Create Lobby form to host games.</p>' +
              '<button class="btn btn-gold btn-block" onclick="adminGenBoxCode()">Generate Box Set Code</button>' +
              '<div id="bscCodeOut" class="output-box" style="margin-top:0.5rem;font-size:0.82rem;"></div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="admin-section">' +
          '<h2>Change Role</h2>' +
          '<div class="admin-card" style="max-width:480px;">' +
            '<h3>Assign Role by UID or Username</h3>' +
            '<p>Upgrade or downgrade any member\'s role. ' + (isOwner ? 'All roles available.' : '<span style="color:#555;">Role assignment is Owner-only. You can view but not apply changes.</span>') + '</p>' +
            '<div style="position:relative;margin-bottom:0.6rem;">' +
              '<input type="text" id="changeRoleUid" class="admin-input" placeholder="Type username or UID..." autocomplete="off" oninput="liveRoleSearch(this.value)" style="width:100%;box-sizing:border-box;" />' +
              '<div id="roleSearchDropdown" style="display:none;position:absolute;top:100%;left:0;right:0;background:#1a1a1a;border:1px solid #444;border-radius:6px;z-index:100;max-height:200px;overflow-y:auto;"></div>' +
            '</div>' +
            '<div style="display:flex;gap:0.5rem;margin-bottom:0.6rem;flex-wrap:wrap;">' +
              '<select id="changeRoleSelect" class="admin-select" ' + (!isOwner ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : '') + '>' +
                '<option value="CIVILIAN">CIVILIAN</option>' +
                '<option value="PLAYER">PLAYER</option>' +
                '<option value="MASTER">MASTER</option>' +
                '<option value="ADMIN">ADMIN</option>' +
              '</select>' +
              '<button class="btn ' + (isOwner ? 'btn-gold' : 'btn-dark') + '" onclick="applyRoleById()" ' + (!isOwner ? 'disabled style="opacity:0.4;cursor:not-allowed;" title="Owner only"' : '') + '>Apply</button>' +
            '</div>' +
            '<div id="changeRoleMsg" class="msg"></div>' +
          '</div>' +
        '</div>' +

        '<div class="admin-section">' +
          '<h2>Warnings &amp; Actions <span class="coming-soon-tag">Coming Soon</span></h2>' +
          '<div class="admin-grid">' +
            '<div class="admin-card">' +
              '<h3>Issue Warning</h3>' +
              '<p>Send an official warning to a member. Warnings are logged to their account.</p>' +
              '<input type="text" id="warnUid" class="admin-input" placeholder="Member username or ID" style="width:100%;box-sizing:border-box;margin-bottom:6px;" />' +
              '<textarea id="warnReason" class="admin-input" rows="2" placeholder="Reason for warning..." style="width:100%;box-sizing:border-box;resize:none;"></textarea>' +
              '<button class="btn btn-gold btn-block" style="margin-top:6px;" onclick="issueWarning()">Issue Warning</button>' +
              '<div id="warnMsg" class="msg"></div>' +
            '</div>' +
            '<div class="admin-card">' +
              '<h3>Suspend Member</h3>' +
              '<p>Temporarily restrict a member\'s access. They can log in but cannot post or interact.</p>' +
              '<input type="text" id="suspendUid" class="admin-input" placeholder="Member username or ID" style="width:100%;box-sizing:border-box;margin-bottom:6px;" />' +
              '<select id="suspendDuration" class="admin-select" style="width:100%;margin-bottom:6px;">' +
                '<option value="1">1 day</option>' +
                '<option value="3">3 days</option>' +
                '<option value="7">7 days</option>' +
                '<option value="30">30 days</option>' +
              '</select>' +
              '<button class="btn btn-red btn-block" onclick="suspendMember()">Suspend</button>' +
              '<div id="suspendMsg" class="msg"></div>' +
            '</div>' +
            (isOwner
              ? '<div class="admin-card">' +
                  '<h3>Ban Member</h3>' +
                  '<p>Permanently ban a member from SORC. This action requires Owner authorization.</p>' +
                  '<input type="text" id="banUid" class="admin-input" placeholder="Member username or ID" style="width:100%;box-sizing:border-box;margin-bottom:6px;" />' +
                  '<input type="text" id="banReason" class="admin-input" placeholder="Reason for ban" style="width:100%;box-sizing:border-box;margin-bottom:6px;" />' +
                  '<button class="btn btn-red btn-block" onclick="banMember()">Ban Member</button>' +
                  '<div id="banMsg" class="msg"></div>' +
                '</div>'
              : '') +
          '</div>' +
        '</div>' +

        '<div class="admin-section">' +
          '<h2>Post Moderation</h2>' +
          '<div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;">' +
            '<input type="text" id="postIdInput" class="admin-input" placeholder="Post ID to remove..." style="max-width:300px;" />' +
            '<button class="btn btn-red" onclick="modDeletePost()">Remove Post</button>' +
          '</div>' +
          '<div id="postModMsg" class="msg"></div>' +
          '<p style="font-size:0.78rem;color:#444;">Post IDs are visible in the forum thread URLs. Removed posts are logged.</p>' +
        '</div>';
    }

    window.adminGenGmCode = async function() {
      var outEl = document.getElementById('gmCodeOut');
      if (!outEl) return;
      outEl.style.color = '#888'; outEl.textContent = 'Generating...';
      try {
        var res = await apiFetch('/api/gm-codes/generate', {
          method: 'POST',
          body: JSON.stringify({})
        });
        if (res.success) {
          outEl.style.color = '#4caf50';
          outEl.innerHTML = 'Code: <strong style="font-size:1rem;letter-spacing:0.1em;">' + escapeHtml(res.code) + '</strong>' +
            ' <button onclick="navigator.clipboard.writeText(\'' + escapeHtml(res.code) + '\').then(function(){document.getElementById(\'gmCodeOut\').textContent=\'Copied!\'})" ' +
            'style="padding:2px 8px;border:1px solid #4caf50;border-radius:4px;background:none;color:#4caf50;cursor:pointer;font-size:0.72rem;">Copy</button>' +
            '<div style="color:#555;font-size:0.72rem;margin-top:2px;">Expires: ' + escapeHtml(res.expires_at ? new Date(res.expires_at).toLocaleDateString() : '7 days') + '</div>';
        } else {
          outEl.style.color = '#c93f35'; outEl.textContent = res.error || 'Failed.';
        }
      } catch(e) { outEl.style.color = '#c93f35'; outEl.textContent = 'Connection error.'; }
    };

    window.adminGenBoxCode = async function() {
      var note = (document.getElementById('bscNote') || {}).value || '';
      var outEl = document.getElementById('bscCodeOut');
      if (!outEl) return;
      outEl.style.color = '#888'; outEl.textContent = 'Generating...';
      try {
        var res = await fetch(API_URL + '/api/box-codes/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Auth-Key': currentUser ? currentUser.authKey : '' },
          body: JSON.stringify({ note: note.trim() })
        });
        var data = await res.json();
        if (data.success) {
          outEl.style.color = '#4caf50';
          outEl.innerHTML = 'Code: <strong style="font-size:1rem;letter-spacing:0.1em;">' + escapeHtml(data.code) + '</strong>' +
            ' <button onclick="navigator.clipboard.writeText(\'' + escapeHtml(data.code) + '\').then(function(){document.getElementById(\'bscCodeOut\').textContent=\'Copied!\'})" ' +
            'style="padding:2px 8px;border:1px solid #4caf50;border-radius:4px;background:none;color:#4caf50;cursor:pointer;font-size:0.72rem;">Copy</button>' +
            '<div style="color:#555;font-size:0.72rem;margin-top:2px;">Expires: ' + escapeHtml(data.expires_at ? new Date(data.expires_at).toLocaleDateString() : '2 days') + '</div>';
        } else {
          outEl.style.color = '#c93f35'; outEl.textContent = data.error || 'Failed.';
        }
      } catch(e) { outEl.style.color = '#c93f35'; outEl.textContent = 'Connection error: ' + (e.message || e); }
    };

    window.loadModQueue = async function loadModQueue() {
      var queueEl = document.getElementById('modQueue');
      var badgeEl = document.getElementById('queueBadge');
      if (!queueEl) return;
      try {
        var data = await apiFetch('/api/admin/reports');
        var reports = data.reports || [];
        if (badgeEl) {
          badgeEl.className = reports.length ? 'queue-count' : '';
          badgeEl.textContent = reports.length ? reports.length + ' pending' : '';
        }
        if (!reports.length) {
          queueEl.innerHTML = '<div class="empty">No reports pending. ✅</div>';
          return;
        }
        queueEl.innerHTML = reports.map(function(r) {
          var isHigh = (r.report_count || 1) >= 3;
          var typeLabel = r.type === 'post' ? 'Post' : 'User';
          var typeClass = r.type === 'post' ? 'post' : 'user';
          return '<div class="report-card' + (isHigh ? ' high' : '') + '" id="rcard_' + escapeHtml(String(r.id)) + '">' +
            '<div class="report-meta">' +
              '<span class="rtype ' + typeClass + '">' + typeLabel + '</span>' +
              '<div class="rpreview">' + escapeHtml(r.target_preview || r.target_id || '') + '</div>' +
              '<div class="rdetail">Reported by ' + escapeHtml(r.reporter_name || 'Unknown') + ' · ' + escapeHtml(r.reason || '') + '</div>' +
            '</div>' +
            '<div class="report-count' + (isHigh ? ' high' : '') + '">' + (r.report_count || 1) + ' report' + ((r.report_count || 1) !== 1 ? 's' : '') + '</div>' +
            '<div class="report-actions">' +
              (r.type === 'post'
                ? '<button class="act-remove-post" onclick="removeReportedPost(\'' + escapeHtml(String(r.target_id)) + '\', \'' + escapeHtml(String(r.id)) + '\')">Remove Post</button>'
                : '<button class="act-suspend-user" onclick="quickSuspend(\'' + escapeHtml(String(r.target_id)) + '\')">Suspend</button>') +
              '<button class="act-dismiss" onclick="dismissReport(\'' + escapeHtml(String(r.id)) + '\')">Dismiss</button>' +
            '</div>' +
          '</div>';
        }).join('');
      } catch(e) {
        if (queueEl) queueEl.innerHTML = '<div class="empty">Could not load mod queue.</div>';
      }
    };

    window.dismissReport = async function(reportId) {
      try {
        var data = await apiFetch('/api/admin/reports/' + reportId + '/dismiss', { method: 'POST', body: '{}' });
        if (data.success) { loadModQueue(); }
        else { alert(data.error || 'Could not dismiss report.'); }
      } catch(e) { alert('Connection error.'); }
    };

    window.removeReportedPost = async function(postId, reportId) {
      if (!confirm('Remove this post?')) return;
      try {
        var res = await fetch(API_URL + '/api/forum/posts/' + postId + '/mod', {
          method: 'DELETE',
          headers: authHeaders()
        });
        var data = await res.json();
        if (data.success) { dismissReport(reportId); }
        else { alert(data.error || 'Could not remove post.'); }
      } catch(e) { alert('Connection error.'); }
    };

    window.loadAllMembers = async function() {
      var listEl = document.getElementById('memberList');
      listEl.innerHTML = '<div class="empty">Loading...</div>';
      try {
        var res = await fetch(API_URL + '/api/admin/members', { headers: authHeaders() });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        var members = data.members || [];
        members.sort(function(a, b) {
          var na = (a.display_name || a.username || '').toLowerCase();
          var nb = (b.display_name || b.username || '').toLowerCase();
          return na < nb ? -1 : na > nb ? 1 : 0;
        });
        renderMembers(members);
      } catch(e) {
        listEl.innerHTML = '<div class="empty">Could not load members. The /api/admin/members endpoint may not be available yet.</div>';
      }
    };

    window.searchMembers = async function() {
      var q = document.getElementById('memberSearch').value.trim();
      if (!q) { loadAllMembers(); return; }
      var listEl = document.getElementById('memberList');
      listEl.innerHTML = '<div class="empty">Searching...</div>';
      try {
        var data = await apiFetch('/api/admin/members?search=' + encodeURIComponent(q));
        renderMembers(data.members || []);
      } catch(e) {
        listEl.innerHTML = '<div class="empty">Search failed.</div>';
      }
    };

    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        var input = document.getElementById('memberSearch');
        if (input) input.addEventListener('keydown', function(e) { if (e.key === 'Enter') searchMembers(); });
      }, 500);
    });

    function renderMembers(members) {
      var listEl = document.getElementById('memberList');
      if (!members.length) { listEl.innerHTML = '<div class="empty">No members found.</div>'; return; }
      var isOwner = currentRole === 'OWNER';
      listEl.innerHTML = members.map(function(m) {
        var role = m.role || 'CIVILIAN';
        var uid = escapeHtml(String(m.id || m.user_id));
        var roleSelect =
          '<select class="admin-select role-select" id="rolesel_' + uid + '" ' +
            (isOwner ? 'onchange="document.getElementById(\'setbtn_' + uid + '\').disabled=false;document.getElementById(\'setbtn_' + uid + '\').style.opacity=\'1\';" ' : 'disabled title="Owner only" ') +
            'style="font-size:0.75rem;padding:4px 6px;' + (!isOwner ? 'opacity:0.35;cursor:not-allowed;' : '') + '">' +
            ['CIVILIAN','PLAYER','MASTER','ADMIN'].map(function(r) {
              return '<option value="' + r + '"' + (r === role ? ' selected' : '') + '>' + r + '</option>';
            }).join('') +
          '</select>' +
          (isOwner
            ? '<button class="act-role" id="setbtn_' + uid + '" onclick="applyRole(\'' + uid + '\')" disabled style="opacity:0.35;cursor:not-allowed;">Set</button>'
            : '<button class="act-role" disabled style="opacity:0.35;cursor:not-allowed;" title="Owner only">Set</button>');
        return '<div class="member-row">' +
          '<div class="member-row-info">' +
            '<div class="mname">' + escapeHtml(m.display_name || m.username) +
              ' <span class="role-pill role-' + role + '">' + role + '</span>' +
            '</div>' +
            '<div class="mdetail">' + escapeHtml(m.email || '') + ' · <span style="color:#b9aa00;font-weight:bold;">UID: ' + uid + '</span></div>' +
          '</div>' +
          '<div class="member-actions" style="align-items:center;">' +
            '<button class="act-warn" onclick="quickWarn(\'' + uid + '\')">Warn</button>' +
            '<button class="act-suspend" onclick="quickSuspend(\'' + uid + '\')">Suspend</button>' +
            (isOwner ? '<button class="act-ban" onclick="quickBan(\'' + uid + '\')">Ban</button>' : '') +
            roleSelect +
          '</div>' +
        '</div>';
      }).join('');
    }

    var _roleSearchTimer = null;
    window.liveRoleSearch = function(val) {
      var dropdown = document.getElementById('roleSearchDropdown');
      if (!dropdown) return;
      if (!val || val.trim().length < 2) { dropdown.style.display = 'none'; dropdown.innerHTML = ''; return; }
      clearTimeout(_roleSearchTimer);
      _roleSearchTimer = setTimeout(async function() {
        try {
          var data = await apiFetch('/api/admin/members?search=' + encodeURIComponent(val.trim()) + '&limit=8');
          var members = data.members || data.users || [];
          if (!members.length) { dropdown.style.display = 'none'; dropdown.innerHTML = ''; return; }
          dropdown.innerHTML = members.map(function(m) {
            var uid = m.user_id || m.id || '';
            var name = escapeHtml(m.display_name || m.username || '');
            var role = escapeHtml(m.role || 'CIVILIAN');
            return '<div class="role-search-item" tabindex="0" ' +
              'onclick="selectRoleSearchResult(\'' + escapeHtml(String(uid)) + '\',\'' + name + '\')" ' +
              'onkeydown="if(event.key===\'Enter\')selectRoleSearchResult(\'' + escapeHtml(String(uid)) + '\',\'' + name + '\')">' +
              '<span>' + name + ' <span style="font-size:0.72rem;color:#888;">[' + role + ']</span></span>' +
              '<span class="rs-uid">#' + escapeHtml(String(uid)) + '</span>' +
            '</div>';
          }).join('');
          dropdown.style.display = 'block';
        } catch(e) { dropdown.style.display = 'none'; }
      }, 250);
    };

    window.selectRoleSearchResult = function(uid, name) {
      var input = document.getElementById('changeRoleUid');
      var dropdown = document.getElementById('roleSearchDropdown');
      if (input) input.value = uid;
      if (dropdown) { dropdown.style.display = 'none'; dropdown.innerHTML = ''; }
    };

    document.addEventListener('click', function(e) {
      var dropdown = document.getElementById('roleSearchDropdown');
      var input = document.getElementById('changeRoleUid');
      if (dropdown && input && !input.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });

    window.quickWarn = function(uid) {
      document.getElementById('warnUid').value = uid;
      document.getElementById('warnUid').scrollIntoView({ behavior: 'smooth' });
    };
    window.quickSuspend = function(uid) {
      document.getElementById('suspendUid').value = uid;
      document.getElementById('suspendUid').scrollIntoView({ behavior: 'smooth' });
    };
    window.quickBan = function(uid) {
      var el = document.getElementById('banUid');
      if (el) { el.value = uid; el.scrollIntoView({ behavior: 'smooth' }); }
    };

    window.applyRoleById = async function() {
      var uid = document.getElementById('changeRoleUid').value.trim();
      var role = document.getElementById('changeRoleSelect').value;
      var msgEl = document.getElementById('changeRoleMsg');
      if (!uid) { msgEl.className = 'msg error'; msgEl.textContent = 'Enter a UID or username.'; return; }
      if (role === 'ADMIN') {
        if (!confirm('Send an Admin invitation to ' + uid + '? They will receive an inbox message and must accept to receive the role and 10,000 CP.')) return;
        try {
          var invData = await apiFetch('/api/admin/invitations', {
            method: 'POST',
            body: JSON.stringify({ uid: uid })
          });
          msgEl.className = 'msg ' + (invData.success ? 'success' : 'error');
          msgEl.textContent = invData.success ? '✅ Admin invitation sent. Awaiting acceptance.' : (invData.error || 'Failed to send invitation.');
          if (invData.success) sendAdminInvitation(uid);
        } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Network error: ' + (e.message || 'check connection'); }
        return;
      }
      if (role === 'MASTER') {
        if (!confirm('Send a GM invitation to ' + uid + '? They must accept on their profile page to receive the role.')) return;
        try {
          var gmInvData = await apiFetch('/api/gm/invitations', {
            method: 'POST',
            body: JSON.stringify({ uid: uid })
          });
          msgEl.className = 'msg ' + (gmInvData.success ? 'success' : 'error');
          msgEl.textContent = gmInvData.success ? '✅ GM invitation sent. They must accept on their profile.' : (gmInvData.error || 'Failed to send GM invitation.');
        } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Network error: ' + (e.message || 'check connection'); }
        return;
      }
      if (!confirm('Set role to ' + role + ' for ' + uid + '?')) return;
      try {
        var data = await apiFetch('/api/admin/members/' + uid + '/role', {
          method: 'PUT',
          body: JSON.stringify({ role: role })
        });
        msgEl.className = 'msg ' + (data.success ? 'success' : 'error');
        msgEl.textContent = data.success ? '✅ Role updated to ' + role + '.' : (data.error || 'Failed.');
        if (data.success) sendRoleChangeMessage(uid, role);
      } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Network error: ' + (e.message || 'check connection'); }
    };

    window.applyRole = async function(uid) {
      var sel = document.getElementById('rolesel_' + uid);
      if (!sel) return;
      var role = sel.value;
      var msgEl = document.getElementById('memberMsg');
      if (role === 'ADMIN') {
        if (!confirm('Send an Admin invitation to this member? They will receive an inbox message and must accept to receive the role and 10,000 CP.')) return;
        try {
          var invData = await apiFetch('/api/admin/invitations', {
            method: 'POST',
            body: JSON.stringify({ uid: uid })
          });
          msgEl.className = 'msg ' + (invData.success ? 'success' : 'error');
          msgEl.textContent = invData.success ? '✅ Admin invitation sent. Awaiting acceptance.' : (invData.error || 'Failed to send invitation.');
          if (invData.success) sendAdminInvitation(uid);
        } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.'; }
        return;
      }
      if (role === 'MASTER') {
        if (!confirm('Send a GM invitation to this member? They must accept on their profile page.')) return;
        try {
          var gmInv = await apiFetch('/api/gm/invitations', {
            method: 'POST',
            body: JSON.stringify({ uid: uid })
          });
          msgEl.className = 'msg ' + (gmInv.success ? 'success' : 'error');
          msgEl.textContent = gmInv.success ? '✅ GM invitation sent. Awaiting acceptance.' : (gmInv.error || 'Failed.');
        } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.'; }
        return;
      }
      if (!confirm('Set role to ' + role + '?')) return;
      try {
        var data = await apiFetch('/api/admin/members/' + uid + '/role', {
          method: 'PUT',
          body: JSON.stringify({ role: role })
        });
        msgEl.className = 'msg ' + (data.success ? 'success' : 'error');
        msgEl.textContent = data.success ? '✅ Role updated to ' + role + '.' : (data.error || 'Failed.');
        if (data.success) {
          sendRoleChangeMessage(uid, role);
          var btn = document.getElementById('setbtn_' + uid);
          if (btn) { btn.disabled = true; btn.style.opacity = '0.35'; btn.style.cursor = 'not-allowed'; }
          var q = document.getElementById('memberSearch') ? document.getElementById('memberSearch').value.trim() : '';
          if (q) searchMembers(); else loadAllMembers();
        }
      } catch(e) {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Network error: ' + (e.message || 'check connection');
      }
    };

    window.issueWarning = async function() {
      var uid = document.getElementById('warnUid').value.trim();
      var reason = document.getElementById('warnReason').value.trim();
      var msgEl = document.getElementById('warnMsg');
      if (!uid || !reason) { msgEl.className = 'msg error'; msgEl.textContent = 'Username/ID and reason required.'; return; }
      try {
        var data = await apiFetch('/api/admin/members/' + uid + '/warn', {
          method: 'POST',
          body: JSON.stringify({ reason: reason })
        });
        msgEl.className = 'msg ' + (data.success ? 'success' : 'error');
        msgEl.textContent = data.success ? '✅ Warning issued.' : (data.error || 'Failed.');
      } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.'; }
    };

    window.suspendMember = async function() {
      var uid = document.getElementById('suspendUid').value.trim();
      var days = document.getElementById('suspendDuration').value;
      var msgEl = document.getElementById('suspendMsg');
      if (!uid) { msgEl.className = 'msg error'; msgEl.textContent = 'Username or ID required.'; return; }
      try {
        var data = await apiFetch('/api/admin/members/' + uid + '/suspend', {
          method: 'POST',
          body: JSON.stringify({ days: parseInt(days) })
        });
        msgEl.className = 'msg ' + (data.success ? 'success' : 'error');
        msgEl.textContent = data.success ? '✅ Member suspended for ' + days + ' day(s).' : (data.error || 'Failed.');
      } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.'; }
    };

    window.banMember = async function() {
      var uid = document.getElementById('banUid') ? document.getElementById('banUid').value.trim() : '';
      var reason = document.getElementById('banReason') ? document.getElementById('banReason').value.trim() : '';
      var msgEl = document.getElementById('banMsg');
      if (!uid) { msgEl.className = 'msg error'; msgEl.textContent = 'Username or ID required.'; return; }
      if (!confirm('Permanently ban this member? This cannot be undone.')) return;
      try {
        var data = await apiFetch('/api/admin/members/' + uid + '/ban', {
          method: 'POST',
          body: JSON.stringify({ reason: reason })
        });
        msgEl.className = 'msg ' + (data.success ? 'success' : 'error');
        msgEl.textContent = data.success ? '✅ Member banned.' : (data.error || 'Failed.');
      } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.'; }
    };

    window.modDeletePost = async function() {
      var postId = document.getElementById('postIdInput').value.trim();
      var msgEl = document.getElementById('postModMsg');
      if (!postId) { msgEl.className = 'msg error'; msgEl.textContent = 'Post ID required.'; return; }
      try {
        var res = await fetch(API_URL + '/api/forum/posts/' + postId + '/mod', {
          method: 'DELETE',
          headers: authHeaders()
        });
        var data = await res.json();
        msgEl.className = 'msg ' + (data.success ? 'success' : 'error');
        msgEl.textContent = data.success ? '✅ Post removed.' : (data.error || 'Failed.');
      } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.'; }
    };
  </script>
  <script src="nav.js?v=2"></script>
  <script src="main.js?v=10"></script>
</body>
