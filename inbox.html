<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbox | Slayers of Rings § Crowns</title>
    <link rel="icon" href="IMG_3419.jpeg" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        body { background: #111; color: #e0cfc0; font-family: sans-serif; margin: 0; padding: 0; }
        .inbox-hero { background: linear-gradient(135deg, #1a0505, #2a0808, #111); padding: 2rem; border-bottom: 2px solid #d0021b; text-align: center; }
        .inbox-hero h1 { color: #d0021b; font-size: 1.8rem; margin-bottom: 0.25rem; }
        .inbox-hero p { color: #666; font-size: 0.85rem; }
        .inbox-container { max-width: 700px; margin: 0 auto; padding: 2rem 1rem; }
        .inbox-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .inbox-tab { padding: 8px 20px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #888; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: all 0.2s; }
        .inbox-tab.active { background: #d0021b; color: #fff; border-color: #d0021b; }
        .inbox-tab:hover { border-color: #d0021b; }
        .inbox-tab .badge { display: inline-block; background: #d4af37; color: #222; border-radius: 10px; padding: 1px 6px; font-size: 0.7rem; margin-left: 4px; }
        .conversation-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 0.5rem; cursor: pointer; transition: border-color 0.2s; display: flex; align-items: center; gap: 1rem; }
        .conversation-card:hover { border-color: #d0021b; }
        .conv-avatar { width: 44px; height: 44px; border-radius: 50%; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #888; border: 2px solid #333; flex-shrink: 0; }
        .conv-info { flex: 1; min-width: 0; }
        .conv-name { font-weight: bold; color: #e0cfc0; font-size: 0.95rem; }
        .conv-preview { font-size: 0.8rem; color: #555; margin-top: 2px; }
        .conv-meta { text-align: right; font-size: 0.75rem; color: #555; flex-shrink: 0; }
        .request-card { background: #1a1a1a; border: 1px solid #d4af37; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .request-info { flex: 1; }
        .request-name { font-weight: bold; color: #e0cfc0; font-size: 0.95rem; }
        .request-text { font-size: 0.8rem; color: #888; margin-top: 2px; }
        .request-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
        .btn { padding: 7px 16px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-red { background: #d0021b; color: #fff; }
        .btn-red:hover { background: #a50013; }
        .btn-grey { background: #333; color: #888; }
        .btn-grey:hover { background: #444; color: #e0cfc0; }
        .empty-state { text-align: center; padding: 3rem; color: #444; font-size: 0.9rem; }
        .conv-view { display: none; }
        .conv-view.active { display: block; }
        .inbox-list.hidden { display: none; }
        .conv-header { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem; }
        .conv-header-name { font-weight: bold; font-size: 1rem; color: #e0cfc0; }
        .message-thread { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 1rem; min-height: 300px; max-height: 450px; overflow-y: auto; margin-bottom: 1rem; }
        .message-bubble { margin-bottom: 0.75rem; display: flex; flex-direction: column; }
        .message-bubble.mine { align-items: flex-end; }
        .message-bubble.theirs { align-items: flex-start; }
        .bubble-author { font-size: 0.7rem; color: #555; margin-bottom: 2px; }
        .bubble-content { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 0.88rem; line-height: 1.5; }
        .mine .bubble-content { background: #d0021b; color: #fff; border-bottom-right-radius: 3px; }
        .theirs .bubble-content { background: #2a2a2a; color: #e0cfc0; border-bottom-left-radius: 3px; }
        .bubble-time { font-size: 0.7rem; color: #444; margin-top: 2px; }
        .message-input-row { display: flex; gap: 0.5rem; }
        .message-input-row input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #e0cfc0; font-size: 0.9rem; }
        .message-input-row input:focus { outline: none; border-color: #d0021b; }
        .message-input-row button { padding: 10px 20px; background: #d0021b; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .message-input-row button:hover { background: #a50013; }
        .not-logged-in { text-align: center; padding: 3rem; color: #555; }
        .not-logged-in a { color: #d4af37; }
    </style>
</head>
<body>
    <div class="inbox-hero">
        <h1>Inbox</h1>
        <p>Your messages and requests</p>
    </div>

    <div class="inbox-container">
        <div class="inbox-list" id="inboxList">
            <div class="inbox-tabs">
                <button class="inbox-tab active" id="tabMessages" onclick="switchTab('messages')">Messages</button>
                <button class="inbox-tab" id="tabRequests" onclick="switchTab('requests')">
                    Requests <span class="badge" id="requestsBadge" style="display:none;">0</span>
                </button>
            </div>
            <div id="messagesList"></div>
            <div id="requestsList" style="display:none;"></div>
        </div>

        <div class="conv-view" id="convView">
            <div style="margin-bottom:1rem;">
                <button class="btn btn-grey" onclick="backToInbox()" style="font-size:0.85rem;padding:6px 14px;">← Back to Inbox</button>
            </div>
            <div class="conv-header" id="convHeader"></div>
            <div class="message-thread" id="messageThread"></div>
            <div class="message-input-row">
                <input type="text" id="messageInput" placeholder="Write a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, orderBy, getDocs, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDu25MxYjeu-g6YjPjaOpfUSUw97yJj-Xg",
            authDomain: "sorc-a1393.firebaseapp.com",
            projectId: "sorc-a1393",
            storageBucket: "sorc-a1393.firebasestorage.app",
            messagingSenderId: "303646936307",
            appId: "1:303646936307:web:806bdcdc37c9e5c024bb86"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const OWNER_EMAILS = ["corbett@sorcrpg.com"];
        const ADMIN_EMAILS = ["markcorbett.mii@gmail.com"];

        var currentUser = null;
        var currentUserData = null;
        var googleUser = null;
        var currentConvId = null;
        var currentOtherUid = null;

        try { var s = localStorage.getItem('sorc_google_user'); if (s) googleUser = JSON.parse(s); } catch(e) {}

        function getMyUid() { return currentUser ? currentUser.uid : (googleUser ? googleUser.googleId : null); }
        function getMyEmail() { return currentUser ? currentUser.email : (googleUser ? googleUser.email : null); }
        function getMyUsername() {
            var data = currentUserData || {};
            return data.username || data.displayName || (getMyEmail() || '').split('@')[0];
        }

        function timeAgo(timestamp) {
            if (!timestamp) return '';
            var date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            var seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
            return Math.floor(seconds / 86400) + 'd ago';
        }

        function getRoleColor(role) {
            if (role === 'OWNER') return 'background:#d4af37;color:#222;';
            if (role === 'ADMIN') return 'background:#8B0000;color:#fff;';
            if (role === 'MASTER') return 'background:#1a6b1a;color:#fff;';
            if (role === 'PLAYER') return 'background:#1a3a6b;color:#fff;';
            return 'background:#333;color:#e0cfc0;';
        }
        function getRoleAbbr(role) {
            if (role === 'OWNER') return '[OWN]';
            if (role === 'ADMIN') return '[AD]';
            if (role === 'MASTER') return '[GM]';
            if (role === 'PLAYER') return '[PC]';
            return '[CIV]';
        }

        async function loadInbox() {
            var uid = getMyUid();
            if (!uid) {
                document.getElementById('inboxList').innerHTML = '<div class="not-logged-in"><p>Please <a href="signin.html">sign in</a> to view your inbox.</p></div>';
                return;
            }

            var snap1 = await getDocs(query(collection(db, "conversations"), where("senderUid", "==", uid)));
            var snap2 = await getDocs(query(collection(db, "conversations"), where("receiverUid", "==", uid)));

            var conversations = [];
            var seen = new Set();
            snap1.forEach(function(d) { if (!seen.has(d.id)) { seen.add(d.id); conversations.push({ id: d.id, ...d.data() }); } });
            snap2.forEach(function(d) { if (!seen.has(d.id)) { seen.add(d.id); conversations.push({ id: d.id, ...d.data() }); } });

            conversations.sort(function(a, b) {
                var aTime = a.lastMessageAt ? (a.lastMessageAt.toDate ? a.lastMessageAt.toDate() : new Date(a.lastMessageAt)) : new Date(0);
                var bTime = b.lastMessageAt ? (b.lastMessageAt.toDate ? b.lastMessageAt.toDate() : new Date(b.lastMessageAt)) : new Date(0);
                return bTime - aTime;
            });

            var accepted = conversations.filter(function(c) { return c.status === 'accepted'; });
            var pending = conversations.filter(function(c) { return c.status === 'pending' && c.receiverUid === uid; });

            var badge = document.getElementById('requestsBadge');
            if (pending.length > 0) {
                badge.textContent = pending.length;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }

            renderMessages(accepted, uid);
            renderRequests(pending);
        }

        function renderMessages(conversations, uid) {
            var el = document.getElementById('messagesList');
            if (conversations.length === 0) {
                el.innerHTML = '<div class="empty-state">No messages yet.<br/>Visit someone\'s profile to start a conversation.</div>';
                return;
            }
            el.innerHTML = conversations.map(function(conv) {
                var otherName = conv.senderUid === uid ? conv.receiverName : conv.senderName;
                var otherUid = conv.senderUid === uid ? conv.receiverUid : conv.senderUid;
                return '<div class="conversation-card" onclick="openConversation(\'' + conv.id + '\', \'' + otherName + '\', \'' + otherUid + '\')">' +
                    '<div class="conv-avatar">' + (otherName ? otherName.charAt(0).toUpperCase() : '?') + '</div>' +
                    '<div class="conv-info">' +
                        '<div class="conv-name">' + (otherName || 'Unknown') + '</div>' +
                        '<div class="conv-preview">' + timeAgo(conv.lastMessageAt) + '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function renderRequests(requests) {
            var el = document.getElementById('requestsList');
            if (requests.length === 0) {
                el.innerHTML = '<div class="empty-state">No pending message requests.</div>';
                return;
            }
            el.innerHTML = requests.map(function(req) {
                return '<div class="request-card">' +
                    '<div class="conv-avatar">' + (req.senderName ? req.senderName.charAt(0).toUpperCase() : '?') + '</div>' +
                    '<div class="request-info">' +
                        '<div class="request-name">' + (req.senderName || 'Unknown') + '</div>' +
                        '<div class="request-text">wants to send you a message</div>' +
                    '</div>' +
                    '<div class="request-actions">' +
                        '<button class="btn btn-red" onclick="acceptRequest(\'' + req.id + '\')">Accept</button>' +
                        '<button class="btn btn-grey" onclick="declineRequest(\'' + req.id + '\')">Decline</button>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        window.switchTab = function(tab) {
            document.getElementById('tabMessages').classList.toggle('active', tab === 'messages');
            document.getElementById('tabRequests').classList.toggle('active', tab === 'requests');
            document.getElementById('messagesList').style.display = tab === 'messages' ? 'block' : 'none';
            document.getElementById('requestsList').style.display = tab === 'requests' ? 'block' : 'none';
        };

        window.acceptRequest = async function(convId) {
            await updateDoc(doc(db, "conversations", convId), { status: 'accepted' });
            await loadInbox();
            // Open the conversation immediately after accepting
            var convDoc = await getDoc(doc(db, "conversations", convId));
            if (convDoc.exists()) {
                var conv = convDoc.data();
                var myUid = getMyUid();
                var otherName = conv.senderUid === myUid ? conv.receiverName : conv.senderName;
                var otherUid = conv.senderUid === myUid ? conv.receiverUid : conv.senderUid;
                openConversation(convId, otherName, otherUid);
            }
        };

        window.declineRequest = async function(convId) {
            await updateDoc(doc(db, "conversations", convId), { status: 'declined' });
            await loadInbox();
        };

        window.openConversation = async function(convId, otherName, otherUid) {
            currentConvId = convId;
            currentOtherUid = otherUid;

            document.getElementById('inboxList').classList.add('hidden');
            document.getElementById('convView').classList.add('active');

            var otherDoc = await getDoc(doc(db, "users", otherUid));
            var otherRole = 'CIVILIAN';
            if (otherDoc.exists()) {
                var otherEmail = otherDoc.data().email || '';
                otherRole = OWNER_EMAILS.includes(otherEmail) ? 'OWNER' : ADMIN_EMAILS.includes(otherEmail) ? 'ADMIN' : (otherDoc.data().role || 'CIVILIAN');
            }

            // Profile link has NO &msg=1 — goes straight to profile
            document.getElementById('convHeader').innerHTML =
                '<div class="conv-avatar">' + (otherName ? otherName.charAt(0).toUpperCase() : '?') + '</div>' +
                '<div>' +
                    '<div class="conv-header-name">' + otherName +
                        ' <span style="' + getRoleColor(otherRole) + 'padding:1px 6px;border-radius:4px;font-size:0.7rem;font-weight:bold;">' + getRoleAbbr(otherRole) + '</span>' +
                    '</div>' +
                    '<a href="public-profile.html?uid=' + otherUid + '" style="color:#d4af37;font-size:0.75rem;text-decoration:none;">View Profile</a>' +
                '</div>';

            await loadMessages(convId);
        };

        window.backToInbox = function() {
            currentConvId = null;
            document.getElementById('inboxList').classList.remove('hidden');
            document.getElementById('convView').classList.remove('active');
            loadInbox();
        };

        async function loadMessages(convId) {
            var q = query(collection(db, "conversations", convId, "messages"), orderBy("createdAt", "asc"));
            var snap = await getDocs(q);
            var myUid = getMyUid();
            var html = '';
            snap.forEach(function(d) {
                var msg = d.data();
                var isMine = msg.senderUid === myUid;
                html +=
                    '<div class="message-bubble ' + (isMine ? 'mine' : 'theirs') + '">' +
                        (!isMine ? '<div class="bubble-author">' + (msg.senderName || '') + '</div>' : '') +
                        '<div class="bubble-content">' + msg.text + '</div>' +
                        '<div class="bubble-time">' + timeAgo(msg.createdAt) + '</div>' +
                    '</div>';
            });
            var el = document.getElementById('messageThread');
            el.innerHTML = html || '<p style="color:#444;font-size:0.85rem;text-align:center;margin-top:2rem;">No messages yet. Say hello!</p>';
            el.scrollTop = el.scrollHeight;
        }

        window.sendMessage = async function() {
            var input = document.getElementById('messageInput');
            var text = input ? input.value.trim() : '';
            if (!text || !currentConvId) return;
            var myUid = getMyUid();
            await addDoc(collection(db, "conversations", currentConvId, "messages"), {
                senderUid: myUid,
                senderName: getMyUsername(),
                text: text,
                createdAt: serverTimestamp()
            });
            await updateDoc(doc(db, "conversations", currentConvId), {
                lastMessageAt: serverTimestamp(),
                lastMessageText: text
            });
            input.value = '';
            await loadMessages(currentConvId);
        };

        onAuthStateChanged(auth, async function(user) {
            if (user) {
                currentUser = user;
                var docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) currentUserData = docSnap.data();
            } else if (googleUser) {
                try {
                    var docSnap = await getDoc(doc(db, "users", googleUser.googleId));
                    if (docSnap.exists()) currentUserData = docSnap.data();
                } catch(e) {}
            }
            await loadInbox();
        });
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
