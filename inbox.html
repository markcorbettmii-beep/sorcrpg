<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbox | Slayers of Rings § Crowns</title>
    <link rel="icon" href="IMG_3419.jpeg" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        .inbox-container { max-width: 700px; margin: 0 auto; padding: 1rem; }
        .inbox-header { padding: 1.5rem 0 1rem 0; }
        .inbox-header h1 { color: #d0021b; font-size: 1.5rem; margin: 0 0 0.25rem 0; }
        .inbox-header p { color: #555; font-size: 0.85rem; margin: 0; }
        .inbox-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .inbox-tab { padding: 8px 16px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #888; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: all 0.2s; }
        .inbox-tab.active { background: #d0021b; color: #fff; border-color: #d0021b; }
        .inbox-tab:hover { border-color: #d0021b; }
        .inbox-tab .badge { display: inline-block; background: #d4af37; color: #222; border-radius: 10px; padding: 1px 6px; font-size: 0.7rem; margin-left: 4px; }
        .inbox-panel { display: none; }
        .inbox-panel.active { display: block; }
        .conversation-item { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 0.5rem; cursor: pointer; transition: border-color 0.2s; display: flex; align-items: center; gap: 1rem; }
        .conversation-item:hover { border-color: #d0021b; }
        .conv-avatar { width: 44px; height: 44px; border-radius: 50%; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #888; border: 2px solid #333; flex-shrink: 0; }
        .conv-info { flex: 1; min-width: 0; }
        .conv-name { font-weight: bold; color: #e0cfc0; font-size: 0.9rem; }
        .conv-preview { font-size: 0.78rem; color: #555; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-time { font-size: 0.72rem; color: #444; flex-shrink: 0; }
        .request-card { background: #1a1a2a; border: 1px solid #d4af37; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 0.5rem; }
        .request-card .req-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
        .request-card .req-avatar { width: 40px; height: 40px; border-radius: 50%; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: #888; border: 2px solid #d4af37; flex-shrink: 0; }
        .request-card .req-name { font-weight: bold; color: #e0cfc0; font-size: 0.9rem; }
        .request-card .req-text { font-size: 0.82rem; color: #888; margin-top: 2px; }
        .request-card .req-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
        .btn { padding: 8px 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .btn-accept { background: #1a6b1a; color: #fff; }
        .btn-accept:hover { background: #125012; }
        .btn-decline { background: #333; color: #888; }
        .btn-decline:hover { background: #444; color: #e0cfc0; }
        .btn-view { background: #1a3a6b; color: #fff; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-view:hover { background: #122a55; }
        .empty-state { text-align: center; padding: 3rem; color: #444; font-size: 0.9rem; line-height: 1.7; }
        .conversation-view { display: none; }
        .conversation-view.open { display: block; }
        .conv-view-header { display: flex; align-items: center; gap: 0.75rem; padding: 1rem 0; border-bottom: 1px solid #2a2a2a; margin-bottom: 1rem; }
        .back-btn { background: none; border: none; color: #d4af37; cursor: pointer; font-size: 0.85rem; font-weight: bold; padding: 0; }
        .back-btn:hover { text-decoration: underline; }
        .conv-view-name { font-weight: bold; color: #e0cfc0; font-size: 1rem; flex: 1; }
        .conv-view-link { font-size: 0.78rem; color: #d4af37; text-decoration: none; }
        .conv-view-link:hover { text-decoration: underline; }
        .messages-list { max-height: 420px; overflow-y: auto; padding: 0.5rem 0; margin-bottom: 1rem; }
        .message-bubble { margin-bottom: 0.75rem; display: flex; flex-direction: column; }
        .message-bubble.mine { align-items: flex-end; }
        .message-bubble.theirs { align-items: flex-start; }
        .bubble-inner { max-width: 75%; padding: 8px 14px; border-radius: 12px; font-size: 0.88rem; line-height: 1.5; word-break: break-word; }
        .message-bubble.mine .bubble-inner { background: #d0021b; color: #fff; border-bottom-right-radius: 3px; }
        .message-bubble.theirs .bubble-inner { background: #222; color: #e0cfc0; border-bottom-left-radius: 3px; }
        .bubble-sender { font-size: 0.7rem; color: #555; margin-bottom: 2px; }
        .msg-input-row { display: flex; gap: 0.5rem; }
        .msg-input-row input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #222; color: #e0cfc0; font-size: 0.9rem; }
        .msg-input-row input:focus { outline: none; border-color: #d0021b; }
        .msg-input-row button { padding: 10px 20px; background: #d0021b; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .msg-input-row button:hover { background: #a50013; }
        .not-logged-in { text-align: center; padding: 3rem; color: #555; }
        .not-logged-in a { color: #d4af37; }
        body.lawful-mode { background: #f5f5f0; color: #2c2c2c; }
        body.lawful-mode .inbox-tab { background: #f5f5f0; color: #2c2c2c; border-color: #ccc; }
        body.lawful-mode .conversation-item,
        body.lawful-mode .request-card { background: #fff; border-color: #e0e0e0; }
        body.lawful-mode .bubble-inner { background: #e0e0e0 !important; color: #2c2c2c !important; }
        body.lawful-mode .message-bubble.mine .bubble-inner { background: #d0021b !important; color: #fff !important; }
    </style>
</head>
<body>
  <div class="page-wrapper">
    <header class="header-container">
      <span class="sorc-letters">S O R C</span><img src="sorc-letters-evil.jpg" class="sorc-letters-img evil-only" alt="SORC" /><img src="sorc-letters-lawful.jpg" class="sorc-letters-img lawful-only" alt="SORC" />
    </header>
    <nav><div id="navRoleBadge"></div></nav>
    <div class="inbox-container">
        <div class="inbox-header">
            <h1>Inbox</h1>
            <p>Your messages and fellowship requests</p>
        </div>
        <div id="inboxApp"><div class="not-logged-in"><p>Loading...</p></div></div>
    </div>
    <div id="footer"></div>

    <script>
        var API_URL = 'https://api.sorcrpg.com';
        var myUser = null;
        var myUid = null;
        var myAuthKey = null;
        var activeConvId = null;
        var activeOtherUid = null;
        var activeOtherName = null;

        (function() {
            var saved = localStorage.getItem('sorc_user');
            if (saved) { try { myUser = JSON.parse(saved); } catch(e) {} }
            if (myUser && myUser.authKey) {
                myUid = myUser.id;
                myAuthKey = myUser.authKey;
            }
            var theme = localStorage.getItem('themeSelected') || 'evil';
            if (theme === 'lawful') document.body.classList.add('lawful-mode');
        })();

        function escapeHtml(str) {
            return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function timeAgo(ts) {
            if (!ts) return '';
            var d = new Date(ts);
            var s = Math.floor((Date.now() - d) / 1000);
            if (s < 60) return 'Just now';
            if (s < 3600) return Math.floor(s / 60) + 'm ago';
            if (s < 86400) return Math.floor(s / 3600) + 'h ago';
            return Math.floor(s / 86400) + 'd ago';
        }

        function authHeaders(withBody) {
            var h = { 'X-Auth-Key': myAuthKey };
            if (withBody) h['Content-Type'] = 'application/json';
            return h;
        }

        async function apiFetch(path, opts) {
            var hasBody = opts && opts.body;
            var res = await fetch(API_URL + path, Object.assign({ headers: authHeaders(hasBody) }, opts || {}));
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        function renderEmptyInbox() {
            document.getElementById('inboxApp').innerHTML =
                '<div class="inbox-tabs">'
                    + '<button class="inbox-tab active" id="tab_messages" onclick="switchTab(\'messages\')">Messages</button>'
                    + '<button class="inbox-tab" id="tab_requests" onclick="switchTab(\'requests\')">Fellowship Requests</button>'
                + '</div>'
                + '<div class="inbox-panel active" id="panel_messages"><div class="empty-state">No messages yet.<br/>Visit a member\'s profile to start a conversation.</div></div>'
                + '<div class="inbox-panel" id="panel_requests"><div class="empty-state">No pending Fellowship requests.</div></div>'
                + '<div class="conversation-view" id="convView"></div>';
        }

        async function init() {
            if (!myUid) {
                document.getElementById('inboxApp').innerHTML =
                    '<div class="not-logged-in"><p>Please <a href="signin.html">sign in</a> to view your inbox.</p></div>';
                return;
            }
            var params = new URLSearchParams(window.location.search);
            var toUid = params.get('to');
            try {
                await renderInbox();
            } catch(e) {
                renderEmptyInbox();
            }
            if (toUid) {
                try {
                    var res = await apiFetch('/api/conversations', {
                        method: 'POST',
                        body: JSON.stringify({ recipient_uid: toUid })
                    });
                    if (res.conversation_id) {
                        if (res.status === 'pending') {
                            var msgPanel = document.getElementById('panel_messages');
                            if (msgPanel) msgPanel.innerHTML = '<div class="empty-state" style="color:#d4af37;">✉️ Message request sent to ' + escapeHtml(res.other_name || 'Member') + '.<br/>They\'ll need to accept before you can chat.</div>';
                        } else {
                            var name = res.other_name || 'Member';
                            await openConversation(res.conversation_id, toUid, name);
                        }
                    } else if (res.error) {
                        var msgPanel = document.getElementById('panel_messages');
                        if (msgPanel) msgPanel.innerHTML = '<div class="empty-state" style="color:#d0021b;">' + escapeHtml(res.error) + '</div>';
                    }
                } catch(e) {}
            }
        }

        async function renderInbox() {
            var [convsData, fellowReqData, msgReqData] = await Promise.all([
                apiFetch('/api/conversations'),
                apiFetch('/api/fellowships/requests/incoming'),
                apiFetch('/api/conversations/requests')
            ]);
            var conversations = convsData.conversations || [];
            var fellowRequests = fellowReqData.requests || [];
            var msgRequests = msgReqData.requests || [];
            var reqCount = fellowRequests.length + msgRequests.length;

            document.getElementById('inboxApp').innerHTML =
                '<div class="inbox-tabs">'
                    + '<button class="inbox-tab active" id="tab_messages" onclick="switchTab(\'messages\')">Messages</button>'
                    + '<button class="inbox-tab" id="tab_requests" onclick="switchTab(\'requests\')">Requests' + (reqCount > 0 ? ' <span class="badge">' + reqCount + '</span>' : '') + '</button>'
                + '</div>'
                + '<div class="inbox-panel active" id="panel_messages"></div>'
                + '<div class="inbox-panel" id="panel_requests"></div>'
                + '<div class="conversation-view" id="convView"></div>';

            var msgPanel = document.getElementById('panel_messages');
            if (conversations.length === 0) {
                msgPanel.innerHTML = '<div class="empty-state">No messages yet.<br/>Visit a member\'s profile and tap Message to start a conversation.</div>';
            } else {
                msgPanel.innerHTML = conversations.map(function(conv) {
                    var otherUid = conv.user1_uid === myUid ? conv.user2_uid : conv.user1_uid;
                    var otherName = conv.user1_uid === myUid ? conv.user2_name : conv.user1_name;
                    return '<div class="conversation-item" onclick="openConversation(\'' + escapeHtml(conv.id) + '\', \'' + escapeHtml(otherUid) + '\', \'' + escapeHtml(otherName).replace(/'/g,"\\'") + '\')">' +
                        '<div class="conv-avatar">' + escapeHtml((otherName || '?').charAt(0).toUpperCase()) + '</div>' +
                        '<div class="conv-info">' +
                            '<div class="conv-name">' + escapeHtml(otherName || 'Unknown') + '</div>' +
                            '<div class="conv-preview">' + escapeHtml(conv.last_message_text || '...') + '</div>' +
                        '</div>' +
                        '<div class="conv-time">' + timeAgo(conv.last_message_at) + '</div>' +
                    '</div>';
                }).join('');
            }

            var reqPanel = document.getElementById('panel_requests');
            var reqHtml = '';

            if (msgRequests.length > 0) {
                reqHtml += '<div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:#555;margin:0.5rem 0 0.5rem 0.1rem;font-weight:bold;">Message Requests</div>';
                reqHtml += msgRequests.map(function(req) {
                    var senderName = req.user1_name;
                    return '<div class="request-card" id="mr_' + escapeHtml(req.id) + '">'
                        + '<div class="req-header">'
                            + '<div class="req-avatar">✉️</div>'
                            + '<div>'
                                + '<div class="req-name">' + escapeHtml(senderName) + '</div>'
                                + '<div class="req-text">wants to send you a message</div>'
                            + '</div>'
                        + '</div>'
                        + '<div class="req-actions">'
                            + '<button class="btn btn-accept" onclick="acceptMessage(\'' + escapeHtml(req.id) + '\', \'' + escapeHtml(req.user1_uid) + '\', \'' + escapeHtml(senderName).replace(/'/g,"\\'") + '\')">✅ Accept</button>'
                            + '<button class="btn btn-decline" onclick="declineMessage(\'' + escapeHtml(req.id) + '\')">Decline</button>'
                            + '<a href="public-profile.html?uid=' + escapeHtml(req.user1_uid) + '" class="btn btn-view">👤 Profile</a>'
                        + '</div>'
                    + '</div>';
                }).join('');
            }

            if (fellowRequests.length > 0) {
                reqHtml += '<div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:#555;margin:0.75rem 0 0.5rem 0.1rem;font-weight:bold;">Fellowship Requests</div>';
                reqHtml += fellowRequests.map(function(req) {
                    return '<div class="request-card" id="fr_' + escapeHtml(req.id) + '">'
                        + '<div class="req-header">'
                            + '<div class="req-avatar">⚔️</div>'
                            + '<div>'
                                + '<div class="req-name">' + escapeHtml(req.sender_name) + '</div>'
                                + '<div class="req-text">wants to be your Fellow</div>'
                            + '</div>'
                        + '</div>'
                        + '<div class="req-actions">'
                            + '<button class="btn btn-accept" onclick="acceptFellowship(\'' + escapeHtml(req.id) + '\')">✅ Accept</button>'
                            + '<button class="btn btn-decline" onclick="declineFellowship(\'' + escapeHtml(req.id) + '\')">Decline</button>'
                            + '<a href="public-profile.html?uid=' + escapeHtml(req.sender_uid) + '" class="btn btn-view">👤 Profile</a>'
                        + '</div>'
                    + '</div>';
                }).join('');
            }

            reqPanel.innerHTML = reqHtml || '<div class="empty-state">No pending requests.</div>';
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('.inbox-tab').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.inbox-panel').forEach(function(p) { p.classList.remove('active'); });
            document.getElementById('tab_' + tab).classList.add('active');
            document.getElementById('panel_' + tab).classList.add('active');
            document.getElementById('convView').classList.remove('open');
        };

        window.openConversation = async function(convId, otherUid, otherName) {
            activeConvId = convId;
            activeOtherUid = otherUid;
            activeOtherName = otherName;

            document.querySelector('.inbox-tabs').style.display = 'none';
            document.querySelectorAll('.inbox-panel').forEach(function(p) { p.style.display = 'none'; });
            var convView = document.getElementById('convView');
            convView.classList.add('open');
            convView.innerHTML =
                '<div class="conv-view-header">'
                    + '<button class="back-btn" onclick="closeConversation()">← Back</button>'
                    + '<div class="conv-view-name">' + escapeHtml(otherName) + '</div>'
                    + '<a href="public-profile.html?uid=' + escapeHtml(otherUid) + '" class="conv-view-link">View Profile</a>'
                + '</div>'
                + '<div class="messages-list" id="messagesList"><p style="color:#555;text-align:center;">Loading...</p></div>'
                + '<div class="msg-input-row">'
                    + '<input type="text" id="msgInput" placeholder="Write a message..." autocomplete="off" />'
                    + '<button onclick="sendMessage()">Send</button>'
                + '</div>';

            document.getElementById('msgInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') sendMessage();
            });

            await loadMessages();
        };

        async function loadMessages() {
            var data = await apiFetch('/api/conversations/' + activeConvId);
            var messages = data.messages || [];
            var listEl = document.getElementById('messagesList');
            if (!listEl) return;
            if (messages.length === 0) {
                listEl.innerHTML = '<div style="text-align:center;color:#444;font-size:0.85rem;padding:1rem;">No messages yet.</div>';
            } else {
                listEl.innerHTML = messages.map(function(msg) {
                    var isMine = msg.sender_uid === myUid;
                    return '<div class="message-bubble ' + (isMine ? 'mine' : 'theirs') + '">'
                        + (!isMine ? '<div class="bubble-sender">' + escapeHtml(msg.sender_name) + '</div>' : '')
                        + '<div class="bubble-inner">' + escapeHtml(msg.body) + '</div>'
                    + '</div>';
                }).join('');
                listEl.scrollTop = listEl.scrollHeight;
            }
        }

        window.closeConversation = function() {
            activeConvId = null;
            document.querySelector('.inbox-tabs').style.display = '';
            document.querySelectorAll('.inbox-panel').forEach(function(p) { p.style.display = ''; });
            document.getElementById('convView').classList.remove('open');
            document.getElementById('panel_messages').classList.add('active');
            document.getElementById('tab_messages').classList.add('active');
        };

        window.sendMessage = async function() {
            var input = document.getElementById('msgInput');
            var body = input ? input.value.trim() : '';
            if (!body) return;
            input.value = '';
            await apiFetch('/api/conversations/' + activeConvId + '/messages', {
                method: 'POST',
                body: JSON.stringify({ body: body })
            });
            await loadMessages();
        };

        window.acceptMessage = async function(id, otherUid, otherName) {
            await apiFetch('/api/conversations/' + id + '/accept', { method: 'POST', body: '{}' });
            await renderInbox();
            await openConversation(id, otherUid, otherName);
        };

        window.declineMessage = async function(id) {
            await apiFetch('/api/conversations/' + id + '/decline', { method: 'POST', body: '{}' });
            await renderInbox();
        };

        window.acceptFellowship = async function(id) {
            await apiFetch('/api/fellowships/' + id + '/accept', { method: 'POST', body: '{}' });
            await renderInbox();
        };

        window.declineFellowship = async function(id) {
            await apiFetch('/api/fellowships/' + id + '/decline', { method: 'POST', body: '{}' });
            await renderInbox();
        };

        init();
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
