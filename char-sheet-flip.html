<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=900, initial-scale=1.0" />
  <title>SORC Character Sheet</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; margin: 0; }
    body { display: flex; flex-direction: column; align-items: stretch; }

    .sheet-viewport {
      min-width: 900px;
      min-height: 1200px;
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }
    @media (max-width: 800px) {
      .sheet-viewport {
        min-width: 360px;
        min-height: 540px;
      }
    }

    .scale-wrap { width: 816px; height: 1056px; transform-origin: top center; flex-shrink: 0; }
    .flip-indicator {
      height: 30px; display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif; font-size: 0.6rem; font-weight: 700;
      color: #555; letter-spacing: 0.16em; text-transform: uppercase;
      flex-shrink: 0; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .flipper { width: 816px; height: 1056px; position: relative; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    .face { position: absolute; inset: 0; background: #f2ece0; overflow: hidden; cursor: pointer; }
    .face.back { display: none; }

    .inner { position: relative; z-index: 1; padding: 24px 42px 24px; height: 100%; display: flex; flex-direction: column; }

    /* Example fields and styling */
    .field-label { font-family: 'Cinzel', serif; font-size: 0.9rem; font-weight: 700; color: #2e3d0f; margin-bottom: 4px; }
    .field-input { width: 95%; font-size: 1.1rem; padding: 4px 8px; margin-bottom: 12px; border: 1px solid #aaa; border-radius: 4px; background: #f9f7ef; }
    .section-title { font-family: 'Cinzel Decorative', serif; font-size: 1.5rem; color: #354f1e; margin: 18px 0 10px 0; text-align: center; }

    .action-bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: #f5f0e4; border-top: 1.5px solid #4a5a20; z-index: 2000;
      display: flex; align-items: center; justify-content: center; gap: 1.5em;
      padding: 0.7em 0 0.7em 0;
    }
    .action-bar button, .action-bar .ptab {
      font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 700;
      background: #354f1e; color: #f6f0e1; border: none; border-radius: 7px;
      padding: 8px 20px; margin: 0 0.2em; cursor: pointer;
      transition: background 0.2s;
    }
    .action-bar button:hover, .action-bar .ptab.active { background: #4a5a20; }
    .print-group { margin: 0 1.2em 0 1.2em; }
    .print-note { display: block; }
    @media print {
      @page { size: 8.5in 11in; margin: 0; }
      html, body { overflow: visible !important; height: auto !important; background: white !important; }
      .action-bar, .flip-indicator, .print-note { display: none !important; }
      .sheet-viewport { display: block !important; overflow: visible !important; height: auto !important; }
      .scale-wrap { transform: none !important; width: 8.5in !important; height: auto !important; margin: 0 !important; }
    }
  </style>
</head>
<body>

<div class="flip-indicator" id="flipIndicator">Tap sheet to flip &rarr; Back</div>
<div style="text-align:center;color:#888;font-size:0.85rem;margin-bottom:6px;" class="print-note">
  <em>
    This sheet will automatically scale to fit your screen.<br>
    When printed, it will use full quality and exact page size.
  </em>
</div>
<div class="sheet-viewport">
  <div class="scale-wrap" id="scaleWrap">
    <div class="flipper" id="flipper">

      <!-- FRONT FACE -->
      <div class="face" id="front">
        <div class="inner">
          <div class="section-title">Character Sheet (Front)</div>
          <label class="field-label" for="cname">Name</label>
          <input class="field-input" id="cname" type="text" value="Elanor Swiftbow">

          <label class="field-label" for="cclass">Class & Level</label>
          <input class="field-input" id="cclass" type="text" value="Elf Ranger • 4">

          <label class="field-label" for="cbackground">Background</label>
          <input class="field-input" id="cbackground" type="text" value="Wanderer">

          <div class="section-title">Abilities</div>
          <label class="field-label" for="cstrength">Strength</label>
          <input class="field-input" id="cstrength" type="text" value="14">

          <label class="field-label" for="cdexterity">Dexterity</label>
          <input class="field-input" id="cdexterity" type="text" value="17">

          <label class="field-label" for="cconstitution">Constitution</label>
          <input class="field-input" id="cconstitution" type="text" value="12">

          <label class="field-label" for="cintelligence">Intelligence</label>
          <input class="field-input" id="cintelligence" type="text" value="11">

          <label class="field-label" for="cwisdom">Wisdom</label>
          <input class="field-input" id="cwisdom" type="text" value="13">

          <label class="field-label" for="ccharisma">Charisma</label>
          <input class="field-input" id="ccharisma" type="text" value="15">
        </div>
      </div>

      <!-- BACK FACE -->
      <div class="face back" id="back">
        <div class="inner">
          <div class="section-title">Character Sheet (Back)</div>
          <label class="field-label" for="cequipment">Equipment</label>
          <input class="field-input" id="cequipment" type="text" value="Longbow, Leather Armor, Rations">

          <label class="field-label" for="cnotes">Notes</label>
          <input class="field-input" id="cnotes" type="text" value="Has a pet hawk named Fenris.">

          <label class="field-label" for="cspells">Spells</label>
          <input class="field-input" id="cspells" type="text" value="Speak with Animals, Cure Wounds">

          <label class="field-label" for="callies">Allies</label>
          <input class="field-input" id="callies" type="text" value="Thorin, Mira, Fenris">
        </div>
      </div>

    </div>
  </div>
</div>

<div class="action-bar">
  <button id="saveJpegBtn">Save as JPEG</button>
  <div class="print-group">
    <button class="ptab active" data-side="front">Front</button>
    <button class="ptab" data-side="back">Back</button>
    <button class="ptab" data-side="both">Both</button>
  </div>
  <button id="printBtn">Print</button>
</div>

<script>
  // scaling
  function scaleToFit() {
    var wrap = document.getElementById('scaleWrap');
    var vp = document.querySelector('.sheet-viewport');
    var vw = vp.clientWidth  || window.innerWidth;
    var vh = vp.clientHeight || (window.innerHeight - 76);
    var wScale = (vw / 816) * 0.97;
    var hScale = (vh / 1056) * 0.97;
    var scale  = Math.min(wScale, hScale);
    wrap.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', scaleToFit);
  window.addEventListener('orientationchange', scaleToFit);
  document.addEventListener('DOMContentLoaded', scaleToFit);

  // flip logic
  (function(){
    var flipper = document.getElementById('flipper');
    var front = document.getElementById('front');
    var back = document.getElementById('back');
    var flipIndicator = document.getElementById('flipIndicator');
    var showingFront = true;
    function flip() {
      if(showingFront) {
        front.style.display = "none";
        back.style.display = "block";
        flipIndicator.innerHTML = "Tap sheet to flip &rarr; Front";
      } else {
        front.style.display = "block";
        back.style.display = "none";
        flipIndicator.innerHTML = "Tap sheet to flip &rarr; Back";
      }
      showingFront = !showingFront;
    }
    flipper.addEventListener('click', flip);
    flipIndicator.addEventListener('click', flip);
  })();

  // Print and tab logic
  document.querySelectorAll('.ptab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.ptab').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var side = btn.getAttribute('data-side');
      var front = document.getElementById('front');
      var back = document.getElementById('back');
      if(side === 'front') {
        front.style.display = "block";
        back.style.display = "none";
      } else if(side === 'back') {
        front.style.display = "none";
        back.style.display = "block";
      } else {
        front.style.display = "block";
        back.style.display = "block";
      }
    });
  });
  document.getElementById('printBtn').addEventListener('click', function() {
    window.print();
  });

  // Save as JPEG using html2canvas
  document.getElementById('saveJpegBtn').addEventListener('click', function() {
    var node = document.getElementById('scaleWrap');
    html2canvas(node, {backgroundColor: "#f2ece0"}).then(function(canvas) {
      var link = document.createElement('a');
      link.download = 'character-sheet.jpg';
      link.href = canvas.toDataURL("image/jpeg");
      link.click();
    });
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
