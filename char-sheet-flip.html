<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=900, initial-scale=1.0" />
  <title>SORC Character Sheet</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; margin: 0; }
    body { display: flex; flex-direction: column; align-items: stretch; }

    .sheet-viewport {
      min-width: 900px;
      min-height: 1200px;
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }
    @media (max-width: 800px) {
      .sheet-viewport {
        min-width: 360px;
        min-height: 540px;
      }
    }

    .scale-wrap { width: 816px; height: 1056px; transform-origin: top center; flex-shrink: 0; }
    .flip-indicator {
      height: 30px; display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif; font-size: 0.6rem; font-weight: 700;
      color: #555; letter-spacing: 0.16em; text-transform: uppercase;
      flex-shrink: 0; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .flipper { width: 816px; height: 1056px; position: relative; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    .face { position: absolute; inset: 0; background: #f2ece0; overflow: hidden; cursor: pointer; }
    .face.back { display: none; }
    .border-frame { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    .border-frame::before { content: ''; position: absolute; inset: 7px; border: 2.5px solid #3a4a18; }
    .border-frame::after { content: ''; position: absolute; inset: 13px; border: 1px solid #3a4a18; }
    .corner { position: absolute; width: 40px; height: 40px; z-index: 12; pointer-events: none; }
    .corner svg { width: 100%; height: 100%; }
    .corner.tl { top: 0; left: 0; }
    .corner.tr { top: 0; right: 0; transform: scaleX(-1); }
    .corner.bl { bottom: 0; left: 0; transform: scaleY(-1); }
    .corner.br { bottom: 0; right: 0; transform: scale(-1,-1); }
    .wm { display: none; }
    .inner { position: relative; z-index: 1; padding: 14px 42px 14px; height: 100%; display: flex; flex-direction: column; }
    .title-block { text-align: center; margin-bottom: 8px; }
    .title-block h1 {
      font-family: 'Cinzel Decorative', Cinzel, serif; font-size: 1.75rem;
      color: #2e3d0f; font-weight: 900; letter-spacing: 0.03em; line-height: 1.15;
    }
    .title-block h2 {
      font-family: 'Cinzel', serif; font-size: 0.78rem; color: #2e3d0f;
      font-weight: 700; letter-spacing: 0.22em; margin-top: 4px;
    }
    .title-block .sub {
      font-family: Arial, sans-serif; font-size: 0.64rem; color: #444; margin-top: 5px; font-style: italic;
    }
    .rule { border: none; border-top: 1.5px solid #4a5a20; margin: 8px 0; opacity: 0.4; }
    .cols { display: grid; grid-template-columns: 1fr 1.12fr 1fr; gap: 16px; margin-top: 6px; align-content: start; overflow: hidden; }
    .sec { margin-bottom: 14px; }
    .sec-title {
      font-family: 'Cinzel', serif; font-size: 0.6rem; font-weight: 700;
      color: #2e3d0f; letter-spacing: 0.16em; text-transform: uppercase;
      text-align: center; border-bottom: 1px solid #4a5a20; padding-bottom: 3px; margin-bottom: 7px;
    }
    .field { margin-bottom: 5px; display: flex; align-items: center; }
    .field-lbl {
      font-family: Arial, sans-serif; font-size: 0.6rem; color: #444; display: block; margin-bottom: 1px;
    }
    .field-lbl.sm { font-size: 0.55rem; }
    .fline {
      width: 100%; height: 1px; background: #6a7a48; margin-bottom: 2px;
    }
    .col-mid { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .portrait { width: 100%; aspect-ratio: 3/4; border: 1.5px solid #4a5a20; background: #e5ddc8; display: flex; align-items: center; justify-content: center; }
    .portrait span { font-family: 'Cinzel', serif; font-size: 0.55rem; color: #999; letter-spacing: 0.14em; text-transform: uppercase; }
    .mid-label { font-family: 'Cinzel', serif; font-size: 0.7rem; font-weight: 700; color: #2e3d0f; letter-spacing: 0.18em; text-transform: uppercase; text-align: center; width: 100%; }
    .mid-line { width: 88%; height: 1px; background: #4a5a20; margin: 3px auto 0; }
    .bp-sub { font-family: 'Cinzel', serif; font-size: 0.54rem; font-weight: 700; color: #4a5a20; letter-spacing: 0.1em; text-transform: uppercase; margin: 6px 0 2px; }
    .chips-lbl { font-family: Arial, sans-serif; font-size: 0.46rem; color: #666; flex-shrink: 0; white-space: nowrap; margin-left: 3px; }
    .cards-wrap { margin-top: 8px; }
    .cards-head { font-family: 'Cinzel', serif; font-size: 0.66rem; font-weight: 700; color: #2e3d0f; letter-spacing: 0.2em; text-transform: uppercase; text-align: center; margin-bottom: 8px; }
    .cards-main-row { display: flex; gap: 8px; align-items: stretch; }
    .cards-center { flex: 1; }
    .cards-side { width: 82px; flex-shrink: 0; display: flex; flex-direction: column; }
    .cards-side-title { font-family: 'Cinzel', serif; font-size: 0.5rem; font-weight: 700; color: #2e3d0f; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; border-bottom: 1px solid #4a5a20; padding-bottom: 3px; margin-bottom: 5px; }
    .cards-side .fline { margin-bottom: 7px; }
    .cards-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px 8px; }
    .card-tpl { border: 1px solid #4a5a20; display: flex; flex-direction: column; }
    .card-tpl-hdr { background: #2e3d0f; color: #e8dfc0; font-family: 'Cinzel', serif; font-size: 0.46rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; padding: 2px 2px; }
    .card-tpl-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0 4px; padding: 5px 5px 4px; }
    .card-tpl-body.single { grid-template-columns: 1fr; }
    .card-tpl-pending { font-family: 'Cinzel', serif; font-size: 0.44rem; color: #888; text-align: center; padding: 10px 4px; font-style: italic; letter-spacing: 0.08em; }
    .cf { margin-bottom: 4px; }
    .cl { font-family: Arial, sans-serif; font-size: 0.44rem; color: #555; display: block; margin-bottom: 1px; line-height: 1.1; }
    .cf .fline { margin-bottom: 0; }

    .attr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .abox { border: 1px solid #4a5a20; background: #e8e0cc; display: flex; flex-direction: row; align-items: center; padding: 3px 2px 3px; gap: 2px; }
    .abox.wide { grid-column: span 2; }
    .aname { font-family: 'Cinzel', serif; font-size: 0.52rem; font-weight: 700; color: #2e3d0f; letter-spacing: 0.08em; }

    .afield, .vfield, .sfield, .tfield, .repo-field {
      border: 1px solid #4a5a20;
      background: #f5f0e4;
      text-align: center;
      font-size: 0.78rem;
      color: #222;
      margin-left: 4px;
      box-sizing: border-box;
      padding: 0 2px;
    }
    .afield { width: 28px; height: 16px; }
    .vfield { width: 100%; height: 18px; }
    .sfield { width: 36px; height: 13px; }
    .sfield.wide { width: 62px; }
    .tfield { width: 24px; height: 12px; }
    .repo-field { width: 22px; height: 12px; }

    .trait-list { list-style: none; padding: 0; }
    .trait-list li {
      display: flex; justify-content: space-between; align-items: center;
      font-family: Arial, sans-serif; font-size: 0.6rem; color: #222;
      padding: 2.5px 0; border-bottom: 1px dotted #ccc;
    }

    .vit-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .vbox { display: flex; flex-direction: row; align-items: center; gap: 2px; }
    .vname { font-family: 'Cinzel', serif; font-size: 0.5rem; font-weight: 700; color: #2e3d0f; letter-spacing: 0.06em; }

    .srow { display: flex; justify-content: space-between; align-items: center; font-family: Arial, sans-serif; font-size: 0.6rem; color: #222; padding: 3px 0; border-bottom: 1px dotted #bbb; }

    .repo-tbl { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; font-size: 0.46rem; margin-top: 4px; }
    .repo-tbl th { font-family: 'Cinzel', serif; font-size: 0.42rem; color: #2e3d0f; padding: 2px 3px; border-bottom: 1px solid #4a5a20; text-align: left; }
    .repo-tbl td { padding: 2px 3px; color: #2e3d0f; border-bottom: 1px dotted #ccc; vertical-align: middle; }
    .repo-pts { display: flex; gap: 2px; }
    .repo-pt { width: 8px; height: 8px; border: 1px solid #4a5a20; background: #f5f0e4; flex-shrink: 0; }

    .xp-bar { border: 1px solid #4a5a20; height: 8px; background: #f5f0e4; margin-top: 3px; overflow: hidden; }
    .xp-fill { height: 100%; width: 0; background: #5a7a28; }
    @media print {
      @page { size: 8.5in 11in; margin: 0; }
      html, body { overflow: visible !important; height: auto !important; background: white !important; }
      .action-bar, .flip-indicator, .print-note { display: none !important; }
      .sheet-viewport { display: block !important; overflow: visible !important; height: auto !important; }
      .scale-wrap { transform: none !important; width: 8.5in !important; height: auto !important; margin: 0 !important; }
    }
  </style>
</head>
<body>

<div class="flip-indicator" id="flipIndicator">Tap sheet to flip &rarr; Back</div>
<div style="text-align:center;color:#888;font-size:0.85rem;margin-bottom:6px;" class="print-note">
  <em>
    This sheet will automatically scale to fit your screen.<br>
    When printed, it will use full quality and exact page size.
  </em>
</div>
<div class="sheet-viewport">
  <div class="scale-wrap" id="scaleWrap">
    <div class="flipper" id="flipper">

      <!-- corner SVG shorthand -->
      <svg style="display:none"><defs>
        <g id="csym"><circle cx="20" cy="20" r="13" fill="none" stroke="#3a4a18" stroke-width="1.4"/><circle cx="20" cy="20" r="6.5" fill="none" stroke="#3a4a18" stroke-width="1"/><circle cx="20" cy="20" r="2.2" fill="#3a4a18"/><line x1="7" y1="20" x2="0" y2="20" stroke="#3a4a18" stroke-width="1.4"/><line x1="20" y1="7" x2="20" y2="0" stroke="#3a4a18" stroke-width="1.4"/><path d="M7,7 Q20,13 33,7" fill="none" stroke="#3a4a18" stroke-width="0.9"/><path d="M7,7 Q13,20 7,33" fill="none" stroke="#3a4a18" stroke-width="0.9"/></g>
      </defs></svg>

      <!-- FRONT FACE -->
      <div class="face" id="front">
        <!-- [front face content goes here, see previous long code block for all the fields and layout] -->
        <!-- ... -->
      </div>

      <!-- BACK FACE -->
      <div class="face back" id="back">
        <!-- [back face content goes here, see previous long code block for all the fields and layout] -->
        <!-- ... -->
      </div>
    </div>
  </div>
</div>

<div class="action-bar">
  <button id="saveJpegBtn">Save as JPEG</button>
  <div class="print-group">
    <button class="ptab active" data-side="front">Front</button>
    <button class="ptab" data-side="back">Back</button>
    <button class="ptab" data-side="both">Both</button>
  </div>
  <button id="printBtn">Print</button>
</div>

<script>
  // Your flipping, scaling, printing JS goes here (unchanged)
  function scaleToFit() {
    var wrap = document.getElementById('scaleWrap');
    var vp = document.querySelector('.sheet-viewport');
    var vw = vp.clientWidth  || window.innerWidth;
    var vh = vp.clientHeight || (window.innerHeight - 76);
    var wScale = (vw / 816) * 0.97;
    var hScale = (vh / 1056) * 0.97;
    var scale  = Math.min(wScale, hScale);
    wrap.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', scaleToFit);
  window.addEventListener('orientationchange', scaleToFit);
  document.addEventListener('DOMContentLoaded', scaleToFit);

  // Flip logic
  (function(){
    var flipper = document.getElementById('flipper');
    var front = document.getElementById('front');
    var back = document.getElementById('back');
    var flipIndicator = document.getElementById('flipIndicator');
    var showingFront = true;
    function flip() {
      if(showingFront) {
        front.style.display = "none";
        back.style.display = "block";
        flipIndicator.innerHTML = "Tap sheet to flip &rarr; Front";
      } else {
        front.style.display = "block";
        back.style.display = "none";
        flipIndicator.innerHTML = "Tap sheet to flip &rarr; Back";
      }
      showingFront = !showingFront;
    }
    flipper.addEventListener('click', flip);
    flipIndicator.addEventListener('click', flip);
  })();

  // Load portrait from character customizer if present
  (function() {
    var portrait = localStorage.getItem('sorc_portrait');
    if (portrait) {
      var box = document.getElementById('portraitBox');
      if (box) {
        box.innerHTML = '';
        var img = document.createElement('img');
        img.src = portrait;
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
        box.appendChild(img);
        localStorage.removeItem('sorc_portrait');
      }
    }
  })();
</script>
</body>
</html>
