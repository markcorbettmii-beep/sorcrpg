<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Character Sheet (Flip)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body {
      background: #111;
      font-family: 'Cinzel', serif;
      margin: 0;
      padding: 0;
    }
    .flip-container {
      width: 740px;
      margin: 40px auto 0 auto;
      background: #f6f0e1;
      border: 2px solid #4a5a20;
      border-radius: 16px;
      box-shadow: 0 0 18px #2222;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }
    .flip-panel {
      width: 200px;
      background: #222;
      color: #eaeaea;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 16px 0 0 16px;
      user-select: none;
      cursor: pointer;
      transition: background 0.15s;
      padding: 0 10px;
    }
    .flip-panel:hover {
      background: #171717;
    }
    .flip-indicator {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #eaeaea;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 22px;
      margin-top: 0;
      line-height: 1.18;
      transition: color 0.15s;
    }
    .flip-panel em {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 1.12rem;
      color: #bdbdbd;
      margin-top: 18px;
      font-style: italic;
      text-align: center;
      line-height: 1.3;
      letter-spacing: 0.04em;
      pointer-events: none;
    }
    .sheet-area {
      flex: 1;
      background: #f6f0e1;
      border-radius: 0 16px 16px 0;
      padding: 24px 24px 32px 24px;
      display: flex;
      flex-direction: column;
      min-height: 900px;
      min-width: 520px;
      position: relative;
    }
    .sheet-face {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }
    .sheet-face.active {
      display: block;
      z-index: 1;
    }
    @media (max-width: 900px) {
      .flip-container { width: 99vw; }
      .sheet-area { min-width: 0; padding: 12px 2vw; }
    }
    @media (max-width: 700px) {
      .flip-container { flex-direction: column; }
      .flip-panel {
        width: 100%;
        border-radius: 16px 16px 0 0;
        margin-bottom: 0;
        padding: 18px 0;
      }
      .sheet-area {
        border-radius: 0 0 16px 16px;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
<div class="flip-container">
  <div class="flip-panel" id="flipPanel">
    <div class="flip-indicator" id="flipIndicator">SHEET TO FLIP → BACK</div>
    <em>
      This sheet<br>
      will automatically<br>
      scale to fit<br>
      your screen.<br>
      When printed,<br>
      it will use<br>
      full quality<br>
      and exact<br>
      page size.
    </em>
  </div>
  <div class="sheet-area">
    <div class="sheet-face active" id="frontFace">
      <!-- FRONT SHEET CONTENT GOES HERE -->
      <h2>Front side of sheet</h2>
      <!-- ... full editable fields, layout, etc. ... -->
    </div>
    <div class="sheet-face" id="backFace">
      <!-- BACK SHEET CONTENT GOES HERE -->
      <h2>Back side of sheet</h2>
      <!-- ... full editable fields, layout, etc. ... -->
    </div>
  </div>
</div>
<script>
  // Flip logic
  (function(){
    var front = document.getElementById('frontFace');
    var back = document.getElementById('backFace');
    var flipIndicator = document.getElementById('flipIndicator');
    var flipPanel = document.getElementById('flipPanel');
    var showingFront = true;
    function flip() {
      if(showingFront) {
        front.classList.remove('active');
        back.classList.add('active');
        flipIndicator.innerHTML = "SHEET TO FLIP → FRONT";
      } else {
        front.classList.add('active');
        back.classList.remove('active');
        flipIndicator.innerHTML = "SHEET TO FLIP → BACK";
      }
      showingFront = !showingFront;
    }
    flipPanel.addEventListener('click', flip);
    flipIndicator.addEventListener('click', flip);
  })();
</script>
</body>
</html>
