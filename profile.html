<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Slayers of Rings § Crowns</title>
    <link rel="icon" href="IMG_3419.jpeg" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        .profile-container { max-width: 680px; margin: 2rem auto; padding: 2rem; }
        .profile-card { background: #1a1a1a; border-radius: 1rem; border: 1px solid #333; overflow: hidden; margin-bottom: 1rem; }
        .profile-banner { width: 100%; height: 120px; background: linear-gradient(135deg, #1a0a0a, #2a0808, #d0021b22); display: flex; align-items: center; justify-content: center; color: #333; font-size: 0.8rem; position: relative; }
        .profile-info-row { display: flex; align-items: flex-end; gap: 1rem; padding: 0 1.5rem; margin-top: -40px; margin-bottom: 1rem; position: relative; z-index: 1; }
        .profile-avatar-large { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #d0021b; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #555; overflow: hidden; flex-shrink: 0; }
        .profile-name-block { flex: 1; padding-bottom: 0.5rem; }
        .profile-username { font-size: 1.3rem; font-weight: bold; color: #e0cfc0; }
        .profile-role-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; margin-top: 3px; }
        .profile-section { padding: 1rem 1.5rem; border-top: 1px solid #2a2a2a; }
        .profile-section h3 { color: #d4af37; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.75rem 0; }
        .profile-field { margin-bottom: 0.75rem; }
        .profile-field label { font-size: 0.75rem; color: #888; display: block; margin-bottom: 3px; }
        .profile-input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 0.9rem; box-sizing: border-box; }
        .profile-input:focus { outline: none; border-color: #d0021b; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
        .stat-box { background: #222; border-radius: 8px; padding: 0.75rem; text-align: center; border: 1px solid #333; }
        .stat-box .stat-val { font-size: 1.2rem; font-weight: bold; color: #d4af37; }
        .stat-box .stat-label { font-size: 0.7rem; color: #666; margin-top: 2px; }
        .btn { padding: 8px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-red { background: #d0021b; color: #fff; }
        .btn-gold { background: #d4af37; color: #222; }
        .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
        .msg { margin-top: 0.5rem; font-size: 0.85rem; }
        .msg.success { color: #4caf50; }
        .msg.error { color: #d0021b; }
        .not-logged-in { text-align: center; padding: 3rem; }
        .not-logged-in a { color: #d0021b; }
        .avatar-preview-box { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #d0021b; background: #2a2a2a; overflow: hidden; margin: 0 auto 1rem auto; display: flex; align-items: center; justify-content: center; }
        .avatar-preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-scroll { max-height: 260px; overflow-y: auto; padding-right: 4px; }
        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
        @media (max-width: 600px) { .avatar-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; } }
        .avatar-option { border: 3px solid transparent; border-radius: 8px; cursor: pointer; overflow: hidden; transition: border-color 0.2s; background: #2a2a2a; aspect-ratio: 1; }
        .avatar-option:hover { border-color: #d4af37; }
        .avatar-option.selected { border-color: #d0021b; }
        .avatar-option img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .points-bar-bg { background: #2a2a2a; border-radius: 8px; height: 8px; margin-top: 4px; overflow: hidden; }
        .points-bar-fill { background: linear-gradient(90deg, #d0021b, #d4af37); height: 100%; border-radius: 8px; }
        .unlock-feature-card { background: #1a1a2a; border: 1px solid #333; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
        .unlock-feature-card.unlocked { border-color: #1a6b1a; }
        .unlock-feature-info h4 { color: #e0cfc0; margin: 0 0 4px 0; font-size: 0.9rem; }
        .unlock-feature-info p { color: #555; margin: 0; font-size: 0.78rem; }
        .upgrade-section { margin-top: 1rem; padding: 1rem 1.5rem; background: #1a1a2a; border: 1px solid #444; border-radius: 8px; }
        .upgrade-section h3 { color: #d4af37; margin-bottom: 0.5rem; font-size: 0.85rem; }
        .upgrade-btn { display: block; width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 2px solid #444; background: #222; color: #e0cfc0; font-weight: bold; cursor: pointer; font-size: 0.9rem; text-align: left; }
        .upgrade-btn:hover { border-color: #d4af37; }
        .upgrade-info { display: none; background: #2a1a00; border: 1px solid #d4af37; color: #d4af37; border-radius: 8px; padding: 1rem; margin-top: 0.5rem; font-size: 0.85rem; line-height: 1.6; }
    </style>
</head>
<body>
  <div class="page-wrapper">
    <header class="header-container">
      <span class="sorc-letters">S O R C</span>
    </header>
    <script>(function(){var t=localStorage.getItem('themeSelected')||'evil';if(t==='lawful')document.body.classList.add('lawful-mode');})();</script>
    <div id="profileApp"><div style="text-align:center;padding:3rem;color:#555;">Loading...</div></div>
    <div id="footer"></div>
    <script type="module" src="main.js"></script>
    <script>
    var API_URL = 'https://api.sorcrpg.com';
    var OWNER_EMAILS = ['corbett@sorcrpg.com'];
    var ADMIN_EMAILS = ['markcorbett.mii@gmail.com'];
    var selectedAvatar = null;

    var AVATARS = [
        '01deb0d8-fb1e-4e18-8048-020d8ea56272.png','037b9199-2abf-47a3-9b34-0b912a0675a6.png',
        '1dc7c652-c366-4ed6-babb-50e9db131cf6.png','1f56a37a-924b-4f5b-ad8c-9b3f811eca08.png',
        '2855038f-8581-4061-b60a-e0629ec1f683.png','2e98fc95-753a-4aaa-855b-79dd6bb17c09.png',
        '3631e3d3-79bd-4fd2-b588-ec80fabc5ae4.png','3dba5b21-7dcc-4e9a-a309-1f42d010d58f.png',
        '3ff4851b-f3ee-4f23-9a1d-57c88547a1c6.png','45cc24a0-0873-48da-aeb5-afad6c36d887.png',
        '4c16641d-eee1-4bd5-bd8a-ec0611f928b7.png','5142b751-8cb6-4f19-ac2b-6880c241ab56.png',
        '51cb2423-194f-4bd1-8229-7fe356f17c32.png','6a04a2c0-ab6a-4fb7-8f2e-f29a5241095e.png',
        '6a955b49-f706-4e8d-a04c-af0daca538f0.png','6b87456a-88d9-4535-9f45-4f7274865156.png',
        '6c37d5d1-76c4-4391-ac12-6ca2a1109026.png','7ad2053e-a2a7-4f23-af8e-902b2d243fa2.png',
        '8368be40-e509-4f84-8ff4-b41cb8e6b263.png','8ea1641c-5cdf-4e58-b28a-60f2f7822d7a.png',
        '953d2b9a-3239-485b-b725-6a8ec7b198a6.png','9900c8e6-3b22-4926-924c-63995c96f50b.png',
        'aba62c03-4bae-49e8-a8bb-88b00459b241.png','b4d464f7-1923-409f-883a-1648018b9483.png'
    ];

    function getRoleColor(role) {
        if (role === 'OWNER') return 'background:#d4af37;color:#222;';
        if (role === 'ADMIN') return 'background:#8B0000;color:#fff;';
        if (role === 'MASTER') return 'background:#1a6b1a;color:#fff;';
        if (role === 'PLAYER') return 'background:#1a3a6b;color:#fff;';
        return 'background:#333;color:#e0cfc0;';
    }
    function getRoleAbbr(role) {
        if (role === 'OWNER') return '[OWN]';
        if (role === 'ADMIN') return '[AD]';
        if (role === 'MASTER') return '[GM]';
        if (role === 'PLAYER') return '[PC]';
        return '[CIV]';
    }

    window.pickAvatar = function(el, filename) {
        document.querySelectorAll('.avatar-option').forEach(function(o) { o.classList.remove('selected'); });
        el.classList.add('selected');
        selectedAvatar = filename;
        var preview = document.getElementById('avatarPreviewImg');
        if (preview) {
            preview.src = 'images/avatars/' + filename;
            preview.style.display = 'block';
        }
    };

    window.saveAvatar = async function() {
        var msgEl = document.getElementById('avatarMsg');
        if (!selectedAvatar) { msgEl.className = 'msg error'; msgEl.textContent = 'Please select an avatar.'; return; }
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!saved || !saved.authKey) { msgEl.className = 'msg error'; msgEl.textContent = 'Not logged in.'; return; }
        try {
            var res = await fetch(API_URL + '/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': saved.authKey },
                body: JSON.stringify({ avatar: selectedAvatar })
            });
            var data = await res.json();
            if (data.success) {
                saved.avatar = selectedAvatar;
                localStorage.setItem('sorc_user', JSON.stringify(saved));
                msgEl.className = 'msg success'; msgEl.textContent = '✅ Avatar saved!';
                if (window._profileBtn_loggedIn) window._profileBtn_loggedIn(selectedAvatar);
                setTimeout(function() { location.reload(); }, 1000);
            } else {
                msgEl.className = 'msg error'; msgEl.textContent = data.error || 'Failed to save.';
            }
        } catch(e) {
            msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.';
        }
    };

    window.saveBio = async function() {
        var bio = document.getElementById('bioInput').value.trim();
        var msgEl = document.getElementById('bioMsg');
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!saved || !saved.authKey) return;
        try {
            var res = await fetch(API_URL + '/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': saved.authKey },
                body: JSON.stringify({ bio: bio })
            });
            var data = await res.json();
            msgEl.className = data.success ? 'msg success' : 'msg error';
            msgEl.textContent = data.success ? '✅ Bio saved!' : (data.error || 'Failed.');
        } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.'; }
    };

    window.saveDisplayName = async function() {
        var name = document.getElementById('displayNameInput').value.trim();
        var msgEl = document.getElementById('nameMsg');
        if (!name || name.length < 3) { msgEl.className = 'msg error'; msgEl.textContent = 'Name must be at least 3 characters.'; return; }
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!saved || !saved.authKey) return;
        try {
            var res = await fetch(API_URL + '/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': saved.authKey },
                body: JSON.stringify({ display_name: name })
            });
            var data = await res.json();
            if (data.success) {
                saved.display_name = name;
                localStorage.setItem('sorc_user', JSON.stringify(saved));
                msgEl.className = 'msg success'; msgEl.textContent = '✅ Name saved!';
            } else { msgEl.className = 'msg error'; msgEl.textContent = data.error || 'Failed.'; }
        } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.'; }
    };

    window.toggleInfo = function(id) {
        var el = document.getElementById(id);
        if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
    };

    window.doSignOut = function() {
        localStorage.removeItem('sorc_user');
        window.location.href = 'index.html';
    };

    document.addEventListener('DOMContentLoaded', function() {
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}

        if (!saved || !saved.authKey) {
            document.getElementById('profileApp').innerHTML =
                '<div class="not-logged-in"><h2>Not logged in</h2><p><a href="signin.html">Sign in to view your profile</a></p></div>';
            return;
        }

        var user = saved;
        var role = user.role || 'CIVILIAN';
        if (OWNER_EMAILS.includes(user.email)) role = 'OWNER';
        else if (ADMIN_EMAILS.includes(user.email)) role = 'ADMIN';

        var displayName = user.display_name || user.username || 'Adventurer';
        var avatar = user.avatar || null;
        var communityPoints = user.community_points || 0;
        var postCount = user.post_count || 0;

        var avatarDisplay = avatar
            ? '<img src="images/avatars/' + avatar + '" style="width:100%;height:100%;object-fit:cover;" />'
            : '<span style="font-size:1.5rem;">👤</span>';

        var avatarGridHtml = AVATARS.map(function(filename) {
            var sel = filename === avatar ? ' selected' : '';
            return '<div class="avatar-option' + sel + '" onclick="pickAvatar(this, \'' + filename + '\')">' +
                '<img src="images/avatars/' + filename + '" loading="lazy" />' +
                '</div>';
        }).join('');

        var upgradeSection = '';
        if (role === 'CIVILIAN') {
            upgradeSection = '<div class="upgrade-section">' +
                '<h3>Upgrade Your Account</h3>' +
                '<button class="upgrade-btn" onclick="toggleInfo(\'pc-info\')">▶ Upgrade to PLAYER</button>' +
                '<div class="upgrade-info" id="pc-info">To upgrade to PLAYER you must pass a SORC Player Assessment. Assessments are currently under development. Upon upgrading you will receive <b>500 community points</b>.</div>' +
                '<button class="upgrade-btn" onclick="toggleInfo(\'gm-info\')">▶ Upgrade to MASTER</button>' +
                '<div class="upgrade-info" id="gm-info">To upgrade to MASTER you must pass a SORC Master Assessment AND redeem an official Master Code. Upon upgrading you will receive <b>1,000 community points</b>.</div>' +
            '</div>';
        }

        document.getElementById('profileApp').innerHTML =
            '<div class="profile-container">' +
                '<div class="profile-card">' +
                    '<div class="profile-banner"></div>' +
                    '<div class="profile-info-row">' +
                        '<div class="profile-avatar-large">' + avatarDisplay + '</div>' +
                        '<div class="profile-name-block">' +
                            '<div class="profile-username">' + displayName + '</div>' +
                            '<span class="profile-role-tag" style="' + getRoleColor(role) + '">' + role + ' ' + getRoleAbbr(role) + '</span>' +
                            (user.id ? '<div style="font-size:0.7rem;color:#444;margin-top:3px;">ID: #' + user.user_id + '</div>' : '') +
                        '</div>' +
                    '</div>' +
                    '<div class="profile-section">' +
                        '<div class="stat-grid">' +
                            '<div class="stat-box"><div class="stat-val">' + communityPoints + '</div><div class="stat-label">Community Points</div></div>' +
                            '<div class="stat-box"><div class="stat-val">' + postCount + '</div><div class="stat-label">Forum Posts</div></div>' +
                            '<div class="stat-box"><div class="stat-val">' + (user.email_verified ? '✅' : '❌') + '</div><div class="stat-label">Email Verified</div></div>' +
                        '</div>' +
                    '</div>' +
                '</div>' +

                '<div class="profile-card">' +
                    '<div class="profile-section">' +
                        '<h3>Edit Profile</h3>' +

                        '<div class="profile-field">' +
                            '<label>DISPLAY NAME</label>' +
                            '<input type="text" id="displayNameInput" class="profile-input" value="' + displayName + '" maxlength="30" />' +
                            '<button class="btn btn-gold btn-sm" onclick="saveDisplayName()" style="margin-top:6px;">Save Name</button>' +
                            '<div id="nameMsg" class="msg"></div>' +
                        '</div>' +

                        '<div class="profile-field">' +
                            '<label>AVATAR</label>' +
                            '<div class="avatar-preview-box">' +
                                (avatar ? '<img id="avatarPreviewImg" src="images/avatars/' + avatar + '" />' : '<img id="avatarPreviewImg" src="" style="display:none;" />') +
                            '</div>' +
                            '<div class="avatar-scroll"><div class="avatar-grid">' + avatarGridHtml + '</div></div>' +
                            '<button class="btn btn-gold btn-sm" onclick="saveAvatar()" style="margin-top:6px;">Save Avatar</button>' +
                            '<div id="avatarMsg" class="msg"></div>' +
                        '</div>' +

                        '<div class="profile-field">' +
                            '<label>BIO</label>' +
                            '<textarea id="bioInput" class="profile-input" rows="3" maxlength="300" placeholder="Tell Essentia about yourself...">' + (user.bio || '') + '</textarea>' +
                            '<button class="btn btn-gold btn-sm" onclick="saveBio()" style="margin-top:6px;">Save Bio</button>' +
                            '<div id="bioMsg" class="msg"></div>' +
                        '</div>' +

                        '<div class="profile-field">' +
                            '<label>EMAIL</label>' +
                            '<div style="font-size:0.85rem;color:#555;">' + user.email + '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>' +

                upgradeSection +

                '<div style="margin-top:1rem;display:flex;gap:1rem;">' +
                    '<button class="btn btn-red" onclick="doSignOut()">Logout</button>' +
                    '<a href="index.html" class="btn btn-gold" style="text-decoration:none;">Home</a>' +
                '</div>' +
            '</div>';
    });
    </script>
</body>
</html>
