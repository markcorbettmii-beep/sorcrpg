<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Slayers of Rings § Crowns</title>
    <link rel="icon" href="IMG_3419.jpeg" />
    <link rel="stylesheet" href="styles.css?v=4" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        .profile-container { max-width: 680px; margin: 2rem auto; padding: 2rem; }
        .profile-card { background: #1a1a1a; border-radius: 1rem; border: 1px solid #333; overflow: hidden; margin-bottom: 1rem; }
        .profile-banner { width: 100%; height: 120px; background: linear-gradient(135deg, #1a0a0a, #2a0808, #d0021b22); display: flex; align-items: center; justify-content: center; color: #333; font-size: 0.8rem; position: relative; }
        .profile-info-row { display: flex; align-items: flex-end; gap: 1rem; padding: 0 1.5rem; margin-top: -40px; margin-bottom: 1rem; position: relative; z-index: 1; }
        .profile-avatar-large { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #d0021b; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #555; overflow: hidden; flex-shrink: 0; }
        .profile-name-block { flex: 1; padding-bottom: 0.5rem; }
        .profile-username { font-size: 1.3rem; font-weight: bold; color: #e0cfc0; }
        .profile-role-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; margin-top: 3px; }
        .profile-section { padding: 1rem 1.5rem; border-top: 1px solid #2a2a2a; }
        .profile-section h3 { color: #d4af37; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.75rem 0; }
        .profile-field { margin-bottom: 0.75rem; }
        .profile-field label { font-size: 0.75rem; color: #888; display: block; margin-bottom: 3px; }
        .profile-input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 0.9rem; box-sizing: border-box; }
        .profile-input:focus { outline: none; border-color: #d0021b; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
        .stat-box { background: #222; border-radius: 8px; padding: 0.75rem; text-align: center; border: 1px solid #333; }
        .stat-box .stat-val { font-size: 1.2rem; font-weight: bold; color: #d4af37; }
        .stat-box .stat-label { font-size: 0.7rem; color: #666; margin-top: 2px; }
        .btn { padding: 8px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-red { background: #d0021b; color: #fff; }
        .btn-gold { background: #d4af37; color: #222; }
        .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
        .msg { margin-top: 0.5rem; font-size: 0.85rem; }
        .msg.success { color: #4caf50; }
        .msg.error { color: #d0021b; }
        .not-logged-in { text-align: center; padding: 3rem; }
        .not-logged-in a { color: #d0021b; }
        .avatar-preview-box { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #d0021b; background: #2a2a2a; overflow: hidden; margin: 0 auto 1rem auto; display: flex; align-items: center; justify-content: center; }
        .avatar-preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-scroll { max-height: 260px; overflow-y: auto; padding-right: 4px; }
        .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
        @media (max-width: 600px) { .avatar-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; } }
        .avatar-option { border: 3px solid transparent; border-radius: 8px; cursor: pointer; overflow: hidden; transition: border-color 0.2s; background: #2a2a2a; aspect-ratio: 1; }
        .avatar-option:hover { border-color: #d4af37; }
        .avatar-option.selected { border-color: #d0021b; }
        .avatar-option img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .points-bar-bg { background: #2a2a2a; border-radius: 8px; height: 8px; margin-top: 4px; overflow: hidden; }
        .points-bar-fill { background: linear-gradient(90deg, #d0021b, #d4af37); height: 100%; border-radius: 8px; }
        .unlock-feature-card { background: #1a1a2a; border: 1px solid #333; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
        .unlock-feature-card.unlocked { border-color: #1a6b1a; }
        .unlock-feature-info h4 { color: #e0cfc0; margin: 0 0 4px 0; font-size: 0.9rem; }
        .unlock-feature-info p { color: #555; margin: 0; font-size: 0.78rem; }
        .upgrade-section { margin-top: 1rem; padding: 1rem 1.5rem; background: #1a1a2a; border: 1px solid #444; border-radius: 8px; }
        .upgrade-section h3 { color: #d4af37; margin-bottom: 0.5rem; font-size: 0.85rem; }
        .upgrade-btn { display: block; width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 2px solid #444; background: #222; color: #e0cfc0; font-weight: bold; cursor: pointer; font-size: 0.9rem; text-align: left; }
        .upgrade-btn:hover { border-color: #d4af37; }
        .upgrade-info { display: none; background: #2a1a00; border: 1px solid #d4af37; color: #d4af37; border-radius: 8px; padding: 1rem; margin-top: 0.5rem; font-size: 0.85rem; line-height: 1.6; }
    </style>
</head>
<body>
  <div class="page-wrapper">
    <header class="header-container">
      <span class="sorc-letters">S O R C</span><img src="sorc-letters-evil.jpg" class="sorc-letters-img evil-only" alt="SORC" /><img src="sorc-letters-lawful.jpg" class="sorc-letters-img lawful-only" alt="SORC" />
    </header>
    <script>(function(){var t=localStorage.getItem('themeSelected')||'evil';if(t==='lawful')document.body.classList.add('lawful-mode');})();</script>
    <ul class="page-nav">
      <li><a href="index.html">&#8962;</a></li>
    </ul>
    <div id="profileApp"><div style="text-align:center;padding:3rem;color:#555;">Loading...</div></div>
    <div id="footer"></div>
    <script type="module" src="main.js?v=2"></script>
    <script>
    var API_URL = 'https://api.sorcrpg.com';
    var OWNER_EMAILS = ['corbett@sorcrpg.com'];
    var ADMIN_EMAILS = ['markcorbett.mii@gmail.com'];
    var selectedAvatar = null;

    var AVATARS = [
        '01deb0d8-fb1e-4e18-8048-020d8ea56272.png','037b9199-2abf-47a3-9b34-0b912a0675a6.png',
        '1dc7c652-c366-4ed6-babb-50e9db131cf6.png','1f56a37a-924b-4f5b-ad8c-9b3f811eca08.png',
        '2855038f-8581-4061-b60a-e0629ec1f683.png','2e98fc95-753a-4aaa-855b-79dd6bb17c09.png',
        '3631e3d3-79bd-4fd2-b588-ec80fabc5ae4.png','3dba5b21-7dcc-4e9a-a309-1f42d010d58f.png',
        '3ff4851b-f3ee-4f23-9a1d-57c88547a1c6.png','45cc24a0-0873-48da-aeb5-afad6c36d887.png',
        '4c16641d-eee1-4bd5-bd8a-ec0611f928b7.png','5142b751-8cb6-4f19-ac2b-6880c241ab56.png',
        '51cb2423-194f-4bd1-8229-7fe356f17c32.png','6a04a2c0-ab6a-4fb7-8f2e-f29a5241095e.png',
        '6a955b49-f706-4e8d-a04c-af0daca538f0.png','6b87456a-88d9-4535-9f45-4f7274865156.png',
        '6c37d5d1-76c4-4391-ac12-6ca2a1109026.png','7ad2053e-a2a7-4f23-af8e-902b2d243fa2.png',
        '8368be40-e509-4f84-8ff4-b41cb8e6b263.png','8ea1641c-5cdf-4e58-b28a-60f2f7822d7a.png',
        '953d2b9a-3239-485b-b725-6a8ec7b198a6.png','9900c8e6-3b22-4926-924c-63995c96f50b.png',
        'aba62c03-4bae-49e8-a8bb-88b00459b241.png','b4d464f7-1923-409f-883a-1648018b9483.png'
    ];

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    function getRoleColor(role) {
        if (role === 'OWNER') return 'background:#d4af37;color:#222;';
        if (role === 'ADMIN') return 'background:#8B0000;color:#fff;';
        if (role === 'MASTER') return 'background:#1a6b1a;color:#fff;';
        if (role === 'PLAYER') return 'background:#1a3a6b;color:#fff;';
        return 'background:#333;color:#e0cfc0;';
    }
    function getRoleAbbr(role) {
        if (role === 'OWNER') return '[OWN]';
        if (role === 'ADMIN') return '[AD]';
        if (role === 'MASTER') return '[GM]';
        if (role === 'PLAYER') return '[PC]';
        return '[CIV]';
    }

    window.pickAvatar = function(el, filename) {
        document.querySelectorAll('.avatar-option').forEach(function(o) { o.classList.remove('selected'); });
        el.classList.add('selected');
        selectedAvatar = filename;
        var preview = document.getElementById('avatarPreviewImg');
        if (preview) {
            preview.src = 'images/avatars/' + filename;
            preview.style.display = 'block';
        }
    };

    window.saveAvatar = async function() {
        var msgEl = document.getElementById('avatarMsg');
        if (!selectedAvatar) { msgEl.className = 'msg error'; msgEl.textContent = 'Please select an avatar.'; return; }
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!saved || !saved.authKey) { msgEl.className = 'msg error'; msgEl.textContent = 'Not logged in.'; return; }
        try {
            var res = await fetch(API_URL + '/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': saved.authKey },
                body: JSON.stringify({ avatar: selectedAvatar })
            });
            var data = await res.json();
            if (data.success) {
                saved.avatar = selectedAvatar;
                localStorage.setItem('sorc_user', JSON.stringify(saved));
                msgEl.className = 'msg success'; msgEl.textContent = '✅ Avatar saved!';
                if (window._profileBtn_loggedIn) window._profileBtn_loggedIn(selectedAvatar);
                setTimeout(function() { location.reload(); }, 1000);
            } else {
                msgEl.className = 'msg error'; msgEl.textContent = data.error || 'Failed to save.';
            }
        } catch(e) {
            msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.';
        }
    };

    window.saveSignature = async function() {
        var sig = document.getElementById('sigInput').value.trim();
        var msgEl = document.getElementById('sigMsg');
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!saved || !saved.authKey) return;
        try {
            var res = await fetch(API_URL + '/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': saved.authKey },
                body: JSON.stringify({ signature: sig })
            });
            var data = await res.json();
            msgEl.className = data.success ? 'msg success' : 'msg error';
            msgEl.textContent = data.success ? '✅ Signature saved!' : (data.error || 'Failed.');
        } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Could not save. Please try again.'; }
    };

    window.saveSocials = async function() {
        var website = document.getElementById('socialWebsite').value.trim();
        var twitter = document.getElementById('socialTwitter').value.trim();
        var twitch = document.getElementById('socialTwitch').value.trim();
        var msgEl = document.getElementById('socialsMsg');
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!saved || !saved.authKey) return;
        try {
            var res = await fetch(API_URL + '/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': saved.authKey },
                body: JSON.stringify({ website: website, social_twitter: twitter, social_twitch: twitch })
            });
            var data = await res.json();
            msgEl.className = data.success ? 'msg success' : 'msg error';
            msgEl.textContent = data.success ? '✅ Socials saved!' : (data.error || 'Failed.');
        } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Could not save. Please try again.'; }
    };

    window.saveBio = async function() {
        var bio = document.getElementById('bioInput').value.trim();
        var msgEl = document.getElementById('bioMsg');
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!saved || !saved.authKey) return;
        try {
            var res = await fetch(API_URL + '/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': saved.authKey },
                body: JSON.stringify({ bio: bio })
            });
            var data = await res.json();
            msgEl.className = data.success ? 'msg success' : 'msg error';
            msgEl.textContent = data.success ? '✅ Bio saved!' : (data.error || 'Failed.');
        } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Could not save. Please try again.'; }
    };

    function applyPrivacyToggleVisual(isPublic) {
        var slider = document.getElementById('emailPrivacySlider');
        var label = document.getElementById('emailPrivacyLabel');
        if (slider) {
            slider.style.background = isPublic ? '#1a6b1a' : '#333';
            slider.children[0].style.left = isPublic ? '23px' : '3px';
        }
        if (label) label.textContent = isPublic ? 'Email visible on your profile' : 'Email hidden from others';
    }

    window.saveEmailPrivacy = async function() {
        var toggle = document.getElementById('emailPrivacyToggle');
        var msgEl = document.getElementById('emailPrivacyMsg');
        var isPublic = toggle ? toggle.checked : false;
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!saved || !saved.authKey) return;
        applyPrivacyToggleVisual(isPublic);
        try {
            var res = await fetch(API_URL + '/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': saved.authKey },
                body: JSON.stringify({ privacy_email: isPublic ? 0 : 1 })
            });
            var data = await res.json();
            if (data.success) {
                saved.privacy_email = isPublic ? 0 : 1;
                localStorage.setItem('sorc_user', JSON.stringify(saved));
                msgEl.className = 'msg success';
                msgEl.textContent = isPublic ? '✅ Email is now public.' : '✅ Email is now hidden.';
            } else {
                msgEl.className = 'msg error';
                msgEl.textContent = data.error || 'Failed to save.';
                if (toggle) toggle.checked = !isPublic;
                applyPrivacyToggleVisual(!isPublic);
            }
        } catch(e) {
            msgEl.className = 'msg error';
            msgEl.textContent = 'Could not save. Please try again.';
            if (toggle) toggle.checked = !isPublic;
            applyPrivacyToggleVisual(!isPublic);
        }
    };

    window.saveDisplayName = async function() {
        var name = document.getElementById('displayNameInput').value.trim();
        var msgEl = document.getElementById('nameMsg');
        if (!name || name.length < 3) { msgEl.className = 'msg error'; msgEl.textContent = 'Name must be at least 3 characters.'; return; }
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!saved || !saved.authKey) return;
        try {
            var res = await fetch(API_URL + '/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': saved.authKey },
                body: JSON.stringify({ display_name: name })
            });
            var data = await res.json();
            if (data.success) {
                saved.display_name = name;
                localStorage.setItem('sorc_user', JSON.stringify(saved));
                msgEl.className = 'msg success'; msgEl.textContent = '✅ Name saved!';
                var btn = document.getElementById('saveNameBtn');
                if (btn) { btn.disabled = true; btn.style.opacity = '0.4'; btn.style.cursor = 'not-allowed'; btn.title = 'Already saved'; }
            } else { msgEl.className = 'msg error'; msgEl.textContent = data.error || 'Failed.'; }
        } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Could not save. Please try again.'; }
    };

    window.toggleInfo = function(id) {
        var el = document.getElementById(id);
        if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
    };

    window.redeemGmCode = async function() {
        var input = document.getElementById('gmCodeInput');
        var msgEl = document.getElementById('gmCodeMsg');
        if (!input || !msgEl) return;
        var code = input.value.trim();
        if (!code) { msgEl.style.color = '#d0021b'; msgEl.textContent = 'Enter a GM code.'; return; }
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!saved || !saved.authKey) { msgEl.style.color = '#d0021b'; msgEl.textContent = 'Not signed in.'; return; }
        msgEl.style.color = '#888'; msgEl.textContent = 'Redeeming...';
        try {
            var res = await fetch(API_URL + '/api/gm-codes/redeem', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': saved.authKey },
                body: JSON.stringify({ code: code })
            });
            var data = await res.json();
            if (data.success) {
                msgEl.style.color = '#4caf50';
                msgEl.textContent = '✓ Upgraded to MASTER (GM)! +' + (data.points_awarded || 500) + ' CP. Refreshing...';
                saved.role = 'MASTER'; saved.sorc_role = 'GM-ADV';
                localStorage.setItem('sorc_user', JSON.stringify(saved));
                setTimeout(function() { window.location.reload(); }, 1800);
            } else {
                msgEl.style.color = '#d0021b';
                msgEl.textContent = data.error || 'Could not redeem code.';
            }
        } catch(e) { msgEl.style.color = '#d0021b'; msgEl.textContent = 'Connection error.'; }
    };

    window.unlockFeature = async function(feature, cost) {
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!saved || !saved.authKey) return;

        var cp = saved.community_points || 0;
        if (cp < cost) { alert('Not enough Community Points. Need ' + cost + ' CP.'); return; }

        try {
            var res = await fetch(API_URL + '/api/unlock', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': saved.authKey },
                body: JSON.stringify({ feature: feature })
            });
            var data = await res.json();
            if (data.success) {
                saved.community_points = data.community_points;
                saved.unlocked_features = data.unlocked_features;
                localStorage.setItem('sorc_user', JSON.stringify(saved));
                location.reload();
            } else {
                alert(data.error || 'Could not unlock. Please try again.');
            }
        } catch(e) { alert('Could not connect. Please try again.'); }
    };

    window.doSignOut = function() {
        localStorage.removeItem('sorc_user');
        window.location.href = 'index.html';
    };

    document.addEventListener('DOMContentLoaded', async function() {
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}

        if (!saved || !saved.authKey) {
            document.getElementById('profileApp').innerHTML =
                '<div class="not-logged-in"><h2>Not logged in</h2><p><a href="signin.html">Sign in to view your profile</a></p></div>';
            return;
        }

        // Always fetch fresh data from server so role/points stay current
        try {
            var freshRes = await fetch(API_URL + '/api/me', {
                headers: { 'X-Auth-Key': saved.authKey }
            });
            var freshData = await freshRes.json();
            if (freshData.user) {
                saved = Object.assign(saved, freshData.user);
                localStorage.setItem('sorc_user', JSON.stringify(saved));
            }
        } catch(e) {}

        var user = saved;
        var role = user.role || 'CIVILIAN';
        if (OWNER_EMAILS.includes(user.email)) role = 'OWNER';
        else if (ADMIN_EMAILS.includes(user.email)) role = 'ADMIN';

        var displayName = user.display_name || user.username || 'Adventurer';
        var avatar = user.avatar || null;
        var communityPoints = user.community_points || 0;
        var postCount = user.post_count || 0;

        var unlockedFeatures = user.unlocked_features || [];
        if (typeof unlockedFeatures === 'string') { try { unlockedFeatures = JSON.parse(unlockedFeatures); } catch(e) { unlockedFeatures = []; } }

        if ((role === 'OWNER' || role === 'ADMIN') && communityPoints < 10000) {
            communityPoints = 10000;
            user.community_points = 10000;
            localStorage.setItem('sorc_user', JSON.stringify(user));
            fetch(API_URL + '/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': user.authKey },
                body: JSON.stringify({ community_points: 10000 })
            }).catch(function(){});
        }

        var avatarDisplay = avatar
            ? '<img src="images/avatars/' + avatar + '" style="width:100%;height:100%;object-fit:cover;" />'
            : '<span style="font-size:1.5rem;">👤</span>';

        var avatarGridHtml = AVATARS.map(function(filename) {
            var sel = filename === avatar ? ' selected' : '';
            return '<div class="avatar-option' + sel + '" onclick="pickAvatar(this, \'' + filename + '\')">' +
                '<img src="images/avatars/' + filename + '" loading="lazy" />' +
                '</div>';
        }).join('');

        var upgradeSection = '';
        if (role === 'CIVILIAN') {
            upgradeSection = '<div class="upgrade-section">' +
                '<h3>Upgrade Your Account</h3>' +
                '<button class="upgrade-btn" onclick="toggleInfo(\'pc-info\')">▶ Upgrade to PLAYER</button>' +
                '<div class="upgrade-info" id="pc-info">To upgrade to PLAYER you must pass a SORC Player Assessment. Assessments are currently under development. Upon upgrading you will receive <b>500 community points</b>.</div>' +
                '<button class="upgrade-btn" onclick="toggleInfo(\'gm-info\')">▶ Upgrade to MASTER</button>' +
                '<div class="upgrade-info" id="gm-info">To upgrade to MASTER you must pass a SORC Master Assessment AND redeem an official Master Code. Upon upgrading you will receive <b>1,000 community points</b>.</div>' +
            '</div>';
        } else if (role === 'PLAYER') {
            upgradeSection = '<div class="upgrade-section">' +
                '<h3>&#128081; Upgrade to MASTER (GM)</h3>' +
                '<p style="color:#888;font-size:0.82rem;margin:0 0 0.75rem 0;">If an admin has issued you a GM code, enter it below to upgrade your account to Game Master status and unlock lobby hosting.</p>' +
                '<div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">' +
                    '<input type="text" id="gmCodeInput" placeholder="Enter GM code..." maxlength="20" style="flex:1;min-width:160px;padding:8px 12px;border-radius:8px;border:1px solid #444;background:#1a1a1a;color:#e0cfc0;font-size:0.88rem;" />' +
                    '<button onclick="redeemGmCode()" style="padding:8px 18px;background:#d4af37;color:#111;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:0.88rem;">Redeem</button>' +
                '</div>' +
                '<div id="gmCodeMsg" style="min-height:1.2em;font-size:0.8rem;margin-top:0.4rem;"></div>' +
            '</div>';
        }

        document.getElementById('profileApp').innerHTML =

                            '<input type="text" id="displayNameInput" class="profile-input" value="' + displayName + '" maxlength="30" oninput="var btn=document.getElementById(\'saveNameBtn\');btn.disabled=this.value.trim()===\'' + displayName.replace(/'/g,"\\'") + '\';btn.style.opacity=btn.disabled?\'0.4\':\'1\';btn.style.cursor=btn.disabled?\'not-allowed\':\'pointer\';" />' +

                            '<div id="bioMsg" class="msg"></div>' +
                        '</div>' +

                        (function() {

                                    '<span style="font-size:0.8rem;color:' + (!locked ? '#1a6b1a' : '#d4af37') + ';font-weight:bold;">' + (!locked ? '✅ Unlocked' : '🔒 50 CP') + '</span>' +
                                    (locked
                                        ? (communityPoints >= 50
                                            ? '<button class="btn btn-gold btn-sm" onclick="unlockFeature(\'fellowships\',50)">Unlock</button>'
                                            : '<span style="font-size:0.75rem;color:#555;">Need ' + (50 - communityPoints) + ' more CP</span>')
                                        : '') +
                                '</div>' +
                            '</div>';
                        })() +

                        (function() {
                            var locked = !unlockedFeatures.includes('signature');
                            return '<div class="unlock-feature-card' + (!locked ? ' unlocked' : '') + '">' +
                                '<div class="unlock-feature-info"><h4>Signature</h4><p>A short line shown below your forum posts.</p></div>' +
                                '<div style="display:flex;align-items:center;gap:0.75rem;">' +
                                    '<span style="font-size:0.8rem;color:' + (!locked ? '#1a6b1a' : '#d4af37') + ';font-weight:bold;">' + (!locked ? '✅ Unlocked' : '🔒 100 CP') + '</span>' +
                                    (locked
                                        ? (communityPoints >= 100
                                            ? '<button class="btn btn-gold btn-sm" onclick="unlockFeature(\'signature\',100)">Unlock</button>'
                                            : '<span style="font-size:0.75rem;color:#555;">Need ' + (100 - communityPoints) + ' more CP</span>')
                                        : '') +
                                '</div>' +
                            '</div>' +
                            (!locked
                                ? '<div class="profile-field" style="margin-top:0.5rem;">' +
                                    '<input type="text" id="sigInput" class="profile-input" value="' + esc(user.signature) + '" maxlength="80" placeholder="Short signature shown on your posts..." />' +
                                    '<button class="btn btn-gold btn-sm" onclick="saveSignature()" style="margin-top:6px;">Save Signature</button>' +
                                    '<div id="sigMsg" class="msg"></div>' +
                                '</div>'
                                : '');
                        })() +

                        (function() {
                            var locked = !unlockedFeatures.includes('socials');
                            return '<div class="unlock-feature-card' + (!locked ? ' unlocked' : '') + '">' +
                                '<div class="unlock-feature-info"><h4>Social Links</h4><p>Website, Twitter/X, and Twitch on your profile.</p></div>' +
                                '<div style="display:flex;align-items:center;gap:0.75rem;">' +
                                    '<span style="font-size:0.8rem;color:' + (!locked ? '#1a6b1a' : '#d4af37') + ';font-weight:bold;">' + (!locked ? '✅ Unlocked' : '🔒 250 CP') + '</span>' +
                                    (locked
                                        ? (communityPoints >= 250
                                            ? '<button class="btn btn-gold btn-sm" onclick="unlockFeature(\'socials\',250)">Unlock</button>'
                                            : '<span style="font-size:0.75rem;color:#555;">Need ' + (250 - communityPoints) + ' more CP</span>')
                                        : '') +
                                '</div>' +
                            '</div>' +
                            (!locked
                                ? '<div class="profile-field" style="margin-top:0.5rem;">' +
                                    '<input type="text" id="socialWebsite" class="profile-input" value="' + esc(user.website) + '" placeholder="Website URL" style="margin-bottom:4px;" />' +
                                    '<input type="text" id="socialTwitter" class="profile-input" value="' + esc(user.social_twitter) + '" placeholder="Twitter / X handle" style="margin-bottom:4px;" />' +
                                    '<input type="text" id="socialTwitch" class="profile-input" value="' + esc(user.social_twitch) + '" placeholder="Twitch handle" />' +
                                    '<button class="btn btn-gold btn-sm" onclick="saveSocials()" style="margin-top:6px;">Save Socials</button>' +
                                    '<div id="socialsMsg" class="msg"></div>' +

                                : '');
                        })() +

                        (function() {

                            return '<div class="unlock-feature-card' + (!locked ? ' unlocked' : '') + '">' +
                                '<div class="unlock-feature-info"><h4>Profile Banner</h4><p>Custom banner image at the top of your profile.</p></div>' +
                                '<div style="display:flex;align-items:center;gap:0.75rem;">' +
                                    '<span style="font-size:0.8rem;color:' + (!locked ? '#1a6b1a' : '#d4af37') + ';font-weight:bold;">' + (!locked ? '✅ Unlocked' : '🔒 500 CP') + '</span>' +
                                    (locked
                                        ? (communityPoints >= 500
                                            ? '<button class="btn btn-gold btn-sm" onclick="unlockFeature(\'banner\',500)">Unlock</button>'
                                            : '<span style="font-size:0.75rem;color:#555;">Need ' + (500 - communityPoints) + ' more CP</span>')
                                        : '<span style="font-size:0.75rem;color:#555;">Contact an admin to upload your banner.</span>') +
                                '</div>' +
                            '</div>';
                        })() +

                        (function() {
                            var emailIsPublic = user.privacy_email === 0 || user.privacy_email === false;
                            return '<div class="profile-field">' +
                                '<label>EMAIL</label>' +
                                '<div style="font-size:0.85rem;color:#888;margin-bottom:8px;">' + (user.email || '') + '</div>' +
                                '<div style="display:flex;align-items:center;gap:0.75rem;">' +
                                    '<label style="position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;">' +

                                            '<span style="position:absolute;height:18px;width:18px;left:' + (emailIsPublic ? '23px' : '3px') + ';bottom:3px;border-radius:50%;background:#e0cfc0;transition:0.2s;"></span>' +

    async function checkAdminInvitation(user) {
        try {
            var res = await fetch(API_URL + '/api/admin/invitations/pending', {
                headers: { 'X-Auth-Key': user.authKey }
            });
            var data = await res.json();
            if (!data.invitation) return;
            var el = document.getElementById('adminInviteNotice');
            if (!el) return;
            el.innerHTML =
                '<div style="background:#1a0a0a;border:2px solid #d4af37;border-radius:12px;padding:1.25rem 1.5rem;margin-top:1rem;">' +
                '<div style="font-size:0.72rem;color:#d4af37;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem;">Admin Invitation</div>' +
                '<p style="color:#e0cfc0;font-size:0.9rem;margin:0 0 0.75rem 0;">You\'ve been invited to become a <strong>SORC Admin [AD]</strong>. Upon accepting, you will receive <strong style="color:#d4af37;">10,000 Community Points</strong>.</p>' +
                '<div style="display:flex;gap:0.75rem;">' +
                '<button class="btn btn-gold" onclick="respondAdminInvite(true)">Accept</button>' +
                '<button class="btn btn-dark" onclick="respondAdminInvite(false)">Decline</button>' +
                '</div>' +
                '<div id="inviteMsg" class="msg" style="margin-top:0.5rem;"></div>' +
                '</div>';
        } catch(e) {}
    }

    async function checkGmInvitation(user) {
        try {
            var res = await fetch(API_URL + '/api/notifications', {
                headers: { 'X-Auth-Key': user.authKey }
            });
            var data = await res.json();
            if (!data.gm_invite) return;
            var el = document.getElementById('gmInviteNotice');
            if (!el) return;
            el.innerHTML =
                '<div style="background:#050f1a;border:2px solid #d4af37;border-radius:12px;padding:1.25rem 1.5rem;margin-top:1rem;">' +
                '<div style="font-size:0.72rem;color:#d4af37;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem;">&#128081; GM Invitation</div>' +
                '<p style="color:#e0cfc0;font-size:0.9rem;margin:0 0 0.75rem 0;">You\'ve been invited to become a <strong>Game Master [GM]</strong>. Upon accepting you will receive <strong style="color:#d4af37;">+500 Community Points</strong> and full GM access.</p>' +
                '<div style="display:flex;gap:0.75rem;">' +
                '<button class="btn btn-gold" onclick="respondGmInvite(true)">Accept</button>' +
                '<button class="btn btn-dark" onclick="respondGmInvite(false)">Decline</button>' +
                '</div>' +
                '<div id="gmInviteMsg" class="msg" style="margin-top:0.5rem;"></div>' +
                '</div>';
        } catch(e) {}
    }

    window.respondGmInvite = async function(accept) {
        var user = null;
        try { user = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!user) return;
        var msgEl = document.getElementById('gmInviteMsg');
        try {
            var res = await fetch(API_URL + '/api/gm/invitations/respond', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': user.authKey },
                body: JSON.stringify({ accept: accept })
            });
            var data = await res.json();
            if (data.success) {
                if (accept) {
                    user.role = 'MASTER'; user.sorc_role = 'GM-ADV';
                    user.community_points = (user.community_points || 0) + 500;
                    localStorage.setItem('sorc_user', JSON.stringify(user));
                    document.getElementById('gmInviteNotice').innerHTML =
                        '<div style="background:#0a1a0a;border:1px solid #1a6b1a;border-radius:8px;padding:1rem 1.25rem;margin-top:1rem;color:#4caf50;font-size:0.9rem;">✅ You are now a Game Master [GM]. Refreshing...</div>';
                    setTimeout(function() { window.location.reload(); }, 1800);
                } else {
                    document.getElementById('gmInviteNotice').innerHTML = '';
                }
            } else {
                if (msgEl) { msgEl.className = 'msg error'; msgEl.textContent = data.error || 'Failed.'; }
            }
        } catch(e) { if (msgEl) { msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.'; } }
    };

    window.respondAdminInvite = async function(accept) {
        var user = null;
        try { user = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!user) return;
        var msgEl = document.getElementById('inviteMsg');
        try {
            var res = await fetch(API_URL + '/api/admin/invitations/respond', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': user.authKey },
                body: JSON.stringify({ accept: accept })
            });
            var data = await res.json();
            if (data.success) {
                if (accept) {
                    user.role = 'ADMIN';
                    user.community_points = (user.community_points || 0) + 10000;
                    localStorage.setItem('sorc_user', JSON.stringify(user));
                    document.getElementById('adminInviteNotice').innerHTML =
                        '<div style="background:#0a1a0a;border:1px solid #1a6b1a;border-radius:8px;padding:1rem 1.25rem;margin-top:1rem;color:#4caf50;font-size:0.9rem;">✅ You are now a SORC Admin [AD]. Reload the page to see your updated role.</div>';
                } else {
                    document.getElementById('adminInviteNotice').innerHTML = '';
                }
            } else {
                if (msgEl) { msgEl.className = 'msg error'; msgEl.textContent = data.error || 'Failed.'; }
            }
        } catch(e) { if (msgEl) { msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.'; } }
    };
    </script>
