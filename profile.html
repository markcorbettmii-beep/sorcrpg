<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Slayers of Rings § Crowns</title>
    <link rel="icon" href="IMG_3419.jpeg" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        body { background: #111; color: #e0cfc0; font-family: sans-serif; }
        .profile-container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 2rem;
            background: #1a1a1a;
            border-radius: 1rem;
            border: 1px solid #333;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #d0021b;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #555;
            overflow: hidden;
            flex-shrink: 0;
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-username { font-size: 1.4rem; font-weight: bold; color: #e0cfc0; }
        .profile-role {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 4px;
        }
        .profile-field {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            background: #222;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .profile-field label { font-size: 0.8rem; color: #888; display: block; margin-bottom: 4px; }
        .profile-input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            margin-bottom: 8px;
        }
        .upgrade-section {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #1a1a2a;
            border: 1px solid #444;
            border-radius: 8px;
        }
        .upgrade-section h3 { color: #d4af37; margin-bottom: 0.5rem; }
        .upgrade-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 2px solid #444;
            background: #222;
            color: #e0cfc0;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            text-align: left;
            transition: border-color 0.2s;
        }
        .upgrade-btn:hover { border-color: #d4af37; }
        .upgrade-info {
            display: none;
            background: #2a1a00;
            border: 1px solid #d4af37;
            color: #d4af37;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 0.5rem;
            font-size: 0.88rem;
            line-height: 1.6;
        }
        .master-code-input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            margin-top: 8px;
            margin-bottom: 8px;
            box-sizing: border-box;
        }
        .btn { padding: 8px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-red { background: #d0021b; color: #fff; }
        .btn-gold { background: #d4af37; color: #222; }
        .btn-green { background: #1a6b1a; color: #fff; }
        .msg { margin-top: 0.5rem; font-size: 0.9rem; }
        .msg.success { color: #4caf50; }
        .msg.error { color: #d0021b; }
        .not-logged-in { text-align: center; padding: 3rem; }
        .not-logged-in a { color: #d0021b; }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .avatar-option {
            border: 3px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            transition: border-color 0.2s;
            background: #2a2a2a;
        }
        .avatar-option:hover { border-color: #d4af37; }
        .avatar-option.selected { border-color: #d0021b; }
        .avatar-placeholder {
            width: 100%;
            aspect-ratio: 1;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 0.7rem;
        }
        .avatar-preview {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>
    <div id="profileApp">
        <div class="not-logged-in"><p>Loading...</p></div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDu25MxYjeu-g6YjPjaOpfUSUw97yJj-Xg",
            authDomain: "sorc-a1393.firebaseapp.com",
            projectId: "sorc-a1393",
            storageBucket: "sorc-a1393.firebasestorage.app",
            messagingSenderId: "303646936307",
            appId: "1:303646936307:web:806bdcdc37c9e5c024bb86"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAILS = ["markcorbett.mii@gmail.com", "corbett@sorcrpg.com"];

        var badWords = ['fuck','shit','ass','bitch','cunt','dick','cock','pussy','nigger','nigga','faggot','retard','whore','slut','bastard','crap','piss','prick','twat','wanker','bollocks'];
        function containsBadWord(str) {
            var lower = str.toLowerCase().replace(/[^a-z0-9]/g, '');
            return badWords.some(function(w) { return lower.includes(w); });
        }
        function isValidUsername(u) {
            if (u.length < 3) return 'Username must be at least 3 characters.';
            if (u.length > 20) return 'Username must be 20 characters or less.';
            if (!/^[a-zA-Z0-9_]+$/.test(u)) return 'Letters, numbers and underscores only.';
            if (containsBadWord(u)) return 'Username contains inappropriate language.';
            return null;
        }

        function roleColor(role) {
            if (role === 'BOUNCER') return 'background:#d4af37;color:#222;';
            if (role === 'MASTER') return 'background:#1a6b1a;color:#fff;';
            if (role === 'PLAYER') return 'background:#1a3a6b;color:#fff;';
            return 'background:#333;color:#e0cfc0;';
        }
        function roleAbbr(role) {
            if (role === 'BOUNCER') return '[AD]';
            if (role === 'MASTER') return '[GM]';
            if (role === 'PLAYER') return '[PC]';
            return '[CIV]';
        }

        function getAvatarPath(avatarId) {
            if (!avatarId) return null;
            return 'assets/images/avatars/' + avatarId + '.png';
        }

        var selectedAvatar = null;
        var currentUid = null;

        function buildAvatarGrid(currentAvatar) {
            var avatars = ['avatar1','avatar2','avatar3','avatar4','avatar5','avatar6','avatar7','avatar8','avatar9','avatar10','avatar11','avatar12'];
            return avatars.map(function(id) {
                var sel = id === currentAvatar ? ' selected' : '';
                var avatarPath = getAvatarPath(id);
                var inner = '<div class="avatar-placeholder">' + id + '</div>';
                return '<div class="avatar-option' + sel + '" onclick="pickAvatar(this, \'' + id + '\')" id="avataropt-' + id + '">' +
                    inner +
                '</div>';
            }).join('');
        }

        window.pickAvatar = function(el, id) {
            document.querySelectorAll('.avatar-option').forEach(function(o) { o.classList.remove('selected'); });
            el.classList.add('selected');
            selectedAvatar = id;
            // Update the header avatar preview immediately
            var headerAvatar = document.getElementById('headerAvatar');
            if (headerAvatar) {
                var path = getAvatarPath(id);
                headerAvatar.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#555;">' + id + '</div>';
            }
        };

        var googleUser = null;
        var savedGoogle = localStorage.getItem('sorc_google_user');
        if (savedGoogle) { try { googleUser = JSON.parse(savedGoogle); } catch(e) {} }

        onAuthStateChanged(auth, async function(user) {
            if (user) {
                currentUid = user.uid;
                var email = user.email;
                var role = ADMIN_EMAILS.includes(email) ? 'BOUNCER' : 'CIVILIAN';
                var username = '';
                var avatar = null;
                var userId = '';

                var docSnap = await getDoc(doc(db, "users", currentUid));
                if (docSnap.exists()) {
                    role = ADMIN_EMAILS.includes(email) ? 'BOUNCER' : (docSnap.data().role || 'CIVILIAN');
                    username = docSnap.data().username || docSnap.data().displayName || '';
                    avatar = docSnap.data().avatar || null;
                    userId = docSnap.data().userId || '';
                }
                selectedAvatar = avatar;
                renderProfile(currentUid, email, role, username, avatar, userId);
            } else if (googleUser) {
                currentUid = googleUser.googleId;
                selectedAvatar = googleUser.avatar || null;
                renderProfile(googleUser.googleId, googleUser.email, ADMIN_EMAILS.includes(googleUser.email) ? 'BOUNCER' : (googleUser.role || 'CIVILIAN'), googleUser.username || googleUser.name || '', googleUser.avatar || null, googleUser.userId || '');
            } else {
                document.getElementById('profileApp').innerHTML =
                    '<div class="not-logged-in"><h2>Not logged in</h2><p><a href="index.html">Go back and sign in</a></p></div>';
            }
        });

        function renderProfile(uid, email, role, username, avatar, userId) {
            var upgradeSection = '';
            if (role === 'CIVILIAN') {
                upgradeSection = `
                <div class="upgrade-section">
                    <h3>Upgrade Your Account</h3>
                    <button class="upgrade-btn" onclick="toggleInfo('pc-info')">▶ Upgrade to PLAYER (Player Character)</button>
                    <div class="upgrade-info" id="pc-info">
                        To upgrade to PLAYER, you must pass a <b>SorC Player Assessment</b>. Assessments are currently under heavy development. Your CIVILIAN account will be linked when they launch.
                    </div>
                    <button class="upgrade-btn" onclick="toggleInfo('gm-info')">▶ Upgrade to MASTER (Game Master)</button>
                    <div class="upgrade-info" id="gm-info">
                        To upgrade to MASTER, you must pass a <b>SorC Master Assessment</b> AND redeem an official Master Code.<br/><br/>
                        Have a code?<br/>
                        <input type="text" id="masterCodeInput" class="master-code-input" placeholder="Enter Master Code" />
                        <button class="btn btn-green" onclick="redeemCode('${uid}')">Redeem</button>
                        <div id="codeMsg" class="msg"></div>
                    </div>
                </div>`;
            } else if (role === 'PLAYER') {
                upgradeSection = `
                <div class="upgrade-section">
                    <h3>Upgrade to MASTER</h3>
                    <button class="upgrade-btn" onclick="toggleInfo('gm-info-pc')">▶ Upgrade to MASTER (Game Master)</button>
                    <div class="upgrade-info" id="gm-info-pc">
                        To upgrade from PLAYER to MASTER, you must pass a <b>SorC Master Assessment</b> AND redeem an official Master Code.<br/><br/>
                        Have a code?<br/>
                        <input type="text" id="masterCodeInput" class="master-code-input" placeholder="Enter Master Code" />
                        <button class="btn btn-green" onclick="redeemCode('${uid}')">Redeem</button>
                        <div id="codeMsg" class="msg"></div>
                    </div>
                </div>`;
            }

            var avatarDisplay = avatar
                ? '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#555;">' + avatar + '</div>'
                : '<div style="font-size:0.7rem;color:#555;">No avatar</div>';

            document.getElementById('profileApp').innerHTML = `
                <div class="profile-container">
                    <div class="profile-header">
                        <div class="profile-avatar" id="headerAvatar">
                            ${avatarDisplay}
                        </div>
                        <div>
                            <div class="profile-username" id="headerUsername">${username || 'No username'}</div>
                            <span class="profile-role" style="${roleColor(role)}">${role} ${roleAbbr(role)}</span>
                            ${userId ? '<div style="font-size:0.75rem;color:#555;margin-top:4px;">ID: #' + userId + '</div>' : ''}
                        </div>
                    </div>

                    <div class="profile-field">
                        <label>EMAIL</label>
                        <span>${email}</span>
                    </div>

                    <div class="profile-field">
                        <label>USERNAME</label>
                        <input type="text" id="usernameInput" class="profile-input" value="${username}" maxlength="20" placeholder="Choose a username" />
                        <button class="btn btn-gold" onclick="saveUsername('${uid}')">Save Username</button>
                        <div id="usernameMsg" class="msg"></div>
                    </div>

                    <div class="profile-field">
                        <label>AVATAR</label>
                        <div class="avatar-grid" style="margin-top:0.5rem;">${buildAvatarGrid(avatar)}</div>
                        <button class="btn btn-gold" onclick="saveAvatar('${uid}')">Save Avatar</button>
                        <div id="avatarMsg" class="msg"></div>
                    </div>

                    ${upgradeSection}
                    <br/>
                    <button class="btn btn-red" onclick="doSignOut()">Logout</button>
                    &nbsp;
                    <a href="index.html" class="btn btn-gold" style="text-decoration:none;">Home</a>
                </div>
            `;
        }

        window.toggleInfo = function(id) {
            var el = document.getElementById(id);
            if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
        };

        window.saveUsername = async function(uid) {
            var newUsername = document.getElementById('usernameInput').value.trim();
            var msgEl = document.getElementById('usernameMsg');
            var err = isValidUsername(newUsername);
            if (err) { msgEl.className = 'msg error'; msgEl.textContent = err; return; }

            var q = query(collection(db, "users"), where("username", "==", newUsername));
            var existing = await getDocs(q);
            var taken = false;
            existing.forEach(function(d) { if (d.id !== uid) taken = true; });
            if (taken) { msgEl.className = 'msg error'; msgEl.textContent = 'That username is already taken.'; return; }

            await updateDoc(doc(db, "users", uid), { username: newUsername, displayName: newUsername });

            // Update header immediately
            var headerUsername = document.getElementById('headerUsername');
            if (headerUsername) headerUsername.textContent = newUsername;

            // Update localStorage for Google users
            var savedGoogle = localStorage.getItem('sorc_google_user');
            if (savedGoogle) {
                try {
                    var userInfo = JSON.parse(savedGoogle);
                    userInfo.username = newUsername;
                    localStorage.setItem('sorc_google_user', JSON.stringify(userInfo));
                } catch(e) {}
            }

            msgEl.className = 'msg success';
            msgEl.textContent = '✅ Username saved!';
        };

        window.saveAvatar = async function(uid) {
            var msgEl = document.getElementById('avatarMsg');
            if (!selectedAvatar) { msgEl.className = 'msg error'; msgEl.textContent = 'Please select an avatar first.'; return; }

            await updateDoc(doc(db, "users", uid), { avatar: selectedAvatar });

            // Update header avatar immediately
            var headerAvatar = document.getElementById('headerAvatar');
            if (headerAvatar) {
                headerAvatar.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#555;">' + selectedAvatar + '</div>';
            }

            // Update localStorage for Google users
            var savedGoogle = localStorage.getItem('sorc_google_user');
            if (savedGoogle) {
                try {
                    var userInfo = JSON.parse(savedGoogle);
                    userInfo.avatar = selectedAvatar;
                    localStorage.setItem('sorc_google_user', JSON.stringify(userInfo));
                } catch(e) {}
            }

            msgEl.className = 'msg success';
            msgEl.textContent = '✅ Avatar saved!';
        };

        window.doSignOut = function() {
            signOut(auth).then(function() {
                localStorage.removeItem('sorc_google_user');
                window.location.href = 'index.html';
            });
        };

        window.redeemCode = async function(uid) {
            var code = document.getElementById('masterCodeInput').value.trim();
            var msgEl = document.getElementById('codeMsg');
            if (!code) { msgEl.className = 'msg error'; msgEl.textContent = 'Please enter a code.'; return; }
            var codesSnap = await getDocs(collection(db, "gm_codes"));
            var matched = null;
            codesSnap.forEach(function(d) { if (d.data().code === code && !d.data().used) matched = d.id; });
            if (!matched) { msgEl.className = 'msg error'; msgEl.textContent = 'Invalid or already used code.'; return; }
            await updateDoc(doc(db, "users", uid), { role: 'MASTER' });
            msgEl.className = 'msg success';
            msgEl.textContent = '✅ You are now a MASTER! Reload to see your updated role.';
        };
    </script>
</body>
</html>
