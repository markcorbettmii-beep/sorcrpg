<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Slayers of Rings § Crowns</title>
    <link rel="icon" href="IMG_3419.jpeg" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        .profile-container { max-width: 680px; margin: 2rem auto; padding: 1rem; }
        .back-link { display: inline-block; color: #d4af37; text-decoration: none; font-size: 0.85rem; margin-bottom: 1rem; }
        .back-link:hover { text-decoration: underline; }
        .profile-card { background: #1a1a1a; border-radius: 1rem; border: 1px solid #333; overflow: hidden; margin-bottom: 1rem; }
        .profile-banner { width: 100%; height: 120px; background: linear-gradient(135deg, #1a0a0a, #2a0808, #d0021b22); }
        .profile-info-row { display: flex; align-items: flex-end; gap: 1rem; padding: 0 1.5rem; margin-top: -40px; margin-bottom: 1rem; }
        .profile-avatar-large { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #d0021b; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #555; overflow: hidden; flex-shrink: 0; }
        .profile-name-block { flex: 1; padding-bottom: 0.5rem; }
        .profile-username { font-size: 1.3rem; font-weight: bold; color: #e0cfc0; }
        .profile-role-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; margin-top: 3px; }
        .profile-title { font-size: 0.8rem; color: #d4af37; margin-top: 2px; font-style: italic; }
        .profile-section { padding: 1rem 1.5rem; border-top: 1px solid #2a2a2a; }
        .profile-section h3 { color: #d4af37; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.75rem 0; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
        .stat-box { background: #222; border-radius: 8px; padding: 0.75rem; text-align: center; border: 1px solid #333; }
        .stat-box .stat-val { font-size: 1.2rem; font-weight: bold; color: #d4af37; }
        .stat-box .stat-label { font-size: 0.7rem; color: #666; margin-top: 2px; }
        .profile-field { margin-bottom: 0.75rem; }
        .profile-field label { font-size: 0.75rem; color: #888; display: block; margin-bottom: 3px; }
        .profile-field p { font-size: 0.9rem; color: #c0b090; margin: 0; line-height: 1.6; }
        .hidden-val { font-size: 0.85rem; color: #444; font-style: italic; }
        .not-found { text-align: center; padding: 3rem; color: #555; }
        .loading { text-align: center; padding: 3rem; color: #555; }
        .pro-badge { display: inline-block; background: #d0021b; color: #fff; font-size: 0.7rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
        .basic-badge { display: inline-block; background: #333; color: #888; font-size: 0.7rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
        .locked-achievements { opacity: 0.4; }
        .msg { font-size: 0.85rem; margin-top: 0.5rem; }
        .msg.success { color: #4caf50; }
        .msg.error { color: #d0021b; }
    </style>
</head>
<body>
  <div class="page-wrapper">
    <header class="header-container">
      <span class="sorc-letters">S O R C</span><img src="sorc-letters-evil.jpg" class="sorc-letters-img evil-only" alt="SORC" /><img src="sorc-letters-lawful.jpg" class="sorc-letters-img lawful-only" alt="SORC" />
    </header>
    <script>(function(){var t=localStorage.getItem('themeSelected')||'evil';if(t==='lawful')document.body.classList.add('lawful-mode');})();</script>
    <div class="profile-container">
        <a href="javascript:history.back()" class="back-link">← Back</a>
        <div id="profileApp"><div class="loading">Loading profile...</div></div>
    </div>
    <div id="footer"></div>
    <script type="module" src="main.js"></script>
    <script>
    var API_URL = 'https://api.sorcrpg.com';
    var OWNER_EMAILS = ['corbett@sorcrpg.com'];
    var ADMIN_EMAILS = ['markcorbett.mii@gmail.com'];

    function getRoleColor(role) {
        if (role === 'OWNER') return 'background:#d4af37;color:#222;';
        if (role === 'ADMIN') return 'background:#8B0000;color:#fff;';
        if (role === 'MASTER') return 'background:#1a6b1a;color:#fff;';
        if (role === 'PLAYER') return 'background:#1a3a6b;color:#fff;';
        return 'background:#333;color:#e0cfc0;';
    }
    function getRoleAbbr(role) {
        if (role === 'OWNER') return '[OWN]';
        if (role === 'ADMIN') return '[AD]';
        if (role === 'MASTER') return '[GM]';
        if (role === 'PLAYER') return '[PC]';
        return '[CIV]';
    }
    function getRoleLabel(role) {
        if (role === 'OWNER') return 'Owner';
        if (role === 'ADMIN') return 'Admin';
        if (role === 'MASTER') return 'Game Master';
        if (role === 'PLAYER') return 'Player Character';
        return 'Civilian';
    }
    function escapeHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    document.addEventListener('DOMContentLoaded', async function() {
        var params = new URLSearchParams(window.location.search);
        var userId = params.get('uid') || params.get('username');

        if (!userId) {
            document.getElementById('profileApp').innerHTML = '<div class="not-found">No profile specified.</div>';
            return;
        }

        try {
            var res = await fetch(API_URL + '/api/profile/' + userId);
            var data = await res.json();

            if (data.error || !data.user) {
                document.getElementById('profileApp').innerHTML = '<div class="not-found">Profile not found.</div>';
                return;
            }

            var user = data.user;
            var role = user.role || 'CIVILIAN';
            if (OWNER_EMAILS.includes(user.email)) role = 'OWNER';
            else if (ADMIN_EMAILS.includes(user.email)) role = 'ADMIN';

            var username = user.display_name || user.username || 'Unknown Adventurer';
            var communityPoints = user.community_points || 0;
            var postCount = user.post_count || 0;
            var titles = user.titles ? (typeof user.titles === 'string' ? JSON.parse(user.titles) : user.titles) : [];
            var joinDate = user.join_date || user.created_at || '';
            var avatar = user.avatar || null;
            var bio = user.bio || null;

            var titleDisplay = titles.length > 0 ? '<div class="profile-title">' + titles.join(' · ') + '</div>' : '';
            var statusBadge = (user.membership === 'pro' || user.pro_member || user.box_set_redeemed)
                ? '<span class="pro-badge">SORC Pro</span>'
                : '<span class="basic-badge">SORC Basic</span>';

            var avatarDisplay = avatar
                ? '<img src="images/avatars/' + escapeHtml(avatar) + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentNode.innerHTML=\'👤\'" />'
                : username.charAt(0).toUpperCase();

            var bioSection = bio
                ? '<div class="profile-section"><h3>About</h3><div class="profile-field"><p>' + escapeHtml(bio) + '</p></div></div>'
                : '';

            var emailSection = (user.email && !user.privacy_email)
                ? '<div class="profile-section"><h3>Contact</h3><div class="profile-field"><p style="font-size:0.88rem;color:#c0b090;">' + escapeHtml(user.email) + '</p></div></div>'
                : '';

            var achievementsSection =
                '<div class="profile-section"><h3>Achievements <span style="font-size:0.7rem;color:#555;font-weight:normal;">(SORC Beyond Pro)</span></h3>'
                + '<div class="locked-achievements" style="display:flex;flex-wrap:wrap;gap:0.5rem;">'
                + '<div style="background:#222;border:1px solid #333;border-radius:8px;padding:6px 12px;font-size:0.8rem;color:#555;">🏆 ???</div>'
                + '<div style="background:#222;border:1px solid #333;border-radius:8px;padding:6px 12px;font-size:0.8rem;color:#555;">🏆 ???</div>'
                + '<div style="background:#222;border:1px solid #333;border-radius:8px;padding:6px 12px;font-size:0.8rem;color:#555;">🏆 ???</div></div>'
                + '<div style="font-size:0.72rem;color:#444;margin-top:6px;">🔒 Unlocks with SORC Beyond Pro</div></div>';

            var currentUser = null;
            try { currentUser = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
            var isSelf = currentUser && (currentUser.id === user.id || currentUser.username === user.username);

            var actionSection = '';
            if (isSelf) {
                actionSection = '<div class="profile-section"><a href="profile.html" style="display:block;text-align:center;background:#d4af37;color:#222;padding:12px;border-radius:8px;font-weight:bold;text-decoration:none;">✏️ Edit Your Profile</a></div>';
            } else if (!currentUser) {
                actionSection = '<div class="profile-section"><p style="font-size:0.85rem;color:#555;"><a href="signin.html" style="color:#d4af37;">Sign in</a> to connect with ' + escapeHtml(username) + '.</p></div>';
            } else {
                var viewerEmail = currentUser.email || '';
                var isOwnerViewer = OWNER_EMAILS.includes(viewerEmail);
                var isAdminViewer = isOwnerViewer || ADMIN_EMAILS.includes(viewerEmail);
                var targetUid = escapeHtml(user.id || user.user_id || '');

                var modSection = '';
                if (isAdminViewer && !isSelf) {
                    var roleSelect =
                        '<select id="modRoleSelect" style="padding:7px 8px;border-radius:6px;border:1px solid #444;background:#222;color:#e0cfc0;font-size:0.82rem;' + (!isOwnerViewer ? 'opacity:0.4;cursor:not-allowed;' : '') + '" ' + (!isOwnerViewer ? 'disabled title="Owner only"' : '') + '>'
                            + ['CIVILIAN','PLAYER','MASTER','ADMIN'].map(function(r) {
                                return '<option value="' + r + '"' + (r === role ? ' selected' : '') + '>' + r + '</option>';
                            }).join('')
                        + '</select>'
                        + '<button onclick="modSetRole()" style="padding:7px 14px;border:none;border-radius:6px;font-weight:bold;font-size:0.82rem;cursor:pointer;' + (isOwnerViewer ? 'background:#d4af37;color:#222;' : 'background:#333;color:#555;cursor:not-allowed;') + '" ' + (!isOwnerViewer ? 'disabled title="Owner only"' : '') + '>Set Role</button>';

                    modSection =
                        '<div style="margin-top:1rem;padding-top:1rem;border-top:1px solid #2a2a2a;">'
                        + '<div style="font-size:0.72rem;color:#d4af37;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.6rem;">Moderation</div>'
                        + '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;">'
                            + '<button onclick="modWarn()" style="padding:7px 14px;background:#d4af37;color:#222;border:none;border-radius:6px;font-weight:bold;font-size:0.82rem;cursor:pointer;">⚠ Warn</button>'
                            + '<button onclick="modSuspend()" style="padding:7px 14px;background:#555;color:#fff;border:none;border-radius:6px;font-weight:bold;font-size:0.82rem;cursor:pointer;">⏸ Suspend</button>'
                            + (isOwnerViewer ? '<button onclick="modBan()" style="padding:7px 14px;background:#d0021b;color:#fff;border:none;border-radius:6px;font-weight:bold;font-size:0.82rem;cursor:pointer;">🚫 Ban</button>' : '')
                            + roleSelect
                        + '</div>'
                        + '<div id="modMsg" class="msg" style="margin-top:0.4rem;"></div>'
                        + '</div>';
                }

                actionSection = '<div class="profile-section">'
                    + '<div style="display:flex;gap:0.75rem;flex-wrap:wrap;">'
                        + '<button onclick="startMessage()" style="padding:9px 18px;background:#d0021b;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:0.85rem;">✉ Message</button>'
                        + '<button id="fellowshipBtn" onclick="sendFellowship()" style="padding:9px 18px;background:#1a3a6b;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:0.85rem;">⚔ Add Fellowship</button>'
                        + '<button id="blockBtn" onclick="toggleBlock(false)" style="padding:9px 18px;background:#333;color:#e0cfc0;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:0.85rem;">🚫 Block</button>'
                        + '<button onclick="reportUser()" style="padding:9px 18px;background:#222;color:#555;border:1px solid #333;border-radius:8px;font-weight:bold;cursor:pointer;font-size:0.85rem;">🚩 Report</button>'
                    + '</div>'
                    + modSection
                    + '<div id="actionMsg" class="msg" style="margin-top:0.5rem;"></div>'
                + '</div>';
            }

            document.getElementById('profileApp').innerHTML =
                '<div class="profile-card">'
                    + '<div class="profile-banner"></div>'
                    + '<div class="profile-info-row">'
                        + '<div class="profile-avatar-large">' + avatarDisplay + '</div>'
                        + '<div class="profile-name-block">'
                            + '<div class="profile-username">' + escapeHtml(username) + statusBadge + '</div>'
                            + '<span class="profile-role-tag" style="' + getRoleColor(role) + ';cursor:pointer;user-select:none;-webkit-user-select:none;" data-username="' + escapeHtml(username) + '" data-uid="' + escapeHtml(String(user.user_id || user.id || '')) + '" data-role="' + role + '" onclick="var el=this;window.showRolePopup&&window.showRolePopup(el.dataset.username,el.dataset.uid,el.dataset.role)">' + getRoleLabel(role) + ' ' + getRoleAbbr(role) + '</span>'
                            + titleDisplay
                            + (user.user_id ? '<div style="font-size:0.7rem;color:#444;margin-top:3px;">ID: #' + user.user_id + '</div>' : '')
                        + '</div>'
                    + '</div>'
                    + '<div class="profile-section">'
                        + '<div class="stat-grid">'
                            + '<div class="stat-box"><div class="stat-val">' + communityPoints + '</div><div class="stat-label">Community Points</div></div>'
                            + '<div class="stat-box"><div class="stat-val">' + postCount + '</div><div class="stat-label">Forum Posts</div></div>'
                            + '<div class="stat-box"><div class="stat-val">' + titles.length + '</div><div class="stat-label">Titles Earned</div></div>'
                        + '</div>'
                        + (joinDate ? '<div style="font-size:0.75rem;color:#555;margin-top:0.5rem;">Member since ' + new Date(joinDate).toLocaleDateString() + '</div>' : '')
                    + '</div>'
                    + bioSection
                    + emailSection
                    + achievementsSection
                    + actionSection
                + '</div>';

            if (!isSelf && currentUser && currentUser.authKey) {
                loadProfileActions(user.id, currentUser.authKey);
            }

        } catch(e) {
            document.getElementById('profileApp').innerHTML = '<div class="not-found">Could not load profile.</div>';
        }
    });

    window.reportUser = async function() {
        var currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!currentUser || !currentUser.authKey) { window.location.href = 'signin.html'; return; }
        var params = new URLSearchParams(window.location.search);
        var uid = params.get('uid') || params.get('username');
        var reason = prompt('Reason for report:\n(harassment, spam, impersonation, inappropriate content, other)');
        if (!reason) return;
        var msgEl = document.getElementById('actionMsg');
        try {
            var res = await fetch(API_URL + '/api/users/' + uid + '/report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': currentUser.authKey },
                body: JSON.stringify({ reason: reason })
            });
            var data = await res.json();
            msgEl.className = 'msg ' + (data.success ? 'success' : 'error');
            msgEl.textContent = data.success ? '✅ Report submitted. Thank you.' : (data.error || 'Failed to submit report.');
        } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.'; }
    };

    function getProfileUid() {
        var params = new URLSearchParams(window.location.search);
        return params.get('uid') || params.get('username');
    }
    function getModUser() {
        var u = null; try { u = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {} return u;
    }
    async function modApiCall(path, body) {
        var u = getModUser();
        var res = await fetch(API_URL + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Auth-Key': u ? u.authKey : '' },
            body: JSON.stringify(body)
        });
        return res.json();
    }
    function modMsg(text, ok) {
        var el = document.getElementById('modMsg');
        if (el) { el.className = 'msg ' + (ok ? 'success' : 'error'); el.textContent = text; }
    }

    window.modWarn = async function() {
        var reason = prompt('Warning reason:');
        if (!reason) return;
        try {
            var data = await modApiCall('/api/admin/members/' + getProfileUid() + '/warn', { reason: reason });
            modMsg(data.success ? '✅ Warning issued.' : (data.error || 'Failed.'), data.success);
        } catch(e) { modMsg('Connection error.', false); }
    };

    window.modSuspend = async function() {
        var days = prompt('Suspend for how many days? (1, 3, 7, 30)');
        if (!days) return;
        try {
            var data = await modApiCall('/api/admin/members/' + getProfileUid() + '/suspend', { days: parseInt(days) });
            modMsg(data.success ? '✅ Suspended for ' + days + ' day(s).' : (data.error || 'Failed.'), data.success);
        } catch(e) { modMsg('Connection error.', false); }
    };

    window.modBan = async function() {
        var reason = prompt('Ban reason (permanent):');
        if (!reason) return;
        if (!confirm('Permanently ban this member?')) return;
        try {
            var data = await modApiCall('/api/admin/members/' + getProfileUid() + '/ban', { reason: reason });
            modMsg(data.success ? '✅ Member banned.' : (data.error || 'Failed.'), data.success);
        } catch(e) { modMsg('Connection error.', false); }
    };

    window.modSetRole = async function() {
        var sel = document.getElementById('modRoleSelect');
        if (!sel) return;
        var role = sel.value;
        var u = getModUser();
        var targetUid = getProfileUid();
        if (role === 'ADMIN') {
            if (!confirm('Send an Admin invitation to this member? They will receive an inbox message and must accept to receive the role and 10,000 CP.')) return;
            try {
                var invRes = await fetch(API_URL + '/api/admin/invitations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Auth-Key': u ? u.authKey : '' },
                    body: JSON.stringify({ uid: targetUid })
                });
                var invData = await invRes.json();
                modMsg(invData.success ? '✅ Admin invitation sent. Awaiting acceptance.' : (invData.error || 'Failed.'), invData.success);
                if (invData.success) {
                    try {
                        fetch(API_URL + '/api/conversations', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-Auth-Key': u ? u.authKey : '' },
                            body: JSON.stringify({ recipient_uid: targetUid, initial_message: "You've been invited to become a SORC Admin [AD] by the Owner. Upon accepting you will receive 10,000 Community Points. To accept or decline, visit your Profile page." })
                        });
                    } catch(e) {}
                }
            } catch(e) { modMsg('Connection error.', false); }
            return;
        }
        if (!confirm('Set role to ' + role + '?')) return;
        try {
            var res = await fetch(API_URL + '/api/admin/members/' + targetUid + '/role', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': u ? u.authKey : '' },
                body: JSON.stringify({ role: role })
            });
            var data;
            try { data = await res.json(); } catch(e) { data = { success: false, error: 'Server error (' + res.status + ')' }; }
            modMsg(data.success ? '✅ Role updated to ' + role + '.' : (data.error || 'Failed (' + res.status + ')'), data.success);
            if (data.success) {
                try {
                    fetch(API_URL + '/api/conversations', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-Auth-Key': u ? u.authKey : '' },
                        body: JSON.stringify({ recipient_uid: targetUid, initial_message: 'Your SORC role has been updated to ' + role + '. If you have questions about this change, please contact an admin.' })
                    });
                } catch(e) {}
            }
        } catch(e) { modMsg('Network error: ' + (e.message || 'check connection'), false); }
    };

    window.startMessage = function() {
        var params = new URLSearchParams(window.location.search);
        var uid = params.get('uid') || params.get('username');
        window.location.href = 'inbox.html?to=' + encodeURIComponent(uid);
    };

    var _profileTargetUid = null;
    var _iBlocked = false;

    async function loadProfileActions(targetUid, authKey) {
        _profileTargetUid = targetUid;
        try {
            var results = await Promise.allSettled([
                fetch(API_URL + '/api/fellowships/status/' + targetUid, { headers: { 'X-Auth-Key': authKey } }).then(function(r) { return r.json(); }),
                fetch(API_URL + '/api/blocks/check/' + targetUid, { headers: { 'X-Auth-Key': authKey } }).then(function(r) { return r.json(); })
            ]);
            var fellowStatus = results[0].status === 'fulfilled' ? results[0].value : { status: 'none' };
            var blockStatus = results[1].status === 'fulfilled' ? results[1].value : { i_blocked: false };
            _iBlocked = !!blockStatus.i_blocked;

            var fellowBtn = document.getElementById('fellowshipBtn');
            if (fellowBtn) {
                if (fellowStatus.status === 'accepted') {
                    fellowBtn.textContent = '✓ Fellows';
                    fellowBtn.disabled = true;
                    fellowBtn.style.opacity = '0.55';
                    fellowBtn.style.cursor = 'default';
                } else if (fellowStatus.status === 'pending_sent') {
                    fellowBtn.textContent = '⏳ Request Sent';
                    fellowBtn.disabled = true;
                    fellowBtn.style.opacity = '0.55';
                    fellowBtn.style.cursor = 'default';
                } else if (fellowStatus.status === 'pending_received') {
                    fellowBtn.textContent = '⚔ Accept Fellowship';
                    fellowBtn.style.background = '#1a6b1a';
                }
            }

            var blockBtn = document.getElementById('blockBtn');
            if (blockBtn) {
                if (_iBlocked) {
                    blockBtn.textContent = '🔓 Unblock';
                    blockBtn.setAttribute('onclick', 'toggleBlock(true)');
                }
            }
        } catch(e) {}
    }

    window.toggleBlock = async function(isCurrentlyBlocked) {
        var currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!currentUser || !currentUser.authKey) { window.location.href = 'signin.html'; return; }
        var uid = _profileTargetUid || (new URLSearchParams(window.location.search).get('uid'));
        if (!uid) return;
        var msgEl = document.getElementById('actionMsg');
        var blockBtn = document.getElementById('blockBtn');
        try {
            if (isCurrentlyBlocked) {
                await fetch(API_URL + '/api/blocks/' + uid, { method: 'DELETE', headers: { 'X-Auth-Key': currentUser.authKey } });
                if (blockBtn) { blockBtn.textContent = '🚫 Block'; blockBtn.setAttribute('onclick', 'toggleBlock(false)'); }
                if (msgEl) { msgEl.className = 'msg success'; msgEl.textContent = 'Member unblocked.'; }
            } else {
                if (!confirm('Block this member? They will not be able to send you messages or fellowship requests.')) return;
                await fetch(API_URL + '/api/blocks/' + uid, { method: 'POST', headers: { 'X-Auth-Key': currentUser.authKey } });
                if (blockBtn) { blockBtn.textContent = '🔓 Unblock'; blockBtn.setAttribute('onclick', 'toggleBlock(true)'); }
                if (msgEl) { msgEl.className = 'msg success'; msgEl.textContent = 'Member blocked.'; }
            }
        } catch(e) {
            if (msgEl) { msgEl.className = 'msg error'; msgEl.textContent = 'Could not complete action. Please try again.'; }
        }
    };

    window.sendFellowship = async function() {
        var currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!currentUser || !currentUser.authKey) { window.location.href = 'signin.html'; return; }
        var unlockedFeatures = currentUser.unlocked_features || [];
        if (typeof unlockedFeatures === 'string') { try { unlockedFeatures = JSON.parse(unlockedFeatures); } catch(e) { unlockedFeatures = []; } }
        var msgEl = document.getElementById('actionMsg');
        var viewerEmail = currentUser.email || '';
        var isPrivileged = OWNER_EMAILS.includes(viewerEmail) || ADMIN_EMAILS.includes(viewerEmail);
        if (!isPrivileged && !unlockedFeatures.includes('fellowships')) {
            msgEl.className = 'msg error';
            msgEl.textContent = '🔒 Fellowship sending requires the "Send Fellowship Requests" unlock (50 CP) in your profile.';
            return;
        }
        var params = new URLSearchParams(window.location.search);
        var uid = params.get('uid') || params.get('username');
        try {
            var res = await fetch(API_URL + '/api/fellowships/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': currentUser.authKey },
                body: JSON.stringify({ receiver_uid: uid })
            });
            var data = await res.json();
            msgEl.className = 'msg ' + (data.success ? 'success' : 'error');
            msgEl.textContent = data.success ? '✅ Fellowship request sent!' : (data.error || 'Failed to send request.');
            if (data.success) {
                var btn = document.getElementById('fellowshipBtn');
                if (btn) { btn.textContent = '⏳ Request Sent'; btn.disabled = true; btn.style.opacity = '0.55'; btn.style.cursor = 'default'; }
            }
        } catch(e) {
            msgEl.className = 'msg error';
            msgEl.textContent = 'Could not connect to the server. Please try again.';
        }
    };
    </script>
</body>
</html>
