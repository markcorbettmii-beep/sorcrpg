<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Slayers of Rings § Crowns</title>
    <link rel="icon" href="IMG_3419.jpeg" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        body { background: #111; color: #e0cfc0; font-family: sans-serif; margin: 0; padding: 0; }
        .profile-container { max-width: 680px; margin: 2rem auto; padding: 1rem; }
        .back-link { display: inline-block; color: #d4af37; text-decoration: none; font-size: 0.85rem; margin-bottom: 1rem; }
        .back-link:hover { text-decoration: underline; }
        .profile-card { background: #1a1a1a; border-radius: 1rem; border: 1px solid #333; overflow: hidden; margin-bottom: 1rem; }
        .profile-banner { width: 100%; height: 120px; background: linear-gradient(135deg, #1a0a0a, #2a0808, #d0021b22); }
        .profile-info-row { display: flex; align-items: flex-end; gap: 1rem; padding: 0 1.5rem; margin-top: -40px; margin-bottom: 1rem; }
        .profile-avatar-large { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #d0021b; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #555; overflow: hidden; flex-shrink: 0; }
        .profile-name-block { flex: 1; padding-bottom: 0.5rem; }
        .profile-username { font-size: 1.3rem; font-weight: bold; color: #e0cfc0; }
        .profile-role-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; margin-top: 3px; }
        .profile-title { font-size: 0.8rem; color: #d4af37; margin-top: 2px; font-style: italic; }
        .profile-section { padding: 1rem 1.5rem; border-top: 1px solid #2a2a2a; }
        .profile-section h3 { color: #d4af37; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.75rem 0; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
        .stat-box { background: #222; border-radius: 8px; padding: 0.75rem; text-align: center; border: 1px solid #333; }
        .stat-box .stat-val { font-size: 1.2rem; font-weight: bold; color: #d4af37; }
        .stat-box .stat-label { font-size: 0.7rem; color: #666; margin-top: 2px; }
        .profile-field { margin-bottom: 0.75rem; }
        .profile-field label { font-size: 0.75rem; color: #888; display: block; margin-bottom: 3px; }
        .profile-field p { font-size: 0.9rem; color: #c0b090; margin: 0; line-height: 1.6; }
        .msg-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-bottom: 0.75rem; }
        .msg-btn-primary { background: #d0021b; color: #fff; }
        .msg-btn-primary:hover { background: #a50013; }
        .msg-btn-admin { background: #d4af37; color: #222; }
        .msg-btn-admin:hover { background: #c19b2b; }
        .msg-status { text-align: center; font-size: 0.85rem; padding: 0.75rem; border-radius: 8px; margin-bottom: 0.75rem; }
        .msg-status.pending { background: #1a1a00; border: 1px solid #555; color: #888; }
        .msg-status.accepted { background: #1a2a1a; border: 1px solid #4caf50; color: #4caf50; }
        .msg-status.declined { background: #2a1a1a; border: 1px solid #555; color: #666; }
        .message-thread { background: #222; border-radius: 8px; padding: 1rem; min-height: 150px; max-height: 300px; overflow-y: auto; margin-top: 0.75rem; margin-bottom: 0.75rem; }
        .message-bubble { margin-bottom: 0.75rem; display: flex; flex-direction: column; }
        .message-bubble.mine { align-items: flex-end; }
        .message-bubble.theirs { align-items: flex-start; }
        .bubble-content { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 0.88rem; line-height: 1.5; }
        .mine .bubble-content { background: #d0021b; color: #fff; border-bottom-right-radius: 3px; }
        .theirs .bubble-content { background: #2a2a2a; color: #e0cfc0; border-bottom-left-radius: 3px; }
        .bubble-time { font-size: 0.7rem; color: #444; margin-top: 2px; }
        .message-input-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
        .message-input-row input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #e0cfc0; font-size: 0.9rem; }
        .message-input-row input:focus { outline: none; border-color: #d0021b; }
        .message-input-row button { padding: 8px 16px; background: #d0021b; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .message-input-row button:hover { background: #a50013; }
        .accept-decline-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
        .btn { padding: 8px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-red { background: #d0021b; color: #fff; }
        .btn-red:hover { background: #a50013; }
        .btn-grey { background: #333; color: #888; }
        .btn-grey:hover { background: #444; color: #e0cfc0; }
        .msg { font-size: 0.85rem; margin-top: 0.5rem; }
        .msg.success { color: #4caf50; }
        .msg.error { color: #d0021b; }
        .not-found { text-align: center; padding: 3rem; color: #555; }
        .loading { text-align: center; padding: 3rem; color: #555; }
        .social-link { display: inline-block; color: #d4af37; text-decoration: none; font-size: 0.85rem; margin-right: 1rem; }
        .social-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="profile-container">
        <a href="javascript:history.back()" class="back-link">← Back</a>
        <div id="profileApp"><div class="loading">Loading profile...</div></div>
    </div>
    <div id="footer"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, orderBy, getDocs, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDu25MxYjeu-g6YjPjaOpfUSUw97yJj-Xg",
            authDomain: "sorc-a1393.firebaseapp.com",
            projectId: "sorc-a1393",
            storageBucket: "sorc-a1393.firebasestorage.app",
            messagingSenderId: "303646936307",
            appId: "1:303646936307:web:806bdcdc37c9e5c024bb86"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const OWNER_EMAILS = ["corbett@sorcrpg.com"];
        const ADMIN_EMAILS = ["markcorbett.mii@gmail.com"];

        var currentUser = null;
        var currentUserData = null;
        var googleUser = null;
        var targetUid = null;
        var targetData = null;
        var conversationId = null;

        try { var s = localStorage.getItem('sorc_google_user'); if (s) googleUser = JSON.parse(s); } catch(e) {}

        var params = new URLSearchParams(window.location.search);
        targetUid = params.get('uid');
        var openMsg = params.get('msg') === '1';

        function getRoleColor(role) {
            if (role === 'OWNER') return 'background:#d4af37;color:#222;';
            if (role === 'ADMIN') return 'background:#8B0000;color:#fff;';
            if (role === 'MASTER') return 'background:#1a6b1a;color:#fff;';
            if (role === 'PLAYER') return 'background:#1a3a6b;color:#fff;';
            return 'background:#333;color:#e0cfc0;';
        }
        function getRoleAbbr(role) {
            if (role === 'OWNER') return '[OWN]';
            if (role === 'ADMIN') return '[AD]';
            if (role === 'MASTER') return '[GM]';
            if (role === 'PLAYER') return '[PC]';
            return '[CIV]';
        }
        function getRoleLabel(role) {
            if (role === 'OWNER') return 'Owner';
            if (role === 'ADMIN') return 'Admin';
            if (role === 'MASTER') return 'Game Master';
            if (role === 'PLAYER') return 'Player Character';
            return 'Civilian';
        }
        function timeAgo(timestamp) {
            if (!timestamp) return '';
            var date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            var seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
            return Math.floor(seconds / 86400) + 'd ago';
        }
        function getMyUid() { return currentUser ? currentUser.uid : (googleUser ? googleUser.googleId : null); }
        function getMyEmail() { return currentUser ? currentUser.email : (googleUser ? googleUser.email : null); }
        function getMyUsername() {
            var data = currentUserData || {};
            return data.username || data.displayName || (getMyEmail() || '').split('@')[0];
        }
        function isAdminOrOwner(email) { return OWNER_EMAILS.includes(email) || ADMIN_EMAILS.includes(email); }

        async function getConvId(uid1, uid2) {
            var ids = [uid1, uid2].sort();
            return ids[0] + '_' + ids[1];
        }

        async function loadConversation() {
            var myUid = getMyUid();
            if (!myUid || !targetUid) return;
            conversationId = await getConvId(myUid, targetUid);
            var convDoc = await getDoc(doc(db, "conversations", conversationId));

            if (!convDoc.exists()) {
                renderMessagingSection('none');
                return;
            }

            var conv = convDoc.data();
            if (conv.status === 'pending') {
                if (conv.senderUid === myUid) {
                    renderMessagingSection('pending_sent');
                } else if (conv.receiverUid === myUid) {
                    renderMessagingSection('pending_received', conversationId);
                }
            } else if (conv.status === 'accepted') {
                renderMessagingSection('accepted', conversationId);
                await loadMessages(conversationId);
            } else if (conv.status === 'declined') {
                renderMessagingSection('declined');
            }
        }

        function renderMessagingSection(status, convId) {
            var el = document.getElementById('messagingSection');
            if (!el) return;
            var myUid = getMyUid();
            var myEmail = getMyEmail();

            if (!myUid) {
                el.innerHTML = '<p style="color:#555;font-size:0.85rem;"><a href="signin.html" style="color:#d4af37;">Sign in</a> to send messages.</p>';
                return;
            }
            if (myUid === targetUid) {
                el.innerHTML = '<p style="color:#555;font-size:0.85rem;">This is your own profile.</p>';
                return;
            }

            if (status === 'none') {
                var isAdmin = isAdminOrOwner(myEmail);
                el.innerHTML =
                    '<button class="msg-btn ' + (isAdmin ? 'msg-btn-admin' : 'msg-btn-primary') + '" onclick="sendMessageRequest()">' +
                        (isAdmin ? '✉ Send Message' : '✉ Send Message Request') +
                    '</button>' +
                    (!isAdmin ? '<p style="font-size:0.75rem;color:#555;margin:0;">They must accept before you can message each other.</p>' : '') +
                    '<div id="msgRequestMsg" class="msg"></div>';

            } else if (status === 'pending_sent') {
                el.innerHTML = '<div class="msg-status pending">⏳ Message request sent — waiting for them to accept.</div>';

            } else if (status === 'pending_received') {
                el.innerHTML =
                    '<div class="msg-status pending">📨 This person wants to message you.</div>' +
                    '<div class="accept-decline-row">' +
                        '<button class="btn btn-red" onclick="acceptRequest(\'' + convId + '\')">Accept</button>' +
                        '<button class="btn btn-grey" onclick="declineRequest(\'' + convId + '\')">Decline</button>' +
                    '</div>';

            } else if (status === 'accepted') {
                el.innerHTML =
                    '<div class="msg-status accepted">✅ Connected</div>' +
                    '<div class="message-thread" id="messageThread"></div>' +
                    '<div class="message-input-row">' +
                        '<input type="text" id="messageInput" placeholder="Write a message..." onkeydown="if(event.key===\'Enter\') sendMessage()" />' +
                        '<button onclick="sendMessage()">Send</button>' +
                    '</div>';

            } else if (status === 'declined') {
                el.innerHTML = '<div class="msg-status declined">❌ Message request was declined.</div>';
            }
        }

        async function loadMessages(convId) {
            var q = query(collection(db, "conversations", convId, "messages"), orderBy("createdAt", "asc"));
            var snap = await getDocs(q);
            var myUid = getMyUid();
            var html = '';
            snap.forEach(function(d) {
                var msg = d.data();
                var isMine = msg.senderUid === myUid;
                html +=
                    '<div class="message-bubble ' + (isMine ? 'mine' : 'theirs') + '">' +
                        '<div class="bubble-content">' + msg.text + '</div>' +
                        '<div class="bubble-time">' + timeAgo(msg.createdAt) + '</div>' +
                    '</div>';
            });
            var el = document.getElementById('messageThread');
            if (el) {
                el.innerHTML = html || '<p style="color:#444;font-size:0.8rem;text-align:center;">No messages yet. Say hello!</p>';
                el.scrollTop = el.scrollHeight;
            }
        }

        window.sendMessageRequest = async function() {
            var myUid = getMyUid();
            var myEmail = getMyEmail();
            var msgEl = document.getElementById('msgRequestMsg');
            if (!myUid) return;
            conversationId = await getConvId(myUid, targetUid);
            var isAdmin = isAdminOrOwner(myEmail);
            var status = isAdmin ? 'accepted' : 'pending';
            await setDoc(doc(db, "conversations", conversationId), {
                senderUid: myUid,
                senderName: getMyUsername(),
                receiverUid: targetUid,
                receiverName: targetData.username || targetData.displayName || 'Unknown',
                status: status,
                createdAt: serverTimestamp(),
                lastMessageAt: serverTimestamp()
            });
            if (msgEl) { msgEl.className = 'msg success'; msgEl.textContent = status === 'accepted' ? '✅ Conversation started!' : '✅ Request sent!'; }
            setTimeout(function() { loadConversation(); }, 800);
        };

        window.acceptRequest = async function(convId) {
            await updateDoc(doc(db, "conversations", convId), { status: 'accepted' });
            await loadConversation();
        };

        window.declineRequest = async function(convId) {
            await updateDoc(doc(db, "conversations", convId), { status: 'declined' });
            renderMessagingSection('declined');
        };

        window.sendMessage = async function() {
            var input = document.getElementById('messageInput');
            var text = input ? input.value.trim() : '';
            if (!text || !conversationId) return;
            var myUid = getMyUid();
            await addDoc(collection(db, "conversations", conversationId, "messages"), {
                senderUid: myUid,
                senderName: getMyUsername(),
                text: text,
                createdAt: serverTimestamp()
            });
            await updateDoc(doc(db, "conversations", conversationId), { lastMessageAt: serverTimestamp() });
            input.value = '';
            await loadMessages(conversationId);
        };

        async function renderProfile(data) {
            targetData = data;
            var role = OWNER_EMAILS.includes(data.email) ? 'OWNER' : ADMIN_EMAILS.includes(data.email) ? 'ADMIN' : (data.role || 'CIVILIAN');
            var username = data.username || data.displayName || 'Unknown Adventurer';
            var communityPoints = data.communityPoints || 0;
            var postCount = data.postCount || 0;
            var titles = data.titles || [];
            var joinDate = data.joinDate || '';
            var isPro = data.isPro || false;

            var titleDisplay = titles.length > 0 ? '<div class="profile-title">' + titles.join(' · ') + '</div>' : '';
            var bioSection = data.privacyBio && data.bio ? '<div class="profile-section"><h3>About</h3><div class="profile-field"><p>' + data.bio + '</p></div></div>' : '';
            var birthdaySection = '';
            if (data.privacyBirthday && data.birthday) {
                var birth = new Date(data.birthday);
                var today = new Date();
                var age = today.getFullYear() - birth.getFullYear();
                var m = today.getMonth() - birth.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
                birthdaySection = '<div class="profile-field"><label>AGE</label><p>' + age + '</p></div>';
            }
            var emailSection = data.privacyEmail ? '<div class="profile-field"><label>EMAIL</label><p>' + data.email + '</p></div>' : '';
            var socialSection = '';
            if (data.privacySocial && isPro) {
                var links = '';
                if (data.website) links += '<a href="' + data.website + '" target="_blank" class="social-link">🌐 Website</a>';
                if (data.socialTwitter) links += '<a href="https://x.com/' + data.socialTwitter + '" target="_blank" class="social-link">𝕏 ' + data.socialTwitter + '</a>';
                if (data.socialInstagram) links += '<a href="https://instagram.com/' + data.socialInstagram + '" target="_blank" class="social-link">📷 ' + data.socialInstagram + '</a>';
                if (links) socialSection = '<div class="profile-section"><h3>Links</h3>' + links + '</div>';
            }

            document.getElementById('profileApp').innerHTML =
                '<div class="profile-card">' +
                    '<div class="profile-banner"></div>' +
                    '<div class="profile-info-row">' +
                        '<div class="profile-avatar-large">' + username.charAt(0).toUpperCase() + '</div>' +
                        '<div class="profile-name-block">' +
                            '<div class="profile-username">' + username + '</div>' +
                            '<span class="profile-role-tag" style="' + getRoleColor(role) + '">' + getRoleLabel(role) + ' ' + getRoleAbbr(role) + '</span>' +
                            titleDisplay +
                        '</div>' +
                    '</div>' +
                    '<div class="profile-section">' +
                        '<div class="stat-grid">' +
                            '<div class="stat-box"><div class="stat-val">' + communityPoints + '</div><div class="stat-label">Community Points</div></div>' +
                            '<div class="stat-box"><div class="stat-val">' + postCount + '</div><div class="stat-label">Forum Posts</div></div>' +
                            '<div class="stat-box"><div class="stat-val">' + titles.length + '</div><div class="stat-label">Titles Earned</div></div>' +
                        '</div>' +
                        (joinDate ? '<div style="font-size:0.75rem;color:#555;margin-top:0.5rem;">Member since ' + joinDate + '</div>' : '') +
                    '</div>' +
                    bioSection +
                    (birthdaySection || emailSection ? '<div class="profile-section">' + birthdaySection + emailSection + '</div>' : '') +
                    socialSection +
                    '<div class="profile-section">' +
                        '<h3>Message</h3>' +
                        '<div id="messagingSection">Loading...</div>' +
                    '</div>' +
                '</div>';

            await loadConversation();
        }

        onAuthStateChanged(auth, async function(user) {
            if (user) {
                currentUser = user;
                var docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) currentUserData = docSnap.data();
            } else if (googleUser) {
                try {
                    var docSnap = await getDoc(doc(db, "users", googleUser.googleId));
                    if (docSnap.exists()) currentUserData = docSnap.data();
                } catch(e) {}
            }

            if (!targetUid) {
                document.getElementById('profileApp').innerHTML = '<div class="not-found">No profile specified.</div>';
                return;
            }

            var targetDoc = await getDoc(doc(db, "users", targetUid));
            if (!targetDoc.exists()) {
                document.getElementById('profileApp').innerHTML = '<div class="not-found">Profile not found.</div>';
                return;
            }

            await renderProfile(targetDoc.data());
        });
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
