<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Slayers of Rings § Crowns</title>
    <link rel="icon" href="IMG_3419.jpeg" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        body { background: #111; color: #e0cfc0; font-family: sans-serif; margin: 0; padding: 0; }
        .profile-container { max-width: 680px; margin: 2rem auto; padding: 1rem; }
        .back-link { display: inline-block; color: #d4af37; text-decoration: none; font-size: 0.85rem; margin-bottom: 1rem; }
        .back-link:hover { text-decoration: underline; }
        .profile-card { background: #1a1a1a; border-radius: 1rem; border: 1px solid #333; overflow: hidden; margin-bottom: 1rem; }
        .profile-banner { width: 100%; height: 120px; background: linear-gradient(135deg, #1a0a0a, #2a0808, #d0021b22); }
        .profile-info-row { display: flex; align-items: flex-end; gap: 1rem; padding: 0 1.5rem; margin-top: -40px; margin-bottom: 1rem; }
        .profile-avatar-large { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #d0021b; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #555; overflow: hidden; flex-shrink: 0; }
        .profile-name-block { flex: 1; padding-bottom: 0.5rem; }
        .profile-username { font-size: 1.3rem; font-weight: bold; color: #e0cfc0; }
        .profile-role-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; margin-top: 3px; }
        .profile-title { font-size: 0.8rem; color: #d4af37; margin-top: 2px; font-style: italic; }
        .profile-section { padding: 1rem 1.5rem; border-top: 1px solid #2a2a2a; }
        .profile-section h3 { color: #d4af37; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.75rem 0; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
        .stat-box { background: #222; border-radius: 8px; padding: 0.75rem; text-align: center; border: 1px solid #333; }
        .stat-box .stat-val { font-size: 1.2rem; font-weight: bold; color: #d4af37; }
        .stat-box .stat-label { font-size: 0.7rem; color: #666; margin-top: 2px; }
        .profile-field { margin-bottom: 0.75rem; }
        .profile-field label { font-size: 0.75rem; color: #888; display: block; margin-bottom: 3px; }
        .profile-field p { font-size: 0.9rem; color: #c0b090; margin: 0; line-height: 1.6; }
        .profile-field .hidden-val { font-size: 0.85rem; color: #444; font-style: italic; }
        .social-link { display: inline-block; color: #d4af37; text-decoration: none; font-size: 0.85rem; margin-right: 1rem; }
        .social-link:hover { text-decoration: underline; }
        .not-found { text-align: center; padding: 3rem; color: #555; }
        .loading { text-align: center; padding: 3rem; color: #555; }
        .pro-badge { display: inline-block; background: #d0021b; color: #fff; font-size: 0.7rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
        .basic-badge { display: inline-block; background: #333; color: #888; font-size: 0.7rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
        .locked-achievements { opacity: 0.4; }
        .action-btn { display: block; width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-bottom: 0.75rem; text-align: center; text-decoration: none; box-sizing: border-box; }
        .action-btn-red { background: #d0021b; color: #fff; }
        .action-btn-red:hover { background: #a50013; }
        .action-btn-gold { background: #d4af37; color: #222; }
        .action-btn-gold:hover { background: #c19b2b; }
        .action-btn-blue { background: #1a3a6b; color: #fff; }
        .action-btn-blue:hover { background: #122a55; }
        .action-btn-green { background: #1a6b1a; color: #fff; }
        .action-btn-green:hover { background: #125012; }
        .action-btn-grey { background: #333; color: #555; cursor: not-allowed; }
        .action-btn-dark { background: #222; color: #666; border: 1px solid #333; }
        .action-btn-dark:hover { border-color: #d0021b; color: #e0cfc0; }
        .msg { font-size: 0.85rem; margin-top: 0.5rem; }
        .msg.success { color: #4caf50; }
        .msg.error { color: #d0021b; }
    </style>
</head>
<body>
    <div class="profile-container">
        <a href="javascript:history.back()" class="back-link">← Back</a>
        <div id="profileApp"><div class="loading">Loading profile...</div></div>
    </div>
    <div id="footer"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDu25MxYjeu-g6YjPjaOpfUSUw97yJj-Xg",
            authDomain: "sorc-a1393.firebaseapp.com",
            projectId: "sorc-a1393",
            storageBucket: "sorc-a1393.firebasestorage.app",
            messagingSenderId: "303646936307",
            appId: "1:303646936307:web:806bdcdc37c9e5c024bb86"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const OWNER_EMAILS = ["corbett@sorcrpg.com"];
        const ADMIN_EMAILS = ["markcorbett.mii@gmail.com"];
        const FELLOWSHIP_POINTS_REQUIRED = 100;
        const FELLOWSHIP_ROLES = ['PLAYER', 'MASTER', 'ADMIN', 'OWNER'];

        var currentUser = null;
        var currentUserData = null;
        var googleUser = null;
        var targetUid = null;
        var targetData = null;

        try { var s = localStorage.getItem('sorc_google_user'); if (s) googleUser = JSON.parse(s); } catch(e) {}

        var params = new URLSearchParams(window.location.search);
        targetUid = params.get('uid');

        function getRoleColor(role) {
            if (role === 'OWNER') return 'background:#d4af37;color:#222;';
            if (role === 'ADMIN') return 'background:#8B0000;color:#fff;';
            if (role === 'MASTER') return 'background:#1a6b1a;color:#fff;';
            if (role === 'PLAYER') return 'background:#1a3a6b;color:#fff;';
            return 'background:#333;color:#e0cfc0;';
        }
        function getRoleAbbr(role) {
            if (role === 'OWNER') return '[OWN]';
            if (role === 'ADMIN') return '[AD]';
            if (role === 'MASTER') return '[GM]';
            if (role === 'PLAYER') return '[PC]';
            return '[CIV]';
        }
        function getRoleLabel(role) {
            if (role === 'OWNER') return 'Owner';
            if (role === 'ADMIN') return 'Admin';
            if (role === 'MASTER') return 'Game Master';
            if (role === 'PLAYER') return 'Player Character';
            return 'Civilian';
        }
        function getMyUid() { return currentUser ? currentUser.uid : (googleUser ? googleUser.googleId : null); }
        function getMyEmail() { return currentUser ? currentUser.email : (googleUser ? googleUser.email : null); }
        function getMyUsername() {
            var data = currentUserData || {};
            return data.username || data.displayName || (getMyEmail() || '').split('@')[0];
        }
        function getMyRole() {
            var email = getMyEmail();
            if (OWNER_EMAILS.includes(email)) return 'OWNER';
            if (ADMIN_EMAILS.includes(email)) return 'ADMIN';
            return (currentUserData || {}).role || 'CIVILIAN';
        }
        function getMyPoints() { return (currentUserData || {}).communityPoints || 0; }
        function isAdminOrOwner(email) { return email && (OWNER_EMAILS.includes(email) || ADMIN_EMAILS.includes(email)); }
        function isFellowshipEligible() {
            return FELLOWSHIP_ROLES.includes(getMyRole()) && getMyPoints() >= FELLOWSHIP_POINTS_REQUIRED;
        }

        function calculateAge(birthday) {
            if (!birthday) return null;
            var today = new Date();
            var birth = new Date(birthday);
            var age = today.getFullYear() - birth.getFullYear();
            var m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            return age;
        }

        function hiddenVal() {
            return '<span class="hidden-val">hidden</span>';
        }

        async function renderProfile(data) {
            targetData = data;
            var role = OWNER_EMAILS.includes(data.email) ? 'OWNER' : ADMIN_EMAILS.includes(data.email) ? 'ADMIN' : (data.role || 'CIVILIAN');
            var username = data.username || data.displayName || 'Unknown Adventurer';
            var communityPoints = data.communityPoints || 0;
            var postCount = data.postCount || 0;
            var titles = data.titles || [];
            var joinDate = data.joinDate || '';
            var isPro = data.isPro || false;
            var achievements = data.achievements || [];

            var myUid = getMyUid();
            var myEmail = getMyEmail();
            var isSelf = myUid === targetUid;
            var isAdmin = isAdminOrOwner(myEmail);

            var titleDisplay = titles.length > 0 ? '<div class="profile-title">' + titles.join(' · ') + '</div>' : '';

            // SorC Beyond status badge
            var statusBadge = isPro
                ? '<span class="pro-badge">SorC Beyond Pro</span>'
                : '<span class="basic-badge">SorC Basic</span>';

            // ===== ABOUT SECTION — always shown, hidden if toggled =====
            var bioValue = (data.privacyBio && data.bio) ? '<p>' + data.bio + '</p>' : hiddenVal();
            var bioSection = '<div class="profile-section"><h3>About</h3><div class="profile-field">' + bioValue + '</div></div>';

            // ===== INFO SECTION — always shown =====
            var ageValue = '';
            if (data.birthday) {
                ageValue = data.privacyBirthday ? '<p>' + calculateAge(data.birthday) + '</p>' : hiddenVal();
            } else {
                ageValue = '<span class="hidden-val">not set</span>';
            }

            var emailValue = data.privacyEmail ? '<p>' + data.email + '</p>' : hiddenVal();

            var infoSection =
                '<div class="profile-section"><h3>Info</h3>' +
                    '<div class="profile-field"><label>AGE</label>' + ageValue + '</div>' +
                    '<div class="profile-field"><label>EMAIL</label>' + emailValue + '</div>' +
                    '<div class="profile-field"><label>SORC BEYOND</label><p>' + (isPro ? '⭐ SorC Beyond Pro' : 'SorC Basic') + '</p></div>' +
                '</div>';

            // ===== LINKS SECTION — always shown =====
            var linksContent = '';
            if (isPro) {
                if (data.privacySocial) {
                    var hasLinks = data.website || data.socialTwitter || data.socialInstagram;
                    if (hasLinks) {
                        if (data.website) linksContent += '<a href="' + data.website + '" target="_blank" class="social-link">🌐 Website</a>';
                        if (data.socialTwitter) linksContent += '<a href="https://x.com/' + data.socialTwitter + '" target="_blank" class="social-link">𝕏 ' + data.socialTwitter + '</a>';
                        if (data.socialInstagram) linksContent += '<a href="https://instagram.com/' + data.socialInstagram + '" target="_blank" class="social-link">📷 ' + data.socialInstagram + '</a>';
                    } else {
                        linksContent = '<span class="hidden-val">none set</span>';
                    }
                } else {
                    linksContent = hiddenVal();
                }
            } else {
                linksContent = '<span class="hidden-val">not available</span>';
            }
            var linksSection = '<div class="profile-section"><h3>Links</h3>' + linksContent + '</div>';

            // ===== ACHIEVEMENTS =====
            var achievementsSection = '';
            if (isPro && achievements.length > 0) {
                achievementsSection =
                    '<div class="profile-section"><h3>Achievements</h3>' +
                        '<div style="display:flex;flex-wrap:wrap;gap:0.5rem;">' +
                        achievements.map(function(a) {
                            return '<div style="background:#222;border:1px solid #333;border-radius:8px;padding:6px 12px;font-size:0.8rem;color:#d4af37;">🏆 ' + a + '</div>';
                        }).join('') +
                        '</div>' +
                    '</div>';
            } else {
                achievementsSection =
                    '<div class="profile-section">' +
                        '<h3>Achievements <span style="font-size:0.7rem;color:#555;font-weight:normal;">— SorC Beyond Pro</span></h3>' +
                        '<div class="locked-achievements" style="display:flex;flex-wrap:wrap;gap:0.5rem;">' +
                            '<div style="background:#222;border:1px solid #333;border-radius:8px;padding:6px 12px;font-size:0.8rem;color:#555;">🏆 ???</div>' +
                            '<div style="background:#222;border:1px solid #333;border-radius:8px;padding:6px 12px;font-size:0.8rem;color:#555;">🏆 ???</div>' +
                            '<div style="background:#222;border:1px solid #333;border-radius:8px;padding:6px 12px;font-size:0.8rem;color:#555;">🏆 ???</div>' +
                        '</div>' +
                        '<div style="font-size:0.72rem;color:#444;margin-top:6px;">🔒 Unlocks with SorC Beyond Pro</div>' +
                    '</div>';
            }

            // ===== FELLOWSHIP + MESSAGE BUTTONS =====
            var actionSection = '';
            if (!isSelf && myUid) {
                var fellowshipId = [myUid, targetUid].sort().join('_');
                var fellowDoc = await getDoc(doc(db, "fellowships", fellowshipId));
                var fellowStatus = fellowDoc.exists() ? fellowDoc.data().status : 'none';
                var fellowSender = fellowDoc.exists() ? fellowDoc.data().senderUid : null;

                var fellowBtn = '';
                if (!isFellowshipEligible()) {
                    fellowBtn = '<div style="font-size:0.72rem;color:#444;margin-bottom:0.75rem;">🔒 Unlocks with Player status</div>';
                } else if (fellowStatus === 'none') {
                    fellowBtn = '<button class="action-btn action-btn-blue" onclick="sendFellowshipRequest()">⚔️ Add to Fellowship</button>';
                } else if (fellowStatus === 'pending' && fellowSender === myUid) {
                    fellowBtn = '<button class="action-btn action-btn-grey" disabled>⏳ Fellowship Request Sent</button>';
                } else if (fellowStatus === 'pending' && fellowSender !== myUid) {
                    fellowBtn = '<button class="action-btn action-btn-green" onclick="acceptFellowshipRequest()">✅ Accept Fellowship Request</button>';
                } else if (fellowStatus === 'accepted') {
                    fellowBtn = '<button class="action-btn action-btn-dark" onclick="removeFellowship()">⚔️ Fellows ✓ &nbsp;<span style="font-size:0.75rem;color:#555;">(click to remove)</span></button>';
                }

                var msgBtnClass = isAdmin ? 'action-btn action-btn-gold' : 'action-btn action-btn-red';

                actionSection =
                    '<div class="profile-section">' +
                        fellowBtn +
                        '<a href="public-profile.html?uid=' + targetUid + '&msg=1" class="' + msgBtnClass + '">✉ Message ' + username + '</a>' +
                        '<div id="fellowMsg" class="msg"></div>' +
                    '</div>';

            } else if (!myUid) {
                actionSection = '<div class="profile-section"><p style="font-size:0.85rem;color:#555;"><a href="signin.html" style="color:#d4af37;">Sign in</a> to connect with ' + username + '.</p></div>';
            }

            document.getElementById('profileApp').innerHTML =
                '<div class="profile-card">' +
                    '<div class="profile-banner"></div>' +
                    '<div class="profile-info-row">' +
                        '<div class="profile-avatar-large">' + username.charAt(0).toUpperCase() + '</div>' +
                        '<div class="profile-name-block">' +
                            '<div class="profile-username">' + username + statusBadge + '</div>' +
                            '<span class="profile-role-tag" style="' + getRoleColor(role) + '">' + getRoleLabel(role) + ' ' + getRoleAbbr(role) + '</span>' +
                            titleDisplay +
                        '</div>' +
                    '</div>' +
                    '<div class="profile-section">' +
                        '<div class="stat-grid">' +
                            '<div class="stat-box"><div class="stat-val">' + communityPoints + '</div><div class="stat-label">Community Points</div></div>' +
                            '<div class="stat-box"><div class="stat-val">' + postCount + '</div><div class="stat-label">Forum Posts</div></div>' +
                            '<div class="stat-box"><div class="stat-val">' + titles.length + '</div><div class="stat-label">Titles Earned</div></div>' +
                        '</div>' +
                        (joinDate ? '<div style="font-size:0.75rem;color:#555;margin-top:0.5rem;">Member since ' + joinDate + '</div>' : '') +
                    '</div>' +
                    bioSection +
                    infoSection +
                    linksSection +
                    achievementsSection +
                    actionSection +
                '</div>';
        }

        window.sendFellowshipRequest = async function() {
            var myUid = getMyUid();
            var msgEl = document.getElementById('fellowMsg');
            var fellowshipId = [myUid, targetUid].sort().join('_');
            await setDoc(doc(db, "fellowships", fellowshipId), {
                senderUid: myUid,
                senderName: getMyUsername(),
                receiverUid: targetUid,
                receiverName: targetData.username || targetData.displayName || 'Unknown',
                status: 'pending',
                createdAt: serverTimestamp()
            });
            msgEl.className = 'msg success';
            msgEl.textContent = '✅ Fellowship request sent!';
            setTimeout(function() { location.reload(); }, 1000);
        };

        window.acceptFellowshipRequest = async function() {
            var myUid = getMyUid();
            var fellowshipId = [myUid, targetUid].sort().join('_');
            await updateDoc(doc(db, "fellowships", fellowshipId), {
                status: 'accepted',
                acceptedAt: serverTimestamp()
            });
            var msgEl = document.getElementById('fellowMsg');
            msgEl.className = 'msg success';
            msgEl.textContent = '✅ You are now Fellows!';
            setTimeout(function() { location.reload(); }, 1000);
        };

        window.removeFellowship = async function() {
            if (!confirm('Remove this Fellow?')) return;
            var myUid = getMyUid();
            var fellowshipId = [myUid, targetUid].sort().join('_');
            await deleteDoc(doc(db, "fellowships", fellowshipId));
            setTimeout(function() { location.reload(); }, 500);
        };

        onAuthStateChanged(auth, async function(user) {
            if (user) {
                currentUser = user;
                var docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) currentUserData = docSnap.data();
            } else if (googleUser) {
                try {
                    var docSnap = await getDoc(doc(db, "users", googleUser.googleId));
                    if (docSnap.exists()) currentUserData = docSnap.data();
                } catch(e) {}
            }

            if (!targetUid) {
                document.getElementById('profileApp').innerHTML = '<div class="not-found">No profile specified.</div>';
                return;
            }

            var targetDoc = await getDoc(doc(db, "users", targetUid));
            if (!targetDoc.exists()) {
                document.getElementById('profileApp').innerHTML = '<div class="not-found">Profile not found.</div>';
                return;
            }

            await renderProfile(targetDoc.data());
        });
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
