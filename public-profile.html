<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Slayers of Rings § Crowns</title>
    <link rel="icon" href="IMG_3419.jpeg" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        .profile-container { max-width: 680px; margin: 2rem auto; padding: 1rem; }
        .back-link { display: inline-block; color: #d4af37; text-decoration: none; font-size: 0.85rem; margin-bottom: 1rem; }
        .back-link:hover { text-decoration: underline; }
        .profile-card { background: #1a1a1a; border-radius: 1rem; border: 1px solid #333; overflow: hidden; margin-bottom: 1rem; }
        .profile-banner { width: 100%; height: 120px; background: linear-gradient(135deg, #1a0a0a, #2a0808, #d0021b22); }
        .profile-info-row { display: flex; align-items: flex-end; gap: 1rem; padding: 0 1.5rem; margin-top: -40px; margin-bottom: 1rem; }
        .profile-avatar-large { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #d0021b; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #555; overflow: hidden; flex-shrink: 0; }
        .profile-name-block { flex: 1; padding-bottom: 0.5rem; }
        .profile-username { font-size: 1.3rem; font-weight: bold; color: #e0cfc0; }
        .profile-role-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; margin-top: 3px; }
        .profile-title { font-size: 0.8rem; color: #d4af37; margin-top: 2px; font-style: italic; }
        .profile-section { padding: 1rem 1.5rem; border-top: 1px solid #2a2a2a; }
        .profile-section h3 { color: #d4af37; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.75rem 0; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
        .stat-box { background: #222; border-radius: 8px; padding: 0.75rem; text-align: center; border: 1px solid #333; }
        .stat-box .stat-val { font-size: 1.2rem; font-weight: bold; color: #d4af37; }
        .stat-box .stat-label { font-size: 0.7rem; color: #666; margin-top: 2px; }
        .profile-field { margin-bottom: 0.75rem; }
        .profile-field label { font-size: 0.75rem; color: #888; display: block; margin-bottom: 3px; }
        .profile-field p { font-size: 0.9rem; color: #c0b090; margin: 0; line-height: 1.6; }
        .hidden-val { font-size: 0.85rem; color: #444; font-style: italic; }
        .not-found { text-align: center; padding: 3rem; color: #555; }
        .loading { text-align: center; padding: 3rem; color: #555; }
        .pro-badge { display: inline-block; background: #d0021b; color: #fff; font-size: 0.7rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
        .basic-badge { display: inline-block; background: #333; color: #888; font-size: 0.7rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
        .locked-achievements { opacity: 0.4; }
        .msg { font-size: 0.85rem; margin-top: 0.5rem; }
        .msg.success { color: #4caf50; }
        .msg.error { color: #d0021b; }
    </style>
</head>
<body>
  <div class="page-wrapper">
    <header class="header-container">
      <span class="sorc-letters">S O R C</span>
    </header>
    <script>(function(){var t=localStorage.getItem('themeSelected')||'evil';if(t==='lawful')document.body.classList.add('lawful-mode');})();</script>
    <div class="profile-container">
        <a href="javascript:history.back()" class="back-link">← Back</a>
        <div id="profileApp"><div class="loading">Loading profile...</div></div>
    </div>
    <div id="footer"></div>
    <script type="module" src="main.js"></script>
    <script>
    var API_URL = 'https://api.sorcrpg.com';
    var OWNER_EMAILS = ['corbett@sorcrpg.com'];
    var ADMIN_EMAILS = ['markcorbett.mii@gmail.com'];

    function getRoleColor(role) {
        if (role === 'OWNER') return 'background:#d4af37;color:#222;';
        if (role === 'ADMIN') return 'background:#8B0000;color:#fff;';
        if (role === 'MASTER') return 'background:#1a6b1a;color:#fff;';
        if (role === 'PLAYER') return 'background:#1a3a6b;color:#fff;';
        return 'background:#333;color:#e0cfc0;';
    }
    function getRoleAbbr(role) {
        if (role === 'OWNER') return '[OWN]';
        if (role === 'ADMIN') return '[AD]';
        if (role === 'MASTER') return '[GM]';
        if (role === 'PLAYER') return '[PC]';
        return '[CIV]';
    }
    function getRoleLabel(role) {
        if (role === 'OWNER') return 'Owner';
        if (role === 'ADMIN') return 'Admin';
        if (role === 'MASTER') return 'Game Master';
        if (role === 'PLAYER') return 'Player Character';
        return 'Civilian';
    }
    function escapeHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    document.addEventListener('DOMContentLoaded', async function() {
        var params = new URLSearchParams(window.location.search);
        var userId = params.get('uid') || params.get('username');

        if (!userId) {
            document.getElementById('profileApp').innerHTML = '<div class="not-found">No profile specified.</div>';
            return;
        }

        try {
            var res = await fetch(API_URL + '/api/profile/' + userId);
            var data = await res.json();

            if (data.error || !data.user) {
                document.getElementById('profileApp').innerHTML = '<div class="not-found">Profile not found.</div>';
                return;
            }

            var user = data.user;
            var role = user.role || 'CIVILIAN';
            if (OWNER_EMAILS.includes(user.email)) role = 'OWNER';
            else if (ADMIN_EMAILS.includes(user.email)) role = 'ADMIN';

            var username = user.display_name || user.username || 'Unknown Adventurer';
            var communityPoints = user.community_points || 0;
            var postCount = user.post_count || 0;
            var titles = user.titles ? (typeof user.titles === 'string' ? JSON.parse(user.titles) : user.titles) : [];
            var joinDate = user.join_date || user.created_at || '';
            var avatar = user.avatar || null;
            var bio = user.bio || null;

            var titleDisplay = titles.length > 0 ? '<div class="profile-title">' + titles.join(' · ') + '</div>' : '';
            var statusBadge = '<span class="basic-badge">SORC Basic</span>';

            var avatarDisplay = avatar
                ? '<img src="images/avatars/' + escapeHtml(avatar) + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentNode.innerHTML=\'👤\'" />'
                : username.charAt(0).toUpperCase();

            var bioSection = bio
                ? '<div class="profile-section"><h3>About</h3><div class="profile-field"><p>' + escapeHtml(bio) + '</p></div></div>'
                : '';

            var achievementsSection =
                '<div class="profile-section"><h3>Achievements <span style="font-size:0.7rem;color:#555;font-weight:normal;">— SORC Beyond Pro</span></h3>' +
                '<div class="locked-achievements" style="display:flex;flex-wrap:wrap;gap:0.5rem;">' +
                '<div style="background:#222;border:1px solid #333;border-radius:8px;padding:6px 12px;font-size:0.8rem;color:#555;">🏆 ???</div>' +
                '<div style="background:#222;border:1px solid #333;border-radius:8px;padding:6px 12px;font-size:0.8rem;color:#555;">🏆 ???</div>' +
                '<div style="background:#222;border:1px solid #333;border-radius:8px;padding:6px 12px;font-size:0.8rem;color:#555;">🏆 ???</div></div>' +
                '<div style="font-size:0.72rem;color:#444;margin-top:6px;">🔒 Unlocks with SORC Beyond Pro</div></div>';

            // Check if viewer is logged in
            var currentUser = null;
            try { currentUser = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
            var isSelf = currentUser && (currentUser.id === user.id || currentUser.username === user.username);

            var actionSection = '';
            if (isSelf) {
                actionSection = '<div class="profile-section"><a href="profile.html" style="display:block;text-align:center;background:#d4af37;color:#222;padding:12px;border-radius:8px;font-weight:bold;text-decoration:none;">✏️ Edit Your Profile</a></div>';
            } else if (!currentUser) {
                actionSection = '<div class="profile-section"><p style="font-size:0.85rem;color:#555;"><a href="signin.html" style="color:#d4af37;">Sign in</a> to connect with ' + escapeHtml(username) + '.</p></div>';
            } else {
                actionSection = '<div class="profile-section">' +
                    '<div style="display:flex;gap:0.75rem;flex-wrap:wrap;">' +
                        '<button onclick="startMessage()" style="padding:9px 18px;background:#d0021b;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:0.85rem;">✉ Message</button>' +
                        '<button onclick="sendFellowship()" style="padding:9px 18px;background:#1a3a6b;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:0.85rem;">⚔ Add Fellowship</button>' +
                        '<button onclick="reportUser()" style="padding:9px 18px;background:#333;color:#e0cfc0;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:0.85rem;">🚩 Report</button>' +
                    '</div>' +
                    '<div id="actionMsg" class="msg" style="margin-top:0.5rem;"></div>' +
                '</div>';
            }

            document.getElementById('profileApp').innerHTML =
                '<div class="profile-card">' +
                    '<div class="profile-banner"></div>' +
                    '<div class="profile-info-row">' +
                        '<div class="profile-avatar-large">' + avatarDisplay + '</div>' +
                        '<div class="profile-name-block">' +
                            '<div class="profile-username">' + escapeHtml(username) + statusBadge + '</div>' +
                            '<span class="profile-role-tag" style="' + getRoleColor(role) + '">' + getRoleLabel(role) + ' ' + getRoleAbbr(role) + '</span>' +
                            titleDisplay +
                            (user.user_id ? '<div style="font-size:0.7rem;color:#444;margin-top:3px;">ID: #' + user.user_id + '</div>' : '') +
                        '</div>' +
                    '</div>' +
                    '<div class="profile-section">' +
                        '<div class="stat-grid">' +
                            '<div class="stat-box"><div class="stat-val">' + communityPoints + '</div><div class="stat-label">Community Points</div></div>' +
                            '<div class="stat-box"><div class="stat-val">' + postCount + '</div><div class="stat-label">Forum Posts</div></div>' +
                            '<div class="stat-box"><div class="stat-val">' + titles.length + '</div><div class="stat-label">Titles Earned</div></div>' +
                        '</div>' +
                        (joinDate ? '<div style="font-size:0.75rem;color:#555;margin-top:0.5rem;">Member since ' + new Date(joinDate).toLocaleDateString() + '</div>' : '') +
                    '</div>' +
                    bioSection +
                    achievementsSection +
                    actionSection +
                '</div>';

        } catch(e) {
            document.getElementById('profileApp').innerHTML = '<div class="not-found">Could not load profile.</div>';
        }
    });

    window.reportUser = async function() {
        var currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!currentUser || !currentUser.authKey) { window.location.href = 'signin.html'; return; }
        var params = new URLSearchParams(window.location.search);
        var uid = params.get('uid') || params.get('username');
        var reason = prompt('Reason for report:\n(harassment, spam, impersonation, inappropriate content, other)');
        if (!reason) return;
        var msgEl = document.getElementById('actionMsg');
        try {
            var res = await fetch(API_URL + '/api/users/' + uid + '/report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': currentUser.authKey },
                body: JSON.stringify({ reason: reason })
            });
            var data = await res.json();
            msgEl.className = 'msg ' + (data.success ? 'success' : 'error');
            msgEl.textContent = data.success ? '✅ Report submitted. Thank you.' : (data.error || 'Failed to submit report.');
        } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.'; }
    };

    window.startMessage = function() {
        var params = new URLSearchParams(window.location.search);
        var uid = params.get('uid') || params.get('username');
        window.location.href = 'inbox.html?to=' + encodeURIComponent(uid);
    };

    window.sendFellowship = async function() {
        var currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem('sorc_user')); } catch(e) {}
        if (!currentUser || !currentUser.authKey) { window.location.href = 'signin.html'; return; }
        var params = new URLSearchParams(window.location.search);
        var uid = params.get('uid') || params.get('username');
        var msgEl = document.getElementById('actionMsg');
        try {
            var res = await fetch(API_URL + '/api/fellowships/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Auth-Key': currentUser.authKey },
                body: JSON.stringify({ receiver_uid: uid })
            });
            var data = await res.json();
            msgEl.className = 'msg ' + (data.success ? 'success' : 'error');
            msgEl.textContent = data.success ? '✅ Fellowship request sent!' : (data.error || 'Failed to send request.');
        } catch(e) { msgEl.className = 'msg error'; msgEl.textContent = 'Connection error.'; }
    };
    </script>
</body>
</html>
