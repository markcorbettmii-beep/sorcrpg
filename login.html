<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slayers of Rings & Crowns - Login</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
<h1>Login</h1>

<!-- Role selection buttons -->
<div style="margin-bottom:20px;">
  <button id="login-gm" style="margin-right:10px;">Login as GM</button>
  <button id="login-player">Login as Player</button>
</div>

<!-- Descriptions for each role -->
<div style="margin-bottom:20px;">
  <strong>GM (Game Master):</strong> You lead the game, create adventures, and manage the story. GMs are responsible for guiding players and controlling the world.
</div>
<div style="margin-bottom:20px;">
  <strong>Player:</strong> You control a character in the story, make decisions, and explore the world created by the GM.
</div>

<!-- Login form for email/password -->
<form id="login-form" autocomplete="off" style="margin-top:20px;">
  <input type="email" id="user-email" placeholder="Email" required /><br><br>
  <input type="password" id="user-password" placeholder="Password" required /><br><br>
  <button type="submit">Login</button>
</form>

<script>
  // Initialize Firebase (replace with your config)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Function to handle login as GM or Player
  function loginAs(role) {
    const email = prompt("Enter email:");
    const password = prompt("Enter password:");
    if (!email || !password) {
      alert("Email and password are required.");
      return;
    }
    firebase.auth().signInWithEmailAndPassword(email, password)
      .then(userCredential => {
        if (role === 'gm') {
          localStorage.setItem('isGM', 'true');
          localStorage.setItem('isPlayer', 'false');
        } else {
          localStorage.setItem('isGM', 'false');
          localStorage.setItem('isPlayer', 'true');
        }
        alert(`Logged in as ${role.toUpperCase()}. Reloading...`);
        location.reload();
      })
      .catch(error => {
        alert("Login failed: " + error.message);
      });
  }

  document.getElementById('login-gm').onclick = () => loginAs('gm');
  document.getElementById('login-player').onclick = () => loginAs('player');

  // Optional: Handle email/password login form
  document.getElementById('login-form').onsubmit = function(e) {
    e.preventDefault();
    const email = document.getElementById('user-email').value.trim();
    const password = document.getElementById('user-password').value;
    firebase.auth().signInWithEmailAndPassword(email, password)
      .then(userCredential => {
        // For testing, default to Player role
        // Change to 'gm' if needed
        const role = 'player'; // or 'gm'
        if (role === 'gm') {
          localStorage.setItem('isGM', 'true');
          localStorage.setItem('isPlayer', 'false');
        } else {
          localStorage.setItem('isGM', 'false');
          localStorage.setItem('isPlayer', 'true');
        }
        alert(`Logged in as ${role.toUpperCase()}. Reloading...`);
        location.reload();
      })
      .catch(error => {
        alert("Login failed: " + error.message);
      });
  };
</script>
</body>
</html>
