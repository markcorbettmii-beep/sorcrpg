<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slayers of Rings & Crowns - Login</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
<h1>Login</h1>

<!-- Buttons for GM and PC login, linking to this page -->
<div style="margin-bottom:20px;">
  <button class="gm_button" onclick="window.location.href='login.html'">GM Login</button>
  <button class="plyr_button" onclick="window.location.href='login.html'">PC Login</button>
</div>

<!-- Login form for email/password -->
<form id="login-form" autocomplete="off" style="margin-top:20px;">
  <input type="email" id="user-email" placeholder="Email" required /><br /><br />
  <input type="password" id="user-password" placeholder="Password" required /><br /><br />
  <button type="submit">Login</button>
</form>

<script>
  // Initialize Firebase (replace with your config)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Function to handle login as GM or Player
  function loginAs(role) {
    const email = prompt("Enter email:");
    const password = prompt("Enter password:");
    if (!email || !password) {
      alert("Email and password are required.");
      return;
    }
    firebase.auth().signInWithEmailAndPassword(email, password)
      .then(userCredential => {
        if (role === 'gm') {
          localStorage.setItem('isGM', 'true');
          localStorage.setItem('isPlayer', 'false');
        } else {
          localStorage.setItem('isGM', 'false');
          localStorage.setItem('isPlayer', 'true');
        }
        alert(`Logged in as ${role.toUpperCase()}. Reloading...`);
        location.reload();
      })
      .catch(error => {
        alert("Login failed: " + error.message);
      });
  }

  // Role login buttons for testing
  document.querySelector('.gm_button').onclick = () => loginAs('gm');
  document.querySelector('.plyr_button').onclick = () => loginAs('player');

  // Handle email/password login form
  document.getElementById('login-form').onsubmit = function(e) {
    e.preventDefault();
    const email = document.getElementById('user-email').value.trim();
    const password = document.getElementById('user-password').value;
    firebase.auth().signInWithEmailAndPassword(email, password)
      .then(userCredential => {
        // For testing, default to 'player'
        // Change to 'gm' to test as GM
        const role = 'player'; // or 'gm'
        if (role === 'gm') {
          localStorage.setItem('isGM', 'true');
          localStorage.setItem('isPlayer', 'false');
        } else {
          localStorage.setItem('isGM', 'false');
          localStorage.setItem('isPlayer', 'true');
        }
        alert(`Logged in as ${role.toUpperCase()}. Reloading...`);
        location.reload();
      })
      .catch(error => {
        alert("Login failed: " + error.message);
      });
  };
</script>
</body>
</html>
