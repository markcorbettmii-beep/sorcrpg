<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fellowships | Slayers of Rings § Crowns</title>
    <link rel="icon" href="IMG_3419.jpeg" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        body { background: #111; color: #e0cfc0; font-family: sans-serif; margin: 0; padding: 0; }
        .f-hero { background: linear-gradient(135deg, #1a0505, #2a0808, #111); padding: 2rem; border-bottom: 2px solid #d0021b; text-align: center; }
        .f-hero h1 { color: #d0021b; font-size: 1.8rem; margin-bottom: 0.25rem; }
        .f-hero p { color: #666; font-size: 0.85rem; margin: 0; }
        .f-container { max-width: 700px; margin: 0 auto; padding: 2rem 1rem; }
        .f-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .f-tab { padding: 8px 16px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #888; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: all 0.2s; }
        .f-tab.active { background: #d0021b; color: #fff; border-color: #d0021b; }
        .f-tab:hover { border-color: #d0021b; }
        .f-tab .badge { display: inline-block; background: #d4af37; color: #222; border-radius: 10px; padding: 1px 6px; font-size: 0.7rem; margin-left: 4px; }
        .f-panel { display: none; }
        .f-panel.active { display: block; }
        .fellow-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 1rem; transition: border-color 0.2s; }
        .fellow-card:hover { border-color: #d0021b; }
        .fellow-avatar { width: 44px; height: 44px; border-radius: 50%; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #888; border: 2px solid #333; flex-shrink: 0; }
        .fellow-info { flex: 1; min-width: 0; }
        .fellow-name { font-weight: bold; color: #e0cfc0; font-size: 0.95rem; }
        .fellow-role { font-size: 0.75rem; color: #555; margin-top: 2px; }
        .fellow-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
        .btn { padding: 7px 14px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-red { background: #d0021b; color: #fff; }
        .btn-red:hover { background: #a50013; }
        .btn-gold { background: #d4af37; color: #222; }
        .btn-gold:hover { background: #c19b2b; }
        .btn-grey { background: #333; color: #888; }
        .btn-grey:hover { background: #444; color: #e0cfc0; }
        .btn-ghost { background: none; border: 1px solid #333; color: #888; }
        .btn-ghost:hover { border-color: #d0021b; color: #e0cfc0; }
        .request-card { background: #1a1a1a; border: 1px solid #d4af37; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .request-info { flex: 1; }
        .request-name { font-weight: bold; color: #e0cfc0; }
        .request-text { font-size: 0.8rem; color: #888; margin-top: 2px; }
        .request-actions { display: flex; gap: 0.5rem; }
        .empty-state { text-align: center; padding: 3rem; color: #444; font-size: 0.9rem; line-height: 1.7; }
        .locked-state { text-align: center; padding: 3rem; }
        .locked-state h2 { color: #d4af37; margin-bottom: 0.5rem; }
        .locked-state p { color: #666; font-size: 0.9rem; line-height: 1.7; }
        .not-logged-in { text-align: center; padding: 3rem; color: #555; }
        .not-logged-in a { color: #d4af37; }
        .outgoing-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 1rem; }
        .outgoing-label { font-size: 0.75rem; color: #555; margin-top: 2px; }
        body.lawful-mode { background: #f5f5f0; color: #2c2c2c; }
        body.lawful-mode .f-tab,
        body.lawful-mode .fellow-card,
        body.lawful-mode .request-card,
        body.lawful-mode .outgoing-card { background: #fff; border-color: #e0e0e0; }
    </style>
</head>
<body>
    <div class="f-hero">
        <h1>⚔️ Fellowships</h1>
        <p>Your companions across Essentia</p>
    </div>

    <div class="f-container" id="fApp">
        <div class="not-logged-in"><p>Loading...</p></div>
    </div>

    <div id="footer"></div>

    <script>
        var API_URL = 'https://api.sorcrpg.com';
        var myUser = null;
        var myUid = null;
        var myAuthKey = null;

        (function() {
            var saved = localStorage.getItem('sorc_user');
            if (saved) { try { myUser = JSON.parse(saved); } catch(e) {} }
            if (myUser && myUser.authKey) {
                myUid = myUser.id;
                myAuthKey = myUser.authKey;
            }
            var theme = localStorage.getItem('themeSelected') || 'evil';
            if (theme === 'lawful') document.body.classList.add('lawful-mode');
        })();

        function escapeHtml(str) {
            return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function authHeaders() {
            return { 'Content-Type': 'application/json', 'X-Auth-Key': myAuthKey };
        }

        async function apiFetch(path, opts) {
            var res = await fetch(API_URL + path, Object.assign({ headers: authHeaders() }, opts || {}));
            return res.json();
        }

        function getRoleTag(role) {
            var colors = { OWNER: '#d4af37;color:#222', ADMIN: '#8B0000;color:#fff', MASTER: '#1a6b1a;color:#fff', PLAYER: '#1a3a6b;color:#fff' };
            var labels = { OWNER: 'OWN', ADMIN: 'AD', MASTER: 'GM', PLAYER: 'PC', CIVILIAN: 'CIV' };
            var c = colors[role] || '#333;color:#e0cfc0';
            return '<span style="display:inline-block;padding:1px 6px;border-radius:4px;font-size:0.65rem;font-weight:bold;background:' + c + ';margin-left:4px;">[' + (labels[role] || 'CIV') + ']</span>';
        }

        async function init() {
            if (!myUid) {
                document.getElementById('fApp').innerHTML =
                    '<div class="not-logged-in"><p>Please <a href="signin.html">sign in</a> to use Fellowships.</p></div>';
                return;
            }
            if (myUser.role === 'CIVILIAN' && !myUser.unlocked_fellowships) {
                document.getElementById('fApp').innerHTML =
                    '<div class="locked-state">' +
                        '<h2>⚔️ Fellowships</h2>' +
                        '<p>Fellowships are unlocked at <b style="color:#d4af37;">100 Community Points</b>. Earn points by posting in the forums, submitting session recaps, and contributing to the community.</p>' +
                        '<p style="margin-top:0.5rem;color:#555;">Your points: <b style="color:#d4af37;">' + (myUser.community_points || 0) + '</b> / 100</p>' +
                        '<p style="margin-top:0.5rem;">Once unlocked, activate the feature from your <a href="/profile.html" style="color:#d4af37;">profile page</a>.</p>' +
                    '</div>';
                return;
            }
            await renderApp();
        }

        async function renderApp() {
            var [fellowsData, incomingData, outgoingData] = await Promise.all([
                apiFetch('/api/fellowships'),
                apiFetch('/api/fellowships/requests/incoming'),
                apiFetch('/api/fellowships/requests/outgoing')
            ]);

            var fellows = fellowsData.fellows || [];
            var incoming = incomingData.requests || [];
            var outgoing = outgoingData.requests || [];
            var reqCount = incoming.length;

            document.getElementById('fApp').innerHTML =
                '<div class="f-tabs">' +
                    '<button class="f-tab active" id="tab_fellows" onclick="switchTab(\'fellows\')">Fellows <span style="color:#555;font-weight:normal;font-size:0.75rem;">(' + fellows.length + ')</span></button>' +
                    '<button class="f-tab" id="tab_requests" onclick="switchTab(\'requests\')">' +
                        'Requests' + (reqCount > 0 ? ' <span class="badge">' + reqCount + '</span>' : '') +
                    '</button>' +
                    '<button class="f-tab" id="tab_sent" onclick="switchTab(\'sent\')">Sent</button>' +
                '</div>' +
                '<div class="f-panel active" id="panel_fellows"></div>' +
                '<div class="f-panel" id="panel_requests"></div>' +
                '<div class="f-panel" id="panel_sent"></div>';

            // Fellows panel
            var fellowsPanel = document.getElementById('panel_fellows');
            if (fellows.length === 0) {
                fellowsPanel.innerHTML = '<div class="empty-state">No Fellows yet.<br/>Visit someone\'s profile to send a Fellowship request.</div>';
            } else {
                fellowsPanel.innerHTML = fellows.map(function(f) {
                    var otherUid = f.sender_uid === myUid ? f.receiver_uid : f.sender_uid;
                    var otherName = f.sender_uid === myUid ? f.receiver_name : f.sender_name;
                    var role = f.role || 'CIVILIAN';
                    return '<div class="fellow-card">' +
                        '<div class="fellow-avatar">' + escapeHtml((otherName || '?').charAt(0).toUpperCase()) + '</div>' +
                        '<div class="fellow-info">' +
                            '<div class="fellow-name">' +
                                '<a href="public-profile.html?uid=' + escapeHtml(otherUid) + '" style="color:#e0cfc0;text-decoration:none;">' + escapeHtml(otherName) + '</a>' +
                                getRoleTag(role) +
                            '</div>' +
                        '</div>' +
                        '<div class="fellow-actions">' +
                            '<a href="public-profile.html?uid=' + escapeHtml(otherUid) + '" class="btn btn-gold" title="View Profile">👤</a>' +
                            '<button class="btn btn-ghost" onclick="removeFellow(\'' + escapeHtml(f.id) + '\', \'' + escapeHtml(otherName).replace(/'/g,"\\'") + '\')">Remove</button>' +
                        '</div>' +
                    '</div>';
                }).join('');
            }

            // Incoming requests panel
            var reqPanel = document.getElementById('panel_requests');
            if (incoming.length === 0) {
                reqPanel.innerHTML = '<div class="empty-state">No pending Fellowship requests.</div>';
            } else {
                reqPanel.innerHTML = incoming.map(function(req) {
                    return '<div class="request-card">' +
                        '<div class="fellow-avatar">' + escapeHtml((req.sender_name || '?').charAt(0).toUpperCase()) + '</div>' +
                        '<div class="request-info">' +
                            '<div class="request-name">' + escapeHtml(req.sender_name) + '</div>' +
                            '<div class="request-text">wants to be your Fellow</div>' +
                        '</div>' +
                        '<div class="request-actions">' +
                            '<button class="btn btn-red" onclick="acceptFellowship(\'' + escapeHtml(req.id) + '\')">Accept</button>' +
                            '<button class="btn btn-grey" onclick="declineFellowship(\'' + escapeHtml(req.id) + '\')">Decline</button>' +
                            '<a href="public-profile.html?uid=' + escapeHtml(req.sender_uid) + '" class="btn btn-ghost">Profile</a>' +
                        '</div>' +
                    '</div>';
                }).join('');
            }

            // Outgoing requests panel
            var sentPanel = document.getElementById('panel_sent');
            if (outgoing.length === 0) {
                sentPanel.innerHTML = '<div class="empty-state">No outgoing requests.</div>';
            } else {
                sentPanel.innerHTML = outgoing.map(function(req) {
                    return '<div class="outgoing-card">' +
                        '<div class="fellow-avatar">' + escapeHtml((req.receiver_name || '?').charAt(0).toUpperCase()) + '</div>' +
                        '<div class="fellow-info">' +
                            '<div class="fellow-name">' + escapeHtml(req.receiver_name) + '</div>' +
                            '<div class="outgoing-label">Pending their response</div>' +
                        '</div>' +
                        '<div class="fellow-actions">' +
                            '<a href="public-profile.html?uid=' + escapeHtml(req.receiver_uid) + '" class="btn btn-ghost">Profile</a>' +
                            '<button class="btn btn-grey" onclick="cancelRequest(\'' + escapeHtml(req.id) + '\')">Cancel</button>' +
                        '</div>' +
                    '</div>';
                }).join('');
            }
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('.f-tab').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.f-panel').forEach(function(p) { p.classList.remove('active'); });
            document.getElementById('tab_' + tab).classList.add('active');
            document.getElementById('panel_' + tab).classList.add('active');
        };

        window.acceptFellowship = async function(id) {
            await apiFetch('/api/fellowships/' + id + '/accept', { method: 'POST', body: '{}' });
            await renderApp();
        };

        window.declineFellowship = async function(id) {
            await apiFetch('/api/fellowships/' + id + '/decline', { method: 'POST', body: '{}' });
            await renderApp();
        };

        window.removeFellow = async function(id, name) {
            if (!confirm('Remove ' + name + ' from your Fellowships?')) return;
            await apiFetch('/api/fellowships/' + id, { method: 'DELETE' });
            await renderApp();
        };

        window.cancelRequest = async function(id) {
            if (!confirm('Cancel this Fellowship request?')) return;
            await apiFetch('/api/fellowships/' + id, { method: 'DELETE' });
            await renderApp();
        };

        init();
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
