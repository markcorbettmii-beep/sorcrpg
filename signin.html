<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Slayers of Rings § Crowns</title>
    <link rel="stylesheet" href="styles.css?v=9" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: sans-serif; min-height: 100vh; margin: 0; display: flex; flex-direction: column; }
        .signin-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem 1rem; }
        .signin-card { background: #1a1a1a; border: 1px solid #333; border-radius: 1rem; padding: 2.5rem 2rem; max-width: 420px; width: 100%; text-align: center; }
        .signin-logo { max-width: 280px; width: 100%; margin-bottom: 1.5rem; }
        .signin-card h1 { color: #c93f35; font-size: 1.6rem; margin-bottom: 0.5rem; }
        .signin-card p { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .signin-input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 1rem; box-sizing: border-box; }
        .signin-input:focus { outline: none; border-color: #c93f35; }
        .password-wrapper { position: relative; margin-bottom: 12px; }
        .password-wrapper .signin-input { margin-bottom: 0; padding-right: 44px; }
        .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #888; cursor: pointer; font-size: 1rem; padding: 0; }
        .toggle-pw:hover { color: #e0cfc0; }
        .signin-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; margin-bottom: 12px; transition: all 0.2s; }
        .signin-btn-primary { background: #c93f35; color: #fff; }
        .signin-btn-primary:hover { background: #c93f35; }
        .signin-btn-resend { background: none; border: 1px solid #b9aa00; color: #b9aa00; padding: 8px; font-size: 0.85rem; margin-bottom: 12px; width: 100%; border-radius: 8px; cursor: pointer; }
        .signin-divider { display: flex; align-items: center; gap: 1rem; margin: 1rem 0; color: #555; font-size: 0.85rem; }
        .signin-divider::before, .signin-divider::after { content: ''; flex: 1; height: 1px; background: #333; }
        .signin-links { margin-top: 1rem; font-size: 0.85rem; color: #888; }
        .signin-links a { color: #b9aa00; text-decoration: none; }
        .signin-links a:hover { text-decoration: underline; }
        .account-type-selector { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; justify-content: center; }
        .account-type-btn { padding: 0.4rem 0.8rem; border: 2px solid #444; border-radius: 8px; background: #222; color: #e0cfc0; font-weight: bold; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
        .account-type-btn.active { border-color: #c93f35; background: #c93f35; color: #fff; }
        .account-type-btn:hover { border-color: #c93f35; }
        .account-info { background: #1a1a2a; border: 1px solid #444; color: #e0cfc0; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; font-size: 0.85rem; line-height: 1.6; text-align: left; display: none; }
        .account-info.coming-soon { border-color: #b9aa00; background: #2a1a00; color: #b9aa00; }
        .status-msg { padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
        .status-msg.success { background: #1a2a1a; border: 1px solid #4caf50; color: #4caf50; }
        .status-msg.error { background: #2a1a1a; border: 1px solid #c93f35; color: #c93f35; }
        body.lawful-mode { background: #f5f5f0; color: #2c2c2c; }
        body.lawful-mode .signin-card { background: #fff; border-color: #e0e0e0; }
        body.lawful-mode .signin-input { background: #f5f5f0; color: #2c2c2c; border-color: #ccc; }
        body.lawful-mode .account-type-btn { background: #f5f5f0; color: #2c2c2c; }
        body.lawful-mode .account-info { background: #fff; }
        .oauth-section { display: none; text-align: center; margin: 1.5rem 0; }
        .oauth-section.show { display: block; }
        .oauth-divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; color: #666; font-size: 0.9rem; }
        .oauth-divider::before, .oauth-divider::after { content: ''; flex: 1; height: 1px; background: #ddd; }
        .oauth-btn { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 24px; font-size: 0.95rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: all 0.2s; background: #f5f5f5; color: #000; }
        .oauth-btn:hover { background: #ebebeb; }
        body.lawful-mode .oauth-btn { background: #f5f5f5; color: #000; }
        body.lawful-mode .oauth-btn:hover { background: #ebebeb; }
        .signup-link-text { margin-top: 1rem; font-size: 0.9rem; color: #888; }
        .signup-link-text a { color: #b9aa00; text-decoration: underline; }
        body.lawful-mode .signup-link-text { color: #666; }
        body.lawful-mode .signup-link-text a { color: #2196f3; }
    </style>
</head>
<body>
<div class="header-container">
  <span class="sorc-letters">S O R C</span><img src="images/newest-sorc-redev-letters-jpeg_20260808_072206_0000.png" class="sorc-letters-img evil-only" alt="SORC" /><img src="images/newest-sorc-goldlaw-letters-jpeg_20260808_072143_0000.png" class="sorc-letters-img lawful-only" alt="SORC" />
</div>
<nav><div id="navRoleBadge"></div></nav>
  <div class="page-wrapper">
    <div class="signin-wrapper">
        <div class="signin-card">
            <img src="slayers-letters_20260510_111419_0000.jpg" alt="Slayers of Rings & Crowns" class="signin-logo" />
            <h1>Welcome to Essentia</h1>
            <p>Sign in to continue your adventure</p>


            <div class="oauth-section show" id="oauthSection">
                <button class="oauth-btn oauth-google" onclick="handleGoogleLogin()">
                    <svg style="width:20px;height:20px;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" fill="none" stroke="#4285F4" stroke-width="2"/>
                        <path fill="#4285F4" d="M12 6v6h6"/>
                    </svg>
                    Continue with Google
                </button>
                <div class="oauth-divider">or</div>
                <button class="oauth-btn oauth-amazon" onclick="handleAmazonLogin()">
                    <span style="font-size:20px;color:#FF9900;font-weight:bold;">a</span>
                    Continue with Amazon
                </button>
                <button class="oauth-btn oauth-apple" onclick="handleAppleLogin()">
                    <span style="font-size:20px;">🍎</span>
                    Continue with Apple
                </button>
                <div class="signup-link-text">
                    New to Essentia? <a href="javascript:void(0)" onclick="checkKIDVerification(function() { window.location.href = '/signin.html'; }, '/signin.html');">Delve in now</a>
                </div>
            </div>


            <div class="signin-links">
                <a href="javascript:void(0)" onclick="showForgotPassword()">Forgot password?</a> &nbsp;·&nbsp;
                <a href="index.html">Back to site</a>
            </div>
        </div>
    </div>

    <script>
        var API_URL = 'https://api.sorcrpg.com';
        var lastUnverifiedEmail = null;

        (function() {
            var savedTheme = localStorage.getItem('themeSelected') || 'evil';
            if (savedTheme === 'lawful') document.body.classList.add('lawful-mode');

            // If already logged in, go home
            var saved = localStorage.getItem('sorc_user');
            if (saved) {
                try {
                    var u = JSON.parse(saved);
                    if (u && u.authKey) {
                        window.location.href = 'index.html';
                        return;
                    }
                } catch(e) {}
            }

            // Show success message if redirected after verification
            var params = new URLSearchParams(window.location.search);
            if (params.get('verified') === 'true') {
                showStatus('✅ Email verified! You can now sign in.', 'success');
            }
            if (params.get('expired') === 'true') {
                showStatus('Your session expired. Please sign in again.', 'error');
            }
            if (params.get('verify_error') === 'true') {
                showStatus('That verification link is invalid or already used. Try signing in, or request a new verification email.', 'error');
            }
            if (params.get('reset') === 'true') {
                showStatus('✅ Password updated! You can now sign in with your new password.', 'success');
            }
        })();

        var badWords = ['fuck','shit','ass','bitch','cunt','dick','cock','pussy','nigger','nigga','faggot','retard','whore','slut','bastard','crap','piss','prick','twat','wanker','bollocks'];
        function containsBadWord(str) {
            var lower = str.toLowerCase().replace(/[^a-z0-9]/g, '');
            return badWords.some(function(word) { return lower.includes(word); });
        }
        function isValidUsername(username) {
            if (username.length < 3) return 'Name must be at least 3 characters.';
            if (username.length > 30) return 'Name must be 30 characters or less.';
            if (!/^[a-zA-Z0-9-]+$/.test(username)) return 'Letters, numbers and hyphens only. No underscores or spaces.';
            if (containsBadWord(username)) return 'Name contains inappropriate language.';
            return null;
        }

        function showStatus(msg, type) {
            var el = document.getElementById('statusMsg');
            el.innerHTML = msg;
            el.className = 'status-msg ' + type;
            el.style.display = 'block';
        }

        window.togglePassword = function(inputId, btn) {
            var input = document.getElementById(inputId);
            if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
            else { input.type = 'password'; btn.textContent = '👁'; }
        };

        window.selectType = function(type, btn) {
            document.querySelectorAll('.account-type-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            document.querySelectorAll('.account-info').forEach(function(el) { el.style.display = 'none'; });
            if (type === 'civilian') {
                document.getElementById('civilianInfo').style.display = 'block';
                document.getElementById('signinForm').style.display = 'block';
            } else if (type === 'Player') {
                document.getElementById('PlayerInfo').style.display = 'block';
                document.getElementById('signinForm').style.display = 'none';
            } else if (type === 'master') {
                document.getElementById('masterInfo').style.display = 'block';
                document.getElementById('signinForm').style.display = 'none';
            }
        };

        window.handleSignIn = async function() {
            var email = document.getElementById('emailInput').value.trim();
            var password = document.getElementById('passwordInput').value;
            if (!email || !password) { showStatus('Please enter your email and password.', 'error'); return; }

            showStatus('Signing in...', 'success');
            document.getElementById('resendBtn').style.display = 'none';

            try {
                var res = await fetch(API_URL + '/api/auth/signin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                var data = await res.json();

                if (!res.ok || !data.success) {
                    if (data.unverified) {
                        lastUnverifiedEmail = email;
                        showStatus(data.error + ' <a href="javascript:void(0)" onclick="handleResendVerification()" style="color:#b9aa00;text-decoration:underline;">Resend verification email</a>', 'error');
                    } else if (res.status === 401 && data.error && data.error.includes('No password')) {
                        var encodedEmail = email.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                        showStatus('No password set for this account. <a href="javascript:void(0)" onclick="sendResetFromSignin(\'' + encodedEmail.replace(/'/g, '&#39;') + '\')" style="color:#b9aa00;text-decoration:underline;">Send me a reset link</a>', 'error');
                    } else {
                        showStatus(data.error || 'Sign in failed.', 'error');
                    }
                    return;
                }

                localStorage.setItem('sorc_user', JSON.stringify({
                    ...data.user,
                    authKey: data.authKey
                }));

                window.location.href = 'index.html';
            } catch(e) {
                showStatus('Connection error. Please try again.', 'error');
            }
        };

        window.handleSignUp = async function() {
            var email = document.getElementById('signupEmail').value.trim();
            var password = document.getElementById('signupPassword').value;
            var confirmPassword = document.getElementById('signupConfirmPassword').value;
            var username = document.getElementById('signupUsername').value.trim();

            if (!email || !password) { showStatus('Please enter an email and password.', 'error'); return; }
            if (!username) { showStatus('Please choose a first name.', 'error'); return; }
            if (password.length < 8 || password.length > 64) { showStatus('Password must be 8-64 characters.', 'error'); return; }
            if (!/[A-Z]/.test(password)) { showStatus('Password must contain at least one uppercase letter.', 'error'); return; }
            if (!/[a-z]/.test(password)) { showStatus('Password must contain at least one lowercase letter.', 'error'); return; }
            if (!/[0-9]/.test(password)) { showStatus('Password must contain at least one number.', 'error'); return; }
            if (password !== confirmPassword) { showStatus('Passwords do not match.', 'error'); return; }

            var usernameError = isValidUsername(username);
            if (usernameError) { showStatus(usernameError, 'error'); return; }

            showStatus('Creating your profile...', 'success');

            try {
                var res = await fetch(API_URL + '/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, username, firstName: username, accountType: 'CIVILIAN' })
                });
                var data = await res.json();

                if (!res.ok || !data.success) {
                    showStatus(data.error || 'Registration failed.', 'error');
                    return;
                }

                // Don't log them in-show verification message
                lastUnverifiedEmail = email;
                showStatus('✅ Profile created! Please check your email to verify your account before signing in. Check your spam folder if you don\'t see it.', 'success');
                document.getElementById('resendBtn').style.display = 'block';

            } catch(e) {
                showStatus('Connection error. Please try again.', 'error');
            }
        };

        window.handleResendVerification = async function() {
            var email = lastUnverifiedEmail || document.getElementById('emailInput').value.trim() || document.getElementById('signupEmail').value.trim();
            if (!email) { showStatus('Please enter your email address.', 'error'); return; }
            try {
                var res = await fetch(API_URL + '/api/auth/resend-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                var data = await res.json();
                if (data.success) {
                    showStatus('✅ Verification email sent! Check your inbox and spam folder.', 'success');
                } else {
                    showStatus(data.error || 'Could not resend email.', 'error');
                }
            } catch(e) {
                showStatus('Connection error. Please try again.', 'error');
            }
        };

        window.sendResetFromSignin = async function(email) {
            showStatus('Sending reset link...', 'success');
            try {
                await fetch(API_URL + '/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                showStatus('Reset link sent to ' + email + '. Check your inbox.', 'success');
            } catch(e) {
                showStatus('Connection error. Please try again.', 'error');
            }
        };

        window.showForgotPassword = function() {
            var email = document.getElementById('emailInput').value.trim();
            var msg = email ? '' : 'Enter your email above, then click Forgot password.';
            if (!email) { showStatus(msg, 'error'); return; }
            showStatus('Sending reset email...', 'success');
            fetch(window.SORC_API + '/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            }).then(function() {
                showStatus('If that email is registered, a password reset link has been sent. Check your inbox.', 'success');
            }).catch(function() {
                showStatus('Connection error. Please try again.', 'error');
            });
        };


        window.handleGoogleLogin = function() {
            window.google.accounts.oauth2.initCodeClient({
                client_id: '303646936307-jn1gtlgiabv9tk345m5dvk0f99nk2apf.apps.googleusercontent.com',
                scope: 'openid email profile',
                ux_mode: 'redirect',
                redirect_uri: 'https://api.sorcrpg.com/auth/google/callback',
                callback: function(response) {
                    if (response.code) {
                        window.location.href = 'https://api.sorcrpg.com/auth/google/callback?code=' + response.code;
                    }
                }
            }).requestCode();
        };

        window.handleAmazonLogin = function() {
            showStatus('Amazon login coming soon...', 'error');
        };

        window.handleAppleLogin = function() {
            showStatus('Apple login coming soon...', 'error');
        };
    </script>
  <script src="verify-kid.js"></script>
  <script type="module" src="main.js?v=25"></script>
  <div id="footer"></div>
</body>
</html>
