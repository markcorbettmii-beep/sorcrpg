<script>
(function() {
    // Check for fresh login via URL param
    if (window.location.search.includes('loggedin=1')) {
        window.history.replaceState({}, '', '/');
    }
    // Hide signin link if already logged in
    var savedGoogle = localStorage.getItem('sorc_google_user');
    if (savedGoogle) {
        try {
            var userInfo = JSON.parse(savedGoogle);
            var signinLink = document.getElementById('signinLink');
            if (signinLink) signinLink.style.display = 'none';
        } catch(e) {
            localStorage.removeItem('sorc_google_user');
        }
    }
})();
</script>
<script type="module" src="main.js"></script>
