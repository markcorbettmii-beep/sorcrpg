<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Slayers of Rings § Crowns</title>
    <link rel="stylesheet" href="styles.css?v=9" />
    <style>
        body { font-family: sans-serif; min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: #ffffff; }
        .signin-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem 1rem; }
        .signin-card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 1rem; padding: 2.5rem 2rem; max-width: 420px; width: 100%; text-align: center; }
        .signin-logo { max-width: 200px; width: 100%; margin-bottom: 1.5rem; }
        .signin-card h1 { color: #c93f35; font-size: 1.6rem; margin-bottom: 0.5rem; font-weight: 600; }
        .signin-card p { color: #2c2c2c; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: #333; text-transform: uppercase; letter-spacing: 0.5px; }
        .signin-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; background: #f9f9f9; color: #2c2c2c; font-size: 1rem; box-sizing: border-box; transition: all 0.2s; }
        .signin-input:focus { outline: none; border-color: #c93f35; background: #fff; box-shadow: 0 0 0 3px rgba(201, 63, 53, 0.1); }
        .password-wrapper { position: relative; margin-bottom: 1.2rem; }
        .password-wrapper .signin-input { margin-bottom: 0; padding-right: 44px; }
        .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #2c2c2c; cursor: pointer; font-size: 1rem; padding: 0; }
        .toggle-pw:hover { color: #c93f35; }
        .signin-btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 1rem; margin-bottom: 16px; background: #c93f35; color: #fff; transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        .signin-btn:hover { background: #d45a4a; }
        .signin-btn:disabled { background: #ccc; cursor: not-allowed; }
        .status-msg { display: none; padding: 12px 14px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 16px; }
        .status-msg.success { background: #e6f5e6; color: #1a7a1a; border: 1px solid #7fcf9f; }
        .status-msg.error { background: #fbe6e4; color: #a03030; border: 1px solid #e0a0a0; }
        .signin-links { margin-top: 1rem; font-size: 0.85rem; }
        .signin-links a { color: #b9aa00; text-decoration: none; }
        .signin-links a:hover { text-decoration: underline; }
        .oauth-logo { max-width: 100px; height: auto; margin-bottom: 1rem; }
        body.lawful-mode .signin-card { background: #ffffff; border-color: #e0e0e0; }
        body.lawful-mode .signin-input { background: #f9f5f1; color: #2c2c2c; border-color: #ccc; }
        body.lawful-mode .form-group label { color: #333; }
    </style>
</head>
<body>
<div class="header-container">
  <span class="sorc-letters">S O R C</span><img src="images/newest-sorc-redev-letters-jpeg_20260808_072206_0000.png" class="sorc-letters-img evil-only" alt="SORC" /><img src="images/newest-sorc-goldlaw-letters-jpeg_20260808_072143_0000.png" class="sorc-letters-img lawful-only" alt="SORC" />
</div>
<nav><div id="navRoleBadge"></div></nav>
    <div class="signin-wrapper">
        <div class="signin-card">
            <img src="slayers-letters_20260510_111419_0000.jpg" alt="Slayers of Rings & Crowns" class="signin-logo" />
            <h1>Create Your Account</h1>
            <p>Complete your profile to join Essentia via Google</p>

            <div class="status-msg" id="statusMsg"></div>

            <div class="form-group">
                <label for="googleEmail">Email Address</label>
                <input type="email" id="googleEmail" class="signin-input" placeholder="your@email.com" readonly />
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="signin-input" placeholder="Choose a name" />
            </div>

            <div class="password-wrapper">
                <label for="password" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: #333; text-transform: uppercase; letter-spacing: 0.5px;">Password</label>
                <input type="password" id="password" class="signin-input" placeholder="8-64 chars, 1 upper, 1 lower, 1 number" />
                <button class="toggle-pw" type="button" onclick="togglePassword('password', this)">👁</button>
            </div>

            <div class="password-wrapper">
                <label for="confirmPassword" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: #333; text-transform: uppercase; letter-spacing: 0.5px;">Confirm Password</label>
                <input type="password" id="confirmPassword" class="signin-input" placeholder="Confirm password" />
                <button class="toggle-pw" type="button" onclick="togglePassword('confirmPassword', this)">👁</button>
            </div>

            <button class="signin-btn" onclick="handleGoogleRegister()">Create Account</button>

            <div class="signin-links">
                <a href="signin.html">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script>
        var API_URL = 'https://api.sorcrpg.com';

        (function() {
            var savedTheme = localStorage.getItem('themeSelected') || 'evil';
            if (savedTheme === 'lawful') document.body.classList.add('lawful-mode');

            // Get email from URL parameter (passed by backend after Google OAuth)
            var params = new URLSearchParams(window.location.search);
            var googleEmail = params.get('email');
            if (googleEmail) {
                document.getElementById('googleEmail').value = googleEmail;
                localStorage.setItem('googleSignupEmail', googleEmail);
            } else {
                // Check localStorage as fallback
                var stored = localStorage.getItem('googleSignupEmail');
                if (stored) {
                    document.getElementById('googleEmail').value = stored;
                }
            }
        })();

        var badWords = ['fuck','shit','ass','bitch','cunt','dick','cock','pussy','nigger','nigga','faggot','retard','whore','slut','bastard','crap','piss','prick','twat','wanker','bollocks'];

        function containsBadWord(str) {
            var lower = str.toLowerCase().replace(/[^a-z0-9]/g, '');
            return badWords.some(function(word) { return lower.includes(word); });
        }

        function isValidUsername(username) {
            if (username.length < 3) return 'Name must be at least 3 characters.';
            if (username.length > 30) return 'Name must be 30 characters or less.';
            if (!/^[a-zA-Z0-9-]+$/.test(username)) return 'Letters, numbers and hyphens only. No underscores or spaces.';
            if (containsBadWord(username)) return 'Name contains inappropriate language.';
            return null;
        }

        function showStatus(msg, type) {
            var el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status-msg ' + type;
            el.style.display = 'block';
        }

        window.togglePassword = function(inputId, btn) {
            var input = document.getElementById(inputId);
            if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
            else { input.type = 'password'; btn.textContent = '👁'; }
        };

        window.handleGoogleRegister = async function() {
            var email = document.getElementById('googleEmail').value.trim();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;

            if (!email || !username || !password || !confirmPassword) {
                showStatus('Please fill in all fields.', 'error');
                return;
            }

            if (password.length < 8 || password.length > 64) {
                showStatus('Password must be 8-64 characters.', 'error');
                return;
            }

            if (!/[A-Z]/.test(password)) {
                showStatus('Password must contain at least one uppercase letter.', 'error');
                return;
            }

            if (!/[a-z]/.test(password)) {
                showStatus('Password must contain at least one lowercase letter.', 'error');
                return;
            }

            if (!/[0-9]/.test(password)) {
                showStatus('Password must contain at least one number.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showStatus('Passwords do not match.', 'error');
                return;
            }

            var usernameError = isValidUsername(username);
            if (usernameError) {
                showStatus(usernameError, 'error');
                return;
            }

            showStatus('Creating your account...', 'success');

            try {
                var res = await fetch(API_URL + '/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, username, firstName: username, accountType: 'CIVILIAN' })
                });
                var data = await res.json();

                if (!res.ok || !data.success) {
                    showStatus(data.error || 'Registration failed.', 'error');
                    return;
                }

                // Account created - store auth key and redirect to home
                if (data.authKey) {
                    localStorage.setItem('sorc_user', JSON.stringify({
                        ...data.user,
                        authKey: data.authKey
                    }));
                    // Clear the temp email from storage
                    localStorage.removeItem('googleSignupEmail');
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showStatus('Account created! Redirecting to sign in...', 'success');
                    localStorage.removeItem('googleSignupEmail');
                    setTimeout(function() {
                        window.location.href = 'signin.html';
                    }, 1500);
                }
            } catch(e) {
                showStatus('Connection error. Please try again.', 'error');
            }
        };
    </script>
    <div id="footer"></div>
</body>
</html>
